abstract-en=The purpose of this vocabulary is to provide the definition of the structure of the employment data cube. To this end, the W3C Data Cube vocabulary is reused, and the necessary instances have been created to define such structure, indicating the dimensions and measures used in this cube.\n\nAdditionally, several vocabularies and code lists are reused to describe the different breakdowns of employment information, such as territory, reference period, sex, age, or economic activity.
introduction-en=\nThis ontology is part of the catalog of ontologies that is being developed in the context of the <a href="https://edint.es/" target="_blank">Data Space for Smart Urban Infrastructures (EDINT)</a>. It was also identified as a relevant ontology for the representation of data managed by local entities in the guide <a href="http://femp.femp.es/files/3580-1937-fichero/DATOS%20ABIERTOS%20FEMP%202019.pdf" target="_blank">Datos abiertos FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a>, as also described in the corresponding <a href="https://datos.gob.es/es/conocimiento/datos-abiertos-femp-2019-40-conjuntos-de-datos-publicar-por-las-entidades-locales" target="_blank">data.gob.es note</a>, and therefore included in the <a href="https://github.com/opencitydata" target="_blank">Github repository supporting the initiative</a>, which will be deprecated once this repository is launched.\nAn amplified version of the guide can be found in <a href="https://redtransparenciayparticipacion.es/wp-content/uploads/2025/03/Datos-abiertos-80-conjuntos-de-datos.pdf" target="_blank">DATOS ABIERTOS 80 CONJUNTOS DE DATOS</a>\n
description-en=\n<span class="markdown">\nFor the generation of the employment data cube, the <a href="https://www.w3.org/TR/vocab-data-cube">W3C Data Cube</a> vocabulary is reused. This vocabulary is a W3C recommendation for the publication of multidimensional data on the Web, which facilitates their structured representation, interoperability, and reuse. In addition, this vocabulary is compatible with the SDMX standard (<i>Statistical Data and Metadata eXchange</i>), which is widely used for the exchange of statistical data and metadata across organizations.\n</span>\n\n<center>\n  <img src="https://www.w3.org/TR/vocab-data-cube/images/qb-fig1.png">\n  <figcaption>Figure 1.- Diagram of the W3C Data Cube vocabulary.</figcaption>\n</center>\n\n<span class="markdown">\nAs shown in Figure 1, W3C Data Cube contains several concepts and properties that make it possible to describe statistical data at different levels of aggregation. In this vocabulary, the model is organized around the concept of <a href="https://www.w3.org/TR/vocab-data-cube/#reference-datasets">qb:DataSet</a>, which represents a dataset following a structure defined by a <a href="https://www.w3.org/TR/vocab-data-cube/#dsd">qb:DataStructureDefinition</a> and materialized through a set of observations represented by <a href="https://www.w3.org/TR/vocab-data-cube/#reference-datasets">qb:Observation</a>.\n\nSpecifically, this vocabulary defines one data cube dataset, represented by the instance <code>edintemp:dataset</code>, and one data structure, represented by the instance <code>edintemp:dsd</code>. The ontology itself is identified separately from the dataset, using the ontology IRI <code>http://vocab.linkeddata.es/datosabiertos/def/actividad-economica/cubo-empleo</code>. This separation allows the vocabulary metadata to describe the ontology, while <code>edintemp:dataset</code> represents the actual data cube dataset to which observations are attached.\n</span>\n\n<ul>\n  <li><a href="https://www.w3.org/TR/vocab-data-cube/#dsd-dimensions">qb:DimensionProperty</a>: component that identifies the dimensions of the observations, such as the reference administrative region, reference period, sex, age, economic activity, sector, or contract type. Dimensions usually take their values from code lists or classifications, typically represented using SKOS.</li>\n  <li><a href="https://www.w3.org/TR/vocab-data-cube/#dsd-dimensions">qb:MeasureProperty</a>: component that represents the measured value of the observed data. In this cube, the measures correspond to employment indicators such as the number of active persons, employed persons, unemployed persons, job seekers, registered contracts, registered unemployment, Social Security affiliates, unemployment rate, employment rate, jobs, job profiles, and number of people.</li>\n</ul>\n\n<span class="markdown">\nSeveral reference vocabularies are reused to define these dimensions and measures:\n</span>\n\n<ol>\n  <li>SDMX vocabularies (<i>Statistical Data and Metadata eXchange</i>):</li>\n  <ul>\n    <li><a href="http://purl.org/linked-data/sdmx/2009/dimension">sdmx-dimension</a>: reused as the basis for general statistical dimensions, especially through specialization relationships such as <a href="#refAdminRegion">edintdimension:refAdminRegion</a>, <a href="#refPeriod">edintdimension:refPeriod</a>, <a href="#sex">edintdimension:sex</a> and <a href="#age">edintdimension:age</a>.</li>\n    <li><a href="http://purl.org/linked-data/sdmx/2009/measure">sdmx-measure</a>: reused as the basis for several cube measures, which are defined as subproperties of <code>sdmx-measure:obsValue</code>.</li>\n  </ul>\n  <li>Territorial and temporal vocabularies:</li>\n  <ul>\n    <li><a href="http://vocab.linkeddata.es/datosabiertos/def/sector-publico/territorio">esadm</a>: reused to indicate that the dimension <a href="#refAdminRegion">edintdimension:refAdminRegion</a> may take values corresponding to municipalities, neighborhoods, or districts.</li>\n    <li><a href="https://www.w3.org/TR/owl-time/">OWL-Time</a>: reused to model the temporal dimension, establishing that <a href="#refPeriod">edintdimension:refPeriod</a> has <code>time:Interval</code> as its range.</li>\n  </ul>\n  <li>SKOS code lists:</li>\n  <ul>\n    <li>The dimension <a href="#sector">edintdimension:sector</a> reuses as a code list the public sector scheme published at <a href="https://datos.gob.es/kos/sector-publico/sector">datos.gob.es</a>.</li>\n    <li>The dimension <a href="#economicActivity">edintdimension:economicActivity</a> reuses a controlled classification of economic activity, such as <a href="http://lod.ine.es/kos/cnae/CNAE-2025">CNAE 2025</a>.</li>\n    <li>The dimension <a href="#contractType">edintdimension:contractType</a> uses its own code list defined in <code>edintkos:contractType</code>.</li>\n  </ul>\n  <li>INE vocabulary:</li>\n  <ul>\n    <li>The vocabulary also reuses several properties from the INE vocabulary, such as <code>ine:unemploymentRate</code>, <code>ine:employmentRate</code>, <code>ine:jobs</code>, and <code>ine:numberOfPeople</code>, in order to extend the cube with additional employment-related indicators.</li>\n  </ul>\n</ol>\n\n<span class="markdown">\nThe employment cube model is shown in Figure 2, where the dimensions and measures that compose it are presented.\n</span>\n\n<center>\n  <img src="../diagrams/diagram.png">\n  <figcaption>Figure 2.- Conceptual diagram of the employment data cube.</figcaption>\n</center>\n\n<span class="markdown">\nThe structure of the employment cube is defined through the instance <a href="#edintemp:dsd">edintemp:dsd</a>, which groups all the dimensions and measures of the model. In this case, the reference administrative region, sector, economic activity, reference period, sex, age, and contract type have been defined as dimensions. As measures, the model includes different counts and indicators associated with employment, such as the number of active persons, employed persons, unemployed persons, registered contracts, job seekers, registered unemployment, Social Security affiliates, unemployment rate, employment rate, jobs, job profiles, and number of people.\n</span>\n\n<pre>\n&lt;http://vocab.linkeddata.es/datosabiertos/def/actividad-economica/cubo-empleo&gt;\n    a <a href="http://www.w3.org/2002/07/owl#Ontology">owl:Ontology</a> ;\n    <a href="http://www.w3.org/2002/07/owl#imports">owl:imports</a> &lt;http://purl.org/linked-data/cube&gt; ;\n    <a href="http://www.w3.org/2002/07/owl#versionInfo">owl:versionInfo</a> "0.1.0" .\n\n<a href="#dataset">edintemp:dataset</a> a <a href="http://purl.org/linked-data/cube#DataSet">qb:DataSet</a> ; \n    <a href="http://purl.org/linked-data/cube#structure">qb:structure</a> <a href="#edintemp:dsd">edintemp:dsd</a> .\n\n<a href="#edintemp:dsd">edintemp:dsd</a> a <a href="http://purl.org/linked-data/cube#DataStructureDefinition">qb:DataStructureDefinition</a> ;\n    <a href="http://purl.org/linked-data/cube#component">qb:component</a>\n        [ <a href="http://purl.org/linked-data/cube#dimension">qb:dimension</a> <a href="#refAdminRegion">edintdimension:refAdminRegion</a> ; qb:order 1 ] ,\n        [ <a href="http://purl.org/linked-data/cube#dimension">qb:dimension</a> <a href="#sector">edintdimension:sector</a> ; qb:order 2 ] ,\n        [ <a href="http://purl.org/linked-data/cube#dimension">qb:dimension</a> <a href="#economicActivity">edintdimension:economicActivity</a> ; qb:order 3 ] ,\n        [ <a href="http://purl.org/linked-data/cube#dimension">qb:dimension</a> <a href="#refPeriod">edintdimension:refPeriod</a> ; qb:order 4 ] ,\n        [ <a href="http://purl.org/linked-data/cube#dimension">qb:dimension</a> <a href="#sex">edintdimension:sex</a> ; qb:order 5 ] ,\n        [ <a href="http://purl.org/linked-data/cube#dimension">qb:dimension</a> <a href="#age">edintdimension:age</a> ; qb:order 6 ] ,\n        [ <a href="http://purl.org/linked-data/cube#dimension">qb:dimension</a> <a href="#contractType">edintdimension:contractType</a> ; qb:order 7 ] ,\n        [ <a href="http://purl.org/linked-data/cube#measure">qb:measure</a> <a href="#activePopulationCount">edintmeasure:activePopulationCount</a> ; qb:order 8 ] ,\n        [ <a href="http://purl.org/linked-data/cube#measure">qb:measure</a> <a href="#employedPopulationCount">edintmeasure:employedPopulationCount</a> ; qb:order 9 ] ,\n        [ <a href="http://purl.org/linked-data/cube#measure">qb:measure</a> <a href="#unemployedPopulationCount">edintmeasure:unemployedPopulationCount</a> ; qb:order 10 ] ,\n        [ <a href="http://purl.org/linked-data/cube#measure">qb:measure</a> <a href="#registeredContractsCount">edintmeasure:registeredContractsCount</a> ; qb:order 11 ] ,\n        [ <a href="http://purl.org/linked-data/cube#measure">qb:measure</a> <a href="#jobSeekersCount">edintmeasure:jobSeekersCount</a> ; qb:order 12 ] ,\n        [ <a href="http://purl.org/linked-data/cube#measure">qb:measure</a> <a href="#registeredUnemploymentCount">edintmeasure:registeredUnemploymentCount</a> ; qb:order 13 ] ,\n        [ <a href="http://purl.org/linked-data/cube#measure">qb:measure</a> <a href="#socialSecurityAffiliatesCount">edintmeasure:socialSecurityAffiliatesCount</a> ; qb:order 14 ] ,\n        [ <a href="http://purl.org/linked-data/cube#measure">qb:measure</a> ine:unemploymentRate ; qb:order 15 ] ,\n        [ <a href="http://purl.org/linked-data/cube#measure">qb:measure</a> ine:employmentRate ; qb:order 16 ] ,\n        [ <a href="http://purl.org/linked-data/cube#measure">qb:measure</a> ine:jobs ; qb:order 17 ] ,\n        [ <a href="http://purl.org/linked-data/cube#measure">qb:measure</a> <a href="#jobProfiles">edintmeasure:jobProfiles</a> ; qb:order 18 ] ,\n        [ <a href="http://purl.org/linked-data/cube#measure">qb:measure</a> ine:numberOfPeople ; qb:order 19 ] .\n</pre>\n\n<div id="cuboempleoejemplo">\n  <h3 id="qb1" class="list">Example 1: Number of employed persons by area, period, sex, and age group<span class="backlink"> back to <a href="#toc">index</a></span></h3>\n\n  <span class="markdown">\n  This example represents the data for the <b>number of employed persons</b> in a given administrative region, for a specific reference period, broken down by <b>sex</b> and <b>age group</b>. Since this vocabulary already defines the dataset <code>edintemp:dataset</code> and the data structure <code>edintemp:dsd</code>, there is no need to generate new dataset or structure instances; the existing ones can be reused.\n  </span>\n\n  <center>\n    <img src="../diagrams/diagram-example.png">\n    <figcaption>Figure 3.- Example of an observation in the employment cube for the number of employed persons by area, period, sex, and age group.</figcaption>\n  </center>\n\n  <span class="markdown">\n  The steps required to represent a specific observation are described below.\n  </span>\n\n  <span class="markdown">\n  <b>1) Reuse of the dataset and the data structure:</b> This vocabulary contains a single dataset, represented by <code>edintemp:dataset</code>, which is linked to the structure <code>edintemp:dsd</code> through the property <a href="http://purl.org/linked-data/cube#structure">qb:structure</a>.\n  </span>\n\n  <pre>\n<a href="#dataset">edintemp:dataset</a> a <a href="http://purl.org/linked-data/cube#DataSet">qb:DataSet</a> ; \n    <a href="http://purl.org/linked-data/cube#structure">qb:structure</a> <a href="#edintemp:dsd">edintemp:dsd</a> .\n  </pre>\n\n  <span class="markdown">\n  <b>2) Identification of the relevant dimensions and measures:</b> Although the structure <code>edintemp:dsd</code> contains all the dimensions and measures of the employment cube, this example only uses the dimensions <a href="#refAdminRegion">edintdimension:refAdminRegion</a>, <a href="#refPeriod">edintdimension:refPeriod</a>, <a href="#sex">edintdimension:sex</a> and <a href="#age">edintdimension:age</a>, together with the measure <a href="#employedPopulationCount">edintmeasure:employedPopulationCount</a>.\n\n  It is important to note that the dimension <a href="#refPeriod">edintdimension:refPeriod</a> has <code>time:Interval</code> as its range, so the reference period must be represented through an explicit instance of a temporal interval.\n  </span>\n\n  <pre>\n&lt;http://vocab.linkeddata.es/datosabiertos/recurso/actividad-economica/cubo-empleo/interval/2025&gt;\n    a time:Interval ;\n    rdfs:label "Year 2025"@en ,\n               "Año 2025"@es .\n  </pre>\n\n  <span class="markdown">\n  <b>3) Definition of a dataset observation:</b> The final step consists of creating an instance of <a href="http://purl.org/linked-data/cube#Observation">qb:Observation</a> and linking it to the dataset through the property <a href="http://purl.org/linked-data/cube#dataSet">qb:dataSet</a>. The corresponding values for the selected dimensions and measure are then assigned.\n  </span>\n\n  <pre>\n&lt;http://vocab.linkeddata.es/datosabiertos/recurso/actividad-economica/cubo-empleo/observation/obs001&gt;\n    a <a href="http://purl.org/linked-data/cube#Observation">qb:Observation</a> ;\n    <a href="http://purl.org/linked-data/cube#dataSet">qb:dataSet</a> <a href="#dataset">edintemp:dataset</a> ;\n    <a href="#refAdminRegion">edintdimension:refAdminRegion</a> &lt;http://vocab.linkeddata.es/datosabiertos/recurso/territorio/municipio/zaragoza&gt; ;\n    <a href="#refPeriod">edintdimension:refPeriod</a> &lt;http://vocab.linkeddata.es/datosabiertos/recurso/actividad-economica/cubo-empleo/interval/2025&gt; ;\n    <a href="#sex">edintdimension:sex</a> &lt;http://purl.org/linked-data/sdmx/2009/code#sex-F&gt; ;\n    <a href="#age">edintdimension:age</a> "25-29"^^xsd:string ;\n    <a href="#employedPopulationCount">edintmeasure:employedPopulationCount</a> "12543"^^xsd:nonNegativeInteger .\n  </pre>\n\n  <span class="markdown">\n  This observation indicates that, in the municipality of Zaragoza, during the temporal interval corresponding to the year 2025, the number of <b>employed women</b> in the <b>25 to 29 years old</b> age group is <b>12,543</b>.\n\n  This example shows how a single cube observation combines several dimension values with a specific measure to represent an employment indicator. In the same way, the same structure can be reused to represent other cube measures, such as the number of active persons, unemployed persons, registered contracts, job seekers, registered unemployment, Social Security affiliates, unemployment rate, employment rate, jobs, job profiles, or number of people.\n  </span>\n</div>\n
references-en=<span class="markdown">\n<ul>\n    <li><a href="https://edint.es/en/" target="_blank">Data Spaces for Smart Urban Infrastructures (EDINT)</a></li>\n    <li><a href="http://femp.femp.es/files/3580-1937-fichero/DATOS%20ABIERTOS%20FEMP%202019.pdf" target="_blank">Guía Datos abiertos FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a></li>\n    <li><a href="https://datos.gob.es/es/conocimiento/datos-abiertos-femp-2019-40-conjuntos-de-datos-publicar-por-las-entidades-locales" target="_blank">DATOS ABIERTOS FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a> (source: datos.gob.es)</li>\n    <li><a href="https://redtransparenciayparticipacion.es/wp-content/uploads/2025/03/Datos-abiertos-80-conjuntos-de-datos.pdf" target="_blank">DATOS ABIERTOS 80 CONJUNTOS DE DATOS</a></li>\n</ul>\n</span>\n
abstract-es=El propósito de este vocabulario es proporcionar la definición de la estructura del cubo de datos de empleo. Para ello, se reutiliza el vocabulario W3C Data Cube y se han generado las instancias necesarias para definir su estructura, indicando las dimensiones y medidas que se emplean en este cubo.\n\nAdicionalmente, se reutilizan varios vocabularios y listas de códigos que permiten describir los distintos desgloses de la información de empleo, como el territorio, el periodo de referencia, el sexo, la edad o la actividad económica.
introduction-es=Esta ontología forma parte del catálogo de ontologías que está siendo desarrollado en el contexto del <a href="https://edint.es/" target="_blank">Espacio de Datos para las Infraestructuras Urbanas Inteligentes (EDINT)</a>. Asimismo, fue identificada como una ontología relevante para la representación de datos gestionados por entidades locales en la guía <a href="http://femp.femp.es/files/3580-1937-fichero/DATOS%20ABIERTOS%20FEMP%202019.pdf" target="_blank">Datos abiertos FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a>, tal y como se describe también en la correspondiente <a href="https://datos.gob.es/es/conocimiento/datos-abiertos-femp-2019-40-conjuntos-de-datos-publicar-por-las-entidades-locales" target="_blank">nota de datos.gob.es</a>, y por tanto recogido en el <a href="https://github.com/opencitydata" target="_blank">repositorio Github de apoyo a la iniciativa</a>, que queda deprecado una vez se lance este repositorio.\nUna versión amplificada de la guía se encuentra en <a href="https://redtransparenciayparticipacion.es/wp-content/uploads/2025/03/Datos-abiertos-80-conjuntos-de-datos.pdf" target="_blank">DATOS ABIERTOS 80 CONJUNTOS DE DATOS</a>\n
description-es=\n<span class="markdown">\nPara la generación del cubo de datos de empleo, se reutiliza el vocabulario <a href="https://www.w3.org/TR/vocab-data-cube">W3C Data Cube</a>. Este vocabulario es una recomendación del W3C para la publicación de datos multidimensionales en la Web, facilitando su representación estructurada, interoperabilidad y reutilización. Además, este vocabulario es compatible con el estándar SDMX (<i>Statistical Data and Metadata eXchange</i>), ampliamente utilizado para el intercambio de datos y metadatos estadísticos entre organizaciones.\n</span>\n\n<center>\n  <img src="https://www.w3.org/TR/vocab-data-cube/images/qb-fig1.png">\n  <figcaption>Figura 1.- Diagrama del vocabulario W3C Data Cube.</figcaption>\n</center>\n\n<span class="markdown">\nComo se muestra en la Figura 1, W3C Data Cube contiene varios conceptos y propiedades que permiten describir datos estadísticos en distintos niveles de agregación. En este vocabulario, el modelo se organiza en torno al concepto <a href="https://www.w3.org/TR/vocab-data-cube/#reference-datasets">qb:DataSet</a>, que representa un conjunto de datos definido de acuerdo con una estructura especificada mediante una <a href="https://www.w3.org/TR/vocab-data-cube/#dsd">qb:DataStructureDefinition</a> y materializado a través de un conjunto de observaciones representadas con <a href="https://www.w3.org/TR/vocab-data-cube/#reference-datasets">qb:Observation</a>.\n\nEn concreto, este vocabulario define un único dataset del cubo de datos, representado mediante la instancia <code>edintemp:dataset</code>, y una única estructura de datos, representada mediante la instancia <code>edintemp:dsd</code>. La ontología se identifica de forma separada del dataset, utilizando la IRI de ontología <code>http://vocab.linkeddata.es/datosabiertos/def/actividad-economica/cubo-empleo</code>. Esta separación permite que los metadatos describan la ontología, mientras que <code>edintemp:dataset</code> representa el dataset del cubo al que se vinculan las observaciones.\n</span>\n\n<ul>\n  <li><a href="https://www.w3.org/TR/vocab-data-cube/#dsd-dimensions">qb:DimensionProperty</a>: componente que identifica las dimensiones de las observaciones, como la región administrativa de referencia, el periodo de referencia, el sexo, la edad, la actividad económica, el sector o el tipo de contrato. Las dimensiones suelen tomar sus valores de listas de códigos o clasificaciones, normalmente representadas mediante SKOS.</li>\n  <li><a href="https://www.w3.org/TR/vocab-data-cube/#dsd-dimensions">qb:MeasureProperty</a>: componente que representa el valor medido de los datos observados. En este cubo, las medidas corresponden a indicadores de empleo, como el número de personas activas, personas ocupadas, personas desempleadas, demandantes de empleo, contratos registrados, paro registrado, afiliaciones a la Seguridad Social, tasa de paro, tasa de empleo, puestos de trabajo, perfiles de empleo y número de personas.</li>\n</ul>\n\n<span class="markdown">\nPara definir estas dimensiones y medidas se reutilizan varios vocabularios de referencia:\n</span>\n\n<ol>\n  <li>Vocabularios SDMX (<i>Statistical Data and Metadata eXchange</i>):</li>\n  <ul>\n    <li><a href="http://purl.org/linked-data/sdmx/2009/dimension">sdmx-dimension</a>: se reutiliza como base para dimensiones estadísticas generales, especialmente mediante relaciones de especialización como <a href="#refAdminRegion">edintdimension:refAdminRegion</a>, <a href="#refPeriod">edintdimension:refPeriod</a>, <a href="#sex">edintdimension:sex</a> y <a href="#age">edintdimension:age</a>.</li>\n    <li><a href="http://purl.org/linked-data/sdmx/2009/measure">sdmx-measure</a>: se reutiliza como base para varias medidas del cubo, definidas como subpropiedades de <code>sdmx-measure:obsValue</code>.</li>\n  </ul>\n  <li>Vocabularios territoriales y temporales:</li>\n  <ul>\n    <li><a href="http://vocab.linkeddata.es/datosabiertos/def/sector-publico/territorio">esadm</a>: se reutiliza para indicar que la dimensión <a href="#refAdminRegion">edintdimension:refAdminRegion</a> puede tomar valores correspondientes a municipios, barrios o distritos.</li>\n    <li><a href="https://www.w3.org/TR/owl-time/">OWL-Time</a>: se reutiliza para modelar la dimensión temporal, estableciendo que <a href="#refPeriod">edintdimension:refPeriod</a> tiene como rango <code>time:Interval</code>.</li>\n  </ul>\n  <li>Listas de códigos SKOS:</li>\n  <ul>\n    <li>La dimensión <a href="#sector">edintdimension:sector</a> reutiliza como lista de códigos el esquema del sector público publicado en <a href="https://datos.gob.es/kos/sector-publico/sector">datos.gob.es</a>.</li>\n    <li>La dimensión <a href="#economicActivity">edintdimension:economicActivity</a> reutiliza una clasificación controlada de actividad económica, como <a href="http://lod.ine.es/kos/cnae/CNAE-2025">CNAE 2025</a>.</li>\n    <li>La dimensión <a href="#contractType">edintdimension:contractType</a> utiliza una lista de códigos propia definida en <code>edintkos:contractType</code>.</li>\n  </ul>\n  <li>Vocabulario del INE:</li>\n  <ul>\n    <li>El vocabulario también reutiliza varias propiedades del vocabulario del INE, como <code>ine:unemploymentRate</code>, <code>ine:employmentRate</code>, <code>ine:jobs</code> e <code>ine:numberOfPeople</code>, con el objetivo de extender el cubo con indicadores adicionales relacionados con el empleo.</li>\n  </ul>\n</ol>\n\n<span class="markdown">\nEl modelo del cubo de empleo se muestra en la Figura 2, donde se presentan las dimensiones y medidas que lo componen.\n</span>\n\n<center>\n  <img src="../diagrams/diagram.png">\n  <figcaption>Figura 2.- Diagrama conceptual del cubo de datos de empleo.</figcaption>\n</center>\n\n<span class="markdown">\nLa estructura del cubo de empleo se define mediante la instancia <a href="#edintemp:dsd">edintemp:dsd</a>, que agrupa todas las dimensiones y medidas del modelo. En este caso, se han definido como dimensiones la región administrativa de referencia, el sector, la actividad económica, el periodo de referencia, el sexo, la edad y el tipo de contrato. Como medidas, el modelo incluye distintos recuentos e indicadores asociados al empleo, como el número de personas activas, ocupadas y desempleadas, contratos registrados, demandantes de empleo, paro registrado, afiliaciones a la Seguridad Social, tasa de paro, tasa de empleo, puestos de trabajo, perfiles de empleo y número de personas.\n</span>\n\n<pre>\n&lt;http://vocab.linkeddata.es/datosabiertos/def/actividad-economica/cubo-empleo&gt;\n    a <a href="http://www.w3.org/2002/07/owl#Ontology">owl:Ontology</a> ;\n    <a href="http://www.w3.org/2002/07/owl#imports">owl:imports</a> &lt;http://purl.org/linked-data/cube&gt; ;\n    <a href="http://www.w3.org/2002/07/owl#versionInfo">owl:versionInfo</a> "0.1.0" .\n\n<a href="#dataset">edintemp:dataset</a> a <a href="http://purl.org/linked-data/cube#DataSet">qb:DataSet</a> ; \n    <a href="http://purl.org/linked-data/cube#structure">qb:structure</a> <a href="#edintemp:dsd">edintemp:dsd</a> .\n\n<a href="#edintemp:dsd">edintemp:dsd</a> a <a href="http://purl.org/linked-data/cube#DataStructureDefinition">qb:DataStructureDefinition</a> ;\n    <a href="http://purl.org/linked-data/cube#component">qb:component</a>\n        [ <a href="http://purl.org/linked-data/cube#dimension">qb:dimension</a> <a href="#refAdminRegion">edintdimension:refAdminRegion</a> ; qb:order 1 ] ,\n        [ <a href="http://purl.org/linked-data/cube#dimension">qb:dimension</a> <a href="#sector">edintdimension:sector</a> ; qb:order 2 ] ,\n        [ <a href="http://purl.org/linked-data/cube#dimension">qb:dimension</a> <a href="#economicActivity">edintdimension:economicActivity</a> ; qb:order 3 ] ,\n        [ <a href="http://purl.org/linked-data/cube#dimension">qb:dimension</a> <a href="#refPeriod">edintdimension:refPeriod</a> ; qb:order 4 ] ,\n        [ <a href="http://purl.org/linked-data/cube#dimension">qb:dimension</a> <a href="#sex">edintdimension:sex</a> ; qb:order 5 ] ,\n        [ <a href="http://purl.org/linked-data/cube#dimension">qb:dimension</a> <a href="#age">edintdimension:age</a> ; qb:order 6 ] ,\n        [ <a href="http://purl.org/linked-data/cube#dimension">qb:dimension</a> <a href="#contractType">edintdimension:contractType</a> ; qb:order 7 ] ,\n        [ <a href="http://purl.org/linked-data/cube#measure">qb:measure</a> <a href="#activePopulationCount">edintmeasure:activePopulationCount</a> ; qb:order 8 ] ,\n        [ <a href="http://purl.org/linked-data/cube#measure">qb:measure</a> <a href="#employedPopulationCount">edintmeasure:employedPopulationCount</a> ; qb:order 9 ] ,\n        [ <a href="http://purl.org/linked-data/cube#measure">qb:measure</a> <a href="#unemployedPopulationCount">edintmeasure:unemployedPopulationCount</a> ; qb:order 10 ] ,\n        [ <a href="http://purl.org/linked-data/cube#measure">qb:measure</a> <a href="#registeredContractsCount">edintmeasure:registeredContractsCount</a> ; qb:order 11 ] ,\n        [ <a href="http://purl.org/linked-data/cube#measure">qb:measure</a> <a href="#jobSeekersCount">edintmeasure:jobSeekersCount</a> ; qb:order 12 ] ,\n        [ <a href="http://purl.org/linked-data/cube#measure">qb:measure</a> <a href="#registeredUnemploymentCount">edintmeasure:registeredUnemploymentCount</a> ; qb:order 13 ] ,\n        [ <a href="http://purl.org/linked-data/cube#measure">qb:measure</a> <a href="#socialSecurityAffiliatesCount">edintmeasure:socialSecurityAffiliatesCount</a> ; qb:order 14 ] ,\n        [ <a href="http://purl.org/linked-data/cube#measure">qb:measure</a> ine:unemploymentRate ; qb:order 15 ] ,\n        [ <a href="http://purl.org/linked-data/cube#measure">qb:measure</a> ine:employmentRate ; qb:order 16 ] ,\n        [ <a href="http://purl.org/linked-data/cube#measure">qb:measure</a> ine:jobs ; qb:order 17 ] ,\n        [ <a href="http://purl.org/linked-data/cube#measure">qb:measure</a> <a href="#jobProfiles">edintmeasure:jobProfiles</a> ; qb:order 18 ] ,\n        [ <a href="http://purl.org/linked-data/cube#measure">qb:measure</a> ine:numberOfPeople ; qb:order 19 ] .\n</pre>\n\n<div id="cuboempleoejemplo">\n  <h3 id="qb1" class="list">Ejemplo 1: Número de personas ocupadas por área, periodo, sexo y grupo de edad<span class="backlink"> volver al <a href="#toc">índice</a></span></h3>\n\n  <span class="markdown">\n  Este ejemplo representa el dato correspondiente al <b>número de personas ocupadas</b> en una región administrativa determinada, para un periodo de referencia específico, desglosado por <b>sexo</b> y <b>grupo de edad</b>. Dado que este vocabulario ya define el dataset <code>edintemp:dataset</code> y la estructura de datos <code>edintemp:dsd</code>, no es necesario generar nuevas instancias de dataset o de estructura; se pueden reutilizar las ya existentes.\n  </span>\n\n  <center>\n    <img src="../diagrams/diagram-example.png">\n    <figcaption>Figura 3.- Ejemplo de una observación en el cubo de empleo para el número de personas ocupadas por área, periodo, sexo y grupo de edad.</figcaption>\n  </center>\n\n  <span class="markdown">\n  A continuación, se describen los pasos necesarios para representar una observación concreta.\n  </span>\n\n  <span class="markdown">\n  <b>1) Reutilización del dataset y de la estructura de datos:</b> Este vocabulario contiene un único dataset, representado por <code>edintemp:dataset</code>, que se vincula con la estructura <code>edintemp:dsd</code> mediante la propiedad <a href="http://purl.org/linked-data/cube#structure">qb:structure</a>.\n  </span>\n\n  <pre>\n<a href="#dataset">edintemp:dataset</a> a <a href="http://purl.org/linked-data/cube#DataSet">qb:DataSet</a> ; \n    <a href="http://purl.org/linked-data/cube#structure">qb:structure</a> <a href="#edintemp:dsd">edintemp:dsd</a> .\n  </pre>\n\n  <span class="markdown">\n  <b>2) Identificación de las dimensiones y medidas relevantes:</b> Aunque la estructura <code>edintemp:dsd</code> contiene todas las dimensiones y medidas del cubo de empleo, este ejemplo solo utiliza las dimensiones <a href="#refAdminRegion">edintdimension:refAdminRegion</a>, <a href="#refPeriod">edintdimension:refPeriod</a>, <a href="#sex">edintdimension:sex</a> y <a href="#age">edintdimension:age</a>, junto con la medida <a href="#employedPopulationCount">edintmeasure:employedPopulationCount</a>.\n\n  Es importante señalar que la dimensión <a href="#refPeriod">edintdimension:refPeriod</a> tiene como rango <code>time:Interval</code>, por lo que el periodo de referencia debe representarse mediante una instancia explícita de intervalo temporal.\n  </span>\n\n  <pre>\n&lt;http://vocab.linkeddata.es/datosabiertos/recurso/actividad-economica/cubo-empleo/interval/2025&gt;\n    a time:Interval ;\n    rdfs:label "Year 2025"@en ,\n               "Año 2025"@es .\n  </pre>\n\n  <span class="markdown">\n  <b>3) Definición de una observación del dataset:</b> El último paso consiste en crear una instancia de <a href="http://purl.org/linked-data/cube#Observation">qb:Observation</a> y vincularla al dataset mediante la propiedad <a href="http://purl.org/linked-data/cube#dataSet">qb:dataSet</a>. A continuación, se asignan los valores correspondientes para las dimensiones y la medida seleccionadas.\n  </span>\n\n  <pre>\n&lt;http://vocab.linkeddata.es/datosabiertos/recurso/actividad-economica/cubo-empleo/observation/obs001&gt;\n    a <a href="http://purl.org/linked-data/cube#Observation">qb:Observation</a> ;\n    <a href="http://purl.org/linked-data/cube#dataSet">qb:dataSet</a> <a href="#dataset">edintemp:dataset</a> ;\n    <a href="#refAdminRegion">edintdimension:refAdminRegion</a> &lt;http://vocab.linkeddata.es/datosabiertos/recurso/territorio/municipio/zaragoza&gt; ;\n    <a href="#refPeriod">edintdimension:refPeriod</a> &lt;http://vocab.linkeddata.es/datosabiertos/recurso/actividad-economica/cubo-empleo/interval/2025&gt; ;\n    <a href="#sex">edintdimension:sex</a> &lt;http://purl.org/linked-data/sdmx/2009/code#sex-F&gt; ;\n    <a href="#age">edintdimension:age</a> "25-29"^^xsd:string ;\n    <a href="#employedPopulationCount">edintmeasure:employedPopulationCount</a> "12543"^^xsd:nonNegativeInteger .\n  </pre>\n\n  <span class="markdown">\n  Esta observación indica que, en el municipio de Zaragoza, durante el intervalo temporal correspondiente al año 2025, el número de <b>mujeres ocupadas</b> en el grupo de edad de <b>25 a 29 años</b> es de <b>12.543</b>.\n\n  Este ejemplo muestra cómo una única observación del cubo combina varios valores de dimensiones con una medida concreta para representar un indicador de empleo. De la misma manera, la misma estructura puede reutilizarse para representar otras medidas del cubo, como el número de personas activas, desempleadas, contratos registrados, demandantes de empleo, paro registrado, afiliaciones a la Seguridad Social, tasa de paro, tasa de empleo, puestos de trabajo, perfiles de empleo o número de personas.\n  </span>\n</div>\n
references-es=<span class="markdown">\n<ul>\n    <li><a href="https://edint.es/" target="_blank">Espacio de Datos para las Infraestructuras Urbanas Inteligentes (EDINT)</a></li>\n    <li><a href="http://femp.femp.es/files/3580-1937-fichero/DATOS%20ABIERTOS%20FEMP%202019.pdf" target="_blank">Guía Datos abiertos FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a></li>\n    <li><a href="https://datos.gob.es/es/conocimiento/datos-abiertos-femp-2019-40-conjuntos-de-datos-publicar-por-las-entidades-locales" target="_blank">DATOS ABIERTOS FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a> (source: datos.gob.es)</li>\n    <li><a href="https://redtransparenciayparticipacion.es/wp-content/uploads/2025/03/Datos-abiertos-80-conjuntos-de-datos.pdf" target="_blank">DATOS ABIERTOS 80 CONJUNTOS DE DATOS</a></li>\n</ul>\n</span>\n
