abstract-en=\nThe purpose of this vocabulary is to provide the definition of the structure of the commercial expenditure data cube. To this end, the W3C Data Cube vocabulary is reused, and the necessary instances have been created to define such structure, indicating the dimensions and measures used in this cube.\n\nAdditionally, several vocabularies and code lists are reused to describe the different breakdowns of commercial expenditure information, such as territory, reference period, economic activity sector, and nationality.\n
introduction-en=\nThis ontology is part of the catalog of ontologies that is being developed in the context of the <a href="https://edint.es/" target="_blank">Data Space for Smart Urban Infrastructures (EDINT)</a>. It was also identified as a relevant ontology for the representation of data managed by local entities in the guide <a href="http://femp.femp.es/files/3580-1937-fichero/DATOS%20ABIERTOS%20FEMP%202019.pdf" target="_blank">Datos abiertos FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a>, as also described in the corresponding <a href="https://datos.gob.es/es/conocimiento/datos-abiertos-femp-2019-40-conjuntos-de-datos-publicar-por-las-entidades-locales" target="_blank">data.gob.es note</a>, and therefore included in the <a href="https://github.com/opencitydata" target="_blank">Github repository supporting the initiative</a>, which will be deprecated once this repository is launched.\nAn amplified version of the guide can be found in <a href="https://redtransparenciayparticipacion.es/wp-content/uploads/2025/03/Datos-abiertos-80-conjuntos-de-datos.pdf" target="_blank">DATOS ABIERTOS 80 CONJUNTOS DE DATOS</a>\n
description-en=\n<span class="markdown">\nFor the generation of the commercial expenditure data cube, the <a href="https://www.w3.org/TR/vocab-data-cube">W3C Data Cube</a> vocabulary is reused. This vocabulary is a W3C recommendation for the publication of multidimensional data on the Web, which facilitates their structured representation, interoperability, and reuse. In addition, this vocabulary is compatible with the SDMX standard (<i>Statistical Data and Metadata eXchange</i>), which is widely used for the exchange of statistical data and metadata across organizations.\n</span>\n\n<center>\n  <img src="https://www.w3.org/TR/vocab-data-cube/images/qb-fig1.png">\n  <figcaption>Figure 1.- Diagram of the W3C Data Cube vocabulary.</figcaption>\n</center>\n\n<span class="markdown">\nAs shown in Figure 1, W3C Data Cube contains several concepts and properties that make it possible to describe statistical data at different levels of aggregation. In this vocabulary, the model is organized around the concept of <a href="https://www.w3.org/TR/vocab-data-cube/#reference-datasets">qb:DataSet</a>, which represents a dataset following a structure defined by a <a href="https://www.w3.org/TR/vocab-data-cube/#dsd">qb:DataStructureDefinition</a> and materialized through a set of observations represented by <a href="https://www.w3.org/TR/vocab-data-cube/#reference-datasets">qb:Observation</a>.\n\nSpecifically, this vocabulary defines a single dataset, represented by the instance <code>edintgast:</code>, and a single data structure, represented by the instance <code>edintgast:dsd</code>. This structure gathers all the dimensions and measures required to represent commercial expenditure information.\n</span>\n\n<ul>\n  <li><a href="https://www.w3.org/TR/vocab-data-cube/#dsd-dimensions">qb:DimensionProperty</a>: component that identifies the dimensions of the observations, such as the reference administrative region, thematic sector, economic activity, reference period, or nationality. Dimensions usually take their values from code lists or classifications, typically represented using SKOS, or from other controlled resources.</li>\n  <li><a href="https://www.w3.org/TR/vocab-data-cube/#dsd-dimensions">qb:MeasureProperty</a>: component that represents the measured value of the observed data. In this cube, the measure corresponds to the total monetary amount of commercial expenditure.</li>\n</ul>\n\n<span class="markdown">\nSeveral reference vocabularies are reused to define these dimensions and measures:\n</span>\n\n<ol>\n  <li>SDMX vocabularies (<i>Statistical Data and Metadata eXchange</i>):</li>\n  <ul>\n    <li><a href="http://purl.org/linked-data/sdmx/2009/dimension">sdmx-dimension</a>: reused as the basis for general statistical dimensions, especially through specialization relationships such as <a href="#refAdminRegion">edintdimension:refAdminRegion</a> and <a href="#refPeriod">edintdimension:refPeriod</a>.</li>\n    <li><a href="http://purl.org/linked-data/sdmx/2009/measure">sdmx-measure</a>: reused as the basis for the cube measure, defined as a subproperty of <code>sdmx-measure:obsValue</code>.</li>\n  </ul>\n  <li>Territorial and temporal vocabularies:</li>\n  <ul>\n    <li><a href="http://vocab.linkeddata.es/datosabiertos/def/sector-publico/territorio">esadm</a>: reused to indicate that the dimension <a href="#refAdminRegion">edintdimension:refAdminRegion</a> may take values corresponding to municipalities, neighborhoods, or districts.</li>\n    <li><a href="https://www.w3.org/TR/owl-time/">OWL-Time</a>: reused to model the temporal dimension, establishing that <a href="#refPeriod">edintdimension:refPeriod</a> has <code>time:Interval</code> as its range.</li>\n  </ul>\n  <li>SKOS code lists:</li>\n  <ul>\n    <li>The dimension <a href="#sector">edintdimension:sector</a> reuses as a code list the public sector scheme published at <a href="https://datos.gob.es/kos/sector-publico/sector">datos.gob.es</a>.</li>\n    <li>The dimension <a href="#economicActivity">edintdimension:economicActivity</a> reuses a controlled classification of economic activity, such as <a href="http://lod.ine.es/kos/cnae/CNAE-2025">CNAE 2025</a>.</li>\n  </ul>\n</ol>\n\n<span class="markdown">\nThe commercial expenditure cube model is shown in Figure 2, where the dimensions and measures that compose it are presented.\n</span>\n\n<center>\n  <img src="../diagrams/diagram.png">\n  <figcaption>Figure 2.- Conceptual diagram of the commercial expenditure data cube.</figcaption>\n</center>\n\n<span class="markdown">\nThe structure of the commercial expenditure cube is defined through the instance <a href="#edintgast:dsd">edintgast:dsd</a>, which groups all the dimensions and measures of the model. In this case, the reference administrative region, sector, economic activity, reference period, and nationality have been defined as dimensions. As measure, the model includes the expenditure amount, which represents the total monetary amount of commercial expenditure made in a given context.\n</span>\n\n<pre>\n<a href="#ontology">edintgast:</a> a <a href="http://purl.org/linked-data/cube#DataSet">qb:DataSet</a> ; \n    <a href="http://purl.org/linked-data/cube#structure">qb:structure</a> <a href="#edintgast:dsd">edintgast:dsd</a> .\n\n<a href="#edintgast:dsd">edintgast:dsd</a> a <a href="http://purl.org/linked-data/cube#DataStructureDefinition">qb:DataStructureDefinition</a> ;\n    <a href="http://purl.org/linked-data/cube#component">qb:component</a>\n        [ <a href="http://purl.org/linked-data/cube#dimension">qb:dimension</a> <a href="#refAdminRegion">edintdimension:refAdminRegion</a> ; qb:order 1 ] ,\n        [ <a href="http://purl.org/linked-data/cube#dimension">qb:dimension</a> <a href="#sector">edintdimension:sector</a> ; qb:order 2 ] ,\n        [ <a href="http://purl.org/linked-data/cube#dimension">qb:dimension</a> <a href="#economicActivity">edintdimension:economicActivity</a> ; qb:order 3 ] ,\n        [ <a href="http://purl.org/linked-data/cube#dimension">qb:dimension</a> <a href="#refPeriod">edintdimension:refPeriod</a> ; qb:order 4 ] ,\n        [ <a href="http://purl.org/linked-data/cube#dimension">qb:dimension</a> <a href="#nationality">edintdimension:nationality</a> ; qb:order 5 ] ,\n        [ <a href="http://purl.org/linked-data/cube#measure">qb:measure</a> <a href="#expenditureAmount">edintmeasure:expenditureAmount</a> ; qb:order 6 ] .\n</pre>\n\n\n<div id="cubogastocomercialejemplo">\n  <h3 id="qb1" class="list">Example 1: Commercial expenditure amount by area, period, economic activity, sector, and nationality<span class="backlink"> back to <a href="#toc">index</a></span></h3>\n\n  <span class="markdown">\n  This example represents the data for the <b>commercial expenditure amount</b> in a given administrative region, for a specific reference period, broken down by <b>economic activity</b>, <b>sector</b>, and <b>nationality</b>. Since this vocabulary already defines the dataset <code>edintgast:</code> and the data structure <code>edintgast:dsd</code>, there is no need to generate new dataset or structure instances; the existing ones can be reused.\n  </span>\n\n  <center>\n    <img src="../diagrams/diagram-example.png">\n    <figcaption>Figure 3.- Example of an observation in the commercial expenditure cube by area, period, economic activity, sector, and nationality.</figcaption>\n  </center>\n\n  <span class="markdown">\n  The steps required to represent a specific observation are described below.\n  </span>\n\n  <span class="markdown">\n  <b>**1) Reuse of the dataset and the data structure:**</b> This vocabulary contains a single dataset, represented by <code>edintgast:</code>, which is linked to the structure <code>edintgast:dsd</code> through the property <a href="http://purl.org/linked-data/cube#structure">qb:structure</a>.\n  </span>\n\n  <pre>\n<a href="#ontology">edintgast:</a> a <a href="http://purl.org/linked-data/cube#DataSet">qb:DataSet</a> ; \n    <a href="http://purl.org/linked-data/cube#structure">qb:structure</a> <a href="#edintgast:dsd">edintgast:dsd</a> .\n  </pre>\n\n  <span class="markdown">\n  <b>**2) Identification of the relevant dimensions and measure:**</b> The structure <code>edintgast:dsd</code> contains the dimensions and measure of the commercial expenditure cube. In this example, the dimensions <a href="#refAdminRegion">edintdimension:refAdminRegion</a>, <a href="#sector">edintdimension:sector</a>, <a href="#economicActivity">edintdimension:economicActivity</a>, <a href="#refPeriod">edintdimension:refPeriod</a>, and <a href="#nationality">edintdimension:nationality</a> are used together with the measure <a href="#expenditureAmount">edintmeasure:expenditureAmount</a>.\n\n  It is important to note that the dimension <a href="#refPeriod">edintdimension:refPeriod</a> has <code>time:Interval</code> as its range, so the reference period must be represented through an explicit instance of a temporal interval.\n  </span>\n\n  <pre>\n&lt;http://vocab.linkeddata.es/datosabiertos/recurso/comercio/cubo-gasto-comercial/interval/2025-01&gt;\n    a time:Interval ;\n    rdfs:label "January 2025"@en ,\n               "Enero de 2025"@es .\n  </pre>\n\n  <span class="markdown">\n  <b>**3) Definition of a dataset observation:**</b> The final step consists of creating an instance of <a href="http://purl.org/linked-data/cube#Observation">qb:Observation</a> and linking it to the dataset through the property <a href="http://purl.org/linked-data/cube#dataSet">qb:dataSet</a>. The corresponding values for the selected dimensions and measure are then assigned.\n  </span>\n\n  <pre>\n&lt;http://vocab.linkeddata.es/datosabiertos/recurso/comercio/cubo-gasto-comercial/observation/obs001&gt;\n    a <a href="http://purl.org/linked-data/cube#Observation">qb:Observation</a> ;\n    <a href="http://purl.org/linked-data/cube#dataSet">qb:dataSet</a> <a href="#ontology">edintgast:</a> ;\n    <a href="#refAdminRegion">edintdimension:refAdminRegion</a> &lt;http://vocab.linkeddata.es/datosabiertos/recurso/territorio/municipio/zaragoza&gt; ;\n    <a href="#sector">edintdimension:sector</a> &lt;https://datos.gob.es/kos/sector-publico/sector#comercio&gt; ;\n    <a href="#economicActivity">edintdimension:economicActivity</a> &lt;http://lod.ine.es/kos/cnae/CNAE-2025/G&gt; ;\n    <a href="#refPeriod">edintdimension:refPeriod</a> &lt;http://vocab.linkeddata.es/datosabiertos/recurso/comercio/cubo-gasto-comercial/interval/2025-01&gt; ;\n    <a href="#nationality">edintdimension:nationality</a> "Spanish"^^xsd:string ;\n    <a href="#expenditureAmount">edintmeasure:expenditureAmount</a> "125430.75"^^xsd:decimal .\n  </pre>\n\n  <span class="markdown">\n  This observation indicates that, in the municipality of Zaragoza, during the temporal interval corresponding to January 2025, the commercial expenditure associated with the commerce sector, a specific economic activity, and Spanish nationality is <b>125,430.75</b>.\n\n  This example shows how a single cube observation combines several dimension values with a specific measure to represent commercial expenditure information. In the same way, the same structure can be reused to represent expenditure values for other administrative regions, reference periods, economic activities, sectors, or nationalities.\n  </span>\n</div>\n
references-en=<span class="markdown">\n<ul>\n    <li><a href="https://edint.es/en/" target="_blank">Data Spaces for Smart Urban Infrastructures (EDINT)</a></li>\n    <li><a href="http://femp.femp.es/files/3580-1937-fichero/DATOS%20ABIERTOS%20FEMP%202019.pdf" target="_blank">Guía Datos abiertos FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a></li>\n    <li><a href="https://datos.gob.es/es/conocimiento/datos-abiertos-femp-2019-40-conjuntos-de-datos-publicar-por-las-entidades-locales" target="_blank">DATOS ABIERTOS FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a> (source: datos.gob.es)</li>\n    <li><a href="https://redtransparenciayparticipacion.es/wp-content/uploads/2025/03/Datos-abiertos-80-conjuntos-de-datos.pdf" target="_blank">DATOS ABIERTOS 80 CONJUNTOS DE DATOS</a></li>\n</ul>\n</span>\n
abstract-es=\nEl propósito de este vocabulario es proporcionar la definición de la estructura del cubo de datos de gasto comercial. Para ello, se reutiliza el vocabulario W3C Data Cube y se han creado las instancias necesarias para definir dicha estructura, indicando las dimensiones y medidas utilizadas en este cubo.\n\nAdemás, se reutilizan varios vocabularios y listas de códigos para describir los diferentes desgloses de la información sobre gasto comercial, como el territorio, el periodo de referencia, el sector de actividad económica y la nacionalidad.\n
introduction-es=Esta ontología forma parte del catálogo de ontologías que está siendo desarrollado en el contexto del <a href="https://edint.es/" target="_blank">Espacio de Datos para las Infraestructuras Urbanas Inteligentes (EDINT)</a>. Asimismo, fue identificada como una ontología relevante para la representación de datos gestionados por entidades locales en la guía <a href="http://femp.femp.es/files/3580-1937-fichero/DATOS%20ABIERTOS%20FEMP%202019.pdf" target="_blank">Datos abiertos FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a>, tal y como se describe también en la correspondiente <a href="https://datos.gob.es/es/conocimiento/datos-abiertos-femp-2019-40-conjuntos-de-datos-publicar-por-las-entidades-locales" target="_blank">nota de datos.gob.es</a>, y por tanto recogido en el <a href="https://github.com/opencitydata" target="_blank">repositorio Github de apoyo a la iniciativa</a>, que queda deprecado una vez se lance este repositorio.\nUna versión amplificada de la guía se encuentra en <a href="https://redtransparenciayparticipacion.es/wp-content/uploads/2025/03/Datos-abiertos-80-conjuntos-de-datos.pdf" target="_blank">DATOS ABIERTOS 80 CONJUNTOS DE DATOS</a>\n
description-es=\n<span class="markdown">\nPara la generación del cubo de datos de gasto comercial se reutiliza el vocabulario <a href="https://www.w3.org/TR/vocab-data-cube">W3C Data Cube</a>. Este vocabulario es una recomendación del W3C para la publicación de datos multidimensionales en la Web, lo que facilita su representación estructurada, interoperabilidad y reutilización. Además, este vocabulario es compatible con el estándar SDMX (<i>Statistical Data and Metadata eXchange</i>), ampliamente utilizado para el intercambio de datos y metadatos estadísticos entre organizaciones.\n</span>\n\n<center>\n  <img src="https://www.w3.org/TR/vocab-data-cube/images/qb-fig1.png">\n  <figcaption>Figura 1.- Diagrama del vocabulario W3C Data Cube.</figcaption>\n</center>\n\n<span class="markdown">\nComo se muestra en la Figura 1, W3C Data Cube contiene varios conceptos y propiedades que permiten describir datos estadísticos en diferentes niveles de agregación. En este vocabulario, el modelo se organiza en torno al concepto de <a href="https://www.w3.org/TR/vocab-data-cube/#reference-datasets">qb:DataSet</a>, que representa un conjunto de datos que sigue una estructura definida mediante una <a href="https://www.w3.org/TR/vocab-data-cube/#dsd">qb:DataStructureDefinition</a> y que se materializa a través de un conjunto de observaciones representadas mediante <a href="https://www.w3.org/TR/vocab-data-cube/#reference-datasets">qb:Observation</a>.\n\nEn concreto, este vocabulario define un único conjunto de datos, representado por la instancia <code>edintgast:</code>, y una única estructura de datos, representada por la instancia <code>edintgast:dsd</code>. Esta estructura agrupa todas las dimensiones y medidas necesarias para representar información sobre gasto comercial.\n</span>\n\n<ul>\n  <li><a href="https://www.w3.org/TR/vocab-data-cube/#dsd-dimensions">qb:DimensionProperty</a>: componente que identifica las dimensiones de las observaciones, como la región administrativa de referencia, el sector temático, la actividad económica, el periodo de referencia o la nacionalidad. Las dimensiones suelen tomar sus valores de listas de códigos o clasificaciones, normalmente representadas mediante SKOS, o de otros recursos controlados.</li>\n  <li><a href="https://www.w3.org/TR/vocab-data-cube/#dsd-dimensions">qb:MeasureProperty</a>: componente que representa el valor medido de los datos observados. En este cubo, la medida corresponde al importe monetario total del gasto comercial.</li>\n</ul>\n\n<span class="markdown">\nPara definir estas dimensiones y medidas se reutilizan varios vocabularios de referencia:\n</span>\n\n<ol>\n  <li>Vocabularios SDMX (<i>Statistical Data and Metadata eXchange</i>):</li>\n  <ul>\n    <li><a href="http://purl.org/linked-data/sdmx/2009/dimension">sdmx-dimension</a>: se reutiliza como base para dimensiones estadísticas generales, especialmente mediante relaciones de especialización como <a href="#refAdminRegion">edintdimension:refAdminRegion</a> y <a href="#refPeriod">edintdimension:refPeriod</a>.</li>\n    <li><a href="http://purl.org/linked-data/sdmx/2009/measure">sdmx-measure</a>: se reutiliza como base para la medida del cubo, definida como subpropiedad de <code>sdmx-measure:obsValue</code>.</li>\n  </ul>\n  <li>Vocabularios territoriales y temporales:</li>\n  <ul>\n    <li><a href="http://vocab.linkeddata.es/datosabiertos/def/sector-publico/territorio">esadm</a>: se reutiliza para indicar que la dimensión <a href="#refAdminRegion">edintdimension:refAdminRegion</a> puede tomar valores correspondientes a municipios, barrios o distritos.</li>\n    <li><a href="https://www.w3.org/TR/owl-time/">OWL-Time</a>: se reutiliza para modelar la dimensión temporal, estableciendo que <a href="#refPeriod">edintdimension:refPeriod</a> tiene como rango <code>time:Interval</code>.</li>\n  </ul>\n  <li>Listas de códigos SKOS:</li>\n  <ul>\n    <li>La dimensión <a href="#sector">edintdimension:sector</a> reutiliza como lista de códigos el esquema de sectores públicos publicado en <a href="https://datos.gob.es/kos/sector-publico/sector">datos.gob.es</a>.</li>\n    <li>La dimensión <a href="#economicActivity">edintdimension:economicActivity</a> reutiliza una clasificación controlada de actividades económicas, como <a href="http://lod.ine.es/kos/cnae/CNAE-2025">CNAE 2025</a>.</li>\n  </ul>\n</ol>\n\n<span class="markdown">\nEl modelo del cubo de gasto comercial se muestra en la Figura 2, donde se presentan las dimensiones y medidas que lo componen.\n</span>\n\n<center>\n  <img src="../diagrams/diagram.png">\n  <figcaption>Figura 2.- Diagrama conceptual del cubo de datos de gasto comercial.</figcaption>\n</center>\n\n<span class="markdown">\nLa estructura del cubo de gasto comercial se define mediante la instancia <a href="#edintgast:dsd">edintgast:dsd</a>, que agrupa todas las dimensiones y medidas del modelo. En este caso, la región administrativa de referencia, el sector, la actividad económica, el periodo de referencia y la nacionalidad se han definido como dimensiones. Como medida, el modelo incluye el importe del gasto, que representa la cantidad monetaria total del gasto comercial realizado en un contexto determinado.\n</span>\n\n<pre>\n<a href="#ontology">edintgast:</a> a <a href="http://purl.org/linked-data/cube#DataSet">qb:DataSet</a> ; \n    <a href="http://purl.org/linked-data/cube#structure">qb:structure</a> <a href="#edintgast:dsd">edintgast:dsd</a> .\n\n<a href="#edintgast:dsd">edintgast:dsd</a> a <a href="http://purl.org/linked-data/cube#DataStructureDefinition">qb:DataStructureDefinition</a> ;\n    <a href="http://purl.org/linked-data/cube#component">qb:component</a>\n        [ <a href="http://purl.org/linked-data/cube#dimension">qb:dimension</a> <a href="#refAdminRegion">edintdimension:refAdminRegion</a> ; qb:order 1 ] ,\n        [ <a href="http://purl.org/linked-data/cube#dimension">qb:dimension</a> <a href="#sector">edintdimension:sector</a> ; qb:order 2 ] ,\n        [ <a href="http://purl.org/linked-data/cube#dimension">qb:dimension</a> <a href="#economicActivity">edintdimension:economicActivity</a> ; qb:order 3 ] ,\n        [ <a href="http://purl.org/linked-data/cube#dimension">qb:dimension</a> <a href="#refPeriod">edintdimension:refPeriod</a> ; qb:order 4 ] ,\n        [ <a href="http://purl.org/linked-data/cube#dimension">qb:dimension</a> <a href="#nationality">edintdimension:nationality</a> ; qb:order 5 ] ,\n        [ <a href="http://purl.org/linked-data/cube#measure">qb:measure</a> <a href="#expenditureAmount">edintmeasure:expenditureAmount</a> ; qb:order 6 ] .\n</pre>\n\n\n<div id="cubogastocomercialejemplo">\n  <h3 id="qb1" class="list">Ejemplo 1: Importe del gasto comercial por área, periodo, actividad económica, sector y nacionalidad<span class="backlink"> volver a <a href="#toc">índice</a></span></h3>\n\n  <span class="markdown">\n  Este ejemplo representa el dato correspondiente al <b>importe del gasto comercial</b> en una región administrativa determinada, para un periodo de referencia específico, desglosado por <b>actividad económica</b>, <b>sector</b> y <b>nacionalidad</b>. Dado que este vocabulario ya define el conjunto de datos <code>edintgast:</code> y la estructura de datos <code>edintgast:dsd</code>, no es necesario generar nuevas instancias de conjunto de datos ni de estructura; se pueden reutilizar las ya existentes.\n  </span>\n\n  <center>\n    <img src="../diagrams/diagram-example.png">\n    <figcaption>Figura 3.- Ejemplo de una observación en el cubo de gasto comercial por área, periodo, actividad económica, sector y nacionalidad.</figcaption>\n  </center>\n\n  <span class="markdown">\n  A continuación, se describen los pasos necesarios para representar una observación concreta.\n  </span>\n\n  <span class="markdown">\n\n  <b>**1) Reutilización del conjunto de datos y de la estructura de datos:**</b> Este vocabulario contiene un único conjunto de datos, representado por <code>edintgast:</code>, que está vinculado a la estructura <code>edintgast:dsd</code> mediante la propiedad <a href="http://purl.org/linked-data/cube#structure">qb:structure</a>.\n  </span>\n\n  <pre>\n<a href="#ontology">edintgast:</a> a <a href="http://purl.org/linked-data/cube#DataSet">qb:DataSet</a> ; \n    <a href="http://purl.org/linked-data/cube#structure">qb:structure</a> <a href="#edintgast:dsd">edintgast:dsd</a> .\n  </pre>\n\n  <span class="markdown">\n  <b>**2) Identificación de las dimensiones y la medida relevantes:**</b> La estructura <code>edintgast:dsd</code> contiene las dimensiones y la medida del cubo de gasto comercial. En este ejemplo se utilizan las dimensiones <a href="#refAdminRegion">edintdimension:refAdminRegion</a>, <a href="#sector">edintdimension:sector</a>, <a href="#economicActivity">edintdimension:economicActivity</a>, <a href="#refPeriod">edintdimension:refPeriod</a> y <a href="#nationality">edintdimension:nationality</a>, junto con la medida <a href="#expenditureAmount">edintmeasure:expenditureAmount</a>.\n\n  Es importante señalar que la dimensión <a href="#refPeriod">edintdimension:refPeriod</a> tiene como rango <code>time:Interval</code>, por lo que el periodo de referencia debe representarse mediante una instancia explícita de intervalo temporal.\n  </span>\n\n  <pre>\n&lt;http://vocab.linkeddata.es/datosabiertos/recurso/comercio/cubo-gasto-comercial/interval/2025-01&gt;\n    a time:Interval ;\n    rdfs:label "January 2025"@en ,\n               "Enero de 2025"@es .\n  </pre>\n\n  <span class="markdown">\n  <b>**3) Definición de una observación del conjunto de datos:**</b> El último paso consiste en crear una instancia de <a href="http://purl.org/linked-data/cube#Observation">qb:Observation</a> y vincularla al conjunto de datos mediante la propiedad <a href="http://purl.org/linked-data/cube#dataSet">qb:dataSet</a>. A continuación, se asignan los valores correspondientes a las dimensiones seleccionadas y a la medida.\n  </span>\n\n  <pre>\n&lt;http://vocab.linkeddata.es/datosabiertos/recurso/comercio/cubo-gasto-comercial/observation/obs001&gt;\n    a <a href="http://purl.org/linked-data/cube#Observation">qb:Observation</a> ;\n    <a href="http://purl.org/linked-data/cube#dataSet">qb:dataSet</a> <a href="#ontology">edintgast:</a> ;\n    <a href="#refAdminRegion">edintdimension:refAdminRegion</a> &lt;http://vocab.linkeddata.es/datosabiertos/recurso/territorio/municipio/zaragoza&gt; ;\n    <a href="#sector">edintdimension:sector</a> &lt;https://datos.gob.es/kos/sector-publico/sector#comercio&gt; ;\n    <a href="#economicActivity">edintdimension:economicActivity</a> &lt;http://lod.ine.es/kos/cnae/CNAE-2025/G&gt; ;\n    <a href="#refPeriod">edintdimension:refPeriod</a> &lt;http://vocab.linkeddata.es/datosabiertos/recurso/comercio/cubo-gasto-comercial/interval/2025-01&gt; ;\n    <a href="#nationality">edintdimension:nationality</a> "Spanish"^^xsd:string ;\n    <a href="#expenditureAmount">edintmeasure:expenditureAmount</a> "125430.75"^^xsd:decimal .\n  </pre>\n\n  <span class="markdown">\n  Esta observación indica que, en el municipio de Zaragoza, durante el intervalo temporal correspondiente a enero de 2025, el gasto comercial asociado al sector comercio, a una actividad económica concreta y a la nacionalidad española es de <b>125.430,75</b>.\n\n  Este ejemplo muestra cómo una única observación del cubo combina varios valores de dimensiones con una medida específica para representar información sobre gasto comercial. Del mismo modo, la misma estructura puede reutilizarse para representar valores de gasto en otras regiones administrativas, periodos de referencia, actividades económicas, sectores o nacionalidades.\n  </span>\n</div>\n
