abstract-en=The Tourism Data Cube ontology describes the structure containing the dimensions and measures that can be used to generate tourism data cubes. Examples of such cubes include those for tourist occupancy, tourist flow, and indicators that allow for the evaluation of aspects like average occupancy, growth in the number of accommodations, growth in tourist flow, etc. The W3C Data Cube vocabulary was reused to develop the tourism data cube.
introduction-en=\nThis ontology is part of the catalog of ontologies that is being developed in the context of the <a href="https://edint.es/" target="_blank">Data Space for Smart Urban Infrastructures (EDINT)</a>. It was also identified as a relevant ontology for the representation of data managed by local entities in the guide <a href="http://femp.femp.es/files/3580-1937-fichero/DATOS%20ABIERTOS%20FEMP%202019.pdf" target="_blank">Datos abiertos FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a>, as also described in the corresponding <a href="https://datos.gob.es/es/conocimiento/datos-abiertos-femp-2019-40-conjuntos-de-datos-publicar-por-las-entidades-locales" target="_blank">data.gob.es note</a>, and therefore included in the <a href="https://github.com/opencitydata" target="_blank">Github repository supporting the initiative</a>, which will be deprecated once this repository is launched.\nAn amplified version of the guide can be found in <a href="https://redtransparenciayparticipacion.es/wp-content/uploads/2025/03/Datos-abiertos-80-conjuntos-de-datos.pdf" target="_blank">DATOS ABIERTOS 80 CONJUNTOS DE DATOS</a>\n
description-en=<span class="markdown">\nFigure 1 shows the conceptual model of the tourism cube with its classes, relationships (object properties), and some individuals.\n<p><center><img src="images/diagram.png"/><figcaption>\nFigure 1. Conceptual model of the tourism cube ontology</figcaption></center></p>\n<p>Cubes are defined using the concepts and properties described in the <a href="https://www.w3.org/TR/vocab-data-cube/">W3C RDF Data Cube</a> vocabulary. The <a href="#DSD_Tourism">DSD_TourismOccupation</a> structure defines the set of cube dimensions and properties that can be combined in different ways to generate cubes that serve various purposes.</p>\n<p>For example, a cube that analyzes tourism occupancy data could use the <a href="#http://vocab.linkeddata.es/datosabiertos/def/dimension#refAdminRegion">administrative region</a> dimension and the <a href="#http://vocab.linkeddata.es/datosabiertos/def/dimension#refPeriod">period</a> dimension.</a> The measure would be the <a href="#http://vocab.linkeddata.es/datosabiertos/def/measure#numTravelers">number of travelers</a> which refers to the number of people who have occupied accommodation establishments in a certain period of time, the year 2025, in a certain administrative region, the municipality of Benidorm. Similarly, by adding the dimensions <a href="#http://vocab.linkeddata.es/datosabiertos/def/dimension#flowType">type of tourist flow</a> and <a href="#http://vocab.linkeddata.es/datosabiertos/def/dimension#countryOfResidence">country of residence</a>, it is possible to have the (<a href="#http://vocab.linkeddata.es/datosabiertos/def/measure#numTourists">number of tourists</a>) from a certain country, for example Germany, who have arrived in Benidorm in the year 2025.\n\n<pre><textarea style="resize:none" readonly id="code2" name="code" rows="25" cols="100">\n@prefix owl:    <http://www.w3.org/2002/07/owl#> .\n@prefix dc:     <http://purl.org/dc/terms/> .\n@prefix vann:   <http://purl.org/vocab/vann/> .\n@prefix qb:     <http://purl.org/linked-data/cube#> .\n@prefix rdf:    <http://www.w3.org/1999/02/22-rdf-syntax-ns#> .\n@prefix rdfs:   <http://www.w3.org/2000/01/rdf-schema#> .\n@prefix schema: <http://schema.org/> .\n@prefix time:   <http://www.w3.org/2006/time#> .\n@prefix skos:   <http://www.w3.org/2004/02/skos/core#> .\n@prefix xsd:    <http://www.w3.org/2001/XMLSchema#> .\n@prefix sdmx-dimension: <http://purl.org/linked-data/sdmx/2009/dimension#> .\n@prefix sdmx-measure:   <http://purl.org/linked-data/sdmx/2009/measure#> .\n@prefix edintdim:      <http://vocab.linkeddata.es/datosabiertos/def/dimension#> .\n@prefix esadm:         <http://vocab.linkeddata.es/datosabiertos/def/sector-publico/territorio#> .\n@prefix edintkos:      <http://vocab.linkeddata.es/datosabiertos/kos/edint/> .\n@prefix edintmeasure: <http://vocab.linkeddata.es/datosabiertos/def/measure#> .\n@prefix edintgast: <http://vocab.linkeddata.es/datosabiertos/def/comercio/cubo-gasto-comercial/> .\n@prefix edinttemp: <http://vocab.linkeddata.es/datosabiertos/def/actividad-economica/cubo-empleo#> .\n@prefix edinttur: <http://vocab.linkeddata.es/datosabiertos/def/turismo/cubo-turismo#> .\n@prefix edinttemp: <http://vocab.linkeddata.es/datosabiertos/def/actividad-economica/cubo-empleo#> .\n@prefix edintrec: <http://vocab.linkeddata.es/datosabiertos/recurso/>.\n@prefix time:      <http://www.w3.org/2006/time#>.\n\n\nedinttur:dsTourism a qb:DataSet ;\n    rdfs:label "Dataset de turismo integrado"@es ;\n    qb:structure edinttur:DSD_Tourism .\n\nedinttur:obsTourism-001 a qb:Observation ;\n    qb:dataSet edinttur:dsTourism ;\n\n    # --- Dimensiones ---\n    edintdim:refAdminRegion      esadm:Murcia ;\n    edintdim:refPeriod           edintrec:instanteobs-001;\n    edintdim:countryOfResidence     edintkos:UnitedKingdom ;\n\n    # --- Medidas ---\n    edintdim:averageStay              "4.7"^^xsd:decimal ;\n    edintdim:numTourists              "15420"^^xsd:nonNegativeInteger ;\n    edintmeasure:numTravelers         "3280"^^xsd:nonNegativeInteger ;\n    edintmeasure:overnightStays       "13312"^^xsd:nonNegativeInteger .\n\n# --- Año y mes de la observación ---\nedintrec:instanteobs-001 a time:Instant;\n    time:inXSDgYearMonth          "2025-08"^^xsd:gYearMonth .\n</textarea></pre>\n<script>\n    var editor2 = CodeMirror.fromTextArea(document.getElementById("code2"), {\n        mode: "text/turtle",\n        matchBrackets: true\n    });\n</script>\nThe example above shows a portion of the knowledge graph in RDF for an observation belonging to the tourism statistics data cube. The dimensions are the administrative region of Murcia, the reference period, August 2025, and the country of residence, the United Kingdom. The measures are the average length of stay of a tourist, the total number of tourists, the total number of travelers (which may include non-tourists), and the total number of overnight stays.\n</span>\n\n
references-en=<span class="markdown">\n<ul>\n    <li><a href="https://edint.es/en/" target="_blank">Data Spaces for Smart Urban Infrastructures (EDINT)</a></li>\n    <li><a href="http://femp.femp.es/files/3580-1937-fichero/DATOS%20ABIERTOS%20FEMP%202019.pdf" target="_blank">Guía Datos abiertos FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a></li>\n    <li><a href="https://datos.gob.es/es/conocimiento/datos-abiertos-femp-2019-40-conjuntos-de-datos-publicar-por-las-entidades-locales" target="_blank">DATOS ABIERTOS FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a> (source: datos.gob.es)</li>\n    <li><a href="https://redtransparenciayparticipacion.es/wp-content/uploads/2025/03/Datos-abiertos-80-conjuntos-de-datos.pdf" target="_blank">DATOS ABIERTOS 80 CONJUNTOS DE DATOS</a></li>\n</ul>\n</span>\n
abstract-es=La ontología de Cubo de Datos Turísticos describe la estructura que contiene las dimensiones y medidas que pueden ser utilizadas para generar cubos de datos turísticos. Algunos ejemplos de cubos son los de ocupación turística, flujo turístico y los de indicadores que permiten evaluar aspectos como ocupación promedio, crecimiento en número de plazas,  crecimiento de flujo turístico, etc. Para desarrollar el cubo de datos turísticos se reutiliza el vocabulario W3C Data Cube.
introduction-es=Esta ontología forma parte del catálogo de ontologías que está siendo desarrollado en el contexto del <a href="https://edint.es/" target="_blank">Espacio de Datos para las Infraestructuras Urbanas Inteligentes (EDINT)</a>. Asimismo, fue identificada como una ontología relevante para la representación de datos gestionados por entidades locales en la guía <a href="http://femp.femp.es/files/3580-1937-fichero/DATOS%20ABIERTOS%20FEMP%202019.pdf" target="_blank">Datos abiertos FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a>, tal y como se describe también en la correspondiente <a href="https://datos.gob.es/es/conocimiento/datos-abiertos-femp-2019-40-conjuntos-de-datos-publicar-por-las-entidades-locales" target="_blank">nota de datos.gob.es</a>, y por tanto recogido en el <a href="https://github.com/opencitydata" target="_blank">repositorio Github de apoyo a la iniciativa</a>, que queda deprecado una vez se lance este repositorio.\nUna versión amplificada de la guía se encuentra en <a href="https://redtransparenciayparticipacion.es/wp-content/uploads/2025/03/Datos-abiertos-80-conjuntos-de-datos.pdf" target="_blank">DATOS ABIERTOS 80 CONJUNTOS DE DATOS</a>\n
description-es=<span class="markdown">En la Figura 1 se muestra el modelo conceptual del cubo de turismo con sus clases, relaciones (propiedades de objeto) y algunos individuos.</p>\n<p><center><img src="images/diagram.png"/><figcaption>\nFigura 1. Modelo conceptual de la ontología de cubos de turismo</figcaption></center></p>\n<p>Los cubos se definen mediante los conceptos y propiedades descritos en el vocabulario  <a href="https://www.w3.org/TR/vocab-data-cube/">W3C RDF Data Cube</a>. La <a href="#DSD_Tourism">estructura DSD_TourismOccupation</a> define el conjunto de dimensiones y propiedades del cubo que se pueden combinar de diferentes maneras para generar cubos que cumplan diversos propósitos.</p>\n<p>Así, se tiene por ejemplo para un cubo que explote los datos de ocupación turística se puede utilizar la dimensión <a href="#http://vocab.linkeddata.es/datosabiertos/def/dimension#refAdminRegion">referencia a región administrativa</a> y la dimensión <a href="#http://vocab.linkeddata.es/datosabiertos/def/dimension#refPeriod">referencia a período</a>. La medida sería el <a href="#http://vocab.linkeddata.es/datosabiertos/def/measure#numTravelers">número de viajeros</a> que se refiere al número de personas que han ocupado establecimientos de alojamiento en un cierto período de tiempo, el año 2025, en una cierta región administrativa, el municipio de Benidorm. De la misma manera y añadiendo las dimensiones <a href="#http://vocab.linkeddata.es/datosabiertos/def/dimension#flowType">tipo de flujo de turistas</a> y  <a href="#http://vocab.linkeddata.es/datosabiertos/def/dimension#countryOfResidence">país de residencia</a>, se puede tener el  (<a href="#http://vocab.linkeddata.es/datosabiertos/def/measure#numTourists">número de turistas</a>) de un determinado país, por ejemplo Alemania, que hayan llegado a Benidorm en el año 2025.\n\n<pre><textarea style="resize:none" readonly id="code2" name="code" rows="25" cols="100">\n@prefix owl:    <http://www.w3.org/2002/07/owl#> .\n@prefix dc:     <http://purl.org/dc/terms/> .\n@prefix vann:   <http://purl.org/vocab/vann/> .\n@prefix qb:     <http://purl.org/linked-data/cube#> .\n@prefix rdf:    <http://www.w3.org/1999/02/22-rdf-syntax-ns#> .\n@prefix rdfs:   <http://www.w3.org/2000/01/rdf-schema#> .\n@prefix schema: <http://schema.org/> .\n@prefix time:   <http://www.w3.org/2006/time#> .\n@prefix skos:   <http://www.w3.org/2004/02/skos/core#> .\n@prefix xsd:    <http://www.w3.org/2001/XMLSchema#> .\n@prefix sdmx-dimension: <http://purl.org/linked-data/sdmx/2009/dimension#> .\n@prefix sdmx-measure:   <http://purl.org/linked-data/sdmx/2009/measure#> .\n@prefix edintdim:      <http://vocab.linkeddata.es/datosabiertos/def/dimension#> .\n@prefix esadm:         <http://vocab.linkeddata.es/datosabiertos/def/sector-publico/territorio#> .\n@prefix edintkos:      <http://vocab.linkeddata.es/datosabiertos/kos/edint/> .\n@prefix edintmeasure: <http://vocab.linkeddata.es/datosabiertos/def/measure#> .\n@prefix edintgast: <http://vocab.linkeddata.es/datosabiertos/def/comercio/cubo-gasto-comercial/> .\n@prefix edinttemp: <http://vocab.linkeddata.es/datosabiertos/def/actividad-economica/cubo-empleo#> .\n@prefix edinttur: <http://vocab.linkeddata.es/datosabiertos/def/turismo/cubo-turismo#> .\n@prefix edinttemp: <http://vocab.linkeddata.es/datosabiertos/def/actividad-economica/cubo-empleo#> .\n@prefix edintrec: <http://vocab.linkeddata.es/datosabiertos/recurso/>.\n@prefix time:      <http://www.w3.org/2006/time#>.\n\n\nedinttur:dsTourism a qb:DataSet ;\n    rdfs:label "Dataset de turismo integrado"@es ;\n    qb:structure edinttur:DSD_Tourism .\n\nedinttur:obsTourism-001 a qb:Observation ;\n    qb:dataSet edinttur:dsTourism ;\n\n    # --- Dimensiones ---\n    edintdim:refAdminRegion      esadm:Murcia ;\n    edintdim:refPeriod           edintrec:instanteobs-001;\n    edintdim:countryOfResidence     edintkos:UnitedKingdom ;\n\n    # --- Medidas ---\n    edintdim:averageStay              "4.7"^^xsd:decimal ;\n    edintdim:numTourists              "15420"^^xsd:nonNegativeInteger ;\n    edintmeasure:numTravelers         "3280"^^xsd:nonNegativeInteger ;\n    edintmeasure:overnightStays       "13312"^^xsd:nonNegativeInteger .\n\n# --- Año y mes de la observación ---\nedintrec:instanteobs-001 a time:Instant;\n    time:inXSDgYearMonth          "2025-08"^^xsd:gYearMonth .\n</textarea></pre>\n<script>\n    var editor2 = CodeMirror.fromTextArea(document.getElementById("code2"), {\n        mode: "text/turtle",\n        matchBrackets: true\n    });\n</script>\nEn el ejemplo anterior se muestra una porción del grafo de conocimiento en RDF para una observación perteneciente al cubo de datos estadístico de turismo. Las dimensiones son la región administrativa de Murcia, el periodo de referencia, agosto de 2025 y el país de residencia, el Reino Unido. Las medidas son la estancia promedio de un turista, el número total de turistas, el número total de viajeros que puede incluir a viajeros que no son turistas y el número total de pernoctas. \n</span>\n\n
references-es=<span class="markdown">\n<ul>\n    <li><a href="https://edint.es/" target="_blank">Espacio de Datos para las Infraestructuras Urbanas Inteligentes (EDINT)</a></li>\n    <li><a href="http://femp.femp.es/files/3580-1937-fichero/DATOS%20ABIERTOS%20FEMP%202019.pdf" target="_blank">Guía Datos abiertos FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a></li>\n    <li><a href="https://datos.gob.es/es/conocimiento/datos-abiertos-femp-2019-40-conjuntos-de-datos-publicar-por-las-entidades-locales" target="_blank">DATOS ABIERTOS FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a> (source: datos.gob.es)</li>\n    <li><a href="https://redtransparenciayparticipacion.es/wp-content/uploads/2025/03/Datos-abiertos-80-conjuntos-de-datos.pdf" target="_blank">DATOS ABIERTOS 80 CONJUNTOS DE DATOS</a></li>\n</ul>\n</span>\n
