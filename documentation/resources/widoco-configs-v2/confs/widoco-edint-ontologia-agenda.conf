abstract-en=El propósito de esta ontología es el de proporcionar un vocabulario común para la representación de todos los conceptos relacionados con la agenda de eventos culturales, deportivos y sociales de un municipio.
introduction-en=\nThis ontology is part of the catalog of ontologies that is being developed in the context of the <a href="https://edint.es/" target="_blank">Data Space for Smart Urban Infrastructures (EDINT)</a>. It was also identified as a relevant ontology for the representation of data managed by local entities in the guide <a href="http://femp.femp.es/files/3580-1937-fichero/DATOS%20ABIERTOS%20FEMP%202019.pdf" target="_blank">Datos abiertos FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a>, as also described in the corresponding <a href="https://datos.gob.es/es/conocimiento/datos-abiertos-femp-2019-40-conjuntos-de-datos-publicar-por-las-entidades-locales" target="_blank">data.gob.es note</a>, and therefore included in the <a href="https://github.com/opencitydata" target="_blank">Github repository supporting the initiative</a>, which will be deprecated once this repository is launched.\nAn amplified version of the guide can be found in <a href="https://redtransparenciayparticipacion.es/wp-content/uploads/2025/03/Datos-abiertos-80-conjuntos-de-datos.pdf" target="_blank">DATOS ABIERTOS 80 CONJUNTOS DE DATOS</a>\n
description-en=<span class="markdown">\n<p>Figure 1 shows the conceptual model of the ontology with its classes and relationships (object properties).</p>\n<p><center><img src="images/diagrama-conceptual.png"/><figcaption>\nFigure 1. Conceptual model of the ontology</figcaption></center></p></span>\n<p>The vocabulary reuses terms from the <a href="https://schema.org/">schema.org</a> vocabulary for the representation of <a href="#https://schema.org/Event">events</a> and the <a href="#https://schema.org/DigitalDocument">associated documentation</a>. The vocabulary  <a href="http://vocab.linkeddata.es/datosabiertos/def/urbanismo-infraestructuras/direccion-postal">Postal Address</a> is reused, and also the vocabulary  <a href="http://vocab.linkeddata.es/datosabiertos/def/sector-publico/territorio">Territory</a> which contains administrative divisions to represent the scope of an event, for example, the municipality in general or a specific <a href="#http://vocab.linkeddata.es/datosabiertos/def/sector-publico/territorio#Distrito">district</a> or <a href="#http://vocab.linkeddata.es/datosabiertos/def/sector-publico/territorio#Barrio">neighborhood</a>\n\nThe main concept of this vocabulary is that of <a href="#CityEvent">an event that takes place in a city</a>. The place where <a href="#takesPlaceIn">the event occurs</a> can be a <a href="#https://edint.es/def/infraestructura#Facility">city facility</a> such as the town hall, a cultural center, etc.</a> An event has an address that can be normalized using the properties of the class <a href="#http://vocab.linkeddata.es/datosabiertos/def/urbanismo-infraestructuras/direccion-postal#DireccionPostal">esdir:DireccionPostal</a> . Additionally, this vocabulary uses several SKOS concept schemes to represent the type of event, the attendance modality (in-person, online, or hybrid), or the status of an event (scheduled, canceled, postponed, or rescheduled).\n</p>\n\n<pre><textarea style="resize:none" readonly id="code2" name="code" rows="25" cols="100">\n&lt;http://vocab.linkeddata.es/datosabiertos/recurso/city-event/madrid-deporte-50292978&gt;\n    a edintagenda:CityEvent ;\n    dct:identifier "50292978" ;\n    rdfs:label "IV Cross escolar de Barajas"@es ;\n    schema:startDate "2026-05-22T00:00:00+02:00"^^xsd:dateTime ;\n    schema:endDate "2026-05-22T23:59:00+02:00"^^xsd:dateTime ;\n    schema:isAccessibleForFree true ;\n    schema:eventStatus edinteventstatus:Scheduled ;\n    edintagenda:attendanceMode edintattendancemode:InPerson ;\n    edintagenda:eventType edinteventtype:ActividadesDeportivas ;\n    edintagenda:schedule "09:00"@es ;\n    edintagenda:documentation &lt;http://vocab.linkeddata.es/datosabiertos/recurso/documento-digital/madrid-deporte-50292978&gt; ;\n    edintagenda:takesPlaceIn &lt;http://vocab.linkeddata.es/datosabiertos/recurso/equipamiento/parque-juan-carlos-i&gt; ;\n    edintagenda:organizedBy &lt;http://vocab.linkeddata.es/datosabiertos/recurso/organizacion/ayuntamiento-madrid&gt; ;\n    schema:address &lt;http://vocab.linkeddata.es/datosabiertos/recurso/direccion-postal/parque-juan-carlos-i&gt; .\n\n&lt;http://vocab.linkeddata.es/datosabiertos/recurso/documento-digital/madrid-deporte-50292978&gt;\n    a schema:DigitalDocument ;\n    dct:identifier "50292978" ;\n    rdfs:label "Página del evento IV Cross escolar de Barajas"@es ;\n    schema:url &lt;http://www.madrid.es/sites/v/index.jsp?vgnextchannel=ca9671ee4a9eb410VgnVCM100000171f5a0aRCRD&amp;vgnextoid=00c0ae46863dd910VgnVCM200000f921e388RCRD&gt; ;\n    schema:encodingFormat "text/html" .\n\n&lt;http://vocab.linkeddata.es/datosabiertos/recurso/equipamiento/parque-juan-carlos-i&gt;\n    a edintagenda:Facility, gsp:Feature ;\n    rdfs:label "Parque Juan Carlos I"@es ;\n    schema:url &lt;http://www.madrid.es/sites/v/index.jsp?vgnextchannel=bfa48ab43d6bb410VgnVCM100000171f5a0aRCRD&amp;vgnextoid=8d9a78a0dea9e210VgnVCM1000000b205a0aRCRD&gt; ;\n    gsp:hasGeometry &lt;http://vocab.linkeddata.es/datosabiertos/recurso/geometria/parque-juan-carlos-i&gt; .\n\n&lt;http://vocab.linkeddata.es/datosabiertos/recurso/direccion-postal/parque-juan-carlos-i&gt;\n    a schema:PostalAddress ;\n    schema:streetAddress "GLORIETA S.A.R. DON JUAN DE BORBON Y BATTEMBERG, 5 5"@es ;\n    schema:addressLocality "Madrid"@es ;\n    schema:addressRegion "BARAJAS"@es ;\n    schema:postalCode "28042" ;\n    schema:addressCountry "ES" .\n\n&lt;http://vocab.linkeddata.es/datosabiertos/recurso/geometria/parque-juan-carlos-i&gt;\n    a gsp:Geometry ;\n    gsp:asWKT "POINT(-3.614888870630359 40.45999848510341)"^^gsp:wktLiteral .\n\n</textarea></pre>\n<script>\n    var editor2 = CodeMirror.fromTextArea(document.getElementById("code2"), {\n        mode: "text/turtle",\n        matchBrackets: true\n    });\n</script>\n
references-en=<span class="markdown">\n<ul>\n    <li><a href="https://edint.es/en/" target="_blank">Data Spaces for Smart Urban Infrastructures (EDINT)</a></li>\n    <li><a href="http://femp.femp.es/files/3580-1937-fichero/DATOS%20ABIERTOS%20FEMP%202019.pdf" target="_blank">Guía Datos abiertos FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a></li>\n    <li><a href="https://datos.gob.es/es/conocimiento/datos-abiertos-femp-2019-40-conjuntos-de-datos-publicar-por-las-entidades-locales" target="_blank">DATOS ABIERTOS FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a> (source: datos.gob.es)</li>\n    <li><a href="https://redtransparenciayparticipacion.es/wp-content/uploads/2025/03/Datos-abiertos-80-conjuntos-de-datos.pdf" target="_blank">DATOS ABIERTOS 80 CONJUNTOS DE DATOS</a></li>\n</ul>\n</span>\n
abstract-es=El propósito de esta ontología es el de proporcionar un vocabulario común para la representación de todos los conceptos relacionados con la agenda de eventos culturales, deportivos y sociales de un municipio.
introduction-es=Esta ontología forma parte del catálogo de ontologías que está siendo desarrollado en el contexto del <a href="https://edint.es/" target="_blank">Espacio de Datos para las Infraestructuras Urbanas Inteligentes (EDINT)</a>. Asimismo, fue identificada como una ontología relevante para la representación de datos gestionados por entidades locales en la guía <a href="http://femp.femp.es/files/3580-1937-fichero/DATOS%20ABIERTOS%20FEMP%202019.pdf" target="_blank">Datos abiertos FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a>, tal y como se describe también en la correspondiente <a href="https://datos.gob.es/es/conocimiento/datos-abiertos-femp-2019-40-conjuntos-de-datos-publicar-por-las-entidades-locales" target="_blank">nota de datos.gob.es</a>, y por tanto recogido en el <a href="https://github.com/opencitydata" target="_blank">repositorio Github de apoyo a la iniciativa</a>, que queda deprecado una vez se lance este repositorio.\nUna versión amplificada de la guía se encuentra en <a href="https://redtransparenciayparticipacion.es/wp-content/uploads/2025/03/Datos-abiertos-80-conjuntos-de-datos.pdf" target="_blank">DATOS ABIERTOS 80 CONJUNTOS DE DATOS</a>\n
description-es=<span class="markdown">\n<p>En la Figura 1 se muestra el modelo conceptual de la ontología con sus clases y relaciones (propiedades de objeto).</p>\n<p><center><img src="images/diagrama-conceptual.png"/><figcaption>\nFigura 1. Modelo conceptual de la ontología</figcaption></center></p></span>\n<p>El vocabulario reutiliza términos del vocabulario <a href="https://schema.org/">schema.org</a> para la representación de los <a href="#https://schema.org/Event">eventos</a> y la <a href="#https://schema.org/DigitalDocument">documentación asociada</a>. También se reutiliza el vocabulario de <a href="http://vocab.linkeddata.es/datosabiertos/def/urbanismo-infraestructuras/direccion-postal">Dirección Postal</a> y el vocabulario de <a href="http://vocab.linkeddata.es/datosabiertos/def/sector-publico/territorio">Territorio</a> que contiene las divisiones administrativas para representar el ámbito de un evento, por ejemplo un <a href="#http://vocab.linkeddata.es/datosabiertos/def/sector-publico/territorio#Distrito">distrito</a> o un <a href="#http://vocab.linkeddata.es/datosabiertos/def/sector-publico/territorio#Barrio">barrio</a>.\n\nEl concepto principal de este vocabulario es el de un <a href="#CityEvent">evento que tiene lugar en una ciudad</a>. El lugar en donde <a href="#takesPlaceIn">se realiza el evento</a> puede ser un <a href="#https://edint.es/def/infraestructura#Facility">equipamiento de la ciudad</a>  tal como el edificio del ayuntamiento, un centro cultural, etc. Un evento tiene una dirección que puede estar normalizada utilizando las propiedades de la clase  <a href="#http://vocab.linkeddata.es/datosabiertos/def/urbanismo-infraestructuras/direccion-postal#DireccionPostal">esdir:DireccionPostal</a>. Adicionalmente, en este vocabulario se han utilizado varios esquemas de conceptos SKOS para representar el tipo de evento, la modalidad de asistencia (presencial, en línea o mixto) o el estado de un evento (programado, cancelado, aplazado o reprogramado).\n</p>\n<pre><textarea style="resize:none" readonly id="code2" name="code" rows="25" cols="100">\n&lt;https://example.org/recurso/city-event/madrid-deporte-50292978&gt;\n    a edintagenda:CityEvent ;\n    dct:identifier "50292978" ;\n    rdfs:label "IV Cross escolar de Barajas"@es ;\n    schema:startDate "2026-05-22T00:00:00+02:00"^^xsd:dateTime ;\n    schema:endDate "2026-05-22T23:59:00+02:00"^^xsd:dateTime ;\n    schema:isAccessibleForFree true ;\n    schema:eventStatus edinteventstatus:Scheduled ;\n    edintagenda:attendanceMode edintattendancemode:InPerson ;\n    edintagenda:eventType edinteventtype:ActividadesDeportivas ;\n    edintagenda:schedule "09:00"@es ;\n    edintagenda:documentation &lt;https://example.org/recurso/documento-digital/madrid-deporte-50292978&gt; ;\n    edintagenda:takesPlaceIn &lt;https://example.org/recurso/equipamiento/parque-juan-carlos-i&gt; ;\n    edintagenda:organizedBy &lt;https://example.org/recurso/organizacion/ayuntamiento-madrid&gt; ;\n    schema:address &lt;https://example.org/recurso/direccion-postal/parque-juan-carlos-i&gt; .\n\n&lt;https://example.org/recurso/documento-digital/madrid-deporte-50292978&gt;\n    a schema:DigitalDocument ;\n    dct:identifier "50292978" ;\n    rdfs:label "Página del evento IV Cross escolar de Barajas"@es ;\n    schema:url &lt;http://www.madrid.es/sites/v/index.jsp?vgnextchannel=ca9671ee4a9eb410VgnVCM100000171f5a0aRCRD&amp;vgnextoid=00c0ae46863dd910VgnVCM200000f921e388RCRD&gt; ;\n    schema:encodingFormat "text/html" .\n\n&lt;https://example.org/recurso/equipamiento/parque-juan-carlos-i&gt;\n    a edintagenda:Facility, gsp:Feature ;\n    rdfs:label "Parque Juan Carlos I"@es ;\n    schema:url &lt;http://www.madrid.es/sites/v/index.jsp?vgnextchannel=bfa48ab43d6bb410VgnVCM100000171f5a0aRCRD&amp;vgnextoid=8d9a78a0dea9e210VgnVCM1000000b205a0aRCRD&gt; ;\n    gsp:hasGeometry &lt;https://example.org/recurso/geometria/parque-juan-carlos-i&gt; .\n\n&lt;https://example.org/recurso/direccion-postal/parque-juan-carlos-i&gt;\n    a schema:PostalAddress ;\n    schema:streetAddress "GLORIETA S.A.R. DON JUAN DE BORBON Y BATTEMBERG, 5 5"@es ;\n    schema:addressLocality "Madrid"@es ;\n    schema:addressRegion "BARAJAS"@es ;\n    schema:postalCode "28042" ;\n    schema:addressCountry "ES" .\n\n&lt;https://example.org/recurso/geometria/parque-juan-carlos-i&gt;\n    a gsp:Geometry ;\n    gsp:asWKT "POINT(-3.614888870630359 40.45999848510341)"^^gsp:wktLiteral .\n\n</textarea></pre>\n<script>\n    var editor2 = CodeMirror.fromTextArea(document.getElementById("code2"), {\n        mode: "text/turtle",\n        matchBrackets: true\n    });\n</script>\n
