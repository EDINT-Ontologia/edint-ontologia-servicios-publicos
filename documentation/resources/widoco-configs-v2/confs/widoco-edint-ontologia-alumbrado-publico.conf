abstract-en=Ontología para la representación de datos de alumbrado público. Modela la composición modular de farolas, la infraestructura eléctrica, el consumo energético y los parámetros fotométricos y de contaminación lumínica.
introduction-en=\nThis ontology is part of the catalog of ontologies that is being developed in the context of the <a href="https://edint.es/" target="_blank">Data Space for Smart Urban Infrastructures (EDINT)</a>. It was also identified as a relevant ontology for the representation of data managed by local entities in the guide <a href="http://femp.femp.es/files/3580-1937-fichero/DATOS%20ABIERTOS%20FEMP%202019.pdf" target="_blank">Datos abiertos FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a>, as also described in the corresponding <a href="https://datos.gob.es/es/conocimiento/datos-abiertos-femp-2019-40-conjuntos-de-datos-publicar-por-las-entidades-locales" target="_blank">data.gob.es note</a>, and therefore included in the <a href="https://github.com/opencitydata" target="_blank">Github repository supporting the initiative</a>, which will be deprecated once this repository is launched.\nAn amplified version of the guide can be found in <a href="https://redtransparenciayparticipacion.es/wp-content/uploads/2025/03/Datos-abiertos-80-conjuntos-de-datos.pdf" target="_blank">DATOS ABIERTOS 80 CONJUNTOS DE DATOS</a>\n
description-en=<span class="markdown"><p>Figure 1 shows the conceptual model of the ontology with its classes and relationships (object properties).</p></span>\n<p><center><img src="images/diagrama-conceptual.png" style="width:100%;"/><figcaption>\nFigure 1. Conceptual model of the ontology</figcaption></center></p>\n<span class="markdown"><p>The ontology models the modular composition of a <a href="#Farola">streetlight</a> as an urban element (<a href="#https://edint.es/def/infraestructura##UrbanElement">edintinf:UrbanElement</a>), composed of a <a href="#Poste">post</a> (with one or more <a href="#Brazo">arms</a>), one or more <a href="#Luminaria">luminaires</a> (each housing a <a href="#Lampara">lamp</a>) and optionally a <a href="#Caja">junction box</a>.</p>\n\n<p>The electrical infrastructure is represented by the <a href="#CentroDeMando">control center</a>, which is a utility supply point (<a href="#https://edint.es/def/suministro##UtilitySupplyPoint">edintsum:UtilitySupplyPoint</a>) on which one or more streetlights depend. The control center may have an <a href="#SuministroElectrico">electricity supply</a> contract (<a href="#https://edint.es/def/suministro##UtilityContract">edintsum:UtilityContract</a>).</p>\n\n<p>Energy <a href="#ConsumoEnergetico">consumption</a> is modeled as a SOSA observation (<a href="#https://edint.es/def/suministro##UtilityConsumption">edintsum:UtilityConsumption</a> ⊂ <a href="#http://www.w3.org/ns/sosa/Observation">sosa:Observation</a>), where each instance represents the consumption for a specific tariff period. The consumption value is represented via <a href="#http://qudt.org/schema/qudt/QuantityValue">qudt:QuantityValue</a>, expressing the magnitude through <a href="#http://qudt.org/schema/qudt/numericValue">qudt:numericValue</a> and the unit of measure through <a href="#http://qudt.org/schema/qudt/hasUnit">qudt:hasUnit</a> (e.g., <code>unit:KiloW-HR</code> for kilowatt-hours). The tariff period is indicated by the <a href="#periodoTarifario">periodoTarifario</a> property linked to a SKOS concept (active, standard, off-peak, peak).</p>\n\n<p>Street lighting classifications (support type, lamp type, conservation status, lighting zone, lighting class, etc.) are represented via object properties pointing to SKOS concepts, organized in independent concept schemes available in the <code>kos/</code> folder.</p>\n\n<p>The <a href="#Fabricante">manufacturer</a> and <a href="#Propietario">owner</a> are referenceable entities (not strings), allowing them to be linked to organizations or other agents. The <a href="#ModeloLuminaria">luminaire model</a> serves as a catalog entry, linking manufacturer, nominal power and specifications.</p>\n</span>\n\n<pre><textarea style="resize:none" readonly id="code2" name="code" rows="30" cols="100">\n@prefix edintalu: &lt;https://edint.es/def/alumbrado-publico#&gt; .\n@prefix edintinf: &lt;https://edint.es/def/infraestructura##&gt; .\n@prefix edintsum: &lt;https://edint.es/def/suministro##&gt; .\n@prefix edintkosinftype: &lt;http://vocab.linkeddata.es/datosabiertos/kos/edint/InfrastructureType/&gt; .\n@prefix esdir: &lt;http://vocab.linkeddata.es/datosabiertos/def/urbanismo-infraestructuras/direccion-postal#&gt; .\n@prefix gsp: &lt;http://www.opengis.net/ont/geosparql#&gt; .\n@prefix sosa: &lt;http://www.w3.org/ns/sosa/&gt; .\n@prefix qudt: &lt;http://qudt.org/schema/qudt/&gt; .\n@prefix qudtu: &lt;http://qudt.org/vocab/unit/&gt; .\n@prefix schema: &lt;http://schema.org/&gt; .\n@prefix xsd: &lt;http://www.w3.org/2001/XMLSchema#&gt; .\n\n# --- Control center ---\nex:cm-001 a edintalu:ControlCenter ;\n    edintalu:name "CM-001" ;\n    edintalu:hasSupply ex:sum-001 .\n\n# --- Electricity supply ---\nex:sum-001 a edintalu:ElectricitySupply ;\n    edintalu:fiscalYear "2024"^^xsd:gYear ;\n    edintalu:tariff "6.1" ;\n    edintalu:hasConsumption ex:cons-001-llano .\n\n# --- Energy consumption (SOSA) ---\nex:cons-001-llano a edintalu:EnergyConsumption ;\n    sosa:hasFeatureOfInterest ex:cm-001 ;\n    sosa:observedProperty edintsum:electricityConsumption ;\n    sosa:hasResult [ a qudt:QuantityValue ;\n                     qudt:numericValue 8500 ;\n                     qudt:hasUnit qudtu:KiloW-HR ] ;\n    edintalu:tariffPeriod &lt;http://vocab.linkeddata.es/datosabiertos/kos/edint/TariffPeriod/llano&gt; ;\n    edintalu:fiscalYear "2024"^^xsd:gYear .\n\n# --- Streetlight ---\nex:farola-001 a edintalu:Streetlight ;\n    edintinf:hasInfrastructureType edintkosinftype:StreeLamp ;\n    edintalu:controlCenter ex:cm-001 ;\n    edintalu:post ex:post-001 ;\n    edintalu:luminaire ex:lum-001 ;\n    edintalu:illuminationClass &lt;http://vocab.linkeddata.es/datosabiertos/kos/edint/IlluminationType/me4&gt; ;\n    edintalu:lightingZone &lt;http://vocab.linkeddata.es/datosabiertos/kos/edint/LightingZone/e3&gt; ;\n    edintalu:address ex:dir-001 ;\n    gsp:hasGeometry ex:geom-001 .\n\n# --- Post with arm ---\nex:post-001 a edintalu:Post ;\n    edintalu:supportType &lt;http://vocab.linkeddata.es/datosabiertos/kos/edint/SupportType/baculo&gt; ;\n    edintalu:height [ a qudt:QuantityValue ; qudt:numericValue 8 ; qudt:hasUnit qudtu:M ] ;\n    edintalu:hasArm ex:brazo-001 .\n\nex:brazo-001 a edintalu:Arm ;\n    edintalu:armOrder 1 ;\n    edintalu:height [ a qudt:QuantityValue ; qudt:numericValue 6.5 ; qudt:hasUnit qudtu:M ] .\n\n# --- Luminaire + Lamp ---\nex:lum-001 a edintalu:Luminaire ;\n    edintalu:hasLamp ex:lamp-001 ;\n    edintalu:luminaireModel ex:modelo-001 .\n\nex:lamp-001 a edintalu:Lamp ;\n    edintalu:lampType &lt;http://vocab.linkeddata.es/datosabiertos/kos/edint/LampType/led&gt; ;\n    edintalu:nominalPower [ a qudt:QuantityValue ; qudt:numericValue 72 ; qudt:hasUnit qudtu:W ] .\n\n# --- Catalog model ---\nex:modelo-001 a edintalu:LuminaireModel ;\n    edintalu:name "SpeedStar LED 72W" .\n\n# --- Postal address ---\nex:dir-001 a esdir:DireccionPostal ;\n    schema:streetAddress "Calle Mayor 1" ;\n    schema:addressLocality "Villaexample" ;\n    schema:addressCountry "ES" .\n\n# --- Geometry ---\nex:geom-001 a gsp:Geometry ;\n    gsp:asWKT "POINT (-3.70 40.42)"^^gsp:wktLiteral .\n</textarea></pre>\n<script>\n    var editor2 = CodeMirror.fromTextArea(document.getElementById("code2"), {\n        mode: "text/turtle",\n        matchBrackets: true\n    });\n</script>\n<span class="markdown">\nThe example above shows a portion of the RDF knowledge graph for a public lighting streetlight. The <strong>control center</strong> (CM-001) is the supply point on which the streetlight depends, and has an associated <strong>electricity supply</strong> contract with tariff 6.1. <strong>Energy consumption</strong> is represented as a SOSA observation: each instance (one per tariff period) has as result a <code>qudt:QuantityValue</code> with the numeric value and unit (kWh). The <strong>streetlight</strong> is an urban element with infrastructure type <code>StreeLamp</code> (EDINT SKOS), composed of a <strong>post</strong> (with its arm at 6.5 m), a <strong>luminaire</strong> (with a 72 W LED lamp) and a reference to a <strong>catalog model</strong>. Classifications (lighting type ME4b, zone E3, support type báculo, lamp type LED) are represented via SKOS concepts. The postal address reuses <code>esdir:DireccionPostal</code> and the geometry from GeoSPARQL.\n</span>\n
references-en=<span class="markdown">\n<ul>\n    <li><a href="https://edint.es/en/" target="_blank">Data Spaces for Smart Urban Infrastructures (EDINT)</a></li>\n    <li><a href="http://femp.femp.es/files/3580-1937-fichero/DATOS%20ABIERTOS%20FEMP%202019.pdf" target="_blank">Guía Datos abiertos FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a></li>\n    <li><a href="https://datos.gob.es/es/conocimiento/datos-abiertos-femp-2019-40-conjuntos-de-datos-publicar-por-las-entidades-locales" target="_blank">DATOS ABIERTOS FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a> (source: datos.gob.es)</li>\n    <li><a href="https://redtransparenciayparticipacion.es/wp-content/uploads/2025/03/Datos-abiertos-80-conjuntos-de-datos.pdf" target="_blank">DATOS ABIERTOS 80 CONJUNTOS DE DATOS</a></li>\n</ul>\n</span>\n
abstract-es=Ontología para la representación de datos de alumbrado público. Modela la composición modular de farolas, la infraestructura eléctrica, el consumo energético y los parámetros fotométricos y de contaminación lumínica.
introduction-es=Esta ontología forma parte del catálogo de ontologías que está siendo desarrollado en el contexto del <a href="https://edint.es/" target="_blank">Espacio de Datos para las Infraestructuras Urbanas Inteligentes (EDINT)</a>. Asimismo, fue identificada como una ontología relevante para la representación de datos gestionados por entidades locales en la guía <a href="http://femp.femp.es/files/3580-1937-fichero/DATOS%20ABIERTOS%20FEMP%202019.pdf" target="_blank">Datos abiertos FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a>, tal y como se describe también en la correspondiente <a href="https://datos.gob.es/es/conocimiento/datos-abiertos-femp-2019-40-conjuntos-de-datos-publicar-por-las-entidades-locales" target="_blank">nota de datos.gob.es</a>, y por tanto recogido en el <a href="https://github.com/opencitydata" target="_blank">repositorio Github de apoyo a la iniciativa</a>, que queda deprecado una vez se lance este repositorio.\nUna versión amplificada de la guía se encuentra en <a href="https://redtransparenciayparticipacion.es/wp-content/uploads/2025/03/Datos-abiertos-80-conjuntos-de-datos.pdf" target="_blank">DATOS ABIERTOS 80 CONJUNTOS DE DATOS</a>\n
description-es=<span class="markdown"><p>En la Figura 1 se muestra el modelo conceptual de la ontología con sus clases y relaciones (propiedades de objeto).</p></span>\n<p><center><img src="images/diagrama-conceptual.png" style="width:100%;"/><figcaption>\nFigura 1. Modelo conceptual de la ontología</figcaption></center></p>\n<span class="markdown"><p>La ontología modela la composición modular de una <a href="#Farola">farola</a> como elemento urbano (<a href="#https://edint.es/def/infraestructura##UrbanElement">edintinf:UrbanElement</a>), compuesta por un <a href="#Poste">poste</a> (con uno o más <a href="#Brazo">brazos</a>), una o más <a href="#Luminaria">luminarias</a> (que alojan una <a href="#Lampara">lámpara</a> cada una) y opcionalmente una <a href="#Caja">caja de conexiones</a>.</p>\n\n<p>La infraestructura eléctrica se representa mediante el <a href="#CentroDeMando">centro de mando</a>, que es un punto de suministro (<a href="#https://edint.es/def/suministro##UtilitySupplyPoint">edintsum:UtilitySupplyPoint</a>) del que dependen una o más farolas. El centro de mando puede tener un <a href="#SuministroElectrico">suministro eléctrico</a> (contrato de suministro, <a href="#https://edint.es/def/suministro##UtilityContract">edintsum:UtilityContract</a>).</p>\n\n<p>El <a href="#ConsumoEnergetico">consumo energético</a> se modela como una observación SOSA (<a href="#https://edint.es/def/suministro##UtilityConsumption">edintsum:UtilityConsumption</a> ⊂ <a href="#http://www.w3.org/ns/sosa/Observation">sosa:Observation</a>), donde cada instancia representa el consumo en un período tarifario determinado. El valor del consumo se representa mediante <a href="#http://qudt.org/schema/qudt/QuantityValue">qudt:QuantityValue</a>, que expresa la magnitud a través de <a href="#http://qudt.org/schema/qudt/numericValue">qudt:numericValue</a> y la unidad de medida a través de <a href="#http://qudt.org/schema/qudt/hasUnit">qudt:hasUnit</a> (por ejemplo, <code>unit:KiloW-HR</code> para kilovatios-hora). El período tarifario se indica mediante la propiedad <a href="#periodoTarifario">periodoTarifario</a> vinculada a un concepto SKOS (activo, llano, valle, punta).</p>\n\n<p>Las clasificaciones del alumbrado (tipo de soporte, tipo de lámpara, estado de conservación, zona de alumbrado, clase luminotécnica, etc.) se representan mediante propiedades de objeto que apuntan a conceptos SKOS, organizados en esquemas de conceptos independientes disponibles en la carpeta <code>kos/</code>.</p>\n\n<p>El <a href="#Fabricante">fabricante</a> y el <a href="#Propietario">propietario</a> son entidades referenciables (no strings), lo que permite vincularlos a organizaciones u otros agentes. El <a href="#ModeloLuminaria">modelo de luminaria</a> actúa como entrada del catálogo de modelos, permitiendo vincular fabricante, potencia nominal y especificaciones.</p>\n</span>\n\n<pre><textarea style="resize:none" readonly id="code2" name="code" rows="30" cols="100">\n@prefix edintalu: &lt;https://edint.es/def/alumbrado-publico#&gt; .\n@prefix edintinf: &lt;https://edint.es/def/infraestructura##&gt; .\n@prefix edintsum: &lt;https://edint.es/def/suministro##&gt; .\n@prefix edintkosinftype: &lt;http://vocab.linkeddata.es/datosabiertos/kos/edint/InfrastructureType/&gt; .\n@prefix esdir: &lt;http://vocab.linkeddata.es/datosabiertos/def/urbanismo-infraestructuras/direccion-postal#&gt; .\n@prefix gsp: &lt;http://www.opengis.net/ont/geosparql#&gt; .\n@prefix sosa: &lt;http://www.w3.org/ns/sosa/&gt; .\n@prefix qudt: &lt;http://qudt.org/schema/qudt/&gt; .\n@prefix qudtu: &lt;http://qudt.org/vocab/unit/&gt; .\n@prefix schema: &lt;http://schema.org/&gt; .\n@prefix xsd: &lt;http://www.w3.org/2001/XMLSchema#&gt; .\n\n# --- Centro de mando ---\nex:cm-001 a edintalu:ControlCenter ;\n    edintalu:name "CM-001" ;\n    edintalu:hasSupply ex:sum-001 .\n\n# --- Suministro eléctrico ---\nex:sum-001 a edintalu:ElectricitySupply ;\n    edintalu:fiscalYear "2024"^^xsd:gYear ;\n    edintalu:tariff "6.1" ;\n    edintalu:hasConsumption ex:cons-001-llano .\n\n# --- Consumo energético (SOSA) ---\nex:cons-001-llano a edintalu:EnergyConsumption ;\n    sosa:hasFeatureOfInterest ex:cm-001 ;\n    sosa:observedProperty edintsum:electricityConsumption ;\n    sosa:hasResult [ a qudt:QuantityValue ;\n                     qudt:numericValue 8500 ;\n                     qudt:hasUnit qudtu:KiloW-HR ] ;\n    edintalu:tariffPeriod &lt;http://vocab.linkeddata.es/datosabiertos/kos/edint/TariffPeriod/llano&gt; ;\n    edintalu:fiscalYear "2024"^^xsd:gYear .\n\n# --- Farola ---\nex:farola-001 a edintalu:Streetlight ;\n    edintinf:hasInfrastructureType edintkosinftype:StreeLamp ;\n    edintalu:controlCenter ex:cm-001 ;\n    edintalu:post ex:post-001 ;\n    edintalu:luminaire ex:lum-001 ;\n    edintalu:illuminationClass &lt;http://vocab.linkeddata.es/datosabiertos/kos/edint/IlluminationType/me4&gt; ;\n    edintalu:lightingZone &lt;http://vocab.linkeddata.es/datosabiertos/kos/edint/LightingZone/e3&gt; ;\n    edintalu:address ex:dir-001 ;\n    gsp:hasGeometry ex:geom-001 .\n\n# --- Poste con brazo ---\nex:post-001 a edintalu:Post ;\n    edintalu:supportType &lt;http://vocab.linkeddata.es/datosabiertos/kos/edint/SupportType/baculo&gt; ;\n    edintalu:height [ a qudt:QuantityValue ; qudt:numericValue 8 ; qudt:hasUnit qudtu:M ] ;\n    edintalu:hasArm ex:brazo-001 .\n\nex:brazo-001 a edintalu:Arm ;\n    edintalu:armOrder 1 ;\n    edintalu:height [ a qudt:QuantityValue ; qudt:numericValue 6.5 ; qudt:hasUnit qudtu:M ] .\n\n# --- Luminaria + Lámpara ---\nex:lum-001 a edintalu:Luminaire ;\n    edintalu:hasLamp ex:lamp-001 ;\n    edintalu:luminaireModel ex:modelo-001 .\n\nex:lamp-001 a edintalu:Lamp ;\n    edintalu:lampType &lt;http://vocab.linkeddata.es/datosabiertos/kos/edint/LampType/led&gt; ;\n    edintalu:nominalPower [ a qudt:QuantityValue ; qudt:numericValue 72 ; qudt:hasUnit qudtu:W ] .\n\n# --- Modelo de catálogo ---\nex:modelo-001 a edintalu:LuminaireModel ;\n    edintalu:name "SpeedStar LED 72W" .\n\n# --- Dirección postal ---\nex:dir-001 a esdir:DireccionPostal ;\n    schema:streetAddress "Calle Mayor 1" ;\n    schema:addressLocality "Villaexample" ;\n    schema:addressCountry "ES" .\n\n# --- Geometría ---\nex:geom-001 a gsp:Geometry ;\n    gsp:asWKT "POINT (-3.70 40.42)"^^gsp:wktLiteral .\n</textarea></pre>\n<script>\n    var editor2 = CodeMirror.fromTextArea(document.getElementById("code2"), {\n        mode: "text/turtle",\n        matchBrackets: true\n    });\n</script>\n<span class="markdown">\nEn el ejemplo anterior se muestra una porción del grafo de conocimiento en RDF para una farola de alumbrado público. El <strong>centro de mando</strong> (CM-001) es el punto de suministro del que depende la farola, y tiene asociado un contrato de <strong>suministro eléctrico</strong> con tarifa 6.1. El <strong>consumo energético</strong> se representa como una observación SOSA: cada instancia (una por período tarifario) tiene como resultado un <code>qudt:QuantityValue</code> con el valor numérico y la unidad (kWh). La <strong>farola</strong> es un elemento urbano con tipo de infraestructura <code>StreeLamp</code> (SKOS de EDINT), compuesta por un <strong>poste</strong> (con su brazo a 6,5 m), una <strong>luminaria</strong> (con una lámpara LED de 72 W) y referencia a un <strong>modelo de catálogo</strong>. Las clasificaciones (tipo de alumbrado ME4b, zona E3, tipo de soporte báculo, tipo de lámpara LED) se representan mediante conceptos SKOS. La dirección postal se reutiliza de <code>esdir:DireccionPostal</code> y la geometría de GeoSPARQL.\n</span>\n
references-es=<span class="markdown">\n<ul>\n    <li><a href="https://edint.es/" target="_blank">Espacio de Datos para las Infraestructuras Urbanas Inteligentes (EDINT)</a></li>\n    <li><a href="http://femp.femp.es/files/3580-1937-fichero/DATOS%20ABIERTOS%20FEMP%202019.pdf" target="_blank">Guía Datos abiertos FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a></li>\n    <li><a href="https://datos.gob.es/es/conocimiento/datos-abiertos-femp-2019-40-conjuntos-de-datos-publicar-por-las-entidades-locales" target="_blank">DATOS ABIERTOS FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a> (source: datos.gob.es)</li>\n    <li><a href="https://redtransparenciayparticipacion.es/wp-content/uploads/2025/03/Datos-abiertos-80-conjuntos-de-datos.pdf" target="_blank">DATOS ABIERTOS 80 CONJUNTOS DE DATOS</a></li>\n</ul>\n</span>\n
