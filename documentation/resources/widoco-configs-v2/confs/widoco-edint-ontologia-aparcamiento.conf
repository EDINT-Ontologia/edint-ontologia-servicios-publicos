abstract-en=The purpose of this ontology is to provide a common vocabulary for representing the main entities and data of public and private parking facilities in a municipality. It includes the representation of parking spaces both on and off public roads. Its scope is limited to data that can be used for mobility management purposes, such as vehicle access to parking facilities, occupancy levels, spaces by permit type (e.g., residents), and spaces by vehicle type, which are part of the standard functions of local authorities.
introduction-en=\nThis ontology is part of the catalog of ontologies that is being developed in the context of the <a href="https://edint.es/" target="_blank">Data Space for Smart Urban Infrastructures (EDINT)</a>. It was also identified as a relevant ontology for the representation of data managed by local entities in the guide <a href="http://femp.femp.es/files/3580-1937-fichero/DATOS%20ABIERTOS%20FEMP%202019.pdf" target="_blank">Datos abiertos FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a>, as also described in the corresponding <a href="https://datos.gob.es/es/conocimiento/datos-abiertos-femp-2019-40-conjuntos-de-datos-publicar-por-las-entidades-locales" target="_blank">data.gob.es note</a>, and therefore included in the <a href="https://github.com/opencitydata" target="_blank">Github repository supporting the initiative</a>, which will be deprecated once this repository is launched.\nAn amplified version of the guide can be found in <a href="https://redtransparenciayparticipacion.es/wp-content/uploads/2025/03/Datos-abiertos-80-conjuntos-de-datos.pdf" target="_blank">DATOS ABIERTOS 80 CONJUNTOS DE DATOS</a>\n
description-en=<span class="markdown">\n<p>Figure 1 shows the conceptual model of the ontology with its classes and relationships (object properties).</p>\n<p><center><img src="images/diagrama-conceptual.png"/><figcaption>\nFigura 1. Conceptual model</figcaption></center></p>\nA <a href="#Parking">parking lot</a> is a place where vehicles can be temporarily parked by paying the <a href="#ParkingFee">fee</a> that <a href="#hasParkingFee">has</a> charges.\n\nParking lots are a (sub)class of <a href="#http://vocab.linkeddata.es/datosabiertos/def/urbanismo-infraestructuras/infraestructura#Facility">Equipment</a> which, in turn, can <a href="#http://vocab.linkeddata.es/datosabiertos/def/urbanismo-infraestructuras/infraestructura#hasObservationPoint">have</a> <a href="#http://vocab.linkeddata.es/datosabiertos/def/urbanismo-infraestructuras/infraestructura#ObservationPoint">observation points</a>. This class and property are described in the <a href="http://vocab.linkeddata.es/datosabiertos/def/urbanismo-infraestructuras/infraestructura#">Ontology for the representation of a municipality's infrastructure</a>.\n\nThere are two (sub)classes of parking: those that are <a href="#OnStreetParking">on-street parking</a> and those that are <a href="#OffStreetParking">off-street parking</a>. On-street parking can be <a href="#isPartOfZone">part of a</a> <a href="#http://vocab.linkeddata.es/datosabiertos/def/common/zone#RegulatedParkingZone">regulated parking zone</a>, which is a (sub)class of <a href="#http://vocab.linkeddata.es/datosabiertos/def/common/zone#RegulatedZone">regulated zone</a>.\n\nAll parking areas have parking spaces that can be grouped according to the type of permit; for example, there are groups of spaces for residents, people with reduced mobility, etc. They are also grouped by the type of vehicle, for example, spaces for cars, for motorcycles, etc. These two taxonomies have been defined in the Ontology for the representation of the census or register of vehicles.</span>\n\n<pre><textarea style="resize:none" readonly id="code2" name="code" rows="25" cols="100">\n@prefix comp: &lt;http://semweb.mmlab.be/ns/rml-compression#&gt; .\n@prefix d2rq: &lt;http://www.wiwiss.fu-berlin.de/suhl/bizer/D2RQ/0.1#&gt; .\n@prefix dct: &lt;http://purl.org/dc/terms/&gt; .\n@prefix edintapar: &lt;http://vocab.linkeddata.es/datosabiertos/def/urbanismo-infraestructuras/aparcamiento#&gt; .\n@prefix edintinf: &lt;http://vocab.linkeddata.es/datosabiertos/def/urbanismo-infraestructuras/infraestructura#&gt; .\n@prefix edintveh: &lt;http://vocab.linkeddata.es/datosabiertos/def/transporte/censovehiculos#&gt; .\n@prefix esadm: &lt;http://vocab.linkeddata.es/datosabiertos/def/sector-publico/territorio#&gt; .\n@prefix escjr: &lt;http://vocab.linkeddata.es/datosabiertos/def/urbanismo-infraestructuras/callejero#&gt; .\n@prefix esdir: &lt;http://vocab.linkeddata.es/datosabiertos/def/urbanismo-infraestructuras/direccion-postal#&gt; .\n@prefix fnml: &lt;http://semweb.mmlab.be/ns/fnml#&gt; .\n@prefix foaf: &lt;http://xmlns.com/foaf/0.1/&gt; .\n@prefix formats: &lt;http://www.w3.org/ns/formats/&gt; .\n@prefix geosparql: &lt;http://www.opengis.net/ont/geosparql#&gt; .\n@prefix grel: &lt;http://users.ugent.be/~bjdmeest/function/grel.ttl#&gt; .\n@prefix ql: &lt;http://semweb.mmlab.be/ns/ql#&gt; .\n@prefix rdf: &lt;http://www.w3.org/1999/02/22-rdf-syntax-ns#&gt; .\n@prefix rdfs: &lt;http://www.w3.org/2000/01/rdf-schema#&gt; .\n@prefix rml: &lt;http://semweb.mmlab.be/ns/rml#&gt; .\n@prefix rr: &lt;http://www.w3.org/ns/r2rml#&gt; .\n@prefix schema: &lt;http://www.owl-ontologies.com/schema#&gt; .\n@prefix void: &lt;http://rdfs.org/ns/void#&gt; .\n@prefix xsd: &lt;http://www.w3.org/2001/XMLSchema#&gt; .\n\n\n&lt;http://vocab.linkeddata.es/datosabiertos/recurso/parking/P001&gt; a edintapar:OnStreetParking;\n  dct:identifier "P001";\n  &lt;http://schema.org/address&gt; &lt;http://vocab.linkeddata.es/datosabiertos/recurso/direccion-postal/28001&gt;;\n  &lt;http://schema.org/openingHours&gt; "Mo-Fr 09:00-18:00";\n  edintapar:hasParkingFee &lt;http://vocab.linkeddata.es/datosabiertos/recurso/tarifa-aparcamiento/TAR001&gt;;\n  edintapar:hasParkingSpot &lt;http://vocab.linkeddata.es/datosabiertos/recurso/plaza-aparcamiento/PLZ001&gt;;\n  edintapar:hasSpotsByParkingPermitType &lt;http://vocab.linkeddata.es/datosabiertos/recurso/plaza-aparcamiento/PLZ001&gt;;\n  edintapar:hasSpotsByVehicleType &lt;http://vocab.linkeddata.es/datosabiertos/recurso/plazas/GRP001&gt;;\n  edintapar:isPartOfZone &lt;http://vocab.linkeddata.es/datosabiertos/recurso/zona-regulatoria/ZONA_SER_01&gt;;\n  edintinf:belongsTo &lt;http://vocab.linkeddata.es/datosabiertos/recurso/sector-publico/territorio/barrio/Salamanca&gt;;\n  edintinf:hasInfrastructureType &lt;edintkos:onStreetParking&gt;;\n  edintinf:hasRegisteredOwner &lt;http://vocab.linkeddata.es/datosabiertos/recurso/organizacion/P001&gt;;\n  geosparql:hasGeometry &lt;http://vocab.linkeddata.es/datosabiertos/recurso/equipamiento-municipal/locations/P001&gt;;\n  rdfs:comment "Zona SER tramo inicial Serrano";\n  rdfs:label "Aparcamiento Serrano TR1" .\n\n&lt;http://vocab.linkeddata.es/datosabiertos/recurso/direccion-postal/28001&gt; a esdir:DireccionPostal;\n  escjr:contieneVia &lt;http://vocab.linkeddata.es/datosabiertos/recurso/urbanismo-infraestructuras/callejero/Calle/Serrano&gt;;\n  rdfs:label "Calle de Serrano 10, Madrid" .\n\n&lt;http://vocab.linkeddata.es/datosabiertos/recurso/urbanismo-infraestructuras/callejero/Calle/Serrano&gt;\n  a escjr:Via;\n  dct:identifier "CL001";\n  esadm:municipio &lt;http://vocab.linkeddata.es/datosabiertos/recurso/sector-publico/territorio/Municipio/Madrid&gt;;\n  escjr:contieneTramoVia &lt;http://vocab.linkeddata.es/datosabiertos/recurso/urbanismo-infraestructuras/callejero/TramoCalle/TR001&gt;;\n  escjr:tipoVia &lt;http://vocab.linkeddata.es/datosabiertos/kos/urbanismo-infraestructuras/tipo-via/calle&gt; .\n\n&lt;http://vocab.linkeddata.es/datosabiertos/recurso/urbanismo-infraestructuras/callejero/TramoCalle/TR001&gt;\n  a escjr:TramoVia;\n  esadm:municipio &lt;http://vocab.linkeddata.es/datosabiertos/recurso/sector-publico/territorio/Municipio/Madrid&gt;;\n  escjr:numeroFinTramo "60";\n  escjr:numeroInicioTramo "1";\n  escjr:via &lt;http://vocab.linkeddata.es/datosabiertos/recurso/urbanismo-infraestructuras/callejero/Calle/Serrano&gt; .\n\n&lt;http://vocab.linkeddata.es/datosabiertos/recurso/equipamiento-municipal/locations/P001&gt;\n  a geosparql:Geometry;\n  dct:identifier "P001";\n  geosparql:asWKT "POINT (-3.6862 40.4306)"^^geosparql:wktLiteral .\n\n&lt;http://vocab.linkeddata.es/datosabiertos/recurso/grupo-plazas-por-vehiculos/GVEH001&gt;\n  a edintapar:SpotsByVehicleType;\n  edintveh:vehicleType &lt;edintkos:car&gt;;\n  edintapar:numberOfSpots "20" .\n\n&lt;http://vocab.linkeddata.es/datosabiertos/recurso/plazas/GRP001&gt; a edintapar:ParkingSpotsByPermitType;\n  edintinf:numberOfParkingSpots "25";\n  edintinf:permitType &lt;edintkos:Residente&gt; .\n\n&lt;http://vocab.linkeddata.es/datosabiertos/recurso/tarifa-aparcamiento/TAR001&gt; a edintapar:ParkingFee;\n  &lt;http://schema.org/description&gt; "Vehículos con distintivo B o C";\n  &lt;http://schema.org/name&gt; "Tarifa estándar SER";\n  &lt;http://schema.org/price&gt; "2.5";\n  &lt;http://schema.org/priceCurrency&gt; "EUR" .\n</textarea></pre>\n<script>\n    var editor2 = CodeMirror.fromTextArea(document.getElementById("code2"), {\n        mode: "text/turtle",\n        matchBrackets: true\n    });\n</script>\n<p>The example above shows the data for an on-street parking lot with the identifier "P001". The parking lot has a rate of €2.50 per hour for vehicles with "B" or "C" environmental stickers. It is located on a section of Serrano Street in the Salamanca district of Madrid. The rate applies during specific hours, it is part of the SER Zone "001", and it is managed by the Madrid City Council. It has a total of 25 spaces for residents.</p>\n</scope>\n
references-en=<span class="markdown">\n<ul>\n    <li><a href="https://edint.es/en/" target="_blank">Data Spaces for Smart Urban Infrastructures (EDINT)</a></li>\n    <li><a href="http://femp.femp.es/files/3580-1937-fichero/DATOS%20ABIERTOS%20FEMP%202019.pdf" target="_blank">Guía Datos abiertos FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a></li>\n    <li><a href="https://datos.gob.es/es/conocimiento/datos-abiertos-femp-2019-40-conjuntos-de-datos-publicar-por-las-entidades-locales" target="_blank">DATOS ABIERTOS FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a> (source: datos.gob.es)</li>\n    <li><a href="https://redtransparenciayparticipacion.es/wp-content/uploads/2025/03/Datos-abiertos-80-conjuntos-de-datos.pdf" target="_blank">DATOS ABIERTOS 80 CONJUNTOS DE DATOS</a></li>\n</ul>\n</span>\n
abstract-es=El propósito de esta ontología es el de proporcionar un vocabulario común para la representación de las entidades y datos principales de los aparcamientos públicos y privados de un municipio. Se incluye la representación de aparcamientos dentro y fuera de la vía pública. Su alcance se limita a los datos que pueden ser utilizados con el propósito de la gestión de movilidad, es decir accesos de vehículos a los aparcamientos, nivel de ocupación, plazas según tipo de permiso (por ejemplo, residentes) y plazas según tipo de vehículo, que son parte de las funciones habituales de las entidades locales.
introduction-es=Esta ontología forma parte del catálogo de ontologías que está siendo desarrollado en el contexto del <a href="https://edint.es/" target="_blank">Espacio de Datos para las Infraestructuras Urbanas Inteligentes (EDINT)</a>. Asimismo, fue identificada como una ontología relevante para la representación de datos gestionados por entidades locales en la guía <a href="http://femp.femp.es/files/3580-1937-fichero/DATOS%20ABIERTOS%20FEMP%202019.pdf" target="_blank">Datos abiertos FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a>, tal y como se describe también en la correspondiente <a href="https://datos.gob.es/es/conocimiento/datos-abiertos-femp-2019-40-conjuntos-de-datos-publicar-por-las-entidades-locales" target="_blank">nota de datos.gob.es</a>, y por tanto recogido en el <a href="https://github.com/opencitydata" target="_blank">repositorio Github de apoyo a la iniciativa</a>, que queda deprecado una vez se lance este repositorio.\nUna versión amplificada de la guía se encuentra en <a href="https://redtransparenciayparticipacion.es/wp-content/uploads/2025/03/Datos-abiertos-80-conjuntos-de-datos.pdf" target="_blank">DATOS ABIERTOS 80 CONJUNTOS DE DATOS</a>\n
description-es=<span class="markdown"><p>En la Figura 1 se muestra el modelo conceptual de la ontología con sus clases y relaciones (propiedades de objeto).</p>\n<p><center><img src="images/diagrama-conceptual.png"/><figcaption>\nFigura 1. Modelo conceptual de la ontología</figcaption></center></p>\n<p>Un <a href="#Parking">aparcamiento</a> es un lugar donde se pueden colocar transitoriamente vehículos abonando la  <a href="#ParkingFee">tarifa</a> que <a href="#hasParkingFee">tiene el aparcamiento</a>.\nLos aparcamientos son una (sub)clase de <a href="#http://vocab.linkeddata.es/datosabiertos/def/urbanismo-infraestructuras/infraestructura#Facility">Equipamiento</a> que, a su vez, pueden <a href="#http://vocab.linkeddata.es/datosabiertos/def/urbanismo-infraestructuras/infraestructura#hasObservationPoint">tener</a> <a href="#http://vocab.linkeddata.es/datosabiertos/def/urbanismo-infraestructuras/infraestructura#ObservationPoint">puntos de observación</a>. Esta clase y propiedad están descritas en la <a href="http://vocab.linkeddata.es/datosabiertos/def/urbanismo-infraestructuras/infraestructura#">Ontología para la representación de la infraestructura de un municipio</a>.\nExisten dos (sub)clases de aparcamiento: los que son  <a href="#OnStreetParking">aparcamientos en la vía pública</a>  y los  <a href="#OffStreetParking">aparcamientos fuera de la vía pública</a>. Los aparcamientos en la vía pública pueden ser  <a href="#isPartOfZone">parte de una</a> <a href="#http://vocab.linkeddata.es/datosabiertos/def/common/zone#RegulatedParkingZone">zona regulatoria de aparcamiento</a>   , que es una (sub)clase de <a href="#http://vocab.linkeddata.es/datosabiertos/def/common/zone#RegulatedZone">zona regulatoria</a> .\nTodos los aparcamientos <a href="#hasParkingSpot">tienen</a> <a href="#ParkingSpot">plazas de aparcamiento</a> que se pueden agrupar según el  <a href="#http://vocab.linkeddata.es/datosabiertos/kos/edint/PermitType">tipo de permiso</a>, por ejemplo existen grupos de plazas para residentes, personas de movilidad reducida, etc. También se agrupan por <a href="#http://vocab.linkeddata.es/datosabiertos/kos/edint/VehicleType">tipo de vehículo</a>, por ejemplo plazas para coches, para motocicletas, etc. Estas dos taxonomías han sido definidas en la <a href="http://vocab.linkeddata.es/datosabiertos/def/transporte/censovehiculos#">Ontología para la representación del censo o registro de vehículos</a>.</p>\n<pre><textarea style="resize:none" readonly id="code2" name="code" rows="25" cols="100">\n@prefix comp: &lt;http://semweb.mmlab.be/ns/rml-compression#&gt; .\n@prefix d2rq: &lt;http://www.wiwiss.fu-berlin.de/suhl/bizer/D2RQ/0.1#&gt; .\n@prefix dct: &lt;http://purl.org/dc/terms/&gt; .\n@prefix edintapar: &lt;http://vocab.linkeddata.es/datosabiertos/def/urbanismo-infraestructuras/aparcamiento#&gt; .\n@prefix edintinf: &lt;http://vocab.linkeddata.es/datosabiertos/def/urbanismo-infraestructuras/infraestructura#&gt; .\n@prefix edintveh: &lt;http://vocab.linkeddata.es/datosabiertos/def/transporte/censovehiculos#&gt; .\n@prefix esadm: &lt;http://vocab.linkeddata.es/datosabiertos/def/sector-publico/territorio#&gt; .\n@prefix escjr: &lt;http://vocab.linkeddata.es/datosabiertos/def/urbanismo-infraestructuras/callejero#&gt; .\n@prefix esdir: &lt;http://vocab.linkeddata.es/datosabiertos/def/urbanismo-infraestructuras/direccion-postal#&gt; .\n@prefix fnml: &lt;http://semweb.mmlab.be/ns/fnml#&gt; .\n@prefix foaf: &lt;http://xmlns.com/foaf/0.1/&gt; .\n@prefix formats: &lt;http://www.w3.org/ns/formats/&gt; .\n@prefix geosparql: &lt;http://www.opengis.net/ont/geosparql#&gt; .\n@prefix grel: &lt;http://users.ugent.be/~bjdmeest/function/grel.ttl#&gt; .\n@prefix ql: &lt;http://semweb.mmlab.be/ns/ql#&gt; .\n@prefix rdf: &lt;http://www.w3.org/1999/02/22-rdf-syntax-ns#&gt; .\n@prefix rdfs: &lt;http://www.w3.org/2000/01/rdf-schema#&gt; .\n@prefix rml: &lt;http://semweb.mmlab.be/ns/rml#&gt; .\n@prefix rr: &lt;http://www.w3.org/ns/r2rml#&gt; .\n@prefix schema: &lt;http://www.owl-ontologies.com/schema#&gt; .\n@prefix void: &lt;http://rdfs.org/ns/void#&gt; .\n@prefix xsd: &lt;http://www.w3.org/2001/XMLSchema#&gt; .\n\n&lt;http://vocab.linkeddata.es/datosabiertos/recurso/parking/P001&gt; a edintapar:OnStreetParking;\n  dct:identifier "P001";\n  &lt;http://schema.org/address&gt; &lt;http://vocab.linkeddata.es/datosabiertos/recurso/direccion-postal/28001&gt;;\n  &lt;http://schema.org/openingHours&gt; "Mo-Fr 09:00-18:00";\n  edintapar:hasParkingFee &lt;http://vocab.linkeddata.es/datosabiertos/recurso/tarifa-aparcamiento/TAR001&gt;;\n  edintapar:hasParkingSpot &lt;http://vocab.linkeddata.es/datosabiertos/recurso/plaza-aparcamiento/PLZ001&gt;;\n  edintapar:hasSpotsByParkingPermitType &lt;http://vocab.linkeddata.es/datosabiertos/recurso/plaza-aparcamiento/PLZ001&gt;;\n  edintapar:hasSpotsByVehicleType &lt;http://vocab.linkeddata.es/datosabiertos/recurso/plazas/GRP001&gt;;\n  edintapar:isPartOfZone &lt;http://vocab.linkeddata.es/datosabiertos/recurso/zona-regulatoria/ZONA_SER_01&gt;;\n  edintinf:belongsTo &lt;http://vocab.linkeddata.es/datosabiertos/recurso/sector-publico/territorio/barrio/Salamanca&gt;;\n  edintinf:hasInfrastructureType &lt;edintkos:onStreetParking&gt;;\n  edintinf:hasRegisteredOwner &lt;http://vocab.linkeddata.es/datosabiertos/recurso/organizacion/P001&gt;;\n  geosparql:hasGeometry &lt;http://vocab.linkeddata.es/datosabiertos/recurso/equipamiento-municipal/locations/P001&gt;;\n  rdfs:comment "Zona SER tramo inicial Serrano";\n  rdfs:label "Aparcamiento Serrano TR1" .\n\n&lt;http://vocab.linkeddata.es/datosabiertos/recurso/direccion-postal/28001&gt; a esdir:DireccionPostal;\n  escjr:contieneVia &lt;http://vocab.linkeddata.es/datosabiertos/recurso/urbanismo-infraestructuras/callejero/Calle/Serrano&gt;;\n  rdfs:label "Calle de Serrano 10, Madrid" .\n\n&lt;http://vocab.linkeddata.es/datosabiertos/recurso/urbanismo-infraestructuras/callejero/Calle/Serrano&gt;\n  a escjr:Via;\n  dct:identifier "CL001";\n  esadm:municipio &lt;http://vocab.linkeddata.es/datosabiertos/recurso/sector-publico/territorio/Municipio/Madrid&gt;;\n  escjr:contieneTramoVia &lt;http://vocab.linkeddata.es/datosabiertos/recurso/urbanismo-infraestructuras/callejero/TramoCalle/TR001&gt;;\n  escjr:tipoVia &lt;http://vocab.linkeddata.es/datosabiertos/kos/urbanismo-infraestructuras/tipo-via/calle&gt; .\n\n&lt;http://vocab.linkeddata.es/datosabiertos/recurso/urbanismo-infraestructuras/callejero/TramoCalle/TR001&gt;\n  a escjr:TramoVia;\n  esadm:municipio &lt;http://vocab.linkeddata.es/datosabiertos/recurso/sector-publico/territorio/Municipio/Madrid&gt;;\n  escjr:numeroFinTramo "60";\n  escjr:numeroInicioTramo "1";\n  escjr:via &lt;http://vocab.linkeddata.es/datosabiertos/recurso/urbanismo-infraestructuras/callejero/Calle/Serrano&gt; .\n\n&lt;http://vocab.linkeddata.es/datosabiertos/recurso/equipamiento-municipal/locations/P001&gt;\n  a geosparql:Geometry;\n  dct:identifier "P001";\n  geosparql:asWKT "POINT (-3.6862 40.4306)"^^geosparql:wktLiteral .\n\n&lt;http://vocab.linkeddata.es/datosabiertos/recurso/grupo-plazas-por-vehiculos/GVEH001&gt;\n  a edintapar:SpotsByVehicleType;\n  edintveh:vehicleType &lt;edintkos:car&gt;;\n  edintapar:numberOfSpots "20" .\n\n&lt;http://vocab.linkeddata.es/datosabiertos/recurso/plazas/GRP001&gt; a edintapar:ParkingSpotsByPermitType;\n  edintinf:numberOfParkingSpots "25";\n  edintinf:permitType &lt;edintkos:Residente&gt; .\n\n&lt;http://vocab.linkeddata.es/datosabiertos/recurso/tarifa-aparcamiento/TAR001&gt; a edintapar:ParkingFee;\n  &lt;http://schema.org/description&gt; "Vehículos con distintivo B o C";\n  &lt;http://schema.org/name&gt; "Tarifa estándar SER";\n  &lt;http://schema.org/price&gt; "2.5";\n  &lt;http://schema.org/priceCurrency&gt; "EUR" .\n</textarea></pre>\n<script>\n    var editor2 = CodeMirror.fromTextArea(document.getElementById("code2"), {\n        mode: "text/turtle",\n        matchBrackets: true\n    });\n</script>\n<p>El ejemplo anterior muestra los datos de un aparcamiento en la vía pública con identificador "P001". El aparcamiento tiene una tarifa para vehículos con distintivo "B" o "C" de 2,50 euros por hora. Corresponde a un tramo de la calle Serrano del Barrio de Salamanca en Madrid. Tiene un horario en el cual se aplica la tarifa, es parte de la Zona SER "001" y la organización que lo gestiona es el Ayuntamiento de Madrid. Tiene un total de 25 plazas para residentes. </p>\n</span>\n\n
