abstract-en=Ontología para modelar las entidades del Catastro Español, centrada en Parcelas, Inmuebles y Construcciones. Reutiliza GeoSPARQL, conceptos INSPIRE y el vocabulario de callejero español.
introduction-en=\nThis ontology is part of the catalog of ontologies that is being developed in the context of the <a href="https://edint.es/" target="_blank">Data Space for Smart Urban Infrastructures (EDINT)</a>. It was also identified as a relevant ontology for the representation of data managed by local entities in the guide <a href="http://femp.femp.es/files/3580-1937-fichero/DATOS%20ABIERTOS%20FEMP%202019.pdf" target="_blank">Datos abiertos FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a>, as also described in the corresponding <a href="https://datos.gob.es/es/conocimiento/datos-abiertos-femp-2019-40-conjuntos-de-datos-publicar-por-las-entidades-locales" target="_blank">data.gob.es note</a>, and therefore included in the <a href="https://github.com/opencitydata" target="_blank">Github repository supporting the initiative</a>, which will be deprecated once this repository is launched.\nAn amplified version of the guide can be found in <a href="https://redtransparenciayparticipacion.es/wp-content/uploads/2025/03/Datos-abiertos-80-conjuntos-de-datos.pdf" target="_blank">DATOS ABIERTOS 80 CONJUNTOS DE DATOS</a>\n
description-en=\ <div style="padding: 25px; background-color: white; width: 100%; box-sizing: border-box; overflow: hidden;">\n     <a href="images/diagram.png" target="_blank" style="display: block;">\n         <img src="images/diagram.png" style="width: 100%; height: auto; display: block;"/>\n     </a>\n </div>\n\n <p>As shown in Figure 1, there are three main concepts in the ontology: <a href="#CadastralParcel">Cadastral Parcel</a>, <a href="#CadastralProperty">Cadastral Property</a> and <a href="#CadastralConstruction">Cadastral Construction</a>, which form a hierarchical relationship.</p>\n\n <p>The class <a href="#CadastralParcel">Cadastral Parcel</a> represents the basic territorial division unit in the Spanish Cadastre. It is a geographically delimited piece of land that may contain one or more cadastral properties. It inherits from <a href="http://www.opengis.net/ont/geosparql#Feature" target="_blank">GeoSPARQL Feature</a>, providing geospatial capabilities. Each parcel has a mandatory <a href="#hasParcelReference">parcel reference</a> (7-character alphanumeric code, e.g. <code>8942103VK</code>), an <a href="#hasAddress">address</a> via the callejero vocabulary, and a <a href="#hasClass">classification</a> (urban/rural) defined in the external SKOS vocabulary of <a href="http://vocab.linkeddata.es/datosabiertos/def/urbanismo-infraestructuras/clase" target="_blank">land classification</a>.</p>\n\n <p>The class <a href="#CadastralProperty">Cadastral Property</a> represents a real estate unit registered in the Cadastre (e.g. a flat, premises, or any independent use unit within a parcel). It may contain one or more <a href="#CadastralConstruction">Cadastral Constructions</a>. It also inherits from GeoSPARQL Feature and has a mandatory <a href="#hasPropertyReference">property reference</a> (e.g. <code>0001UO</code>). Additional properties include its <a href="#participation">participation percentage</a> in common elements, an <a href="#hasAddress">address</a>, a <a href="#hasUse">primary use</a> from the SKOS vocabulary of <a href="http://vocab.linkeddata.es/datosabiertos/def/urbanismo-infraestructuras/uso" target="_blank">uses</a>, and whether it is subject to <a href="#hasHorizontalDivision">horizontal division</a>.</p>\n\n <p>The class <a href="#CadastralConstruction">Cadastral Construction</a> represents a building or construction unit registered on a cadastral property. It includes data on area, use, construction characteristics, and renovations. It inherits from GeoSPARQL Feature and is located on exactly one cadastral property. Properties include its <a href="#constructionYear">construction year</a>, <a href="#hasUse">primary use</a>, <a href="#floor">floor</a>, <a href="#staircase">staircase</a>, <a href="#door">door</a>, and <a href="#supportPercentage">support percentage</a>. It may also have undergone one or more <a href="#hasRenovation">renovations</a>, modelled by the <a href="#Renovation">Renovation</a> class.</p>\n\n <p>The classes <a href="#ParcelReference">Parcel Reference</a> and <a href="#PropertyReference">Property Reference</a> are concrete sub-classes of the abstract <a href="#CadastralReference">Cadastral Reference</a> class. A <a href="#ParcelReference">Parcel Reference</a> holds the 7-character alphanumeric code (e.g. <code>8942103VK</code>), while a <a href="#PropertyReference">Property Reference</a> combines the parcel reference with a property identifier and check digit (e.g. <code>TF8006N0001HZ</code>), following the official format of the <a href="https://www.sedecatastro.gob.es" target="_blank">Catastro</a>.</p>\n\n <p>The class <a href="#Renovation">Renovation</a> models renovation events for a construction, including the <a href="#renovationDate">date</a> and <a href="#renovationType">type</a> of renovation. These are linked to a <a href="#CadastralConstruction">Cadastral Construction</a> via the <a href="#hasRenovation">has renovation</a> relationship.</p>\n\n <p>Below we show a simplified RDF example in Turtle notation, based on the real example from <a href="https://www.sedecatastro.gob.es" target="_blank">sedecatastro.gob.es</a> (reference <code>8942103VK2793</code>, Calle Badajoz 348, Pozuelo de Alarc&oacute;n), showing the hierarchical relationship between <a href="#CadastralParcel">Cadastral Parcel</a> &rarr; <a href="#CadastralProperty">Cadastral Property</a> &rarr; <a href="#CadastralConstruction">Cadastral Construction</a>.</p>\n\n <pre>\n     <textarea style="resize:none" readonly id="code1" name="code" rows="35" cols="150">\n @prefix ex: &lt;https://edint.github.io/edint-ontologia-inmuebles/examples#&gt; .\n @prefix edintcat: &lt;http://vocab.linkeddata.es/datosabiertos/def/catastro#&gt; .\n @prefix callejero: &lt;http://vocab.linkeddata.es/datosabiertos/def/urbanismo-infraestructuras/callejero#&gt; .\n @prefix edintkos-clase: &lt;http://vocab.linkeddata.es/datosabiertos/kos/edint/clase/&gt; .\n @prefix edintkos-uso: &lt;http://vocab.linkeddata.es/datosabiertos/kos/edint/uso/&gt; .\n @prefix rdfs: &lt;http://www.w3.org/2000/01/rdf-schema#&gt; .\n @prefix xsd: &lt;http://www.w3.org/2001/XMLSchema#&gt; .\n\n # ---------------------------------------------------------------------------\n # CADASTRAL PARCEL\n # ---------------------------------------------------------------------------\n\n ex:Parcel_8942103VK2793\n     a edintcat:CadastralParcel ;\n     rdfs:label "Parcel 8942103VK2793"@en ;\n     edintcat:hasParcelReference ex:Ref_Parcel ;\n     edintcat:hasCadastralProperty ex:Property_0001UO ;\n     edintcat:hasClass edintkos-clase:Urban .\n\n ex:Ref_Parcel\n     a edintcat:ParcelReference ;\n     edintcat:parcelReference "8942103VK2793" .\n\n # ---------------------------------------------------------------------------\n # CADASTRAL PROPERTY\n # ---------------------------------------------------------------------------\n\n ex:Property_0001UO\n     a edintcat:CadastralProperty ;\n     rdfs:label "Cadastral Property 0001UO"@en ;\n     edintcat:hasPropertyReference ex:Ref_Property ;\n     edintcat:onCadastralParcel ex:Parcel_8942103VK2793 ;\n     edintcat:participation "100.00"^^xsd:decimal ;\n     edintcat:hasUse edintkos-uso:Cultural ;\n     edintcat:hasClass edintkos-clase:Urban ;\n     edintcat:hasAddress ex:Portal_348B ;\n     edintcat:hasCadastralConstruction ex:Construction_3_n2_01 .\n\n ex:Ref_Property\n     a edintcat:PropertyReference ;\n     edintcat:parcelReference "8942103VK2793" ;\n     edintcat:propertyReference "0001UO" .\n\n # ---------------------------------------------------------------------------\n # CADASTRAL CONSTRUCTION\n # ---------------------------------------------------------------------------\n\n ex:Construction_3_n2_01\n     a edintcat:CadastralConstruction ;\n     rdfs:label "STORAGE 3/-2/01"@en ;\n     edintcat:constructionYear "2012"^^xsd:gYear ;\n     edintcat:hasUse edintkos-uso:StorageParking ;\n     edintcat:onCadastralProperty ex:Property_0001UO ;\n     edintcat:staircase "3" ;\n     edintcat:floor "-2" ;\n     edintcat:door "01" .\n\n # ---------------------------------------------------------------------------\n # ADDRESS (callejero vocabulary)\n # ---------------------------------------------------------------------------\n\n ex:Portal_348B\n     a callejero:Portal ;\n     callejero:number "348" ;\n     callejero:postalCode "28223" ;\n     callejero:municipality "POZUELO DE ALARCON" ;\n     callejero:province "MADRID" .\n\n     </textarea>\n </pre>\n\n <script>\n     var editor1 = CodeMirror.fromTextArea(document.getElementById("code1"), {\n         mode: "text/turtle",\n         matchBrackets: true\n     });\n\n </script>\n
references-en=<span class="markdown">\n<ul>\n    <li><a href="https://edint.es/en/" target="_blank">Data Spaces for Smart Urban Infrastructures (EDINT)</a></li>\n    <li><a href="http://femp.femp.es/files/3580-1937-fichero/DATOS%20ABIERTOS%20FEMP%202019.pdf" target="_blank">Guía Datos abiertos FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a></li>\n    <li><a href="https://datos.gob.es/es/conocimiento/datos-abiertos-femp-2019-40-conjuntos-de-datos-publicar-por-las-entidades-locales" target="_blank">DATOS ABIERTOS FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a> (source: datos.gob.es)</li>\n    <li><a href="https://redtransparenciayparticipacion.es/wp-content/uploads/2025/03/Datos-abiertos-80-conjuntos-de-datos.pdf" target="_blank">DATOS ABIERTOS 80 CONJUNTOS DE DATOS</a></li>\n</ul>\n</span>\n
abstract-es=Ontología para modelar las entidades del Catastro Español, centrada en Parcelas, Inmuebles y Construcciones. Reutiliza GeoSPARQL, conceptos INSPIRE y el vocabulario de callejero español.
introduction-es=Esta ontología forma parte del catálogo de ontologías que está siendo desarrollado en el contexto del <a href="https://edint.es/" target="_blank">Espacio de Datos para las Infraestructuras Urbanas Inteligentes (EDINT)</a>. Asimismo, fue identificada como una ontología relevante para la representación de datos gestionados por entidades locales en la guía <a href="http://femp.femp.es/files/3580-1937-fichero/DATOS%20ABIERTOS%20FEMP%202019.pdf" target="_blank">Datos abiertos FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a>, tal y como se describe también en la correspondiente <a href="https://datos.gob.es/es/conocimiento/datos-abiertos-femp-2019-40-conjuntos-de-datos-publicar-por-las-entidades-locales" target="_blank">nota de datos.gob.es</a>, y por tanto recogido en el <a href="https://github.com/opencitydata" target="_blank">repositorio Github de apoyo a la iniciativa</a>, que queda deprecado una vez se lance este repositorio.\nUna versión amplificada de la guía se encuentra en <a href="https://redtransparenciayparticipacion.es/wp-content/uploads/2025/03/Datos-abiertos-80-conjuntos-de-datos.pdf" target="_blank">DATOS ABIERTOS 80 CONJUNTOS DE DATOS</a>\n
description-es=\ <div style="padding: 25px; background-color: white; width: 100%; box-sizing: border-box; overflow: hidden;">\n     <a href="images/diagram.png" target="_blank" style="display: block;">\n         <img src="images/diagram.png" style="width: 100%; height: auto; display: block;"/>\n     </a>\n </div>\n\n <p>Como se muestra en la Figura 1, hay tres conceptos principales en la ontolog&iacute;a: <a href="#CadastralParcel">Parcela Catastral</a>, <a href="#CadastralProperty">Inmueble Catastral</a> y <a href="#CadastralConstruction">Construcci&oacute;n Catastral</a>, que forman una relaci&oacute;n jer&aacute;rquica.</p>\n\n <p>La clase <a href="#CadastralParcel">Parcela Catastral</a> representa la unidad b&aacute;sica de divisi&oacute;n territorial en el Catastro Espa&ntilde;ol. Es una porci&oacute;n de terreno delimitada geogr&aacute;ficamente que puede contener uno o m&aacute;s inmuebles catastrales. Hereda de <a href="http://www.opengis.net/ont/geosparql#Feature" target="_blank">GeoSPARQL Feature</a>, lo que le proporciona capacidades geoespaciales. Cada parcela tiene una <a href="#hasParcelReference">referencia de parcela</a> obligatoria (c&oacute;digo alfanum&eacute;rico de 7 caracteres, ej. <code>8942103VK</code>), una <a href="#hasAddress">direcci&oacute;n</a> a trav&eacute;s del vocabulario callejero, y una <a href="#hasClass">clasificaci&oacute;n</a> (urbano/r&uacute;stico) definida en el vocabulario SKOS externo de <a href="http://vocab.linkeddata.es/datosabiertos/def/urbanismo-infraestructuras/clase" target="_blank">clase de suelo</a>.</p>\n\n <p>La clase <a href="#CadastralProperty">Inmueble Catastral</a> representa una unidad inmobiliaria inscrita en el Catastro (ej. un piso, local o cualquier unidad de uso independiente dentro de una parcela). Puede contener una o m&aacute;s <a href="#CadastralConstruction">Construcciones Catastrales</a>. Tambi&eacute;n hereda de GeoSPARQL Feature y tiene una <a href="#hasPropertyReference">referencia de inmueble</a> obligatoria (ej. <code>0001UO</code>). Adicionalmente, se caracteriza por su <a href="#participation">porcentaje de participaci&oacute;n</a> en elementos comunes, una <a href="#hasAddress">direcci&oacute;n</a>, un <a href="#hasUse">uso principal</a> del vocabulario SKOS de <a href="http://vocab.linkeddata.es/datosabiertos/def/urbanismo-infraestructuras/uso" target="_blank">usos</a>, y si est&aacute; sujeto a <a href="#hasHorizontalDivision">divisi&oacute;n horizontal</a>.</p>\n\n <p>La clase <a href="#CadastralConstruction">Construcci&oacute;n Catastral</a> representa un edificio o unidad constructiva registrada sobre un inmueble catastral. Incluye datos de superficie, uso, caracter&iacute;sticas constructivas y reformas. Hereda de GeoSPARQL Feature y est&aacute; ubicada sobre un &uacute;nico inmueble catastral. Se describe con propiedades como su <a href="#constructionYear">a&ntilde;o de construcci&oacute;n</a>, <a href="#hasUse">uso principal</a>, <a href="#floor">planta</a>, <a href="#staircase">escalera</a>, <a href="#door">puerta</a> y <a href="#supportPercentage">porcentaje de soporte</a>. Adem&aacute;s, puede haber sufrido una o m&aacute;s <a href="#hasRenovation">reformas</a>, modeladas mediante la clase <a href="#Renovation">Reforma</a>.</p>\n\n <p>Las clases <a href="#ParcelReference">Referencia de Parcela</a> y <a href="#PropertyReference">Referencia de Inmueble</a> son subclases concretas de la clase abstracta <a href="#CadastralReference">Referencia Catastral</a>. Una <a href="#ParcelReference">Referencia de Parcela</a> contiene el c&oacute;digo alfanum&eacute;rico de 7 caracteres (ej. <code>8942103VK</code>), mientras que una <a href="#PropertyReference">Referencia de Inmueble</a> combina la referencia de parcela con un identificador de inmueble y d&iacute;gito de control (ej. <code>TF8006N0001HZ</code>), seg&uacute;n el formato oficial del <a href="https://www.sedecatastro.gob.es" target="_blank">Catastro</a>.</p>\n\n <p>La clase <a href="#Renovation">Reforma</a> modela eventos de reforma de una construcci&oacute;n, incluyendo la <a href="#renovationDate">fecha</a> y el <a href="#renovationType">tipo</a> de reforma. Estas se vinculan a una <a href="#CadastralConstruction">Construcci&oacute;n Catastral</a> mediante la relaci&oacute;n <a href="#hasRenovation">tiene reforma</a>.</p>\n\n <p>A continuaci&oacute;n mostramos un ejemplo simplificado en RDF, usando la notaci&oacute;n RDF Turtle y basado en el ejemplo real de <a href="https://www.sedecatastro.gob.es" target="_blank">sedecatastro.gob.es</a> (referencia <code>8942103VK2793</code>, Calle Badajoz 348, Pozuelo de Alarc&oacute;n), que muestra la relaci&oacute;n jer&aacute;rquica entre <a href="#CadastralParcel">Parcela Catastral</a> &rarr; <a href="#CadastralProperty">Inmueble Catastral</a> &rarr; <a href="#CadastralConstruction">Construcci&oacute;n Catastral</a>.</p>\n\n <pre>\n     <textarea style="resize:none" readonly id="code1" name="code" rows="35" cols="150">\n @prefix ex: &lt;https://edint.github.io/edint-ontologia-inmuebles/examples#&gt; .\n @prefix edintcat: &lt;http://vocab.linkeddata.es/datosabiertos/def/catastro#&gt; .\n @prefix callejero: &lt;http://vocab.linkeddata.es/datosabiertos/def/urbanismo-infraestructuras/callejero#&gt; .\n @prefix edintkos-clase: &lt;http://vocab.linkeddata.es/datosabiertos/kos/edint/clase/&gt; .\n @prefix edintkos-uso: &lt;http://vocab.linkeddata.es/datosabiertos/kos/edint/uso/&gt; .\n @prefix rdfs: &lt;http://www.w3.org/2000/01/rdf-schema#&gt; .\n @prefix xsd: &lt;http://www.w3.org/2001/XMLSchema#&gt; .\n\n # ---------------------------------------------------------------------------\n # PARCELA CATASTRAL\n # ---------------------------------------------------------------------------\n\n ex:Parcela_8942103VK2793\n     a edintcat:CadastralParcel ;\n     rdfs:label "Parcela 8942103VK2793"@es ;\n     edintcat:hasParcelReference ex:Ref_Parcela ;\n     edintcat:hasCadastralProperty ex:Inmueble_0001UO ;\n     edintcat:hasClass edintkos-clase:Urban .\n\n ex:Ref_Parcela\n     a edintcat:ParcelReference ;\n     edintcat:parcelReference "8942103VK2793" .\n\n # ---------------------------------------------------------------------------\n # INMUEBLE CATASTRAL\n # ---------------------------------------------------------------------------\n\n ex:Inmueble_0001UO\n     a edintcat:CadastralProperty ;\n     rdfs:label "Inmueble 0001UO"@es ;\n     edintcat:hasPropertyReference ex:Ref_Inmueble ;\n     edintcat:onCadastralParcel ex:Parcela_8942103VK2793 ;\n     edintcat:participation "100.00"^^xsd:decimal ;\n     edintcat:hasUse edintkos-uso:Cultural ;\n     edintcat:hasClass edintkos-clase:Urban ;\n     edintcat:hasAddress ex:Portal_348B ;\n     edintcat:hasCadastralConstruction ex:Construccion_3_n2_01 .\n\n ex:Ref_Inmueble\n     a edintcat:PropertyReference ;\n     edintcat:parcelReference "8942103VK2793" ;\n     edintcat:propertyReference "0001UO" .\n\n # ---------------------------------------------------------------------------\n # CONSTRUCCI&Oacute;N CATASTRAL\n # ---------------------------------------------------------------------------\n\n ex:Construccion_3_n2_01\n     a edintcat:CadastralConstruction ;\n     rdfs:label "ALMACEN 3/-2/01"@es ;\n     edintcat:constructionYear "2012"^^xsd:gYear ;\n     edintcat:hasUse edintkos-uso:StorageParking ;\n     edintcat:onCadastralProperty ex:Inmueble_0001UO ;\n     edintcat:staircase "3" ;\n     edintcat:floor "-2" ;\n     edintcat:door "01" .\n\n # ---------------------------------------------------------------------------\n # DIRECCI&Oacute;N (vocabulario callejero)\n # ---------------------------------------------------------------------------\n\n ex:Portal_348B\n     a callejero:Portal ;\n     callejero:numero "348" ;\n     callejero:codigoPostal "28223" ;\n     callejero:municipio "POZUELO DE ALARCON" ;\n     callejero:provincia "MADRID" .\n\n     </textarea>\n </pre>\n\n <script>\n     var editor1 = CodeMirror.fromTextArea(document.getElementById("code1"), {\n         mode: "text/turtle",\n         matchBrackets: true\n     });\n\n </script>\n
