abstract-en=The purpose of this ontology is to provide a common vocabulary for representing the entities and main data related to commercial establishments in a municipality, and their licenses. It also includes commercial groupings, such as markets and shopping centers, and the outdoor seating areas (terraces) associated with the establishments.
introduction-en=\nThis ontology is part of the catalog of ontologies that is being developed in the context of the <a href="https://edint.es/" target="_blank">Data Space for Smart Urban Infrastructures (EDINT)</a>. It was also identified as a relevant ontology for the representation of data managed by local entities in the guide <a href="http://femp.femp.es/files/3580-1937-fichero/DATOS%20ABIERTOS%20FEMP%202019.pdf" target="_blank">Datos abiertos FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a>, as also described in the corresponding <a href="https://datos.gob.es/es/conocimiento/datos-abiertos-femp-2019-40-conjuntos-de-datos-publicar-por-las-entidades-locales" target="_blank">data.gob.es note</a>, and therefore included in the <a href="https://github.com/opencitydata" target="_blank">Github repository supporting the initiative</a>, which will be deprecated once this repository is launched.\nAn amplified version of the guide can be found in <a href="https://redtransparenciayparticipacion.es/wp-content/uploads/2025/03/Datos-abiertos-80-conjuntos-de-datos.pdf" target="_blank">DATOS ABIERTOS 80 CONJUNTOS DE DATOS</a>\n
description-en=\n<span class="markdown">\n\n<p>Figure 1 shows the main entities of the ontology and the relationships among them. The ontology represents, among other things, <a href="#CommercialSpace">commercial spaces</a>, their <a href="#CommercialAggregation">aggregations</a>, and their <a href="#Terrace">terraces</a>, thereby extending the set of <a href="http://vocab.linkeddata.es/datosabiertos/def/urbanismos-infraestructuras/infraestructura#InfrastructureElement">infrastructure elements</a> considered in the <a href="http://vocab.linkeddata.es/datosabiertos/def/urbanismos-infraestructuras/infraestructura#">EDINT Infrastructure Ontology</a>. <a href="#CommercialSpace">Commercial spaces</a> are places prepared for the sale of products, the provision of services, or customer service, such as shops or offices. They may <a href="#belongToCommercialAggregation">belong</a> to a <a href="#CommercialAggregation">commercial aggregation</a>, which brings several of them together in a physical location, and <a href="#hasTerrace">have</a> one or more <a href="#Terrace">terraces</a>, and they also <a href="#hasAccessType">have an access type</a>. As <a href="http://vocab.linkeddata.es/datosabiertos/def/urbanismos-infraestructuras/infraestructura#Facility">facilities</a> and, therefore, <a href="http://vocab.linkeddata.es/datosabiertos/def/urbanismos-infraestructuras/infraestructura#InfrastructureElement">infrastructure elements</a>, a commercial space, a commercial aggregation, and a terrace <a href="http://vocab.linkeddata.es/datosabiertos/def/urbanismos-infraestructuras/infraestructura#hasInfrastructureType">have an infrastructure element type</a> and a <a href="#CommercialSpace">geolocation</a>, and <a href="http://vocab.linkeddata.es/datosabiertos/def/urbanismos-infraestructuras/infraestructura#belongTo">belong to an administrative division</a> (<a href="http://vocab.linkeddata.es/datosabiertos/def/sector-publico/territorio#Municipio">municipality</a>, <a href="http://vocab.linkeddata.es/datosabiertos/def/sector-publico/territorio#Distrito">district</a>, or <a href="http://vocab.linkeddata.es/datosabiertos/def/sector-publico/territorio#Barrio">neighborhood</a>) (and a <a href="http://vocab.linkeddata.es/datosabiertos/def/common/zone#RegulatedZone">zone</a>).\n</p>\n<p><a href="#CommercialEntity">Commercial entities</a> are <a href="http://schema.org/Person">persons</a> or <a href="http://schema.org/Organization">organizations</a> that carry out or intend to carry out a commercial activity. For this purpose, they may <a href="#usesSpace">use</a> one or more <a href="#CommercialSpace">commercial spaces</a> described above.</p>\n\n<p><a href="#CommercialPermit">Commercial permits</a> <a href="#hasCommercialPermitType">have an associated type</a> and an associated <a href="#hasCommercialPermitStatus">status</a>, and <a href="#issuedTo">are issued to</a>  a <a href="#CommercialEntity">commercial entity</a> and <a href="#appliedTo">are applied to</a>  a <a href="#CommercialSpace">commercial space</a> in order to authorize a specific activity, indicated by a <a href="#hasCNAECode">CNAE code</a> and/or an <a href="hasIAECode">IAE code</a> . <a href="#CommercialPermit">Commercial permits</a> may also <a href="#appliedTo">be applied to</a>  <a href="#Terrace">terraces</a> in order to authorize a use with a specific <a href="http://schema.org/floorSize">surface area</a>, <a href="http://schema.org/maximumAttendeeCapacity">capacity</a>, <a href="#numberOfPermitedTables">number of tables</a>, and <a href="#numberOrPermitedChairs">number of chairs</a>.\n<p>NOTE: If any of the terrace data changes, it will be considered a new and different terrace.</p>\n</p>\n\n<p><center><img src="images/diagrama.png" style="width:100%;"/><figcaption>\nFigure 1. Conceptual model of the ontology.\n</figcaption></center></p> \n\n<p>Below there is an example in RDF using RDF Turtle notation. This example describes the <a href="#CommercialEntity">commercial entity</a> ENT-0001, <a href="#rdfs:label">named</a> "Cafeter&iacute;a Chamber&iacute; S.L.", which has as activities the <a href="#hasCNAECode">CNAE code</a> 563000 and the <a href="#hasIAECode">IAE code</a> 673.1, and <a href="#usesSpace">uses</a> the <a href="#CommercialSpace">commercial space</a> COM-0001. This commercial space, <a href="#rdfs:label">named</a> "Cafeter&iacute;a Chamber&iacute;", <a href="#hasCommercialSpaceStatus">is in</a> active status and <a href="#belongsToCommercialAggregation">belongs to</a> the commercial aggregation <a href="#CommercialAggregation">commercial aggregation</a> AGR-0001, <a href="#rdfs:label">named</a> "Mercado de Chamber&iacute;". Its <a href="#hasAccessType">access type</a> is interior and it <a href="#hasTerrace">has the terrace</a> TER-0001, for which <a href="#edintinf:hasInfraestructureType">its type</a>, <a href="#schema:openningHours">its opening hours</a>, <a href="#schema:floorSize">its surface area</a>, <a href="#schema:maximumAttendeeCapacity">its capacity</a>, <a href="#numberOfPermitedTables">its number of authorized tables</a>, and <a href="#numberOfPermitedTables">its number of authorized chairs</a> are detailed. Data about its location are also included: the <a href="#belongsTo">administrative division to which it belongs</a> (Trafalgar neighborhood), <a href="#schema:address">its postal code</a> (28010), and its <a href="#geosparql:asWKT">geolocation</a> (-3.700200 40.434300) through <a href="#gsp:hasGeometry">its geometry</a>.</p>\n\n<p>The <a href="#CommercialPermit">permit</a> LIC-CAF-0001, with <a href="#fileCode">file code</a> 2021/EXP/45872 and <a href="#hasCommercialPermitType">type</a> APAL, <a href="#hasCommercialPermitStatus">is</a> granted, <a href="#issuedTo">is issued</a> to the <a href="#CommercialEntity">commercial entity</a>, and <a href="#appliedTo">is applied</a> to the <a href="#CommercialSpace">commercial space</a> COM-0001, for the <a href="#hasCNAECode">CNAE code</a> 563000, and has a <a href="#schema:startDate">start date</a> of 2021-05-14T00:00:00. The <a href="#CommercialPermit">permit</a> <a href="#appliedTo">is applied</a> to the <a href="#Terrace">terrace</a> TER-0001.\n</p>\n\n<pre><textarea style="resize:none" readonly id="code_d581" name="code" rows="25" cols="100">\n@prefix comp: &lt;http://semweb.mmlab.be/ns/rml-compression#&gt; .\n@prefix d2rq: &lt;http://www.wiwiss.fu-berlin.de/suhl/bizer/D2RQ/0.1#&gt; .\n@prefix dcterms: &lt;http://purl.org/dc/terms/&gt; .\n@prefix edintcom: &lt;http://vocab.linkeddata.es/datosabiertos/def/comercio/censo-locales#&gt; .\n@prefix edintinf: &lt;http://vocab.linkeddata.es/datosabiertos/def/urbanismos-infraestructuras/infraestructura#&gt; .\n@prefix edintkoacctype: &lt;http://vocab.linkeddata.es/datosabiertos/kos/edint/AccesType/&gt; .\n@prefix edintkoscomespsit: &lt;http://vocab.linkeddata.es/datosabiertos/kos/edint/CommercialSpaceStatus/&gt; .\n@prefix edintkosinf: &lt;http://vocab.linkeddata.es/datosabiertos/kos/edint/InfrastructureType/&gt; .\n@prefix edintterper: &lt;http://vocab.linkeddata.es/datosabiertos/kos/edint/TerracePeriod/&gt; .\n@prefix esdir: &lt;http://vocab.linkeddata.es/datosabiertos/def/urbanismo-infraestructuras/direccion-postal#&gt; .\n@prefix ex: &lt;https://example.org/id/&gt; .\n@prefix fnml: &lt;http://semweb.mmlab.be/ns/fnml#&gt; .\n@prefix foaf: &lt;http://xmlns.com/foaf/0.1/&gt; .\n@prefix formats: &lt;http://www.w3.org/ns/formats/&gt; .\n@prefix geosparql: &lt;http://www.opengis.net/ont/geosparql#&gt; .\n@prefix grel: &lt;http://users.ugent.be/~bjdmeest/function/grel.ttl#&gt; .\n@prefix ql: &lt;http://semweb.mmlab.be/ns/ql#&gt; .\n@prefix rdf: &lt;http://www.w3.org/1999/02/22-rdf-syntax-ns#&gt; .\n@prefix rdfs: &lt;http://www.w3.org/2000/01/rdf-schema#&gt; .\n@prefix rml: &lt;http://semweb.mmlab.be/ns/rml#&gt; .\n@prefix rr: &lt;http://www.w3.org/ns/r2rml#&gt; .\n@prefix schema: &lt;http://schema.org/&gt; .\n@prefix tejcom: &lt;http://vocab.ciudadesabiertas.es/def/comercio/tejido-comercial#&gt; .\n@prefix void: &lt;http://rdfs.org/ns/void#&gt; .\n@prefix xsd: &lt;http://www.w3.org/2001/XMLSchema#&gt; .\n\n&lt;http://vocab.linkeddata.es/datosabiertos/recurso/agrupacionComercial/AGR-0001&gt; a\n    edintcom:CommercialAggregation;\n  dcterms:identifier "AGR-0001";\n  rdfs:comment "Mercado tradicional de Madrid, con origen en 1876 y reinaugurado en 1943 tras una reforma. Tiene accesos por Alonso Cano, García de Paredes y Viriato, y combina puestos de alimentación, restauración y comercio especializado.";\n  rdfs:label "Mercado de Chamberí" .\n\n&lt;http://vocab.linkeddata.es/datosabiertos/recurso/direccion-postal/28010&gt; a esdir:DireccionPostal;\n  schema:postalCode "28010";\n  rdfs:label "28010" .\n\n&lt;http://vocab.linkeddata.es/datosabiertos/recurso/entidad-comercial/ENT-0001&gt; a edintcom:CommercialEntity;\n  dcterms:identifier "ENT-0001";\n  schema:legalName "Cafetería Chamberí S.L.";\n  schema:url "https://mercadodechamberi.es";\n  edintcom:hasCNAECode &lt;http://lod.ine.es/kos/cnae/CNAE-2025/6/563000&gt;;\n  edintcom:hasIAECode &lt;http://vocab.linkeddata.es/datosabiertos/kos/edint/iae/3/673.1&gt;;\n  edintcom:usesSpace &lt;http://vocab.linkeddata.es/datosabiertos/recurso/espacio-comercial/COM-0001&gt;;\n  rdfs:label "Cafetería Chamberí S.L." .\n\n&lt;http://vocab.linkeddata.es/datosabiertos/recurso/espacio-comercial/COM-0001&gt; a edintcom:CommercialSpace;\n  dcterms:identifier "COM-0001";\n  edintcom:belongsToCommercialAggregation &lt;http://vocab.linkeddata.es/datosabiertos/recurso/agrupacionComercial/AGR-0001&gt;;\n  edintcom:hasAccessType edintkosacctype:Indoor;\n  edintcom:hasCommercialSpaceStatus edintkoscomespsit:Active;\n  edintcom:hasTerrace &lt;http://vocab.linkeddata.es/datosabiertos/recurso/terraza/TER-0001&gt;;\n  rdfs:label "Cafetería Chamberí" .\n\n&lt;http://vocab.linkeddata.es/datosabiertos/recurso/terraza/TER-0001&gt; a edintcom:Terrace;\n  dcterms:identifier "TER-0001";\n  schema:address &lt;http://vocab.linkeddata.es/datosabiertos/recurso/direccion-postal/28010&gt;;\n  schema:floorSize "14.5";\n  schema:maximumAttendeeCapacity 18;\n  schema:openingHours "Tu-Sa 12:30-16:30; Tu-Sa 19:00-00:00; Su 12:30-16:30";\n  edintcom:hasTerracePeriod edintterper:anual;\n  edintcom:numberOfPermitedTables 6;\n  edintcom:numberOfPermitedChairs 18;\n  edintinf:belongsTo &lt;http://vocab.linkeddata.es/datosabiertos/recurso/sector-publico/territorio/barrio/TRAFALGAR&gt;;\n  edintinf:hasInfrastructureType edintkosinf:Terrace;\n  geosparql:hasGeometry &lt;http://vocab.linkeddata.es/datosabiertos/recurso/terraza/geometry/TER-0001&gt;;\n  rdfs:comment "Zona de degustación vinculada a cafetería-pastelería dentro del Mercado de Chamberí, orientada a consumo en horario diurno y de restauración.";\n  rdfs:label "Terraza Cafetería Chamberí" .\n\n&lt;http://vocab.linkeddata.es/datosabiertos/recurso/terraza/geometry/TER-0001&gt; geosparql:asWKT\n    "POINT (-3.700200 40.434300)"^^geosparql:wktLiteral .\n\n&lt;http://vocab.linkeddata.es/datosabiertos/recurso/licencia/LIC-CAF-0001&gt; a edintcom:Permit ;\n  dcterms:identifier "LIC-CAF-0001" ;\n  rdfs:label "Licencia de actividad Cafetería Chamberí" ;\n  edintcom:fileCode "2021/EXP/45872" ;\n  edintcom:issuedTo &lt;http://vocab.linkeddata.es/datosabiertos/recurso/entidad-comercial/ENT-0001&gt; ;\n  edintcom:appliedTo &lt;http://vocab.linkeddata.es/datosabiertos/recurso/espacio-comercial/COM-0001&gt; ;\n  edintcom:hasCommercialPermitType http://vocab.linkeddata.es/datosabiertos/kos/edint/CommercialPermitType/APAL ;\n  edintcom:hasCommercialPermitStatus http://vocab.linkeddata.es/datosabiertos/kos/edint/CommercialPermitStatus/Granted ;\n  edintcom:hasCNAECode &lt;http://lod.ine.es/kos/cnae/CNAE-2025/6/563000&gt; ;\n  edintcom:hasIAECode &lt;http://vocab.linkeddata.es/datosabiertos/kos/edint/iae/3/673.1&gt; ;\n  schema:startDate "2021-05-14T00:00:00"^^xsd:dateTime .\n\n&lt;http://vocab.linkeddata.es/datosabiertos/recurso/licencia/LIC-TER-0001&gt; a edintcom:Permit ;\n  dcterms:identifier "LIC-TER-0001" ;\n  rdfs:label "Autorización de terraza Cafetería Chamberí" ;\n  edintcom:fileCode "2024/VEL/10328" ;\n  edintcom:appliedTo &lt;http://vocab.linkeddata.es/datosabiertos/recurso/terraza/TER-0001&gt; ;\n  edintcom:hasCommercialPermitType http://vocab.linkeddata.es/datosabiertos/kos/edint/CommercialPermitType/APAL ;\n  edintcom:hasCommercialPermitStatus http://vocab.linkeddata.es/datosabiertos/kos/edint/CommercialPermitStatus/Granted ;\n  schema:startDate "2024-03-01T00:00:00"^^xsd:dateTime ;\n  schema:endDate "2026-12-31T23:59:59"^^xsd:dateTime .\n\n</textarea></pre>\n<script>\n    var editor_d581 = CodeMirror.fromTextArea(document.getElementById("code_d581"), {\n        mode: "text/turtle",\n        matchBrackets: true\n    });\n</script>\n</span>\n
references-en=<span class="markdown">\n<ul>\n    <li><a href="https://edint.es/en/" target="_blank">Data Spaces for Smart Urban Infrastructures (EDINT)</a></li>\n    <li><a href="http://femp.femp.es/files/3580-1937-fichero/DATOS%20ABIERTOS%20FEMP%202019.pdf" target="_blank">Guía Datos abiertos FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a></li>\n    <li><a href="https://datos.gob.es/es/conocimiento/datos-abiertos-femp-2019-40-conjuntos-de-datos-publicar-por-las-entidades-locales" target="_blank">DATOS ABIERTOS FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a> (source: datos.gob.es)</li>\n    <li><a href="https://redtransparenciayparticipacion.es/wp-content/uploads/2025/03/Datos-abiertos-80-conjuntos-de-datos.pdf" target="_blank">DATOS ABIERTOS 80 CONJUNTOS DE DATOS</a></li>\n</ul>\n</span>\n
abstract-es=El propósito de esta ontología es proporcionar un vocabulario común para la representación de las entidades y los datos principales relacionados con los establecimientos comerciales de un municipio, y sus licencias. También incluye las agrupaciones comerciales, como mercados y centros comerciales, y las terrazas asociadas a los establecimientos.
introduction-es=Esta ontología forma parte del catálogo de ontologías que está siendo desarrollado en el contexto del <a href="https://edint.es/" target="_blank">Espacio de Datos para las Infraestructuras Urbanas Inteligentes (EDINT)</a>. Asimismo, fue identificada como una ontología relevante para la representación de datos gestionados por entidades locales en la guía <a href="http://femp.femp.es/files/3580-1937-fichero/DATOS%20ABIERTOS%20FEMP%202019.pdf" target="_blank">Datos abiertos FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a>, tal y como se describe también en la correspondiente <a href="https://datos.gob.es/es/conocimiento/datos-abiertos-femp-2019-40-conjuntos-de-datos-publicar-por-las-entidades-locales" target="_blank">nota de datos.gob.es</a>, y por tanto recogido en el <a href="https://github.com/opencitydata" target="_blank">repositorio Github de apoyo a la iniciativa</a>, que queda deprecado una vez se lance este repositorio.\nUna versión amplificada de la guía se encuentra en <a href="https://redtransparenciayparticipacion.es/wp-content/uploads/2025/03/Datos-abiertos-80-conjuntos-de-datos.pdf" target="_blank">DATOS ABIERTOS 80 CONJUNTOS DE DATOS</a>\n
description-es=\n<span class="markdown">\n\n<p>La Figura 1 muestra las principales entidades de la ontolog&iacute;a y las relaciones entre ellas. La ontolog&iacute;a representa, entre otras cosas, los <a href="#CommercialSpace">espacios comerciales</a>, sus <a href="#CommercialAggregation">agrupaciones</a> y sus <a href="#Terrace">terrazas</a>, ampliando as&iacute; el conjunto de <a href="http://vocab.linkeddata.es/datosabiertos/def/urbanismos-infraestructuras/infraestructura#InfrastructureElement">elementos de infraestructura</a> contemplados en la <a href="http://vocab.linkeddata.es/datosabiertos/def/urbanismos-infraestructuras/infraestructura#">Ontolog&iacute;a EDINT de Infraestructura</a>. Los <a href="#CommercialSpace">espacios comerciales</a> son lugares preparados para la venta de productos, prestaci&oacute;n de servicios o atenci&oacute;n al cliente, tales como tiendas, locales u oficinas. Pueden <a href="#belongToCommercialAggregation">pertenecer</a> a una <a href="#CommercialAggregation">agrupaci&oacute;n comercial</a>, que integra varios de ellos en un lugar f&iacute;sico y <a href="#hasTerrace">tener</a> una o varias <a href="#Terrace">terrazas</a>, y tambi&eacute;n <a href="#hasAccessType">tienen un tipo de acceso</a>. Como <a href="http://vocab.linkeddata.es/datosabiertos/def/urbanismos-infraestructuras/infraestructura#Facility">equipamiento</a> y, por tanto, <a href="http://vocab.linkeddata.es/datosabiertos/def/urbanismos-infraestructuras/infraestructura#InfrastructureElement">elemento de infraestructura</a>, un espacio comercial, una grupaci&oacute;n comercial y una terraza <a href="http://vocab.linkeddata.es/datosabiertos/def/urbanismos-infraestructuras/infraestructura#hasInfrastructureType">tienen un tipo de elemento de infraestructura</a> y una <a href="#CommercialSpace">geolocalizaci&oacute;n</a>, y <a href="http://vocab.linkeddata.es/datosabiertos/def/urbanismos-infraestructuras/infraestructura#belongTo">pertenecen a una divisi&oacute;n administrativa (<a href="http://vocab.linkeddata.es/datosabiertos/def/sector-publico/territorio#Municipio">municipio</a>, <a href=<"http://vocab.linkeddata.es/datosabiertos/def/sector-publico/territorio#Distrito">distrito</a> o <a href=<"http://vocab.linkeddata.es/datosabiertos/def/sector-publico/territorio#Barrio">barrio</a>) (y una <a href="http://vocab.linkeddata.es/datosabiertos/def/common/zone#RegulatedZone">zona</a>).\n</p>\n<p>Las <a href="#CommercialEntity">entidades comerciales</a> son <a href="http://schema.org/Person">personas</a> u <a href="http://schema.org/Organization">organizaciones</a> que ejercen o quieren ejercer una actividad comercial. Para ello pueden <a href="#usesSpace">usar</a> uno o m&aacute;s <a href="#CommercialSpace">espacios comerciales</a> descritos anteriormente.</p>\n<p>Las <a href="#CommercialPermit">licencias comerciales</a> <a href="#hasCommercialPermitType">tienen un tipo</a>  y un <a href="#hasCommercialPermitStatus">estado </a>asociados y <a href="#issuedTo">se emiten</a> a una <a href="#CommercialEntity">entidad comercial</a> y <a href="#appliedTo">se aplican</a> a un <a href="#CommercialSpace">espacio comercial</a> para autorizar una actividad concreta, indicada mediante un <a href="#hasCNAECode">c&oacute;digo CNAE</a> y/o uno <a href="hasIAECode">IAE</a>, Las <a href="#CommercialPermit">licencias comerciales</a> tambi&eacute;n pueden <a href="#appliedTo">aplicarse</a> a <a href="#Terrace">terrazas</a> para autorizar un uso con una <a href="http://schema.org/floorSize">superficie</a>, <a href="http://schema.org/maximumAttendeeCapacity">aforo</a>, <a href="#numberOfPermitedTables">n&uacute;mero de mesas</a> y <a href="#numberOrPermitedChairs">de sillas</a> concretos.\n<p>NOTA: Si alguno de los datos de la terraza cambia, se considerará una terraza nueva y distinta.</p>\n</p>\n\n<p><center><img src="images/diagrama.png" style="width:100%;"/><figcaption>\nFigura 1. Modelo conceptual de la ontolog&iacute;a.</figcaption></center></p> \n\n<p>A continuaci&oacute;n se muestra un ejemplo en RDF usando la notaci&oacute;n RDF Turtle. Este ejemplo describe la <a href="#CommercialEntity">entidad comercial</a> ENT-0001, <a href="#rdfs:label">llamada</a> "Cafeter&iacute;a Chamber&iacute; S.L.", que tiene como actividades <a href="#hasCNAECode">el c&oacute;digo CNAE</a> 563000 y <a href="#hasIAECode">el c&oacute;digo IAE</a> 673.1, y <a href="#usesSpace">usa</a> el <a href="#CommercialSpace">espacio comercial</a> COM-0001. Este espacio comercial, <a href="#rdfs:label">llamado</a> "Cafeter&iacute;a Chamber&iacute;", <a href="#hasCommercialSpaceStatus">est&aacute; en situaci&oacute;n</a> activa y <a href="#belongsToCommercialAggregation">pertenece a la agrupaci&oacute;n comercial la <a href="#CommercialAggregation">agrupaci&oacute;n comercial</a> AGR-0001, <a href="#rdfs:label">llamada</a> "Mercado de Chamber&iacute;". Su <a href="#hasAccessType">tipo de acceso</a> es interior y <a href="#hasTerrace">tiene la terraza</a> TER-0001, para la que se detallan <a href="#edintinf:hasInfraestructureType">su tipo</a>, <a href="#schema:openningHours">su horario</a>, <a href="#schema:floorSize">su superficie</a>, <a href="#schema:maximumAttendeeCapacity">su aforo</a>, <a href="#numberOfPermitedTables">su n&uacute;mero de mesas autorizas</a> y <a href="#numberOfPermitedTables">su n&uacute;mero de sillas autorizadas</a>. Tambi&eacute;n se incluyen datos de su localizaci&oacute;n: <a href="#belongsTo">divisi&oacute;n administrativa a la que pertenece</a> (barrio de Trafalgar), <a href="#schema:address">su c&oacute;digo postal</a> (28010) y su <a href="#geosparql:asWKT">geolocalizaci&oacute;n</a> (-3.700200 40.434300) a trav&eacute;s de <a href="#gsp:hasGeometry">su geometr&iacute;a</a>.</p>\n\n<p> La <a href="#CommercialPermit">licencia</a> LIC-CAF-0001, con <a href="#fileCode">código de expediente</a> 2021/EXP/45872 y <a href="#hasCommercialPermitType">con tipo</a> APAL, <a href="#hasCommercialPermitStatus">est&aacute</a> concedida, <a href="#issuedTo">est&aacute emitida</a> a la <a href="#CommercialEntity">entidad comercial</a> y <a href="#appliedTo">se aplica</a> para el <a href="#CommercialSpace">espacio comercial</a> COM-0001, para el <a href="#hasCNAECode">c&oacute;digo CNAE</a>563000, y tiene como <a href="#schema:startDate">fecha de inicio</a> 2021-05-14T00:00:00. La <a href="#CommercialPermit">licencia</a> <a href="#appliedTo">se aplica</a> a la <a href="#Terrace">terraza</a> TER-0001.\n</p>\n\n<pre><textarea style="resize:none" readonly id="code_d581" name="code" rows="25" cols="100">\n@prefix comp: &lt;http://semweb.mmlab.be/ns/rml-compression#&gt; .\n@prefix d2rq: &lt;http://www.wiwiss.fu-berlin.de/suhl/bizer/D2RQ/0.1#&gt; .\n@prefix dcterms: &lt;http://purl.org/dc/terms/&gt; .\n@prefix edintcom: &lt;http://vocab.linkeddata.es/datosabiertos/def/comercio/censo-locales#&gt; .\n@prefix edintinf: &lt;http://vocab.linkeddata.es/datosabiertos/def/urbanismos-infraestructuras/infraestructura#&gt; .\n@prefix edintkoacctype: &lt;http://vocab.linkeddata.es/datosabiertos/kos/edint/AccesType/&gt; .\n@prefix edintkoscomespsit: &lt;http://vocab.linkeddata.es/datosabiertos/kos/edint/CommercialSpaceStatus/&gt; .\n@prefix edintkosinf: &lt;http://vocab.linkeddata.es/datosabiertos/kos/edint/InfrastructureType/&gt; .\n@prefix edintterper: &lt;http://vocab.linkeddata.es/datosabiertos/kos/edint/TerracePeriod/&gt; .\n@prefix esdir: &lt;http://vocab.linkeddata.es/datosabiertos/def/urbanismo-infraestructuras/direccion-postal#&gt; .\n@prefix ex: &lt;https://example.org/id/&gt; .\n@prefix fnml: &lt;http://semweb.mmlab.be/ns/fnml#&gt; .\n@prefix foaf: &lt;http://xmlns.com/foaf/0.1/&gt; .\n@prefix formats: &lt;http://www.w3.org/ns/formats/&gt; .\n@prefix geosparql: &lt;http://www.opengis.net/ont/geosparql#&gt; .\n@prefix grel: &lt;http://users.ugent.be/~bjdmeest/function/grel.ttl#&gt; .\n@prefix ql: &lt;http://semweb.mmlab.be/ns/ql#&gt; .\n@prefix rdf: &lt;http://www.w3.org/1999/02/22-rdf-syntax-ns#&gt; .\n@prefix rdfs: &lt;http://www.w3.org/2000/01/rdf-schema#&gt; .\n@prefix rml: &lt;http://semweb.mmlab.be/ns/rml#&gt; .\n@prefix rr: &lt;http://www.w3.org/ns/r2rml#&gt; .\n@prefix schema: &lt;http://schema.org/&gt; .\n@prefix tejcom: &lt;http://vocab.ciudadesabiertas.es/def/comercio/tejido-comercial#&gt; .\n@prefix void: &lt;http://rdfs.org/ns/void#&gt; .\n@prefix xsd: &lt;http://www.w3.org/2001/XMLSchema#&gt; .\n\n&lt;http://vocab.linkeddata.es/datosabiertos/recurso/agrupacionComercial/AGR-0001&gt; a\n    edintcom:CommercialAggregation;\n  dcterms:identifier "AGR-0001";\n  rdfs:comment "Mercado tradicional de Madrid, con origen en 1876 y reinaugurado en 1943 tras una reforma. Tiene accesos por Alonso Cano, García de Paredes y Viriato, y combina puestos de alimentación, restauración y comercio especializado.";\n  rdfs:label "Mercado de Chamberí" .\n\n&lt;http://vocab.linkeddata.es/datosabiertos/recurso/direccion-postal/28010&gt; a esdir:DireccionPostal;\n  schema:postalCode "28010";\n  rdfs:label "28010" .\n\n&lt;http://vocab.linkeddata.es/datosabiertos/recurso/entidad-comercial/ENT-0001&gt; a edintcom:CommercialEntity;\n  dcterms:identifier "ENT-0001";\n  schema:legalName "Cafetería Chamberí S.L.";\n  schema:url "https://mercadodechamberi.es";\n  edintcom:hasCNAECode &lt;http://lod.ine.es/kos/cnae/CNAE-2025/6/563000&gt;;\n  edintcom:hasIAECode &lt;http://vocab.linkeddata.es/datosabiertos/kos/edint/iae/3/673.1&gt;;\n  edintcom:usesSpace &lt;http://vocab.linkeddata.es/datosabiertos/recurso/espacio-comercial/COM-0001&gt;;\n  rdfs:label "Cafetería Chamberí S.L." .\n\n&lt;http://vocab.linkeddata.es/datosabiertos/recurso/espacio-comercial/COM-0001&gt; a edintcom:CommercialSpace;\n  dcterms:identifier "COM-0001";\n  edintcom:belongsToCommercialAggregation &lt;http://vocab.linkeddata.es/datosabiertos/recurso/agrupacionComercial/AGR-0001&gt;;\n  edintcom:hasAccessType edintkosacctype:Indoor;\n  edintcom:hasCommercialSpaceStatus edintkoscomespsit:Active;\n  edintcom:hasTerrace &lt;http://vocab.linkeddata.es/datosabiertos/recurso/terraza/TER-0001&gt;;\n  rdfs:label "Cafetería Chamberí" .\n\n&lt;http://vocab.linkeddata.es/datosabiertos/recurso/terraza/TER-0001&gt; a edintcom:Terrace;\n  dcterms:identifier "TER-0001";\n  schema:address &lt;http://vocab.linkeddata.es/datosabiertos/recurso/direccion-postal/28010&gt;;\n  schema:floorSize "14.5";\n  schema:maximumAttendeeCapacity 18;\n  schema:openingHours "Tu-Sa 12:30-16:30; Tu-Sa 19:00-00:00; Su 12:30-16:30";\n  edintcom:hasTerracePeriod edintterper:anual;\n  edintcom:numberOfPermitedTables 6;\n  edintcom:numberOfPermitedChairs 18;\n  edintinf:belongsTo &lt;http://vocab.linkeddata.es/datosabiertos/recurso/sector-publico/territorio/barrio/TRAFALGAR&gt;;\n  edintinf:hasInfrastructureType edintkosinf:Terrace;\n  geosparql:hasGeometry &lt;http://vocab.linkeddata.es/datosabiertos/recurso/terraza/geometry/TER-0001&gt;;\n  rdfs:comment "Zona de degustación vinculada a cafetería-pastelería dentro del Mercado de Chamberí, orientada a consumo en horario diurno y de restauración.";\n  rdfs:label "Terraza Cafetería Chamberí" .\n\n&lt;http://vocab.linkeddata.es/datosabiertos/recurso/terraza/geometry/TER-0001&gt; geosparql:asWKT\n    "POINT (-3.700200 40.434300)"^^geosparql:wktLiteral .\n\n&lt;http://vocab.linkeddata.es/datosabiertos/recurso/licencia/LIC-CAF-0001&gt; a edintcom:Permit ;\n  dcterms:identifier "LIC-CAF-0001" ;\n  rdfs:label "Licencia de actividad Cafetería Chamberí" ;\n  edintcom:fileCode "2021/EXP/45872" ;\n  edintcom:issuedTo &lt;http://vocab.linkeddata.es/datosabiertos/recurso/entidad-comercial/ENT-0001&gt; ;\n  edintcom:appliedTo &lt;http://vocab.linkeddata.es/datosabiertos/recurso/espacio-comercial/COM-0001&gt; ;\n  edintcom:hasCommercialPermitType http://vocab.linkeddata.es/datosabiertos/kos/edint/CommercialPermitType/APAL ;\n  edintcom:hasCommercialPermitStatus http://vocab.linkeddata.es/datosabiertos/kos/edint/CommercialPermitStatus/Granted ;\n  edintcom:hasCNAECode &lt;http://lod.ine.es/kos/cnae/CNAE-2025/6/563000&gt; ;\n  edintcom:hasIAECode &lt;http://vocab.linkeddata.es/datosabiertos/kos/edint/iae/3/673.1&gt; ;\n  schema:startDate "2021-05-14T00:00:00"^^xsd:dateTime .\n\n&lt;http://vocab.linkeddata.es/datosabiertos/recurso/licencia/LIC-TER-0001&gt; a edintcom:Permit ;\n  dcterms:identifier "LIC-TER-0001" ;\n  rdfs:label "Autorización de terraza Cafetería Chamberí" ;\n  edintcom:fileCode "2024/VEL/10328" ;\n  edintcom:appliedTo &lt;http://vocab.linkeddata.es/datosabiertos/recurso/terraza/TER-0001&gt; ;\n  edintcom:hasCommercialPermitType http://vocab.linkeddata.es/datosabiertos/kos/edint/CommercialPermitType/APAL ;\n  edintcom:hasCommercialPermitStatus http://vocab.linkeddata.es/datosabiertos/kos/edint/CommercialPermitStatus/Granted ;\n  schema:startDate "2024-03-01T00:00:00"^^xsd:dateTime ;\n  schema:endDate "2026-12-31T23:59:59"^^xsd:dateTime .\n\n</textarea></pre>\n<script>\n    var editor_d581 = CodeMirror.fromTextArea(document.getElementById("code_d581"), {\n        mode: "text/turtle",\n        matchBrackets: true\n    });\n</script>\n</span>\n
