abstract-en=The purpose of this ontology is to provide a common vocabulary for representing the key entities and data associated with vehicle registration or vehicle census records. Its scope is limited to data used for local government functions such as tax collection and mobility management (e.g., parking permits, access permits for specific zones). Aspects such as vehicle registration certificates and technical inspection records fall outside the scope of this ontology, though they could be addressed through future extensions or updates if deemed relevant.
introduction-en=\nThis ontology is part of the catalog of ontologies that is being developed in the context of the <a href="https://edint.es/" target="_blank">Data Space for Smart Urban Infrastructures (EDINT)</a>. It was also identified as a relevant ontology for the representation of data managed by local entities in the guide <a href="http://femp.femp.es/files/3580-1937-fichero/DATOS%20ABIERTOS%20FEMP%202019.pdf" target="_blank">Datos abiertos FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a>, as also described in the corresponding <a href="https://datos.gob.es/es/conocimiento/datos-abiertos-femp-2019-40-conjuntos-de-datos-publicar-por-las-entidades-locales" target="_blank">data.gob.es note</a>, and therefore included in the <a href="https://github.com/opencitydata" target="_blank">Github repository supporting the initiative</a>, which will be deprecated once this repository is launched.\nAn amplified version of the guide can be found in <a href="https://redtransparenciayparticipacion.es/wp-content/uploads/2025/03/Datos-abiertos-80-conjuntos-de-datos.pdf" target="_blank">DATOS ABIERTOS 80 CONJUNTOS DE DATOS</a>\n
description-en=<span class="markdown">\n\n<p>As shown in Figure 1, there are two main concepts in this ontology: <a href="#Vehicle">Vehicle</a> and <a href="#Permit">Permit</a></p>\n    \n<p><center><img src="images/diagram.png" style="width:100%;"/><figcaption>\nFigure 1. Main conceptual model of the ontology</figcaption></center></p> \n    \n<p>The class <a href="#Vehicle">Vehicle</a> represents all the vehicles that may be registered in the vehicle census/registry of the municipality, with the purpose of allowing the municipality to take care of the corresponding taxes as well as to allow controlling accesses to specific areas of the city, including low emission zones and parking areas and facilities. This class is considered equivalent to the one with the same name in the <a href="https://saref.etsi.org/saref4auto/">SAREF4Auto ontology</a></p>\n    \n<p>Apart from the data properties that may be used to describe vehicles, and which will be evolving according the use cases in which this ontology will be used in the future, there are three object properties that characterise vehicles from the point of view of whether they will be allowed to enter and/or park in specific areas. These are: <a href="#vehicleType">vehicle type</a>, <a href="#propulsionType">propulsion type</a> and <a href="#environmentalBadge">environmental badge</a>. These three properties have as a range their corresponding SKOS concept scheme: <a href="#https://edint.es/kos/VehicleType">Vehicle Type</a>, <a href="#https://edint.es/kos/VehiclePropulsionType">Propulsion Type</a> and <a href="#https://edint.es/kos/VehicleEnvironmentalBadge">Environmental Badge</a>, respectively.</p>\n    \n<p>Similarly, the class <a href="#Permit">Permit</a> represents all the permits that a vehicle may have, associated to a <a href="#Vehicle">Vehicle</a> via the object property <a href="#authorisesVehicle">authorises vehicle</a>,   to transit through a street segment or area of the municipality (represented with the object properties <a href="#authorisesInSegment">authorises in segment</a> and <a href="#authorisesInArea">authorises in area</a>, respectively. The ranges of these properties belong to other ontologies in this ontology ecosystem, used to represent traffic and municipality areas.</p>\n\n<p>The permits are also described using three object properties (<a href="#permitType">permit type</a>, <a href="#permitStatus">permit status</a> and <a href="#permitPeriodicity">permit periodicity</a>), which are connected to their corresponding SKOS concept schemes (<a href="#https://edint.es/kos/VehiclePermitType">Permit Type</a>, <a href="#https://edint.es/kos/VehiclePermitStatus">Permit Status</a> and <a href="#https://edint.es/kos/VehiclePermitPeriodicity">Permit Periodicity</a>).</p>\n    \n<p>Finally, Permits and Vehicles may be owned by a Person or Organisation. Following the general guidelines used in the EDINT ontology network, these two general concepts are represented using schema.org classes, and the union of these two classes is currently named <a href="#Owner">Owner</a>, although this term may change in the future to something more general like Agent.</p>\n    \n<p>Next we show an example in RDF, using the RDF Turtle notation, that describes a <a href="#Vehicle">Vehicle</a> (a diesel van, with an environmental badge B), with an annual <a href="#Permit">Permit</a> that belongs to a company, and which allows it to enter in the low emissions zone of the city of Salamanca.</p>\n\n<pre><textarea style="resize:none" readonly id="code1" name="code" rows="50" cols="100">\n@prefix edintveh: &lt;https://edint.es/def/censovehiculos#&gt; .\n@prefix edintvehiclepermittype: &lt;https://edint.es/kos/VehiclePermitType/&gt; .\n@prefix edintvehiclepermitstatus: &lt;https://edint.es/kos/VehiclePermitStatus/&gt; .\n@prefix edintvehiclepermitperiodicity: &lt;https://edint.es/kos/VehiclePermitPeriodicity/&gt; .\n@prefix edintvehicletype: &lt;https://edint.es/kos/VehicleType/&gt; .\n@prefix edintvehiclepropulsionType: &lt;https://edint.es/kos/VehiclePropulsionType/&gt; .\n@prefix edintvehicleenvironmentalbadge: &lt;https://edint.es/kos/VehicleEnvironmentalBadge/&gt; .\n@prefix edintzona: &lt;https://edint.es/def/zone#&gt;\n@prefix dct: &lt;http://purl.org/dc/terms/&gt; .\n@prefix rdfs: &lt;http://www.w3.org/2000/01/rdf-schema#&gt; .\n\n\n&lt;https://example.org/recurso/autorizacion/Permit1&gt; a edintveh:Permit ;\n  dct:identifier "Permit1" ;\n  rdfs:label "Permit for Vehicle 2" ;\n  edintveh:permitType edintvehiclepermittype:CommercialIndustrial ;\n  edintveh:permitStatus edintvehiclepermitstatus:Active ;\n  edintveh:permitPeriodicity edintvehiclepermitperiodicity:Annual ;\n  edintveh:authorisesInArea &lt;https://example.org/recurso/ZBESalamanca ;\n  edintveh:authorisesVehicle &lt;https://example.org/recurso/Vehicle2 ;\n  edintveh:permitOwner &lt;https://example.org/recurso/Company3 .\n\n&lt;https://example.org/recurso/vehicle/Vehicle2&gt; a edintveh:Vehicle ;\n  dct:identifier "1234ABC" ;\n  rdfs:label "Permit for Vehicle with plate 1234ABC" ;\n  edintveh:vehicleType edintvehicletype:Van ;\n  edintveh:propulsionType edintvehiclepropulsiontype:Diesel ;\n  edintveh:environmentalBadge edintvehicleenvironmentalbadge:B ;\n  edintveh:registeredOwner &lt;https://example.org/recurso/Company3 .\n\n&lt;https://example.org/recurso/zona-de-bajas-emisiones/ZBESalamanca&gt; a edintzona:LowEmissionsZone :\n  dct:identifier "ZBESalamanca" ;\n  rdfs:label "Zona de bajas emisiones de Salamanca" .\n  \n&lt;https://example.org/recurso/organization/Company3&gt a schema:Organization ;\n  dct:identifier "Company3" ;\n  rdfs:label "Example, Inc." .\n\n</textarea></pre>\n    <script>\n      var editor1 = CodeMirror.fromTextArea(document.getElementById("code1"), {\n        mode: "text/turtle",\n        matchBrackets: true\n      });\n </script>\n \n\n</span>\n\n
references-en=<span class="markdown">\n<ul>\n    <li><a href="https://edint.es/en/" target="_blank">Data Spaces for Smart Urban Infrastructures (EDINT)</a></li>\n    <li><a href="http://femp.femp.es/files/3580-1937-fichero/DATOS%20ABIERTOS%20FEMP%202019.pdf" target="_blank">Guía Datos abiertos FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a></li>\n    <li><a href="https://datos.gob.es/es/conocimiento/datos-abiertos-femp-2019-40-conjuntos-de-datos-publicar-por-las-entidades-locales" target="_blank">DATOS ABIERTOS FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a> (source: datos.gob.es)</li>\n    <li><a href="https://redtransparenciayparticipacion.es/wp-content/uploads/2025/03/Datos-abiertos-80-conjuntos-de-datos.pdf" target="_blank">DATOS ABIERTOS 80 CONJUNTOS DE DATOS</a></li>\n</ul>\n</span>\n
abstract-es=El propósito de esta ontología es el de proporcionar un vocabulario común para la representación de las entidades y datos principales del censo o registro de vehículos. Su alcance se limita a los datos que pueden ser utilizados con los propósitos de cobro de impuestos por parte de las entidades locales o de gestión de la movilidad (permisos de aparcamiento, permisos de acceso a zonas específicas, etc.), que son parte de las funciones habituales de las entidades locales. Quedan fuera del alcance de la ontología otros aspectos relacionados con los vehículos, como pueden ser los datos de sus permisos de circulación, inspecciones técnicas, etc., que podrían ser objeto de una extensión de esta ontología o de su evolución en el futuro, si se considera relevante.
introduction-es=Esta ontología forma parte del catálogo de ontologías que está siendo desarrollado en el contexto del <a href="https://edint.es/" target="_blank">Espacio de Datos para las Infraestructuras Urbanas Inteligentes (EDINT)</a>. Asimismo, fue identificada como una ontología relevante para la representación de datos gestionados por entidades locales en la guía <a href="http://femp.femp.es/files/3580-1937-fichero/DATOS%20ABIERTOS%20FEMP%202019.pdf" target="_blank">Datos abiertos FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a>, tal y como se describe también en la correspondiente <a href="https://datos.gob.es/es/conocimiento/datos-abiertos-femp-2019-40-conjuntos-de-datos-publicar-por-las-entidades-locales" target="_blank">nota de datos.gob.es</a>, y por tanto recogido en el <a href="https://github.com/opencitydata" target="_blank">repositorio Github de apoyo a la iniciativa</a>, que queda deprecado una vez se lance este repositorio.\nUna versión amplificada de la guía se encuentra en <a href="https://redtransparenciayparticipacion.es/wp-content/uploads/2025/03/Datos-abiertos-80-conjuntos-de-datos.pdf" target="_blank">DATOS ABIERTOS 80 CONJUNTOS DE DATOS</a>\n
description-es=<span class="markdown">\n\n<p>Como se muestra en la Figura 1, hay dos conceptos principales en la ontología: <a href="#Vehicle">Vehículo</a> y <a href="#Permit">Autorización</a></p>\n    \n<p><center><img src="images/diagram.png" style="width:100%;"/><figcaption>\nFigura 1. Modelo conceptual principal de la ontología</figcaption></center></p> \n    \n<p>La clase <a href="#Vehicle">Vehículo</a> representa los vehículos que pueden encontrarse registrados en el censo de vehículos del municipio, con el propósito de que el municipio pueda aplicar los impuestos correspondientes así como controlar el acceso a áreas específicas de la ciudad, incluyendo zonas de bajas emisiones, zonas de aparcamiento, etc. Esta clase es equivalente a la clase Vehicle de la <a href="https://saref.etsi.org/saref4auto/" target="_blank">ontología SAREF4Auto</a></p>\n    \n<p>Además de las propiedades de datos que pueden usarse para describir vehículos, y que evolucionarán de acuerdo con los casos de uso que utilicen esta ontología en el futuro, hay tres relaciones que caracterizan a los vehículos desde el punto de vista de los permisos para entra y/o aparcar en determinadas zonas. Son: <a href="#vehicleType">tipo de vehículo</a>, <a href="#propulsionType">tipo de propulsión</a> y <a href="#environmentalBadge">distintivo medioambiental</a>. Estas tres relaciones tienen como rango un esquema de conceptos SKOS: <a href="#https://edint.es/kos/VehicleType">Tipo de vehículo</a>, <a href="#https://edint.es/kos/VehiclePropulsionType">Tipo de propulsión</a> y <a href="#https://edint.es/kos/VehicleEnvironmentalBadge">Distintivo medioambiental</a>, respectivamente.</p>\n    \n<p>De manera similar, la clase <a href="#Permit">Autorización</a> representa todas las autorizaciones que un vehículo puede tener, asociadas al <a href="#Vehicle">Vehículo</a> correspondiente mediante la relación <a href="#authorisesVehicle">autoriza a vehículo</a>,   para transitar a través de o aparcar en un tramo de vía o área del municipio (representado con las relaciones <a href="#authorisesInSegment">autoriza en tramo</a> y <a href="#authorisesInArea">autoriza en área</a>, respectivamente. Los rangos de estas relaciones pertenecen a otras ontologías en este ecosistema de ontologías, usadas para representar el tráfico y las áreas de un municipio.</p>\n\n<p>Las autorizaciones también se describen con tres relaciones (<a href="#permitType">tipo de autorización</a>, <a href="#permitStatus">estado de  autorización</a> y <a href="#permitPeriodicity">periodicidad de autorización</a>), que también están conectadas con sus esquemas de conceptos SKOS correspondientes (<a href="#https://edint.es/kos/VehiclePermitType">Tipo de autorización</a>, <a href="#https://edint.es/kos/VehiclePermitStatus">Estado de autorización</a> y <a href="#https://edint.es/kos/VehiclePermitPeriodicity">Periodicidad de autorización</a>).</p>\n    \n<p>Finalmente, las Autorizaciones y los Vehículos pueden pertenecer a una Persona u Organización. Siguiendo las guías generales usadas en la red de ontologías EDINT, estos dos conceptos generales se representan usando clases de schema.org, y la unión de estas dos clases se denomina actualmente <a href="#Owner">Titular</a>, aunque este término puede cambiar en el futuro a algo más genérico como Agente.</p>\n    \n<p>A continuación mostramos un ejemplo en RDF, usando la notación RDF Turtle, que describe un <a href="#Vehicle">Vehículo</a> (una furgoneta diésel, con etiqueta B), con una <a href="#Permit">Autorización</a> anual que pertence a una empresa, y que le permite entrar en la zona de bajas emisiones de Salamanca.</p>\n\n<pre><textarea style="resize:none" readonly id="code1" name="code" rows="50" cols="100">\n@prefix edintveh: &lt;https://edint.es/def/censovehiculos#&gt; .\n@prefix edintvehiclepermittype: &lt;https://edint.es/kos/VehiclePermitType/&gt; .\n@prefix edintvehiclepermitstatus: &lt;https://edint.es/kos/VehiclePermitStatus/&gt; .\n@prefix edintvehiclepermitperiodicity: &lt;https://edint.es/kos/VehiclePermitPeriodicity/&gt; .\n@prefix edintvehicletype: &lt;https://edint.es/kos/VehicleType/&gt; .\n@prefix edintvehiclepropulsionType: &lt;https://edint.es/kos/VehiclePropulsionType/&gt; .\n@prefix edintvehicleenvironmentalbadge: &lt;https://edint.es/kos/VehicleEnvironmentalBadge/&gt; .\n@prefix edintzona: &lt;https://edint.es/def/zone#&gt;\n@prefix dct: &lt;http://purl.org/dc/terms/&gt; .\n@prefix rdfs: &lt;http://www.w3.org/2000/01/rdf-schema#&gt; .\n\n\n&lt;https://example.org/recurso/autorizacion/Permit1&gt; a edintveh:Permit ;\n  dct:identifier "Permit1" ;\n  rdfs:label "Permit for Vehicle 2" ;\n  edintveh:permitType edintvehiclepermittype:CommercialIndustrial ;\n  edintveh:permitStatus edintvehiclepermitstatus:Active ;\n  edintveh:permitPeriodicity edintvehiclepermitperiodicity:Annual ;\n  edintveh:authorisesInArea &lt;https://example.org/recurso/ZBESalamanca ;\n  edintveh:authorisesVehicle &lt;https://example.org/recurso/Vehicle2 ;\n  edintveh:permitOwner &lt;https://example.org/recurso/Company3 .\n\n&lt;https://example.org/recurso/vehicle/Vehicle2&gt; a edintveh:Vehicle ;\n  dct:identifier "1234ABC" ;\n  rdfs:label "Permit for Vehicle with plate 1234ABC" ;\n  edintveh:vehicleType edintvehicletype:Van ;\n  edintveh:propulsionType edintvehiclepropulsiontype:Diesel ;\n  edintveh:environmentalBadge edintvehicleenvironmentalbadge:B ;\n  edintveh:registeredOwner &lt;https://example.org/recurso/Company3 .\n\n&lt;https://example.org/recurso/zona-de-bajas-emisiones/ZBESalamanca&gt; a edintzona:LowEmissionsZone :\n  dct:identifier "ZBESalamanca" ;\n  rdfs:label "Zona de bajas emisiones de Salamanca" .\n  \n&lt;https://example.org/recurso/organization/Company3&gt a schema:Organization ;\n  dct:identifier "Company3" ;\n  rdfs:label "Example, Inc." .\n\n</textarea></pre>\n    <script>\n      var editor1 = CodeMirror.fromTextArea(document.getElementById("code1"), {\n        mode: "text/turtle",\n        matchBrackets: true\n      });\n </script>\n \n    \n</span>\n\n
