abstract-en=Ontología centrada en el certificado de eficiencia energética como unidad documental, incluyendo calificación energética, etiqueta, técnico competente, recomendaciones de mejora, procedimiento de cálculo y recomendaciones de uso para el usuario.
introduction-en=\nThis ontology is part of the catalog of ontologies that is being developed in the context of the <a href="https://edint.es/" target="_blank">Data Space for Smart Urban Infrastructures (EDINT)</a>. It was also identified as a relevant ontology for the representation of data managed by local entities in the guide <a href="http://femp.femp.es/files/3580-1937-fichero/DATOS%20ABIERTOS%20FEMP%202019.pdf" target="_blank">Datos abiertos FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a>, as also described in the corresponding <a href="https://datos.gob.es/es/conocimiento/datos-abiertos-femp-2019-40-conjuntos-de-datos-publicar-por-las-entidades-locales" target="_blank">data.gob.es note</a>, and therefore included in the <a href="https://github.com/opencitydata" target="_blank">Github repository supporting the initiative</a>, which will be deprecated once this repository is launched.\nAn amplified version of the guide can be found in <a href="https://redtransparenciayparticipacion.es/wp-content/uploads/2025/03/Datos-abiertos-80-conjuntos-de-datos.pdf" target="_blank">DATOS ABIERTOS 80 CONJUNTOS DE DATOS</a>\n
description-en=<span class="markdown"><p>Figure 1 shows the conceptual model of the ontology with its classes and relationships (object properties).</p></span>\n<p><center><img src="images/diagrama-conceptual.png" style="width:100%;"/><figcaption>\nFigure 1. Conceptual model of the ontology</figcaption></center></p>\n<span class="markdown"><p>The ontology models the <a href="#EnergyCertificate">energy performance certificate</a> as the central documentary unit, according to Spanish Royal Decree 390/2021. The certificate is linked to an <a href="#EnergyRating">energy rating</a> (which includes the global rating letter on the A-G scale and numerical indicators of primary energy consumption and CO₂ emissions), an <a href="#EnergyLabel">energy label</a> (the visual representation), a <a href="#CompetentTechnician">competent technician</a> (who signs the certificate), one or more <a href="#ImprovementRecommendation">improvement recommendations</a> (technical interventions for the building owner), and <a href="#UserRecommendations">user recommendations</a> (behavioural or operational recommendations for the building occupant).</p>\n\n<p>The <a href="#CalculationProcedure">calculation procedure</a> records whether the rating was obtained using the general or simplified procedure, and whether the data is calculated, measured, or mixed. Building characteristics (use, climatic zone, energy sources for each technical system) are recorded as datatype or object properties linking to SKOS concept schemes.</p>\n\n<p>Controlled vocabularies (certificate type, building use, climatic zone, energy source, rating letter, rating scale version, recommendation type, procedure type, data basis, recipient type, access path, and course module) are represented via object properties pointing to SKOS concepts, organized in independent concept schemes available in the <code>kos/</code> folder.</p>\n\n<p>The building itself is modelled as an external entity that references the certificate through a property defined in its own ontology (e.g., BOT, schema.org). This separation allows the certificate ontology to remain focused on the documentary unit while enabling integration with building databases.</p>\n</span>\n\n<pre><textarea style="resize:none" readonly id="code2" name="code" rows="55" cols="100">\n@prefix xsd: &lt;http://www.w3.org/2001/XMLSchema#&gt; .\n@prefix edintcee: &lt;http://vocab.linkeddata.es/datosabiertos/def/sectorpublico/cee/&gt; .\n@prefix edintceekos-bu: &lt;http://vocab.linkeddata.es/datosabiertos/kos/edint/BuildingUse/&gt; .\n@prefix edintceekos-es: &lt;http://vocab.linkeddata.es/datosabiertos/kos/edint/EnergySource/&gt; .\n@prefix edintceekos-cz: &lt;http://vocab.linkeddata.es/datosabiertos/kos/edint/ClimaticZone/&gt; .\n@prefix edintceekos-ct: &lt;http://vocab.linkeddata.es/datosabiertos/kos/edint/CertificateType/&gt; .\n@prefix edintceekos-rl: &lt;http://vocab.linkeddata.es/datosabiertos/kos/edint/RatingLetter/&gt; .\n@prefix edintceekos-pt: &lt;http://vocab.linkeddata.es/datosabiertos/kos/edint/ProcedureType/&gt; .\n@prefix edintceekos-rt: &lt;http://vocab.linkeddata.es/datosabiertos/kos/edint/RecommendationType/&gt; .\n@prefix edintceekos-db: &lt;http://vocab.linkeddata.es/datosabiertos/kos/edint/DataBasis/&gt; .\n@prefix edintceekos-rcp: &lt;http://vocab.linkeddata.es/datosabiertos/kos/edint/RecipientType/&gt; .\n@prefix edintceekos-rsv: &lt;http://vocab.linkeddata.es/datosabiertos/kos/edint/RatingScaleVersion/&gt; .\n@prefix ex: &lt;http://ejemplo.org/cee/&gt; .\n\n# --- Calculation procedure ---\nex:proc_CEP a edintcee:CalculationProcedure ;\n    edintcee:procedureName "CEP" ;\n    edintcee:procedureVersion "7.0" ;\n    edintcee:procedureType edintceekos-pt:General .\n\n# --- Competent technician ---\nex:tech_mlopez a edintcee:CompetentTechnician ;\n    edintcee:technicianName "María López García" ;\n    edintcee:technicianNIF "23456789B" ;\n    edintcee:technicianQualification "Arquitecta" ;\n    edintcee:technicianRegistrationCCAA "Comunidad de Madrid" ;\n    edintcee:technicianPublicAuthorization "true"^^xsd:boolean .\n\n# --- User recommendations ---\nex:userrec_2024_M12345 a edintcee:UserRecommendations ;\n    edintcee:userRecommendationsDelivered "true"^^xsd:boolean ;\n    edintcee:userRecommendationsDeliveryDate "2024-05-20"^^xsd:date ;\n    edintcee:userRecommendationsRecipient edintceekos-rcp:Owner .\n\n# --- Energy certificate ---\nex:cert_2024_M12345 a edintcee:EnergyCertificate ;\n    edintcee:hasRating              ex:rating_2024_M12345 ;\n    edintcee:issuedBy               ex:tech_mlopez ;\n    edintcee:hasLabel               ex:label_2024_M12345 ;\n    edintcee:usesProcedure          ex:proc_CEP ;\n    edintcee:hasUserRecommendations ex:userrec_2024_M12345 ;\n    edintcee:certificateType        edintceekos-ct:ExistingBuilding ;\n    edintcee:certificateNumber      "M-2024-012345" ;\n    edintcee:issueDate              "2024-05-20"^^xsd:date ;\n    edintcee:visitDate              "2024-05-15"^^xsd:date ;\n    edintcee:registrationDate       "2024-05-28"^^xsd:date ;\n    edintcee:validUntil             "2034-05-20"^^xsd:date ;\n    edintcee:refersToCadastralEntity ex:catastro_mayor10 ;\n    edintcee:hasObservedAddress         ex:dir_mayor10 ;\n    edintcee:observedBuildingUse        edintceekos-bu:Residential ;\n    edintcee:observedClimaticZone       edintceekos-cz:D3 ;\n    edintcee:hasRecommendation          ex:rec_2024_M12345_1 .\n\n# --- Cadastral property ---\nex:catastro_mayor10 a catastro:CadastralProperty ;\n    catastro:referenceCatastral "2807901VK4717F0001WX" .\n\n# --- Postal address ---\nex:dir_mayor10 a esdir:DireccionPostal ;\n    schema:streetAddress "Calle Mayor 10" ;\n    schema:addressLocality "Madrid" ;\n    schema:addressRegion "Madrid" ;\n    schema:addressCountry "ES" .\n\n# --- Energy rating ---\nex:rating_2024_M12345 a edintcee:EnergyRating ;\n    edintcee:ratingLetter              edintceekos-rl:D ;\n    edintcee:ratingScaleVersion        edintceekos-rsv:RD390_2021 ;\n    edintcee:primaryEnergyTotal        [ a qudt:QuantityValue ; qudt:numericValue 152.4 ; qudt:hasUnit qudtu:KiloW-HR ] ;\n    edintcee:primaryEnergyNonRenewable [ a qudt:QuantityValue ; qudt:numericValue 112.8 ; qudt:hasUnit qudtu:KiloW-HR ] ;\n    edintcee:co2Emissions              [ a qudt:QuantityValue ; qudt:numericValue 34.2 ; qudt:hasUnit qudtu:KiloGM ] ;\n    edintcee:dataBasis                  edintceekos-db:Calculated .\n\n# --- Energy label ---\nex:label_2024_M12345 a edintcee:EnergyLabel ;\n    edintcee:labelRatingLetter edintceekos-rl:D .\n\n# --- Improvement recommendation ---\nex:rec_2024_M12345_1 a edintcee:ImprovementRecommendation ;\n    edintcee:recommendationType        edintceekos-rt:Installation ;\n    edintcee:recommendationDescription "Replace individual boilers with centralized aerothermal heat pump system." ;\n    edintcee:estimatedSavingPct        [ a qudt:QuantityValue ; qudt:numericValue 38.0 ; qudt:hasUnit qudtu:PERCENT ] ;\n    edintcee:improvedRatingLetter      edintceekos-rl:B ;\n    edintcee:priority                  1 .\n</textarea></pre>\n<script>\n    var editor2 = CodeMirror.fromTextArea(document.getElementById("code2"), {\n        mode: "text/turtle",\n        matchBrackets: true\n    });\n</script>\n<span class="markdown">\nThe example above shows a portion of the RDF knowledge graph for an existing building energy certificate. The <strong>certificate</strong> (type <code>ExistingBuilding</code> per SKOS) is issued by a <strong>competent technician</strong> and contains an <strong>energy rating</strong> (letter D, scale version RD 390/2021, calculated basis) and an <strong>energy label</strong> (letter D). Building data is modelled by reusing external vocabularies: the postal address uses <code>esdir:DireccionPostal</code> (a specialisation of <code>schema:PostalAddress</code>), the cadastral reference uses <code>catastro:CadastralProperty</code>, and physical quantities (energy, emissions, savings) use <code>qudt:QuantityValue</code> (numeric value + explicit unit). Classifications (certificate type, building use, climatic zone, rating letter, procedure type, data basis, recommendation type, recipient) are represented via SKOS concepts from the schemes available in <code>kos/</code>. The <strong>improvement recommendation</strong> (installation type) estimates an improvement to letter B with 38% savings.\n</span>\n
references-en=<span class="markdown">\n<ul>\n    <li><a href="https://edint.es/en/" target="_blank">Data Spaces for Smart Urban Infrastructures (EDINT)</a></li>\n    <li><a href="http://femp.femp.es/files/3580-1937-fichero/DATOS%20ABIERTOS%20FEMP%202019.pdf" target="_blank">Guía Datos abiertos FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a></li>\n    <li><a href="https://datos.gob.es/es/conocimiento/datos-abiertos-femp-2019-40-conjuntos-de-datos-publicar-por-las-entidades-locales" target="_blank">DATOS ABIERTOS FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a> (source: datos.gob.es)</li>\n    <li><a href="https://redtransparenciayparticipacion.es/wp-content/uploads/2025/03/Datos-abiertos-80-conjuntos-de-datos.pdf" target="_blank">DATOS ABIERTOS 80 CONJUNTOS DE DATOS</a></li>\n</ul>\n</span>\n
abstract-es=Ontología centrada en el certificado de eficiencia energética como unidad documental, incluyendo calificación energética, etiqueta, técnico competente, recomendaciones de mejora, procedimiento de cálculo y recomendaciones de uso para el usuario.
introduction-es=Esta ontología forma parte del catálogo de ontologías que está siendo desarrollado en el contexto del <a href="https://edint.es/" target="_blank">Espacio de Datos para las Infraestructuras Urbanas Inteligentes (EDINT)</a>. Asimismo, fue identificada como una ontología relevante para la representación de datos gestionados por entidades locales en la guía <a href="http://femp.femp.es/files/3580-1937-fichero/DATOS%20ABIERTOS%20FEMP%202019.pdf" target="_blank">Datos abiertos FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a>, tal y como se describe también en la correspondiente <a href="https://datos.gob.es/es/conocimiento/datos-abiertos-femp-2019-40-conjuntos-de-datos-publicar-por-las-entidades-locales" target="_blank">nota de datos.gob.es</a>, y por tanto recogido en el <a href="https://github.com/opencitydata" target="_blank">repositorio Github de apoyo a la iniciativa</a>, que queda deprecado una vez se lance este repositorio.\nUna versión amplificada de la guía se encuentra en <a href="https://redtransparenciayparticipacion.es/wp-content/uploads/2025/03/Datos-abiertos-80-conjuntos-de-datos.pdf" target="_blank">DATOS ABIERTOS 80 CONJUNTOS DE DATOS</a>\n
description-es=<span class="markdown"><p>En la Figura 1 se muestra el modelo conceptual de la ontología con sus clases y relaciones (propiedades de objeto).</p></span>\n<p><center><img src="images/diagrama-conceptual.png" style="width:100%;"/><figcaption>\nFigura 1. Modelo conceptual de la ontología</figcaption></center></p>\n<span class="markdown"><p>La ontología modela el <a href="#EnergyCertificate">certificado de eficiencia energética</a> como la unidad documental central, según el Real Decreto 390/2021. El certificado está vinculado a una <a href="#EnergyRating">calificación energética</a> (que incluye la letra de calificación global en la escala A-G y los indicadores numéricos de consumo de energía primaria y emisiones de CO₂), una <a href="#EnergyLabel">etiqueta energética</a> (la representación visual), un <a href="#CompetentTechnician">técnico competente</a> (que firma el certificado), una o más <a href="#ImprovementRecommendation">recomendaciones de mejora</a> (intervenciones técnicas para el propietario del edificio), y <a href="#UserRecommendations">recomendaciones de uso</a> (recomendaciones de comportamiento u operativas para el ocupante del edificio).</p>\n\n<p>El <a href="#CalculationProcedure">procedimiento de cálculo</a> registra si la calificación se obtuvo mediante el procedimiento general o simplificado, y si los datos son calculados, medidos o mixtos. Las características del edificio (uso, zona climática, fuentes de energía para cada sistema técnico) se registran como propiedades de dato o de objeto que enlazan con esquemas de conceptos SKOS.</p>\n\n<p>Los vocabularios controlados (tipo de certificado, uso de edificio, zona climática, fuente de energía, letra de calificación, versión de escala, tipo de recomendación, tipo de procedimiento, base de datos, tipo de destinatario, vía de acceso y módulo del curso) se representan mediante propiedades de objeto que apuntan a conceptos SKOS, organizados en esquemas de conceptos independientes disponibles en la carpeta <code>kos/</code>.</p>\n\n<p>El edificio se modela como una entidad externa que referencia al certificado mediante una propiedad definida en su propia ontología (e.g., BOT, schema.org). Esta separación permite que la ontología del certificado se mantenga centrada en la unidad documental mientras permite la integración con bases de datos de edificios.</p>\n</span>\n\n<pre><textarea style="resize:none" readonly id="code2" name="code" rows="55" cols="100">\n@prefix xsd: &lt;http://www.w3.org/2001/XMLSchema#&gt; .\n@prefix edintcee: &lt;http://vocab.linkeddata.es/datosabiertos/def/sectorpublico/cee/&gt; .\n@prefix edintceekos-bu: &lt;http://vocab.linkeddata.es/datosabiertos/kos/edint/BuildingUse/&gt; .\n@prefix edintceekos-es: &lt;http://vocab.linkeddata.es/datosabiertos/kos/edint/EnergySource/&gt; .\n@prefix edintceekos-cz: &lt;http://vocab.linkeddata.es/datosabiertos/kos/edint/ClimaticZone/&gt; .\n@prefix edintceekos-ct: &lt;http://vocab.linkeddata.es/datosabiertos/kos/edint/CertificateType/&gt; .\n@prefix edintceekos-rl: &lt;http://vocab.linkeddata.es/datosabiertos/kos/edint/RatingLetter/&gt; .\n@prefix edintceekos-pt: &lt;http://vocab.linkeddata.es/datosabiertos/kos/edint/ProcedureType/&gt; .\n@prefix edintceekos-rt: &lt;http://vocab.linkeddata.es/datosabiertos/kos/edint/RecommendationType/&gt; .\n@prefix edintceekos-db: &lt;http://vocab.linkeddata.es/datosabiertos/kos/edint/DataBasis/&gt; .\n@prefix edintceekos-rcp: &lt;http://vocab.linkeddata.es/datosabiertos/kos/edint/RecipientType/&gt; .\n@prefix edintceekos-rsv: &lt;http://vocab.linkeddata.es/datosabiertos/kos/edint/RatingScaleVersion/&gt; .\n@prefix ex: &lt;http://ejemplo.org/cee/&gt; .\n\n# --- Procedimiento de cálculo ---\nex:proc_CEP a edintcee:CalculationProcedure ;\n    edintcee:procedureName "CEP" ;\n    edintcee:procedureVersion "7.0" ;\n    edintcee:procedureType edintceekos-pt:General .\n\n# --- Técnico competente ---\nex:tech_mlopez a edintcee:CompetentTechnician ;\n    edintcee:technicianName "María López García" ;\n    edintcee:technicianNIF "23456789B" ;\n    edintcee:technicianQualification "Arquitecta" ;\n    edintcee:technicianRegistrationCCAA "Comunidad de Madrid" ;\n    edintcee:technicianPublicAuthorization "true"^^xsd:boolean .\n\n# --- Recomendaciones de uso ---\nex:userrec_2024_M12345 a edintcee:UserRecommendations ;\n    edintcee:userRecommendationsDelivered "true"^^xsd:boolean ;\n    edintcee:userRecommendationsDeliveryDate "2024-05-20"^^xsd:date ;\n    edintcee:userRecommendationsRecipient edintceekos-rcp:Owner .\n\n# --- Certificado de eficiencia energética ---\nex:cert_2024_M12345 a edintcee:EnergyCertificate ;\n    edintcee:hasRating              ex:rating_2024_M12345 ;\n    edintcee:issuedBy               ex:tech_mlopez ;\n    edintcee:hasLabel               ex:label_2024_M12345 ;\n    edintcee:usesProcedure          ex:proc_CEP ;\n    edintcee:hasUserRecommendations ex:userrec_2024_M12345 ;\n    edintcee:certificateType        edintceekos-ct:ExistingBuilding ;\n    edintcee:certificateNumber      "M-2024-012345" ;\n    edintcee:issueDate              "2024-05-20"^^xsd:date ;\n    edintcee:visitDate              "2024-05-15"^^xsd:date ;\n    edintcee:registrationDate       "2024-05-28"^^xsd:date ;\n    edintcee:validUntil             "2034-05-20"^^xsd:date ;\n    edintcee:refersToCadastralEntity ex:catastro_mayor10 ;\n    edintcee:hasObservedAddress         ex:dir_mayor10 ;\n    edintcee:observedBuildingUse        edintceekos-bu:Residential ;\n    edintcee:observedClimaticZone       edintceekos-cz:D3 ;\n    edintcee:hasRecommendation          ex:rec_2024_M12345_1 .\n\n# --- Entidad catastral ---\nex:catastro_mayor10 a catastro:CadastralProperty ;\n    catastro:referenceCatastral "2807901VK4717F0001WX" .\n\n# --- Dirección postal ---\nex:dir_mayor10 a esdir:DireccionPostal ;\n    schema:streetAddress "Calle Mayor 10" ;\n    schema:addressLocality "Madrid" ;\n    schema:addressRegion "Madrid" ;\n    schema:addressCountry "ES" .\n\n# --- Calificación energética ---\nex:rating_2024_M12345 a edintcee:EnergyRating ;\n    edintcee:ratingLetter              edintceekos-rl:D ;\n    edintcee:ratingScaleVersion        edintceekos-rsv:RD390_2021 ;\n    edintcee:primaryEnergyTotal        [ a qudt:QuantityValue ; qudt:numericValue 152.4 ; qudt:hasUnit qudtu:KiloW-HR ] ;\n    edintcee:primaryEnergyNonRenewable [ a qudt:QuantityValue ; qudt:numericValue 112.8 ; qudt:hasUnit qudtu:KiloW-HR ] ;\n    edintcee:co2Emissions              [ a qudt:QuantityValue ; qudt:numericValue 34.2 ; qudt:hasUnit qudtu:KiloGM ] ;\n    edintcee:dataBasis                  edintceekos-db:Calculated .\n\n# --- Etiqueta energética ---\nex:label_2024_M12345 a edintcee:EnergyLabel ;\n    edintcee:labelRatingLetter edintceekos-rl:D .\n\n# --- Recomendación de mejora ---\nex:rec_2024_M12345_1 a edintcee:ImprovementRecommendation ;\n    edintcee:recommendationType        edintceekos-rt:Installation ;\n    edintcee:recommendationDescription "Sustituir calderas por aerotermia centralizada." ;\n    edintcee:estimatedSavingPct        [ a qudt:QuantityValue ; qudt:numericValue 38.0 ; qudt:hasUnit qudtu:PERCENT ] ;\n    edintcee:improvedRatingLetter      edintceekos-rl:B ;\n    edintcee:priority                  1 .\n</textarea></pre>\n<script>\n    var editor2 = CodeMirror.fromTextArea(document.getElementById("code2"), {\n        mode: "text/turtle",\n        matchBrackets: true\n    });\n</script>\n<span class="markdown">\nEn el ejemplo anterior se muestra una porción del grafo de conocimiento en RDF para un certificado de eficiencia energética de un edificio existente. El <strong>certificado</strong> (tipo <code>ExistingBuilding</code> según SKOS) es emitido por un <strong>técnico competente</strong> y contiene una <strong>calificación energética</strong> (letra D, versión de escala RD 390/2021, base calculada) y una <strong>etiqueta energética</strong> (letra D). Los datos del edificio se representan mediante reutilización de vocabularios externos: la dirección postal se modela con <code>esdir:DireccionPostal</code> (especialización de <code>schema:PostalAddress</code>), la referencia catastral con <code>catastro:CadastralProperty</code>, y las magnitudes físicas (energía, emisiones, ahorro) con <code>qudt:QuantityValue</code> (valor numérico + unidad explícita). Las clasificaciones (tipo de certificado, uso, zona climática, letra, tipo de procedimiento, base de datos, tipo de recomendación, destinatario) se representan mediante conceptos SKOS de los esquemas disponibles en <code>kos/</code>. La <strong>recomendación de mejora</strong> (tipo instalación) estima una mejora a letra B con un ahorro del 38 %.\n</span>\n
references-es=<span class="markdown">\n<ul>\n    <li><a href="https://edint.es/" target="_blank">Espacio de Datos para las Infraestructuras Urbanas Inteligentes (EDINT)</a></li>\n    <li><a href="http://femp.femp.es/files/3580-1937-fichero/DATOS%20ABIERTOS%20FEMP%202019.pdf" target="_blank">Guía Datos abiertos FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a></li>\n    <li><a href="https://datos.gob.es/es/conocimiento/datos-abiertos-femp-2019-40-conjuntos-de-datos-publicar-por-las-entidades-locales" target="_blank">DATOS ABIERTOS FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a> (source: datos.gob.es)</li>\n    <li><a href="https://redtransparenciayparticipacion.es/wp-content/uploads/2025/03/Datos-abiertos-80-conjuntos-de-datos.pdf" target="_blank">DATOS ABIERTOS 80 CONJUNTOS DE DATOS</a></li>\n</ul>\n</span>\n
