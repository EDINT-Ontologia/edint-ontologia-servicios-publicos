abstract-en=This ontology aims to provide the commun vocabulary for representing the main entities and data for sensors and observations on noise pollution. It is an update of a <a href="https://vocab.linkeddata.es/datosabiertos/def/sector-publico/territorio/index-en.html">previous version</a>, which adapts that ontology to comply with <a href="https://edint.es/">(EDINT)</a> requirements. It also extends the <a href="http://vocab.linkeddata.es/datosabiertos/def/medioambiente/">Environmental Sensors Ontology</a> for noise pollution. 
introduction-en=\nThis ontology is part of the catalog of ontologies that is being developed in the context of the <a href="https://edint.es/" target="_blank">Data Space for Smart Urban Infrastructures (EDINT)</a>. It was also identified as a relevant ontology for the representation of data managed by local entities in the guide <a href="http://femp.femp.es/files/3580-1937-fichero/DATOS%20ABIERTOS%20FEMP%202019.pdf" target="_blank">Datos abiertos FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a>, as also described in the corresponding <a href="https://datos.gob.es/es/conocimiento/datos-abiertos-femp-2019-40-conjuntos-de-datos-publicar-por-las-entidades-locales" target="_blank">data.gob.es note</a>, and therefore included in the <a href="https://github.com/opencitydata" target="_blank">Github repository supporting the initiative</a>, which will be deprecated once this repository is launched.\nAn amplified version of the guide can be found in <a href="https://redtransparenciayparticipacion.es/wp-content/uploads/2025/03/Datos-abiertos-80-conjuntos-de-datos.pdf" target="_blank">DATOS ABIERTOS 80 CONJUNTOS DE DATOS</a>\n
description-en=\n<div>\n<p>As shown in Figure 1, this ontology extends the <a href="http://vocab.linkeddata.es/datosabiertos/def/medioambiente/">environment ontology</a> of EDINT by adding five properties to specify the specific characteristics of a <a href="#NoiseObservation">noise observation</a>: <a href="#noiseEmitterPredominantType">predominant noise emitter type</a>, <a href="#noiseReferenceInterval">noise reference interval</a>, <a href="#noiseRateType">noise rate type</a>, <a href="#noisePonderation">noise weighting</a>, and <a href="#noiseTimeConstantType">noise time constant type</a>, which are linked to their corresponding SKOS concepts: <a href="&lt;http://vocab.linkeddata.es/datosabiertos/kos/edint/NoiseEmitterPredominantType&gt;">predominant noise emitter type</a>, <a href="&lt;http://vocab.linkeddata.es/datosabiertos/kos/edint/NoiseReferenceInterval&gt;">noise reference interval</a>, <a href="&lt;http://vocab.linkeddata.es/datosabiertos/kos/edint/NoiseRateType&gt;">noise rate type</a>, <a href="&lt;http://vocab.linkeddata.es/datosabiertos/kos/edint/NoisePonderation&gt;">noise weighting</a> and <a href="&lt;http://vocab.linkeddata.es/datosabiertos/kos/edint/NoiseTimeConstantType&gt;">noise time constant type</a>.\n</p>\n    \n<p><center><img src="images/diagram.png" style="width:100%;"/><figcaption>\nFigure 1. Conceptual model of the ontology</figcaption></center></p> \n\n<p>Below we show an example in RDF, using RDF Turtle notation, which describes an observation of the equivalent sound pressure level with A-weighting (normally simplified as LAeq) and whose predominant emitter type is a motor vehicle.</p>\n\n<pre><textarea style="resize:none" readonly id="code1" name="code" rows="50" cols="100">\n\n@prefix owl: &lt;http://www.w3.org/2002/07/owl#&gt; .\n@prefix rdfs: &lt;http://www.w3.org/2000/01/rdf-schema#&gt; .\n@prefix xsd: &lt;http://www.w3.org/2001/XMLSchema#&gt; .\n@prefix dct: &lt;http://purl.org/dc/terms/&gt; .\n@prefix sosa: &lt;http://www.w3.org/ns/sosa/&gt; .\n@prefix skos: &lt;http://www.w3.org/2004/02/skos/core#&gt; .\n@prefix gsp: &lt;http://www.opengis.net/ont/geosparql#&gt; .\n@prefix geo: &lt;http://www.w3.org/2003/01/geo/wgs84_pos#&gt; .\n@prefix qudt: &lt;http://qudt.org/schema/qudt/&gt; .\n@prefix unit: &lt;http://qudt.org/vocab/unit/&gt; .\n@prefix schema: &lt;http://schema.org/&gt; .\n\n\n&lt;https://example.org/recurso/observacion/Observation_LAeq_001&gt; a edintacus:NoiseObservation ;\n    dct:identifier ex:Medicion_001	# Identificador compartido entre todos los valores calculados para una misma medición				\n	edintacus:noiseReferenceInterval edintnoiserefint:EquivalentLevel ;\n	edintacus:noisePonderation edintnoisepon:A ;\n	edintacus:noiseEmitterPredominantType edintemittertype:motorvehicle ;\n	rdfs:label "Nivel de presión sonora equivalente con ponderación A - 18/03/2026 08:00"@es ;\n    rdfs:label "A-weighting equivalent noise pressure level - 18/03/2026 08:00"@en ;\n    sosa:madeBySensor ex:Noise_Sensor_001 ;\n    sosa:hasFeatureOfInterest edintkosfoi:AcousticEnvironment ; \n    sosa:resultTime "2026-03-18T08:00:00+01:00"^^xsd:dateTime ;\n    sosa:hasResult [\n        a qudt:QuantityValue ;\n        qudt:numericValue "57.4"^^xsd:decimal ;\n        qudt:hasUnit unit:DeciB\n    ] .\n	\n</textarea></pre>\n    <script>\n      var editor1 = CodeMirror.fromTextArea(document.getElementById("code1"), {\n        mode: "text/turtle",\n        matchBrackets: true\n      });\n </script>\n \n</div>\n
references-en=<span class="markdown">\n<ul>\n    <li><a href="https://edint.es/en/" target="_blank">Data Spaces for Smart Urban Infrastructures (EDINT)</a></li>\n    <li><a href="http://femp.femp.es/files/3580-1937-fichero/DATOS%20ABIERTOS%20FEMP%202019.pdf" target="_blank">Guía Datos abiertos FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a></li>\n    <li><a href="https://datos.gob.es/es/conocimiento/datos-abiertos-femp-2019-40-conjuntos-de-datos-publicar-por-las-entidades-locales" target="_blank">DATOS ABIERTOS FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a> (source: datos.gob.es)</li>\n    <li><a href="https://redtransparenciayparticipacion.es/wp-content/uploads/2025/03/Datos-abiertos-80-conjuntos-de-datos.pdf" target="_blank">DATOS ABIERTOS 80 CONJUNTOS DE DATOS</a></li>\n</ul>\n</span>\n
abstract-es=Esta ontología intenta proporcionar el vocabulario común para representar las principales entidades y datos de sensores y observaciones sobre contaminación acústica. Es una actualización de una <a href="https://vocab.linkeddata.es/datosabiertos/def/sector-publico/territorio/index-en.html">versión previa</a> de la ontología, que adapta esa ontología para cubrir los requisitos del Espacio de Datos para las Infraestructuras Urbanas Inteligentes <a href="https://edint.es/">(EDINT)</a>. También amplia la <a href="http://vocab.linkeddata.es/datosabiertos/def/medioambiente/">ontología de medioambiente</a> para el caso de la contaminación acústica.
introduction-es=Esta ontología forma parte del catálogo de ontologías que está siendo desarrollado en el contexto del <a href="https://edint.es/" target="_blank">Espacio de Datos para las Infraestructuras Urbanas Inteligentes (EDINT)</a>. Asimismo, fue identificada como una ontología relevante para la representación de datos gestionados por entidades locales en la guía <a href="http://femp.femp.es/files/3580-1937-fichero/DATOS%20ABIERTOS%20FEMP%202019.pdf" target="_blank">Datos abiertos FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a>, tal y como se describe también en la correspondiente <a href="https://datos.gob.es/es/conocimiento/datos-abiertos-femp-2019-40-conjuntos-de-datos-publicar-por-las-entidades-locales" target="_blank">nota de datos.gob.es</a>, y por tanto recogido en el <a href="https://github.com/opencitydata" target="_blank">repositorio Github de apoyo a la iniciativa</a>, que queda deprecado una vez se lance este repositorio.\nUna versión amplificada de la guía se encuentra en <a href="https://redtransparenciayparticipacion.es/wp-content/uploads/2025/03/Datos-abiertos-80-conjuntos-de-datos.pdf" target="_blank">DATOS ABIERTOS 80 CONJUNTOS DE DATOS</a>\n
description-es=\n<!--<span class="markdown">-->\n<div>\n<p>Como se muestra en la Figura 1, esta ontología extiende la <a href="https://edint.es/def/medioambiente/">ontología de medioambiente</a> de EDINT añadiendo cinco propiedades para especificar las características concretas de una <a href="#NoiseObservation">observación de ruido</a>: <a href="#noiseEmitterPredominantType">tipo de emisor de ruido predominante</a>, <a href="#noiseReferenceInterval">intervalo de referencia para ruido</a>, <a href="#noiseRateType">tipo de índice para ruido</a>, <a href="#noisePonderation">ponderación de ruido</a>, y <a href="#noiseTimeConstantType">tipo de constante de tiempo para el ruido</a>, que están conectados a sus conceptos SKOS correspondientes: <a href="<https://edint.es/kos/NoiseEmitterPredominantType>">tipo de emisor de ruido predominante</a>, <a href="<https://edint.es/kos/NoiseReferenceInterval>">intervalo de referencia para ruido</a>, <a href="<https://edint.es/kos/NoiseRateType>">tipo de índice para ruido</a>, <a href="<https://edint.es/kos/NoisePonderation>">ponderación de ruido</a> y <a href="<https://edint.es/kos/NoiseTimeConstantType">tipo de constante de tiempo para el ruido</a>.\n</p>\n\n<p><center><img src="images/diagram.png" style="width:100%;"/><figcaption>\nFigura 1. Modelo conceptual de la ontología</figcaption></center></p> \n\n<p>A continuación mostramos un ejemplo en RDF, usando la notación RDF Turtle, que describe una observación del nivel de presión sonora equivalente con ponderación A (normalmente simplificado con LAeq)  y cuyo tipo de emisor predominante es un vehículo automóvil.</p>\n\n<pre><textarea style="resize:none" readonly id="code1" name="code" rows="50" cols="100">\n\n@prefix owl: &lt;http://www.w3.org/2002/07/owl#&gt; .\n@prefix rdfs: &lt;http://www.w3.org/2000/01/rdf-schema#&gt; .\n@prefix xsd: &lt;http://www.w3.org/2001/XMLSchema#&gt; .\n@prefix dct: &lt;http://purl.org/dc/terms/&gt; .\n@prefix sosa: &lt;http://www.w3.org/ns/sosa/&gt; .\n@prefix skos: &lt;http://www.w3.org/2004/02/skos/core#&gt; .\n@prefix gsp: &lt;http://www.opengis.net/ont/geosparql#&gt; .\n@prefix geo: &lt;http://www.w3.org/2003/01/geo/wgs84_pos#&gt; .\n@prefix qudt: &lt;http://qudt.org/schema/qudt/&gt; .\n@prefix unit: &lt;http://qudt.org/vocab/unit/&gt; .\n@prefix schema: &lt;http://schema.org/&gt; .\n\n@prefix edintmed: &lt;https://edint.es/def/medioambiente/&gt; .\n@prefix edintnoiserefint: &lt;https://edint.es/kos/NoiseReferenceInterval/&gt; .\n@prefix edintnoisepon: &lt;https://edint.es/kos/NoisePonderation/&gt; .\n@prefix edintemittertype: &lt;https://edint.es/kos/EmitterPredominantType/&gt; .\n\n\n&lt;https://example.org/recurso/observacion/Observation_LAeq_001&gt;\n    dct:identifier ex:Medicion_001	# Identificador compartido entre todos los valores calculados para una misma medición				\n	edintacus:noiseReferenceInterval edintnoiserefint:EquivalentLevel ;\n	edintacus:noisePonderation edintnoisepon:A ;\n	edintacus:noiseEmitterPredominantType edintemittertype:motorvehicle ;\n	rdfs:label "Nivel de presión sonora equivalente con ponderación A - 18/03/2026 08:00"@es ;\n    rdfs:label "A-weighting equivalent noise pressure level - 18/03/2026 08:00"@en ;\n    sosa:madeBySensor ex:Noise_Sensor_001 ;\n    sosa:hasFeatureOfInterest edintkosfoi:AcousticEnvironment ; \n    sosa:resultTime "2026-03-18T08:00:00+01:00"^^xsd:dateTime ;\n    sosa:hasResult [\n        a qudt:QuantityValue ;\n        qudt:numericValue "57.4"^^xsd:decimal ;\n        qudt:hasUnit unit:DeciB\n    ] .\n\n</textarea></pre>\n    <script>\n      var editor1 = CodeMirror.fromTextArea(document.getElementById("code1"), {\n        mode: "text/turtle",\n        matchBrackets: true\n      });\n </script>\n \n</div>\n
