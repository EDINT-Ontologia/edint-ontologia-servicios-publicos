abstract-en=The purpose of this ontology is to provide a common vocabulary for the representation of concepts related to photovoltaic systems found in the infrastructure elements of a municipality and the measurement of the generation, consumption, storage and export of electricity into the grid by these installations.
introduction-en=\nThis ontology is part of the catalog of ontologies that is being developed in the context of the <a href="https://edint.es/" target="_blank">Data Space for Smart Urban Infrastructures (EDINT)</a>. It was also identified as a relevant ontology for the representation of data managed by local entities in the guide <a href="http://femp.femp.es/files/3580-1937-fichero/DATOS%20ABIERTOS%20FEMP%202019.pdf" target="_blank">Datos abiertos FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a>, as also described in the corresponding <a href="https://datos.gob.es/es/conocimiento/datos-abiertos-femp-2019-40-conjuntos-de-datos-publicar-por-las-entidades-locales" target="_blank">data.gob.es note</a>, and therefore included in the <a href="https://github.com/opencitydata" target="_blank">Github repository supporting the initiative</a>, which will be deprecated once this repository is launched.\nAn amplified version of the guide can be found in <a href="https://redtransparenciayparticipacion.es/wp-content/uploads/2025/03/Datos-abiertos-80-conjuntos-de-datos.pdf" target="_blank">DATOS ABIERTOS 80 CONJUNTOS DE DATOS</a>\n
description-en=<span class="markdown">\nFigure 1 shows the conceptual model of the ontology with its classes and relationships (object properties).\n\n<p><center><img src="images/diagrama-conceptual.png"/><figcaption>\nFigure 1. Conceptual model of the ontology</figcaption></center></p>\n\n<p>The ontology reuses sensor-related concepts from the Semantic Sensor Network Ontology (Semantic Sensor Network Ontology) to represent the electricity generation of a photovoltaic installation. An infrastructure element is any piece of equipment or urban element that a photovoltaic installation may have. These installations are the <a href="#http://www.w3.org/ns/sosa/FeatureOfInterest">features of interest</a> of the measurements of electricity generation\n<a href="#http://www.w3.org/ns/sosa/madeBySensor">made with sensors</a>, which in turn <a href="#http://www.w3.org/ns/sosa/observes">observe</a> an <a href="#http://www.w3.org/ns/sosa/ObservableProperty">observable property</a> such as the electricity generated, consumed, stored, and fed into the grid.</p>\n\n<p>A <a href="#PhotovoltaicMeter">photovoltaic meter</a> is a sensor that measures variables related to the electricity generated by the installation.</p> These <a href="#PhotovoltaicGeneration">generation measurements</a> reflect the amount of electricity generated, consumed, stored, or fed into the grid over a certain period of time. To represent these measurements, the Quantities, Units, Dimensions, and DataTypes Ontology <a href="https://www.qudt.org/">Quantities, Units, Dimensions and DataTypes Ontology</a> is reused. The measurement value is represented by the class <a href="#http://qudt.org/schema/qudt/QuantityValue">QuantityValue</a> which expresses the magnitude and type of a quantity and is obtained by multiplying a <a href="#http://qudt.org/schema/qudt/value">numerical value n</a> by a unit of measurement obtained through the property <a href="#http://qudt.org/schema/qudt/hasUnit">hasUnit</a> which is related to the class <a href="#http://qudt.org/schema/qudt/Unit">Unit</a> that contains a catalog of units of measurement, for example kilowatt-hour (unit:KiloW-HR) used to measure the generation of electricity. The measured period is represented by the class <a href="#http://www.w3.org/2006/time#Interval">Interval</a> where its start and end times are related to a point in time (<a href="#http://www.w3.org/2006/time#Instant">Instant</a>). The <a href="#https://edint.es/kos/PhotovoltaicSystemStatus">status of the photovoltaic installation</a> is a taxonomy that includes concepts such as "Operational", "Partial", or "Out of service". The installation has a <a href="#https://edint.es/kos/PhotovoltaicSystemUsageType">usage type</a> which can be, for example, "On-grid", "Off-grid", or "Hybrid".\nThe <a href="#PhotovoltaicSystemContract">contract</a> has a <a href="#contractHolder">holder</a> and <a href="#appliesTo">applies</a> to a specific photovoltaic installation. The contract is also associated with a <a href="#PhotovoltaicRate">tariff</a>.</p></span>\n<pre><textarea style="resize:none" readonly id="code2" name="code" rows="25" cols="100">\n@prefix dct: &lt;http://purl.org/dc/terms/&gt; .\n@prefix edintinf: &lt;https://edint.es/def/infraestructura#&gt; .\n@prefix edintphotovstatus: &lt;https://edint.es/kos/PhotovoltaicSystemStatus/&gt; .\n@prefix edintphotovusage: &lt;https://edint.es/kos/PhotovoltaicSystemUsageType/&gt; .\n@prefix edintfotov: &lt;https://edint.es/def/fotovoltaica#&gt; .\n@prefix esdir: &lt;http://vocab.linkeddata.es/datosabiertos/def/urbanismo-infraestructuras/direccion-postal#&gt; .\n@prefix esadm: &lt;http://vocab.linkeddata.es/datosabiertos/def/sector-publico/territorio#&gt; .\n@prefix geosparql: &lt;http://www.opengis.net/ont/geosparql#&gt; .\n@prefix qudt: &lt;http://qudt.org/schema/qudt/&gt; .\n@prefix rdf: &lt;http://www.w3.org/1999/02/22-rdf-syntax-ns#&gt; .\n@prefix rdfs: &lt;http://www.w3.org/2000/01/rdf-schema#&gt; .\n@prefix schema: &lt;https://schema.org/&gt; .\n@prefix sosa: &lt;http://www.w3.org/ns/sosa/&gt; .\n@prefix time: &lt;http://www.w3.org/2006/time#&gt; .\n@prefix xsd: &lt;http://www.w3.org/2001/XMLSchema#&gt; .\n\n# Information on electricity generation through the photovoltaic system\n&lt;https://example.org/recurso/generacionFotovoltaica/853_2026_03_GLORIAFUERTES&gt;\n  a edintfotov:PhotovoltaicGeneration;\n  dct:identifier "853_2026_03_GLORIAFUERTES";\n  rdfs:label "Generación de 300 KwH en 3/2026", "Lectura del sensor GLORIAFUERTES correspondiente a 3/2026";\n  sosa:hasFeatureOfInterest &lt;https://example.org/recurso/instalacionFotovoltaica/ES2026111222XX&gt;;\n  sosa:hasResult &lt;https://example.org/recurso/valorGenerado/853_2026_03_GLORIAFUERTES&gt;;\n  sosa:madeBySensor &lt;https://example.org/recurso/medidorInstalacionFotovoltaica/GLORIAFUERTES_General&gt;;\n  sosa:phenomenonTime &lt;https://example.org/recurso/intervaloMedicion/853_2026_03_GLORIAFUERTES&gt; .\n\n# Photovoltaic system contract\n&lt;https://example.org/recurso/contratoFotovoltaico/853&gt; a edintfotov:PhotovoltaicSystemContract;\n  dct:identifier "Contrato-ES2002783120652701XX";\n  edintfotov:appliesTo &lt;https://example.org/recurso/instalacionFotovoltaica/ES2026111222XX&gt;;\n  edintfotov:contractHolder &lt;https://example.org/recurso/organizacion/JMDBarajas&gt;;\n  edintfotov:hasRate &lt;https://example.org/recurso/tarifaInstalacionFotovoltaica/tarifa_fotov_general&gt;;\n  rdfs:label "Contrato de instalación fotovoltaica en CALLE LOGROÑO, 181, 28042 MADRID",\n    "Contrato de instalación fotovoltaicaq para: CC Y BIBLIOTECA GLORIA FUERTES" .\n\n# Postal address \n&lt;https://example.org/recurso/direccion-postal/28042&gt; a esdir:DireccionPostal;\n  rdfs:label "AV/ LOGROÑO 181, 28042 MADRID" .\n\n# Geometry definition\n&lt;https://example.org/recurso/equipamiento-municipal/locations/404606.22-3593687.76&gt;\n  a geosparql:Geometry;\n  geosparql:asWKT "POINT (-3.5936877657335900 40.460622835379600)"^^geosparql:wktLiteral .\n\n# Element of the municipal infrastructure: CC Y BIBLIOTECA GLORIA FUERTES \n&lt;https://example.org/recurso/equipamientoMunicipal/853&gt; a\n    edintinf:InfrastructureElement;\n  dct:identifier "853";\n  edintinf:belongsTo &lt;https://example.org/recurso/sector-publico/territorio/barrio/127&gt;;\n  edintfotov:hasPhotovoltaicSystem &lt;https://example.org/recurso/instalacionFotovoltaica/ES2026111222XX&gt;;\n  geosparql:hasGeometry &lt;https://example.org/recurso/equipamiento-municipal/locations/404606.22-3593687.76&gt;;\n  rdfs:label "CC Y BIBLIOTECA GLORIA FUERTES";\n  schema:address &lt;https://example.org/recurso/direccion-postal/28042&gt; .\n\n# Instant of datetime at the beginning of the time interval\n&lt;https://example.org/recurso/instante/853_2026_03_GLORIAFUERTES/2026-03-01T00%3A00%3A00Z&gt;\n  a time:Instant;\n  rdfs:label "Instante de tiempo: 2026-03-01T00:00:00Z";\n  time:inXSDDateTimeStamp "2026-03-01T00:00:00Z"^^xsd:dateTimeStamp .\n\n# Instant of datetime at the end of the time interval\n&lt;https://example.org/recurso/instante/853_2026_03_GLORIAFUERTES/2026-03-31T23%3A59%3A59Z&gt;\n  a time:Instant;\n  rdfs:label "Instante de tiempo: 2026-03-31T23:59:59Z";\n  time:inXSDDateTimeStamp "2026-03-31T23:59:59Z"^^xsd:dateTimeStamp .\n\n# Time interval\n&lt;https://example.org/recurso/intervaloMedicion/853_2026_03_GLORIAFUERTES&gt;\n  a time:Interval;\n  rdfs:label "Período de medición correspondiente a 3/2026";\n  time:hasBeginning &lt;https://example.org/recurso/instante/853_2026_03_GLORIAFUERTES/2026-03-01T00%3A00%3A00Z&gt;;\n  time:hasEnd &lt;https://example.org/recurso/instante/853_2026_03_GLORIAFUERTES/2026-03-31T23%3A59%3A59Z&gt; .\n\n# Electricity generation meter of the photovoltaic systen\n&lt;https://example.org/recurso/medidorInstalacionFotovoltaica/GLORIAFUERTES_General&gt;\n  a edintfotov:PhotovoltaicMeter;\n  dct:identifier "GLORIAFUERTES_General";\n  rdfs:label "Medidor fotovoltaico: GLORIAFUERTES_General, Sensor/Medidor de tipo: external";\n  schema:manufacturer &lt;https://example.org/recurso/organizacion/Siemens&gt; .\n\n# Organization that manages the infrastructure element\n&lt;https://example.org/recurso/organizacion/JMDBarajas&gt;\n  a schema:Organization;\n  dct:identifier "JMDBarajas";\n  rdf:label "Junta Municipal del Distrito de Barajas";\n  schema:legalName "Junta Municipal del Distrito de Barajas" .\n\n# Organization that installed the photovoltaic system\n&lt;https://example.org/recurso/organizacion/dragados&gt; a schema:Organization;\n  dct:identifier "DRAGADOS";\n  rdfs:label "Dragados Offshore" .\n\n# Meter manufacturer\n  &lt;https://example.org/recurso/organizacion/Siemens&gt; a schema:Organization;\n  dct:identifier "Siemens";\n  rdfs:label "Siemens" .\n\n# Photovoltaic system\n&lt;https://example.org/recurso/instalacionFotovoltaica/ES2026111222XX&gt;\n  a edintfotov:PhotovoltaicSystem;\n  dct:identifier "ES2026111222XX";\n  edintfotov:hasStatus edintphotovstatus:operative;\n  edintfotov:hasUsageType edintphotovusage:grid;\n  edintfotov:installationOrganization &lt;https://example.org/recurso/organizacion/dragados&gt; ;\n  edintfotov:inServiceDate "2025-02-01"^^xsd:date;\n  edintfotov:installedPhotovoltaicPower "8,2"^^xsd:float;\n  rdfs:label "Instalación fotovoltaica ES2026111222XX, on-grid, conectada a la red" .\n\n# Neighborhood where the infrastructure element is located\n&lt;https://example.org/recurso/sector-publico/territorio/barrio/120&gt;\n  a esadm:Barrio;\n  dct:identifier "120";\n  rdfs:label "ALAMEDA DE OSUNA" .\n\n# Electricity generation rate for the contract\n&lt;https://example.org/recurso/tarifaInstalacionFotovoltaica/tarifa_fotov_general&gt;\n  a edintfotov:PhtovoltaicSystemRate;\n  dct:identifier "tarifa_fotov_general";\n  rdfs:label "Tarifa aplicada para la generación de electricidad",\n    "Tarifa de tipo: tarifa_fotov_general" .\n\n# Unit of measure\n&lt;https://example.org/recurso/unidad/kWh&gt; a qudt:Unit;\n  rdfs:label "kWh" .\n\n# Result of the measurement of electricity generation over one month\n&lt;https://example.org/recurso/valorGenerado/853_2026_03_GLORIAFUERTES&gt;\n  a qudt:QuantityValue;\n  qudt:hasUnit &lt;https://example.org/recurso/unidad/kWh&gt;;\n  qudt:value "300"^^xsd:float;\n  rdfs:label "Cantidad generada: 300 kWh" .\n</textarea></pre>\n<script>\n    var editor2 = CodeMirror.fromTextArea(document.getElementById("code2"), {\n        mode: "text/turtle",\n        matchBrackets: true\n    });\n</script>\nThe example above shows a portion of the RDF knowledge graph for the "Gloria Fuertes Community Center and Library". The Photovoltaic system section represents general properties such as the identifier, its status (operational), the type of use (grid-connected), and the organization that installed the system (Organization that installed the photovoltaic system section). The infrastructure element is related to this photovoltaic system and has a postal address (Postal address section) and a relationship with spatial data corresponding to its geographic coordinates (Geometry definition section). There is a link to the organization that manages this center (Organization that manages the infrastructure element section), which is the Barajas District Municipal Board. Information about electricity generation through the installation is found in the Information on electricity generation through the photovoltaic system section. The generation of 300 kWh took place in March 2026.\n</span>\n\n\n\n\n
references-en=<span class="markdown">\n<ul>\n    <li><a href="https://edint.es/en/" target="_blank">Data Spaces for Smart Urban Infrastructures (EDINT)</a></li>\n    <li><a href="http://femp.femp.es/files/3580-1937-fichero/DATOS%20ABIERTOS%20FEMP%202019.pdf" target="_blank">Guía Datos abiertos FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a></li>\n    <li><a href="https://datos.gob.es/es/conocimiento/datos-abiertos-femp-2019-40-conjuntos-de-datos-publicar-por-las-entidades-locales" target="_blank">DATOS ABIERTOS FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a> (source: datos.gob.es)</li>\n    <li><a href="https://redtransparenciayparticipacion.es/wp-content/uploads/2025/03/Datos-abiertos-80-conjuntos-de-datos.pdf" target="_blank">DATOS ABIERTOS 80 CONJUNTOS DE DATOS</a></li>\n</ul>\n</span>\n
abstract-es=El propósito de esta ontología es el de proporcionar un vocabulario común para la representación de los conceptos relacionados con las instalaciones fotovoltaicas que se encuentran en los elementos de la infraestructura de un municipio y la medición de la generación, consumo, acumulación y vertido de electricidad en la red realizada por estas instalaciones.
introduction-es=Esta ontología forma parte del catálogo de ontologías que está siendo desarrollado en el contexto del <a href="https://edint.es/" target="_blank">Espacio de Datos para las Infraestructuras Urbanas Inteligentes (EDINT)</a>. Asimismo, fue identificada como una ontología relevante para la representación de datos gestionados por entidades locales en la guía <a href="http://femp.femp.es/files/3580-1937-fichero/DATOS%20ABIERTOS%20FEMP%202019.pdf" target="_blank">Datos abiertos FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a>, tal y como se describe también en la correspondiente <a href="https://datos.gob.es/es/conocimiento/datos-abiertos-femp-2019-40-conjuntos-de-datos-publicar-por-las-entidades-locales" target="_blank">nota de datos.gob.es</a>, y por tanto recogido en el <a href="https://github.com/opencitydata" target="_blank">repositorio Github de apoyo a la iniciativa</a>, que queda deprecado una vez se lance este repositorio.\nUna versión amplificada de la guía se encuentra en <a href="https://redtransparenciayparticipacion.es/wp-content/uploads/2025/03/Datos-abiertos-80-conjuntos-de-datos.pdf" target="_blank">DATOS ABIERTOS 80 CONJUNTOS DE DATOS</a>\n
description-es=<span class="markdown">En la Figura 1 se muestra el modelo conceptual de la ontología con sus clases y relaciones (propiedades de objeto).</p>\n<p><center><img src="images/diagrama-conceptual.png"/><figcaption>\nFigura 1. Modelo conceptual de la ontología</figcaption></center></p>\n<p>La ontología reutiliza conceptos relacionados a sensores de la (<a href="https://w3c.github.io/sdw-sosa-ssn/ssn/">Semantic Sensor Network Ontology</a>) para representar la generación de electricidad de una instalación fotovoltaica. Un <a href="#https://edint.es/def/infraestructura#InfrastructureElement">elemento de la infraestructura</a> es cualquier equipamiento o elemento urbano que puede tener una  <a href="#PhotovoltaicSystem">instalación fotovoltaica</a>.  Estas instalaciones  son <a href="#http://www.w3.org/ns/sosa/FeatureOfInterest">características de interés</a> de las mediciones de generación de electricidad\n <a href="#http://www.w3.org/ns/sosa/madeBySensor">hechas con sensores</a>, que a su vez <a href="#http://www.w3.org/ns/sosa/observes">observan</a> una <a href="#http://www.w3.org/ns/sosa/ObservableProperty">propiedad observable</a> tal como la electricidad generada, consumida, acumulada y vertida en la red.</p>\n\n<p>Un <a href="#PhotovoltaicMeter">medidor fotovoltaico</a> es un sensor que mide las variables relacionadas con la electricidad que es generada por la instalación. Estas <a href="#PhotovoltaicGeneration">mediciones de la generación</a> reflejan la cantidad de electricidad generada, consumida, acumulada o vertida en cierto período de tiempo. Para representar estas mediciones se reutiliza la ontología de cantidades, unidades, dimensiones y tipos, <a href="https://www.qudt.org/">Quantities, Units, Dimensions and DataTypes Ontology</a>. El valor de la medición se representa mediante la clase  <a href="#http://qudt.org/schema/qudt/QuantityValue">QuantityValue</a> que expresa la magnitud y el tipo de una cantidad y se obtiene multiplicando un <a href="#http://qudt.org/schema/qudt/value">valor numérico n</a> por una unidad de medida que se obtiene a través de la propiedad <a href="#http://qudt.org/schema/qudt/hasUnit">hasUnit</a> que se relaciona con la clase <a href="#http://qudt.org/schema/qudt/Unit">Unit</a> que contiene un catálogo de unidades de medida, por ejempo kilovatio-hora (unit:KiloW-HR) utilizado para medir la generación de electricidad.  El período medido se representa mediante la clase  <a href="#http://www.w3.org/2006/time#Interval">Interval</a> en donde su hora de inicio y hora de fin se relacionan con un instante de tiempo (<a href="#http://www.w3.org/2006/time#Instant">Instant</a>). El <a href="#https://edint.es/kos/PhotovoltaicSystemStatus">estado de la instalación fotovoltaica</a> es una taxonomía en donde se tienen conceptos como "Operativo", "Parcial" o  "Fuera de servicio".  La instalación tiene un <a href="#https://edint.es/kos/PhotovoltaicSystemUsageType">tipo de uso</a> que puede ser por ejemplo  "Conectado (On-grid)", "Autónomo (Off-grid)" o "Híbrido". \nEl <a href="#PhotovoltaicSystemContract">contrato</a> tiene un <a href="#contractHolder">titular</a> y se <a href="#appliesTo">aplica</a> una determianda instalación fotovoltaica. El contrato también se asocia con una <a href="#PhotovoltaicRate">tarifa</a>.</p>\n<pre><textarea style="resize:none" readonly id="code2" name="code" rows="25" cols="100">\n@prefix dct: &lt;http://purl.org/dc/terms/&gt; .\n@prefix edintinf: &lt;https://edint.es/def/infraestructura#&gt; .\n@prefix edintphotovstatus: &lt;https://edint.es/kos/PhotovoltaicSystemStatus/&gt; .\n@prefix edintphotovusage: &lt;https://edint.es/kos/PhotovoltaicSystemUsageType/&gt; .\n@prefix edintfotov: &lt;https://edint.es/def/fotovoltaica#&gt; .\n@prefix esdir: &lt;http://vocab.linkeddata.es/datosabiertos/def/urbanismo-infraestructuras/direccion-postal#&gt; .\n@prefix esadm: &lt;http://vocab.linkeddata.es/datosabiertos/def/sector-publico/territorio#&gt; .\n@prefix geosparql: &lt;http://www.opengis.net/ont/geosparql#&gt; .\n@prefix qudt: &lt;http://qudt.org/schema/qudt/&gt; .\n@prefix rdf: &lt;http://www.w3.org/1999/02/22-rdf-syntax-ns#&gt; .\n@prefix rdfs: &lt;http://www.w3.org/2000/01/rdf-schema#&gt; .\n@prefix schema: &lt;https://schema.org/&gt; .\n@prefix sosa: &lt;http://www.w3.org/ns/sosa/&gt; .\n@prefix time: &lt;http://www.w3.org/2006/time#&gt; .\n@prefix xsd: &lt;http://www.w3.org/2001/XMLSchema#&gt; .\n\n# Generación de electricidad a través de la instalación fotovoltaica\n&lt;https://example.org/recurso/generacionFotovoltaica/853_2026_03_GLORIAFUERTES&gt;\n  a edintfotov:PhotovoltaicGeneration;\n  dct:identifier "853_2026_03_GLORIAFUERTES";\n  rdfs:label "Generación de 300 KwH en 3/2026", "Lectura del sensor GLORIAFUERTES correspondiente a 3/2026";\n  sosa:hasFeatureOfInterest &lt;https://example.org/recurso/instalacionFotovoltaica/ES2026111222XX&gt;;\n  sosa:hasResult &lt;https://example.org/recurso/valorGenerado/853_2026_03_GLORIAFUERTES&gt;;\n  sosa:madeBySensor &lt;https://example.org/recurso/medidorInstalacionFotovoltaica/GLORIAFUERTES_General&gt;;\n  sosa:phenomenonTime &lt;https://example.org/recurso/intervaloMedicion/853_2026_03_GLORIAFUERTES&gt; .\n\n# Contrato de la instalación fotovoltaica\n&lt;https://example.org/recurso/contratoFotovoltaico/853&gt; a edintfotov:PhotovoltaicSystemContract;\n  dct:identifier "Contrato-ES2002783120652701XX";\n  edintfotov:appliesTo &lt;https://example.org/recurso/instalacionFotovoltaica/ES2026111222XX&gt;;\n  edintfotov:contractHolder &lt;https://example.org/recurso/organizacion/JMDBarajas&gt;;\n  edintfotov:hasRate &lt;https://example.org/recurso/tarifaInstalacionFotovoltaica/tarifa_fotov_general&gt;;\n  rdfs:label "Contrato de instalación fotovoltaica en CALLE LOGROÑO, 181, 28042 MADRID",\n    "Contrato de instalación fotovoltaicaq para: CC Y BIBLIOTECA GLORIA FUERTES" .\n\n# Dirección postal \n&lt;https://example.org/recurso/direccion-postal/28042&gt; a esdir:DireccionPostal;\n  rdfs:label "AV/ LOGROÑO 181, 28042 MADRID" .\n\n# Definición de la Geometría\n&lt;https://example.org/recurso/equipamiento-municipal/locations/404606.22-3593687.76&gt;\n  a geosparql:Geometry;\n  geosparql:asWKT "POINT (-3.5936877657335900 40.460622835379600)"^^geosparql:wktLiteral .\n\n# Elemento de la infraestructura municipal: CC Y BIBLIOTECA GLORIA FUERTES \n&lt;https://example.org/recurso/equipamientoMunicipal/853&gt; a\n    edintinf:InfrastructureElement;\n  dct:identifier "853";\n  edintinf:belongsTo &lt;https://example.org/recurso/sector-publico/territorio/barrio/127&gt;;\n  edintfotov:hasPhotovoltaicSystem &lt;https://example.org/recurso/instalacionFotovoltaica/ES2026111222XX&gt;;\n  geosparql:hasGeometry &lt;https://example.org/recurso/equipamiento-municipal/locations/404606.22-3593687.76&gt;;\n  rdfs:label "CC Y BIBLIOTECA GLORIA FUERTES";\n  schema:address &lt;https://example.org/recurso/direccion-postal/28042&gt; .\n\n# Instante de tiempo de comienzo del intervalo\n&lt;https://example.org/recurso/instante/853_2026_03_GLORIAFUERTES/2026-03-01T00%3A00%3A00Z&gt;\n  a time:Instant;\n  rdfs:label "Instante de tiempo: 2026-03-01T00:00:00Z";\n  time:inXSDDateTimeStamp "2026-03-01T00:00:00Z"^^xsd:dateTimeStamp .\n\n# Instante de tiempo de final del intervalo\n&lt;https://example.org/recurso/instante/853_2026_03_GLORIAFUERTES/2026-03-31T23%3A59%3A59Z&gt;\n  a time:Instant;\n  rdfs:label "Instante de tiempo: 2026-03-31T23:59:59Z";\n  time:inXSDDateTimeStamp "2026-03-31T23:59:59Z"^^xsd:dateTimeStamp .\n\n# Intervalo de tiempo\n&lt;https://example.org/recurso/intervaloMedicion/853_2026_03_GLORIAFUERTES&gt;\n  a time:Interval;\n  rdfs:label "Período de medición correspondiente a 3/2026";\n  time:hasBeginning &lt;https://example.org/recurso/instante/853_2026_03_GLORIAFUERTES/2026-03-01T00%3A00%3A00Z&gt;;\n  time:hasEnd &lt;https://example.org/recurso/instante/853_2026_03_GLORIAFUERTES/2026-03-31T23%3A59%3A59Z&gt; .\n\n# Medidor de la generación de electricidad de la instalación fotovoltaica\n&lt;https://example.org/recurso/medidorInstalacionFotovoltaica/GLORIAFUERTES_General&gt;\n  a edintfotov:PhotovoltaicMeter;\n  dct:identifier "GLORIAFUERTES_General";\n  rdfs:label "Medidor fotovoltaico: GLORIAFUERTES_General, Sensor/Medidor de tipo: external";\n  schema:manufacturer &lt;https://example.org/recurso/organizacion/Siemens&gt; .\n\n# Organización que gestiona el elemento de la infraesturctura\n&lt;https://example.org/recurso/organizacion/JMDBarajas&gt;\n  a schema:Organization;\n  dct:identifier "JMDBarajas";\n  rdf:label "Junta Municipal del Distrito de Barajas";\n  schema:legalName "Junta Municipal del Distrito de Barajas" .\n\n# Organización que realizó la instalación fotovoltaica\n&lt;https://example.org/recurso/organizacion/dragados&gt; a schema:Organization;\n  dct:identifier "DRAGADOS";\n  rdfs:label "Dragados Offshore" .\n\n# Organización fabricante del medidor\n  &lt;https://example.org/recurso/organizacion/Siemens&gt; a schema:Organization;\n  dct:identifier "Siemens";\n  rdfs:label "Siemens" .\n\n# Instalación fotovoltaica\n&lt;https://example.org/recurso/instalacionFotovoltaica/ES2026111222XX&gt;\n  a edintfotov:PhotovoltaicSystem;\n  dct:identifier "ES2026111222XX";\n  edintfotov:hasStatus edintphotovstatus:operative;\n  edintfotov:hasUsageType edintphotovusage:grid;\n  edintfotov:installationOrganization &lt;https://example.org/recurso/organizacion/dragados&gt; ;\n  edintfotov:inServiceDate "2025-02-01"^^xsd:date;\n  edintfotov:installedPhotovoltaicPower "8,2"^^xsd:float;\n  rdfs:label "Instalación fotovoltaica ES2026111222XX, on-grid, conectada a la red" .\n\n# Barrio en donde se encuentra el elemento de la infraestructura\n&lt;https://example.org/recurso/sector-publico/territorio/barrio/120&gt;\n  a esadm:Barrio;\n  dct:identifier "120";\n  rdfs:label "ALAMEDA DE OSUNA" .\n\n# Tarifa de generación de electricidad para el contrato\n&lt;https://example.org/recurso/tarifaInstalacionFotovoltaica/tarifa_fotov_general&gt;\n  a edintfotov:PhtovoltaicSystemRate;\n  dct:identifier "tarifa_fotov_general";\n  rdfs:label "Tarifa aplicada para la generación de electricidad",\n    "Tarifa de tipo: tarifa_fotov_general" .\n\n# Unidad de medida\n&lt;https://example.org/recurso/unidad/kWh&gt; a qudt:Unit;\n  rdfs:label "kWh" .\n\n# Resultado de la medición de generación de electricidad durante un mes\n&lt;https://example.org/recurso/valorGenerado/853_2026_03_GLORIAFUERTES&gt;\n  a qudt:QuantityValue;\n  qudt:hasUnit &lt;https://example.org/recurso/unidad/kWh&gt;;\n  qudt:value "300"^^xsd:float;\n  rdfs:label "Cantidad generada: 300 kWh" .\n</textarea></pre>\n<script>\n    var editor2 = CodeMirror.fromTextArea(document.getElementById("code2"), {\n        mode: "text/turtle",\n        matchBrackets: true\n    });\n</script>\nEn el ejemplo anterior se muestra una porción del grafo de conocimiento en RDF para el "CC Y BIBLIOTECA GLORIA FUERTES". En la sección de Instalación fotovoltaica se representan propiedades generales tales como el identificador, su status (operativo), el tipo de uso (conectado a la red) y la organización que instaló el sistema (Sección Organización que realizó la instalación fotovoltaica). El elemento de la infraestructura está relacionado con esta instalación fotovoltaica y tiene una dirección postal (Sección Dirección postal) y una relación con datos espaciales que corresponden a sus coordenadas geográficas (Sección Definición de la Geometría). Se tiene un enlace a la organización que gestiona ese centro (Sección Organización que gestiona el elemento de la infraestructura) que es la Junta Municipal del Distrito de Barajas . La información sobre la generación de electricidad a través de la instalación se encuentra en  la Sección Generación de electricidad a través de la instalación fotovoltaica. La generación de 300 kWh se ha realizado en el mes de marzo del año 2026.\n</span>\n\n\n
