abstract-en=The purpose of this ontology is to provide a common vocabulary for representing the main entities and data of a municipality's infrastructure. This data includes educational centers, cultural and social centers, sports centers, and health centers, as well as on- and off-street parking. Its scope is limited to data that can be used to maintain and access the inventory of municipal facilities and to track their resource consumption (electricity, water, etc.) and to manage mobility (pedestrian access to municipal facilities and vehicle access to parking areas), which are part of the routine functions of local authorities.
introduction-en=\nThis ontology is part of the catalog of ontologies that is being developed in the context of the <a href="https://edint.es/" target="_blank">Data Space for Smart Urban Infrastructures (EDINT)</a>. It was also identified as a relevant ontology for the representation of data managed by local entities in the guide <a href="http://femp.femp.es/files/3580-1937-fichero/DATOS%20ABIERTOS%20FEMP%202019.pdf" target="_blank">Datos abiertos FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a>, as also described in the corresponding <a href="https://datos.gob.es/es/conocimiento/datos-abiertos-femp-2019-40-conjuntos-de-datos-publicar-por-las-entidades-locales" target="_blank">data.gob.es note</a>, and therefore included in the <a href="https://github.com/opencitydata" target="_blank">Github repository supporting the initiative</a>, which will be deprecated once this repository is launched.\nAn amplified version of the guide can be found in <a href="https://redtransparenciayparticipacion.es/wp-content/uploads/2025/03/Datos-abiertos-80-conjuntos-de-datos.pdf" target="_blank">DATOS ABIERTOS 80 CONJUNTOS DE DATOS</a>\n
description-en=<span class="markdown"> \n<p>Figure 1 captures the general conceptual model of the infrastructure ontology. </p>\n<p><center><img src="images/diagrama-conceptual-General-with-DP.png"/><figcaption>\nFigure 1. Main conceptual model of the infrastructure onology</figcaption></center></p> \n<p>The public and private elements of a municipality’s infrastructure (<a href="#InfrastructureElement">infrastructure element</a>) include the (sub)classes  <a href="#UrbanElement">urban element</a> —such as traffic lights or pedestrian crossings— and <a href="#Facility">facility</a>. Facilities include educational, social, cultural, and sports facilities, as well as on‑street and off‑street <a href="#https://edint.es/def/aparcamiento#Parking">parking areas</a> and <a href="#https://edint.es/def/vehiculos-compartidos#SharedVehicleStation">shared vehicle stations</a>. Geospatial concepts from the <a href="https://opengeospatial.github.io/ogc-geosparql/geosparql11/geo.html">GeoSPARQL ontology</a> are reused to represent areas or coordinates of infrastructure elements by using the concept <a href="#http://www.opengis.net/ont/geosparql#Feature">gsp:Feature</a> and the property <a href="#http://www.opengis.net/ont/geosparql#hasGeometry">gsp:hasGeometry</a>. The elements belong to an administrative unit (<a href="#http://vocab.linkeddata.es/datosabiertos/def/sector-publico/territorio#Municipio">Municipality</a>, <a href="#http://vocab.linkeddata.es/datosabiertos/def/sector-publico/territorio#Distrito">District</a>, <a href="#http://vocab.linkeddata.es/datosabiertos/def/sector-publico/territorio#Barrio">Neighborhood</a>), which are concepts from the <a href="https://vocab.linkeddata.es/datosabiertos/def/sector-publico/territorio/">Territorial Division Ontology</a>, and have a <a href="#http://schema.org/address">postal address</a></p>\n<p>In addition, infrastructure elements have an <a href="#https://edint.es/kos/InfrastructureType">infrastructure type</a>, which is a <a href="#http://www.w3.org/2004/02/skos/core#Concept">concept belonging to a SKOS taxonomy</a>, such as “Health Center,” “Cultural Center,” “Parking,” etc. An infrastructure element may <a href="#offersRegularActivity">offer regular activities</a> —for example, a cultural center may host concerts, exhibitions, etc. It may also <a href="#providesPublicService">provide public services</a>, such as Wi-Fi access. The infrastructure element has <a href="#rolePlayedBy">roles played by</a> <a href="#Organization">organizations</a>. Roles can <a href="#hasRoleType">have</a> a <a href="#https://edint.es/kos/edint/RoleType">type</a>, such as security or maintenance, which are <a href="#http://www.w3.org/2004/02/skos/core#Concept">concepts belonging to a SKOS taxonomy</a>. In turn, the role is <a href="#madeOnInfrastructure">made on an infrastructure element</a>. Infrastructure elements are also related to the organizations that own them (<a href="#hasRegisteredOwner">has registered owner</a>). One facility may <a href="#containsFacility">contain other facilities</a>. This relationship allows representing different areas within a facility. For example, a cultural center may have auditoriums and exhibition halls; a sports center may contain a football field or a swimming pool.\n\n<p>The infrastructure ontology reuses sensor-related concepts from the (<a href="https://w3c.github.io/sdw-sosa-ssn/ssn/">Semantic Sensor Network Ontology</a>) to represent access and counts of people and vehicles at any infrastructure element, as well as vehicle traffic measurements. An infrastructure element may <a href="#hasObservationPoint">have observation points</a>. An <a href="#ObservationPoint">observation point</a> is a <a href="#FeatureOfInterest">feature of interest</a> of  <a href="#http://www.w3.org/ns/sosa/Observation">observations</a> <a href="#http://www.w3.org/ns/sosa/madeBySensor">made by sensors</a>, which in turn <a href="#http://www.w3.org/ns/sosa/observes">observes</a> an <a href="#http://www.w3.org/ns/sosa/ObservableProperty">observable property</a> such as vehicle speed, traffic density, or the access of a vehicle or a person. Figures 2, 3, and 4 illustrate the reuse of this ontology for access sensors, counting sensors, and traffic measurement devices, respectively.</p>\n<p>Figure 2 shows concepts related to access sensors.</p>\n<p><center><img src="images/diagrama-conceptual-AccessSensors-with-DP.png"/><figcaption>\nFigure 2. Conceptual model for access sensors</figcaption></center></p> \n\n<p>In the case of <a href="#AccessObservation">access observations</a>, these are performed by <a href="#AccessSensor">access sensors</a> for an observable property called <a href="#access">access</a>. Access observations may <a href="#includesVehicle">include the vehicles</a> they detect and can be used to <a href="#provesViolation">document a violation</a>, which will be <a href="#linkedTo">linked to</a> a  <a href="https://edint.es/def/censovehiculos#Vehicle">vehicle</a> and will have a <a href="https://edint.es/kos/ViolationType">violation type</a> —this type being a concept belonging to a SKOS taxonomy, such as speeding, mobile phone use, etc.</p>\n<p>Figure 3 shows concepts related to counting sensors.</p>\n<p><center><img src="images/diagrama-conceptual-CountingSensors.png"/><figcaption>\nFigure 3. Conceptual model for the counting sensors</figcaption></center></p> \n<p>In the case of <a href="#CountingObservation">counting observations</a>, these are performed by <a href="#CountingSensor">counting sensors</a> for an observable property called <a href="#facilityOccupancy">facility occupancy</a>.\n<p>Figure 4 shows concepts related to traffic sensors.</p>\n<p><center><img src="images/diagrama-conceptual-TrafficSensors-with-DP.png"/><figcaption>\nFigure 4. Conceptual model for the traffic sensors</figcaption></center></p> \n<p>For traffic-related sensors, concepts from the  <a href="http://vocab.ciudadesabiertas.es/def/transporte/trafico#">Ontology for the representation of vehicle traffic data</a> are reused. Specifically, this ontology includes <a href="http://vocab.ciudadesabiertas.es/def/transporte/trafico#ObservacionTrafico">traffic observations, <a href="http://vocab.ciudadesabiertas.es/def/transporte/trafico#DispositivoMedicionTrafico">traffic measurement devices</a>, and <a href="http://vocab.ciudadesabiertas.es/def/transporte/trafico#PropiedadMedicionTrafico">traffic measurement properties</a>. The observable properties <a href="http://vocab.ciudadesabiertas.es/def/transporte/trafico#ocupacion">traffic occupancy</a>, <a href="http://vocab.ciudadesabiertas.es/def/transporte/trafico#nivel">level, <a href="http://vocab.ciudadesabiertas.es/def/transporte/trafico#intensidad">intensity</a>, and <a href="http://vocab.ciudadesabiertas.es/def/transporte/trafico#velocidad">speed</a> can be reused. The property <a href="#trafficDensity">traffic density</a> has been added as a new observable property.</p>\n<p>Sensors of any of the three types considered in the ontology (access, counting, and traffic) have a <a href="#http://schema.org/manufacturer">manufacturer</a>, which is an <a href="#Organization">organization</a>.</p>\n<pre><textarea style="resize:none" readonly id="code1" name="code" rows="25" cols="100">\n@prefix dct: &lt;http://purl.org/dc/terms/&gt; .\n@prefix edintinf: &lt;https://edint.es/def/infraestructura#&gt; .\n@prefix edintkos: &lt;https://edint.es/kos/&gt; .\n@prefix edintpublicservice: &lt;https://edint.es/kos/PublicService/&gt; .\n@prefix edintregularact: &lt;https://edint.es/kos/RegularActivity/&gt; .\n@prefix esdir: &lt;http://vocab.linkeddata.es/datosabiertos/def/urbanismo-infraestructuras/direccion-postal#&gt; .\n@prefix ester: &lt;http://vocab.linkeddata.es/datosabiertos/def/sector-publico/territorio#&gt; .\n@prefix foaf: &lt;http://xmlns.com/foaf/0.1/&gt; .\n@prefix geosparql: &lt;http://www.opengis.net/ont/geosparql#&gt; .\n@prefix schema: &lt;http://schema.org/&gt; .\n@prefix xsd: &lt;http://www.w3.org/2001/XMLSchema#&gt; .\n\n# Información del Centro de Día\n&lt;https://example.org/recurso/equipamiento-municipal/10047540&gt;\n  a edintinf:Facility ;\n  dct:identifier "10047540" ;\n  schema:address &lt;https://example.org/recurso/direccion-postal/28030&gt; ;\n  schema:openingHours "De 8,15 a 18 horas de Lunes a Viernes." ;\n  edintinf:belongsTo &lt;https://example.org/recurso/sector-publico/territorio/barrio/FONTARRON&gt; ;\n  edintinf:hasInfrastructureType &lt;edintkos:CentrosDiaMayores&gt; ;\n  edintinf:hasObservationPoint &lt;https://example.org/recurso/punto-de-observacion/1398&gt; ;\n  edintinf:hasRegisteredOwner &lt;https://example.org/recurso/organizacion/10047540&gt; ;\n  edintinf:providesPublicService edintpublicservice:medicalassistance ;\n  geosparql:hasGeometry &lt;https://example.org/recurso/equipamiento-municipal/locations/10047540&gt; ;\n  rdfs:label "Centro de Día Municipal 'Nicanor Barroso'" .\n\n# Definición de la Geometría\n&lt;https://example.org/recurso/equipamiento-municipal/locations/10047540&gt;\n  a geosparql:Geometry ;\n  dct:identifier "10047540" ;\n  geosparql:asWKT "POINT (-3.6420364042780338 40.398886698528045)"^^geosparql:wktLiteral .\n\n# Propietario (Organización)\n&lt;https://example.org/recurso/organizacion/10047540&gt;\n  a edintinf:Organization ;\n  rdfs:label "Ayuntamiento de Madrid" ;\n  edintinf:isPublic "true"^^xsd:boolean .\n\n# Punto de observación asociado\n&lt;https://example.org/recurso/punto-de-observacion/1398&gt;\n  a edintinf:ObservationPoint ;\n  rdfs:comment "Punto de conteo de personas en el acceso principal" ;\n  edintinf:belongsTo &lt;https://example.org/recurso/sector-publico/territorio/barrio/FONTARRON&gt; .\n\n# Dirección Postal\n&lt;https://example.org/recurso/direccion-postal/28030&gt;\n  a esdir:DireccionPostal ;\n  rdfs:label "C. de la Encomienda de Palacios, 224, Moratalaz, 28030 Madrid" .\n\n# Barrio\n&lt;https://example.org/recurso/sector-publico/territorio/barrio/FONTARRON&gt;\n  a ester:Barrio ;\n  rdfs:label "Fontarrón" .\n</textarea></pre>\n<script>\n\n    var editor2 = CodeMirror.fromTextArea(document.getElementById("code1"), {\n        mode: "text/turtle",\n        matchBrackets: true\n    });\n</script>\nThe example above shows a portion of the RDF knowledge graph for the "Nicanor Barroso Municipal Day Center." The Information section represents general properties such as the identifier, opening hours, the neighborhood it belongs to (FONTARRON), its postal address (Postal Address section), its type "Senior Day Center" (which belongs to a taxonomy of infrastructure element types), and the regular service it provides, "medical assistance." There is a link to the organization that owns the center (Owner section), which is the Madrid City Council, and a link to a point where access to the center is monitored via an access sensor (Associated Observation Point section). Additionally, there is a link to its spatial data, which corresponds to its geographic coordinates (Geometry Definition section).\n</span>\n
references-en=<span class="markdown">\n<ul>\n    <li><a href="https://edint.es/en/" target="_blank">Data Spaces for Smart Urban Infrastructures (EDINT)</a></li>\n    <li><a href="http://femp.femp.es/files/3580-1937-fichero/DATOS%20ABIERTOS%20FEMP%202019.pdf" target="_blank">Guía Datos abiertos FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a></li>\n    <li><a href="https://datos.gob.es/es/conocimiento/datos-abiertos-femp-2019-40-conjuntos-de-datos-publicar-por-las-entidades-locales" target="_blank">DATOS ABIERTOS FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a> (source: datos.gob.es)</li>\n    <li><a href="https://redtransparenciayparticipacion.es/wp-content/uploads/2025/03/Datos-abiertos-80-conjuntos-de-datos.pdf" target="_blank">DATOS ABIERTOS 80 CONJUNTOS DE DATOS</a></li>\n</ul>\n</span>\n
abstract-es=El propósito de esta ontología es el de proporcionar un vocabulario común para la representación de las entidades y datos principales de la infraestructura de un municipio que pueden incluir tanto centros educativos, centros culturales y sociales, centros de salud así como todo los aparcamientos dentro y fuera de la vía pública. Su alcance se limita a los datos que pueden ser utilizados con los propósitos de mantener y acceder al inventario de los equipamientos municipales y conocer su consumo de recursos (electricidad, agua, etc.), de gestionar el mantenimiento urbano, el de la gestión de la movilidad (accesos a las instalaciones municipales y accesos de vehículos a los aparcamientos), que son parte de las funciones habituales de las entidades locales.
introduction-es=Esta ontología forma parte del catálogo de ontologías que está siendo desarrollado en el contexto del <a href="https://edint.es/" target="_blank">Espacio de Datos para las Infraestructuras Urbanas Inteligentes (EDINT)</a>. Asimismo, fue identificada como una ontología relevante para la representación de datos gestionados por entidades locales en la guía <a href="http://femp.femp.es/files/3580-1937-fichero/DATOS%20ABIERTOS%20FEMP%202019.pdf" target="_blank">Datos abiertos FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a>, tal y como se describe también en la correspondiente <a href="https://datos.gob.es/es/conocimiento/datos-abiertos-femp-2019-40-conjuntos-de-datos-publicar-por-las-entidades-locales" target="_blank">nota de datos.gob.es</a>, y por tanto recogido en el <a href="https://github.com/opencitydata" target="_blank">repositorio Github de apoyo a la iniciativa</a>, que queda deprecado una vez se lance este repositorio.\nUna versión amplificada de la guía se encuentra en <a href="https://redtransparenciayparticipacion.es/wp-content/uploads/2025/03/Datos-abiertos-80-conjuntos-de-datos.pdf" target="_blank">DATOS ABIERTOS 80 CONJUNTOS DE DATOS</a>\n
description-es=<span class="markdown"> \n<p>La Figura 1 presenta el modelo conceptual general de la ontología.</p>\n<p><center><img src="images/diagrama-conceptual-General-with-DP.png"/><figcaption>\nFigura 1. Modelo conceptual principal de la ontología</figcaption></center></p> \n<p>Los elementos públicos y privados de la infraestructura de un municipio (<a href="#InfrastructureElement">Elemento de infraestructura</a>) incluyen las (sub)clases de <a href="#UrbanElement">Elemento urbano</a>, como los semáforos o los pasos de cebra, y de <a href="#Facility">Equipamiento</a>. Los equipamientos incluyen centros educativos, sociales y culturales, deportivos, así como <a href="#https://edint.es/def/aparcamiento#Parking">aparcamientos</a> dentro y fuera de la vía pública  y <a href="#https://edint.es/def/vehiculos-compartidos#SharedVehicleStation">estaciones de vehículos compartidos</a>. \n\nSe reutilizan conceptos geoespaciales de la ontología <a href="https://opengeospatial.github.io/ogc-geosparql/geosparql11/geo.html">GeoSPARQL</a> para representar áreas o coordenadas de los elementos de la infraestructura utilizando el concepto de   <a href="#http://www.opengis.net/ont/geosparql#Feature">gsp:Feature</a> y la propiedad <a href="#http://www.opengis.net/ont/geosparql#hasGeometry">gsp:hasGeometry</a>. \nLos elementos pertenecen a una unidad administrativa (<a href="#http://vocab.linkeddata.es/datosabiertos/def/sector-publico/territorio#Municipio">Municipio</a>, <a href="#http://vocab.linkeddata.es/datosabiertos/def/sector-publico/territorio#Distrito">Distrito</a>, <a href="#http://vocab.linkeddata.es/datosabiertos/def/sector-publico/territorio#Barrio">Barrio</a>), los cuales son conceptos de la <a href="https://vocab.linkeddata.es/datosabiertos/def/sector-publico/territorio/">Ontología de representación de datos de territorio</a>  y tienen una  <a href="#http://schema.org/address">dirección postal</a>.\n\n<p>Además, los elementos de infraestructura <a href="#hasInfrastructureType">tienen un tipo de infraestructura</a> que es un concepto que pertenece a una taxonomía SKOS como por ejemplo, "Centro de salud", "Centro cultural", "Aparcamiento", etc.\nUn elemento de una infraestructura puede  <a href="#offersRegularActivity">ofrecer actividades regulares</a>, por ejemplo un centro cultural puede ofrecer conciertos, exposiciones, etc. También puede  <a href="#providesPublicService">prestar servicios públicos</a>, como por ejemplo internet a través de una wifi .\nEl elemento de la infraestructura tiene <a href="#rolePlayedBy">roles ejercidos</a> por <a href="#Organization">organizaciones</a>. Existen diferentes <a href="#hasRoleType">tipos de roles</a> tales como seguridad o mantenimiento, los cuales son conceptos de una taxonomía SKOS. A su vez el rol se  \n<a href="#madeOnInfrastructure">realiza sobre un elemento de la infraestructura</a>\nLos elementos de la infraestructura están relacionados con las organizaciones \nde las cuales son titulares (<a href="#hasRegisteredOwner">tiene titular registrado</a>)\nUn equipamiento puede <a href="#containsFacility">contener otro equipamiento</a>. Esta relación permite representar diferentes áreas dentro de un equipamiento. Por ejemplo, un centro cultural puede tener auditorios y salas de exposiciones; un centro deportivo puede tener un campo de fútbol o una piscina.</p>\n\n<p>En la ontología se reutilizan conceptos relacionados a sensores (<a href="https://w3c.github.io/sdw-sosa-ssn/ssn/">Semantic Sensor Network Ontology</a>) para representar los accesos y conteos de personas y vehículos en cualquier elemento de la infraestructura, así como mediciones de tráfico de vehículos. Un elemento de la infraestructura puede <a href="#hasObservationPoint">tener un punto de observación</a>. Estos puntos de observación son <a href="#http://www.w3.org/ns/sosa/FeatureOfInterest">características de interés</a> de las observaciones\n <a href="#http://www.w3.org/ns/sosa/madeBySensor">hechas con sensores</a>, que a su vez <a href="#http://www.w3.org/ns/sosa/observes">observan</a> una <a href="#http://www.w3.org/ns/sosa/ObservableProperty">propiedad observable</a> tales como la velocidad de un vehículo, la densidad del tráfico, o el acceso de un vehículo o persona.\n\n En las figuras 2, 3 y 4 se ilustra la reutilización de esta ontología para sensores de acceso, conteo y dispositivos de medición de tráfico, respectivamente. \n\n<p>La Figura 2 desarrolla el concepto de sensores de acceso.</p>\n<p><center><img src="images/diagrama-conceptual-AccessSensors-with-DP.png"/><figcaption>\nFigura 2. Modelo conceptual de Sensores de Acceso</figcaption></center></p> \n<p>En el caso de las <a href="#AccessObservation">observaciones de acceso</a>, estas las harán <a href="#AccessSensor">sensores de acceso</a> para la propiedad observable <a href="#access">acceso</a>.  Las observaciones de acceso pueden <a href="#includesVehicle">incluir los vehículos</a> que captan y pueden servir para  <a href="#provesViolation">demostrar una infracción</a>, que estará <a href="#linkedTo">relacionada con</a> a un vehículo, y que tendrá un <a href="#hasViolationType">tipo de infracción</a>, que es un concepto que pertenece a una taxonomía SKOS, tal como exceso de velocidad, uso del móvil, etc.</p>\n<p>La Figura 3 desarrolla el concepto de sensores de conteo.</p>\n<p><center><img src="images/diagrama-conceptual-CountingSensors.png"/><figcaption>\nFigura 3. Modelo conceptual de Sensores de Conteo</figcaption></center></p> \n<p>En el caso de las <a href="#CountingObservation">observaciones de conteo</a>, estas las harán <a href="#CountingSensor">sensores de conteo</a> para la propiedad observable de <a href="#facilityOccupancy">ocupación de un equipamiento</a>. \n<p>La Figura 4 desarrolla el concepto de sensores de tráfico.</p>\n<p><center><img src="images/diagrama-conceptual-TrafficSensors-with-DP.png"/><figcaption>\nFigura 4. Modelo conceptual de Sensores de Tráfico</figcaption></center></p> \n<p>Para la ocupación para tráfico se reutilizan conceptos de la  <a href="http://vocab.ciudadesabiertas.es/def/transporte/trafico#">Ontología para la representación de datos de tráfico de vehículos</a>. En concreto se tiene <a href="http://vocab.ciudadesabiertas.es/def/transporte/trafico#ObservacionTrafico">estraf:ObservacionTrafico</a>, <a href="http://vocab.ciudadesabiertas.es/def/transporte/trafico#DispositivoMedicionTrafico">estraf:DispositivoMedicionTrafico</a>, <a href="http://vocab.ciudadesabiertas.es/def/transporte/trafico#PropiedadMedicionTrafico">estraf:PropiedadMedicionTrafico</a>. Se pueden reutilizar las propiedades observables ocupación de tráfico, nivel , intensidad y velocidad. La propiedad densidad de tráfico se ha añadido como propiedad observable.</p>\nLos sensores de cualquiera de los tres tipos considerados en la ontología (acceso, conteo y tráfico) tienen un <a href="#http://schema.org/manufacturer">fabricante</a> que es una organización.\n<pre><textarea style="resize:none" readonly id="code1" name="code" rows="25" cols="100">\n@prefix dct: &lt;http://purl.org/dc/terms/&gt; .\n@prefix edintinf: &lt;https://edint.es/def/infraestructura#&gt; .\n@prefix edintkos: &lt;https://edint.es/kos/&gt; .\n@prefix edintpublicservice: &lt;https://edint.es/kos/PublicService/&gt; .\n@prefix edintregularact: &lt;https://edint.es/kos/RegularActivity/&gt; .\n@prefix esdir: &lt;http://vocab.linkeddata.es/datosabiertos/def/urbanismo-infraestructuras/direccion-postal#&gt; .\n@prefix ester: &lt;http://vocab.linkeddata.es/datosabiertos/def/sector-publico/territorio#&gt; .\n@prefix foaf: &lt;http://xmlns.com/foaf/0.1/&gt; .\n@prefix geosparql: &lt;http://www.opengis.net/ont/geosparql#&gt; .\n@prefix schema: &lt;http://schema.org/&gt; .\n@prefix xsd: &lt;http://www.w3.org/2001/XMLSchema#&gt; .\n\n# Información del Centro de Día\n&lt;https://example.org/recurso/equipamiento-municipal/10047540&gt;\n  a edintinf:Facility ;\n  dct:identifier "10047540" ;\n  schema:address &lt;https://example.org/recurso/direccion-postal/28030&gt; ;\n  schema:openingHours "De 8,15 a 18 horas de Lunes a Viernes." ;\n  edintinf:belongsTo &lt;https://example.org/recurso/sector-publico/territorio/barrio/FONTARRON&gt; ;\n  edintinf:hasInfrastructureType &lt;edintkos:CentrosDiaMayores&gt; ;\n  edintinf:hasObservationPoint &lt;https://example.org/recurso/punto-de-observacion/1398&gt; ;\n  edintinf:hasRegisteredOwner &lt;https://example.org/recurso/organizacion/10047540&gt; ;\n  edintinf:providesPublicService edintpublicservice:medicalassistance ;\n  geosparql:hasGeometry &lt;https://example.org/recurso/equipamiento-municipal/locations/10047540&gt; ;\n  rdfs:label "Centro de Día Municipal 'Nicanor Barroso'" .\n\n# Definición de la Geometría\n&lt;https://example.org/recurso/equipamiento-municipal/locations/10047540&gt;\n  a geosparql:Geometry ;\n  dct:identifier "10047540" ;\n  geosparql:asWKT "POINT (-3.6420364042780338 40.398886698528045)"^^geosparql:wktLiteral .\n\n# Propietario (Organización)\n&lt;https://example.org/recurso/organizacion/10047540&gt;\n  a edintinf:Organization ;\n  rdfs:label "Ayuntamiento de Madrid" ;\n  edintinf:isPublic "true"^^xsd:boolean .\n\n# Punto de observación asociado\n&lt;https://example.org/recurso/punto-de-observacion/1398&gt;\n  a edintinf:ObservationPoint ;\n  rdfs:comment "Punto de conteo de personas en el acceso principal" ;\n  edintinf:belongsTo &lt;https://example.org/recurso/sector-publico/territorio/barrio/FONTARRON&gt; .\n\n# Dirección Postal\n&lt;https://example.org/recurso/direccion-postal/28030&gt;\n  a esdir:DireccionPostal ;\n  rdfs:label "C. de la Encomienda de Palacios, 224, Moratalaz, 28030 Madrid" .\n\n# Barrio\n&lt;https://example.org/recurso/sector-publico/territorio/barrio/FONTARRON&gt;\n  a ester:Barrio ;\n  rdfs:label "Fontarrón" .\n</textarea></pre>\n<script>\n\n    var editor2 = CodeMirror.fromTextArea(document.getElementById("code1"), {\n        mode: "text/turtle",\n        matchBrackets: true\n    });\n</script>\nEn el ejemplo anterior se muestra una porción del grafo de conocimiento en RDF para el "Centro de Día Municipal Nicanor Barroso". En la sección de Información se representan propiedades generales tales como el identificador, el horario, el barrio al cual pertenece (FONTARRON), su dirección postal (Sección Dirección Postal), su tipo "CentroDiaMayores" que pertenece a una taxonomía de tipos de elementos de infraestructura y el servicio regular que presta, "asistencia médica". Se tiene un enlace a la organización que es titular de ese centro (Sección Propietario) que es el Ayuntamiento de Madrid  y un enlace al un punto en donde se "observa" el acceso al centro a través de un sensor de acceso (Sección Punto de obervación asociado). Además existe una relación con sus datos espaciales que corresponden a sus coordenadas geográficas (Sección Definición de la Geometría).\n</span>\n
