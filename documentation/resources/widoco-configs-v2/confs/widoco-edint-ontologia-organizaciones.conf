abstract-en=The purpose of this ontology is to provide a common vocabulary for representing public organizations in Spain, as well as aspects related to organizational charts within those organizations. It is an update of a previous version of the ontology that extended the W3C Organization Ontology. This version adapts that ontology to meet EDINT requirements. The most relevant changes include removing the Office and Economic-Budgetary Management Unit classes, along with their specific properties, and including Spanish Organizacion as a subclass of Organization and edintinf:Facility as a subclass of Site.
introduction-en=\nThis ontology is part of the catalog of ontologies that is being developed in the context of the <a href="https://edint.es/" target="_blank">Data Space for Smart Urban Infrastructures (EDINT)</a>. It was also identified as a relevant ontology for the representation of data managed by local entities in the guide <a href="http://femp.femp.es/files/3580-1937-fichero/DATOS%20ABIERTOS%20FEMP%202019.pdf" target="_blank">Datos abiertos FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a>, as also described in the corresponding <a href="https://datos.gob.es/es/conocimiento/datos-abiertos-femp-2019-40-conjuntos-de-datos-publicar-por-las-entidades-locales" target="_blank">data.gob.es note</a>, and therefore included in the <a href="https://github.com/opencitydata" target="_blank">Github repository supporting the initiative</a>, which will be deprecated once this repository is launched.\nAn amplified version of the guide can be found in <a href="https://redtransparenciayparticipacion.es/wp-content/uploads/2025/03/Datos-abiertos-80-conjuntos-de-datos.pdf" target="_blank">DATOS ABIERTOS 80 CONJUNTOS DE DATOS</a>\n
description-en=\n<span class="markdown"><p>Figure 1 shows the main classes of the ontology and their properties, although it only includes the names of those that are specific to the ontology. As can be seen, this is an extension of the <a href="http://www.w3.org/ns/org#">Organization Ontology</a> of <a href="https://www.w3.org/">W3C</a> to represent particular aspects of public administration organizations in Spain. To this end, a subtype of <a href="http://www.w3.org/ns/org#Organization">organization</a>, called <a href="#Organization">organization</a> too, has been created. This organization <a href="#hasCompetenceRegion">has a competence region</a>, which is an <a href="http://dbpedia.org/ontology/GovernmentalAdministrativeRegion">administrative region</a> of Spain (<a href="http://vocab.linkeddata.es/datosabiertos/def/sector-publico/territorio#Autonomia">autonomous community</a>, <a href="http://vocab.linkeddata.es/datosabiertos/def/sector-publico/territorio#Provincia">province</a>, <a href="http://vocab.linkeddata.es/datosabiertos/def/sector-publico/territorio#Comarca">county</a>, <a href="http://vocab.linkeddata.es/datosabiertos/def/sector-publico/territorio#Distrito">district</a>, <a href="http://vocab.linkeddata.es/datosabiertos/def/sector-publico/territorio#Municipio">municipality</a>).\n</p>\n\n<p><a href="#Organization">Organizations</a> have properties to represent their <a href="#externalIdentifier">external identifier</a>, the <a href="#legalProvision">legal provision</a> that regulates the organization, their <a href="#hierarchicalLevel">hierarchical level</a> within the organization to which they belong, and <a href="#DeregistrationNote">notes regarding their deregistration</a>, if it has occurred. In addition, they <a href="#hasOrganizationStatus">have a status</a>, <a href="#hasOrganizationType">correspond to a type</a>, and are <a href="#hasAdministrationLevel">located at an administration level</a>, which are represented by <a href="http://www.w3.org/2004/02/skos/core#Concept">SKOS concepts</a>, with the corresponding taxonomy. \n</p>\n\n<p>A subclass of <a href="http://www.w3.org/ns/org#OrganizationalUnit">organizational unit</a> called <a href="#OrganicUnit">organic unit</a> has also been created to represent organizational units that <a href="http://www.w3.org/ns/org#unitOf">belong to</a> a <a href="#PublicLawEntity">public law entity</a>, which is a subclass of <a href="http://www.w3.org/ns/org#FormalOrganization">formal organization</a> created to meet needs of general interest and whose activity depends on public funding or control.\n</p>\n\n<p>Finally, the <a href="#Facility">facilities</a> of the <a href="http://vocab.linkeddata.es/datosabiertos/def/urbanismo-infraestructuras/infraestructura#">infrastructure ontology</a> have been considered as a subclass of <a href="http://www.w3.org/ns/org#Site">site</a>.\n</p>\n\n<p><center><img src="images/diagrama.png" style="width:100%;"/><figcaption>\nFigure 1. Conceptual model of the ontology (only includes names of specific properties).\n</figcaption></center></p></span>\n
