abstract-es=El propósito de esta ontología es proporcionar un vocabulario común para la representación de las organizaciones públicas en España, así como aspectos relacionados con los organigramas dentro de dichas organizaciones. Es una actualización de una versión previa de la ontología que extendía la ontología del W3C para organizaciones (W3C Organization Ontology). Esta versión adapta esa ontología para cubrir los requisitos EDINT. Como cambios más relevantes, elimina las clases Oficina y Unidad con función de Gestión Económica-Presupuestaria, junto con sus propiedades específicas, e incluye Organización Española como subclase de Organización y edintinf:Equipamiento como subclase de Sede.
introduction-es=Esta ontología forma parte del catálogo de ontologías que está siendo desarrollado en el contexto del <a href="https://edint.es/" target="_blank">Espacio de Datos para las Infraestructuras Urbanas Inteligentes (EDINT)</a>. Asimismo, fue identificada como una ontología relevante para la representación de datos gestionados por entidades locales en la guía <a href="http://femp.femp.es/files/3580-1937-fichero/DATOS%20ABIERTOS%20FEMP%202019.pdf" target="_blank">Datos abiertos FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a>, tal y como se describe también en la correspondiente <a href="https://datos.gob.es/es/conocimiento/datos-abiertos-femp-2019-40-conjuntos-de-datos-publicar-por-las-entidades-locales" target="_blank">nota de datos.gob.es</a>, y por tanto recogido en el <a href="https://github.com/opencitydata" target="_blank">repositorio Github de apoyo a la iniciativa</a>, que queda deprecado una vez se lance este repositorio.\nUna versión amplificada de la guía se encuentra en <a href="https://redtransparenciayparticipacion.es/wp-content/uploads/2025/03/Datos-abiertos-80-conjuntos-de-datos.pdf" target="_blank">DATOS ABIERTOS 80 CONJUNTOS DE DATOS</a>\n
description-es=\n<span class="markdown"><p>La Figura 1 muestra las principales clases de la ontolog&iacute;a y sus propiedades, aunque solo incluye los nombres de las que son espec&iacute;ficas de la ontolog&iacute;a. Como se puede apreciar, se trata de una ampliaci&oacute;n de la <a href="http://www.w3.org/ns/org#">Ontolog&iacute;a de organizaciones</a> del <a href="https://www.w3.org/">W3C</a> para representar aspectos particulares de las organizaciones de la administraci&oacute;n p&uacute;blica en España. Con ese fin, se ha creado un subtipo de <a href="http://www.w3.org/ns/org#Organization">organizaci&oacute;n</a>, llamado <a href="#Organization">organizaci&oacute;n</a> también. Esta organizaci&oacute;n <a href="#hasCompetenceRegion">tiene un &aacute;mbito de competencia</a>, que es una <a href="http://dbpedia.org/ontology/GovernmentalAdministrativeRegion">regi&oacute;n adminitrativa</a> de España (<a href="http://vocab.linkeddata.es/datosabiertos/def/sector-publico/territorio#Autonomia">autonom&iacute;a</a>, <a href="http://vocab.linkeddata.es/datosabiertos/def/sector-publico/territorio#Provincia">provincia</a>, <a href="http://vocab.linkeddata.es/datosabiertos/def/sector-publico/territorio#Comarca">comarca</a>, <a href="http://vocab.linkeddata.es/datosabiertos/def/sector-publico/territorio#Distrito">distrito</a>, <a href="http://vocab.linkeddata.es/datosabiertos/def/sector-publico/territorio#Municipio">municipio</a>).\n</p>\n\n<p>Las <a href="#Organization">organizaciones</a> tienen propiedades para representar su <a href="#externalIdentifier">identificador externo</a>, la <a href="#legalProvision">disposici&oacute;n legal </a> que regula la organizaci&oacute;n, su <a href="#hierarchicalLevel">nivel jer&aacute;rquico</a> dentro de la organizaci&oacute;n a la que pertenece y <a href="#DeregistrationNote">observaciones acerca de su baja</a>, si se ha producido. Adem&aacute;s, <a href="#hasOrganizationStatus">tienen un estado</a>, <a href="#hasOrganizationType">corresponden a un tipo</a> y se <a href="#hasAdministrationLevel">encuentran en un nivel de la administraci&oacute;n</a>, que est&aacute;n representados mediante <a href="http://www.w3.org/2004/02/skos/core#Concept">conceptos SKOS</a>, con la taxonom&iacute;a correspondiente. \n</p>\n\n<p>Tambi&eacute;n se ha creado una subclase de <a href="http://www.w3.org/ns/org#OrganizationalUnit">unidad organizativa</a> llamada <a href="#OrganicUnit">unidad org&aacute;nica</a> para representar las unidades organizativas que <a href="http://www.w3.org/ns/org#unitOf">pertenecen a</a> una <a href="#PublicLawEntity">entidad de derecho p&uacute;blico</a>, que es una subclase de <a href="http://www.w3.org/ns/org#FormalOrganization">organizaci&oacute;n formal</a> creada para satisfacer necesidades de inter&eacute;s general y cuya actividad depende de fondos o control p&uacute;blicos.\n</p>\n\n<p>Finalmente, se han considerado los <a href="#Facility">equipamientos de la <a href="http://vocab.linkeddata.es/datosabiertos/def/urbanismo-infraestructuras/infraestructura#">ontolog&iacute;a de infraestructura</a> como subclase de <a href="http://www.w3.org/ns/org#Site">sede</a>.\n</p>\n\n<p><center><img src="images/diagrama.png" style="width:100%;"/><figcaption>\nFigura 1. Modelo conceptual de la ontolog&iacute;a (solo incluye nombres de propiedades espec&iacute;ficas).</figcaption></center></p> \n\n</span>\n
