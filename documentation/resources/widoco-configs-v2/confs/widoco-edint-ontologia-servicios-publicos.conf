abstract-en=The Public Services Ontology describes concepts related to public services provided to citizens, administrative procedures associated with these services, and the roles involved.
introduction-en=\nThis ontology is part of the catalog of ontologies that is being developed in the context of the <a href="https://edint.es/" target="_blank">Data Space for Smart Urban Infrastructures (EDINT)</a>. It was also identified as a relevant ontology for the representation of data managed by local entities in the guide <a href="http://femp.femp.es/files/3580-1937-fichero/DATOS%20ABIERTOS%20FEMP%202019.pdf" target="_blank">Datos abiertos FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a>, as also described in the corresponding <a href="https://datos.gob.es/es/conocimiento/datos-abiertos-femp-2019-40-conjuntos-de-datos-publicar-por-las-entidades-locales" target="_blank">data.gob.es note</a>, and therefore included in the <a href="https://github.com/opencitydata" target="_blank">Github repository supporting the initiative</a>, which will be deprecated once this repository is launched.\nAn amplified version of the guide can be found in <a href="https://redtransparenciayparticipacion.es/wp-content/uploads/2025/03/Datos-abiertos-80-conjuntos-de-datos.pdf" target="_blank">DATOS ABIERTOS 80 CONJUNTOS DE DATOS</a>\n
description-en=<span class="markdown">\n<p>Figure 1 captures the general conceptual model of the Public Services Ontology. </p>\n<p><center><img src="../diagrams/diagram.png"/><figcaption>\nFigure 1. Main conceptual model of the Public Services Ontology</figcaption></center></p> \nThe ontology provides a conceptual model for describing public services and administrative procedures offered by local administrations. It is intended to support the harmonised publication of information about municipal services, procedures, requirements, documentation, responsible organisations and administrative interactions.<br><br>\n\nThe model reuses and extends the <a href="https://semiceu.github.io/CPSV-AP/releases/3.0.0">Core Public Service Vocabulary (CPSV)</a>, a vocabulary designed to describe public services in a structured and interoperable way. Following the CPSV pattern, the ontology represents a public service as an activity or function provided by a public organisation in response to the needs of citizens, businesses or other agents. Administrative procedures are represented as formal processes associated with the access, request, management or resolution of those services.<br>\n<br>\n\nThe ontology also reuses elements from the <a href="https://vocab.linkeddata.es/datosabiertos/def/sector-publico/servicio/index-en.html">Vocabulary for the representation of services and administrative procedures offered by a municipality</a>, which also imports CPSV and was developed to describe municipal services and administrative procedures. In particular, this ontology reuses the class <a href="https://vocab.linkeddata.es/datosabiertos/def/sector-publico/servicio/index-en.html#DestinadoProcedimiento"><code>DestinadoProcedimiento</code></a> to represent the target entity of a Public Service.<br><br>\nThe main conceptual elements of the ontology include:<br>\n\n- <a href="#PublicService">Public Service</a>: represents a service provided by a public administration, such as waste collection, citizen assistance, urban planning services or social services.<br>\n- <a href="#AdministrativeProcedure">Administrative Procedure</a>: represents a formal administrative process through which a person or organisation interacts with the administration, for example to submit an application, request a licence, register information, pay a fee, obtain a certificate or lodge a complaint.<br>\n- <a href="#PublicOrganisation">Public Organisation</a>: represents the public body, department or administrative unit responsible for providing a service or managing a procedure.<br>\n- <a href="#Input">Input</a>: represents the information, forms or documents that must be provided to initiate or complete a procedure.<br>\n- <a href="#Output">Output</a>: represents the result produced by a procedure, such as an authorisation, licence, certificate, resolution or registration.<br>\n- <a href="#Rule">Rule</a>: represents the legal, regulatory or administrative framework that governs the provision of a service or the execution of a procedure.<br><br>\n\nIn addition to these core classes, the ontology can be complemented with controlled vocabularies for classifying public service types and administrative procedure types. These controlled vocabularies make it possible to distinguish between the domain of the service, such as public safety, waste management, water supply or urban maintenance, and the type of administrative interaction, such as application, communication, responsible declaration, authorisation, registration, payment, complaint or appeal.<br>\n\n\n<pre><textarea style="resize:none" readonly id="code1" name="code" rows="25" cols="100">\n&lt;http://vocab.linkeddata.es/datosabiertos/recurso/servicio-publico/ServicioLicenciaObraMenor&gt;\n    a edintserpub:PublicService ;\n    rdfs:label "Servicio de licencia de obra menor"@es ;\n    dcterms:description "Servicio municipal que permite a la ciudadanía solicitar autorización para realizar obras menores en viviendas, locales o inmuebles dentro del término municipal."@es ;\n    dcterms:identifier "SP-URB-001" ;\n\n    edintserpub:availability "Disponible durante todo el año a través de la sede electrónica municipal y de la oficina de atención ciudadana."@es ;\n\n    # SKOS skos-PublicServices.ttl\n    edintserpub:typePublicService edintkossertype:servicioObras ;\n\n    # Procedimiento administrativo asociado\n    edintserpub:hasAdministrativeProcedure &lt;http://vocab.linkeddata.es/datosabiertos/recurso/procedimiento-administrativo/ProcedimientoLicenciaObraMenor&gt; ;\n\n    # Área competente\n    edintserpub:hasCompetentAuthority &lt;http://vocab.linkeddata.es/datosabiertos/recurso/area/AreaUrbanismo&gt; ;\n\n    # Punto de contacto\n    cv:contactPoint &lt;http://vocab.linkeddata.es/datosabiertos/recurso/punto-contacto/PuntoContactoUrbanismo&gt; ;\n\n    # Canales\n    cv:hasChannel &lt;http://vocab.linkeddata.es/datosabiertos/recurso/canal/CanalSedeElectronicaUrbanismo&gt; ;\n    cv:hasChannel &lt;http://vocab.linkeddata.es/datosabiertos/recurso/canal/CanalOficinaAtencionCiudadana&gt; ;\n\n    # Regla aplicable\n    cpsv:follows &lt;http://vocab.linkeddata.es/datosabiertos/recurso/regla/OrdenanzaUrbanisticaMunicipal&gt; .\n\n    # SKOS skos-AdministrativeProcedures.ttl\n    edintserpub:typeProcedure edintkosproctype:autorizacionLicencia ;\n\n    edintserpub:resolutionPeriod "P3M"^^xsd:duration ;\n    edintserpub:stateProcedure "Abierto"@es .\n\n\n\n# Organización pública responsable\n&lt;http://vocab.linkeddata.es/datosabiertos/recurso/area/AreaUrbanismo&gt;\n    a cpsv:PublicOrganisation;\n    rdfs:label "Área de Urbanismo del Ayuntamiento de Villa Ejemplo"@es ;\n    dcterms:description "Unidad administrativa responsable de gestionar los servicios y procedimientos municipales en materia urbanística."@es ;\n    dcterms:identifier "ORG-URB-001" .\n\n\n# Punto de contacto\n&lt;http://vocab.linkeddata.es/datosabiertos/recurso/punto-contacto/PuntoContactoUrbanismo&gt;\n    a cv:ContactPoint ;\n    rdfs:label "Punto de contacto del Área de Urbanismo"@es ;\n    schema:email "urbanismo@madrid.es" ;\n    schema:telephone "+34 900 000 001" ;\n    schema:contactType "Información y tramitación urbanística"@es .\n\n# Canal específico de urbanismo\n&lt;http://vocab.linkeddata.es/datosabiertos/recurso/canal/CanalSedeElectronicaUrbanismo&gt;\n    a cv:Channel ;\n    rdfs:label "Sede electrónica municipal para trámites urbanísticos"@es ;\n    schema:url &lt;https://sede.madrid.es/urbanismo/licencia-obra-menor&gt; ;\n    dcterms:description "Canal electrónico para presentar la solicitud de licencia de obra menor y consultar el estado del procedimiento."@es .\n\n# Regla aplicable al procedimiento urbanístico\n&lt;http://vocab.linkeddata.es/datosabiertos/recurso/regla/OrdenanzaUrbanisticaMunicipal&gt;\n    a cpsv:Rule ;\n    rdfs:label "Ordenanza municipal reguladora de actuaciones urbanísticas"@es ;\n    dcterms:description "Norma municipal que regula los requisitos, condiciones y documentación aplicables a la tramitación de licencias urbanísticas."@es ;\n    dcterms:identifier "RULE-URB-001" .\n\n</textarea></pre>\n\n</span>\n
references-en=<span class="markdown">\n<ul>\n    <li><a href="https://edint.es/en/" target="_blank">Data Spaces for Smart Urban Infrastructures (EDINT)</a></li>\n    <li><a href="http://femp.femp.es/files/3580-1937-fichero/DATOS%20ABIERTOS%20FEMP%202019.pdf" target="_blank">Guía Datos abiertos FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a></li>\n    <li><a href="https://datos.gob.es/es/conocimiento/datos-abiertos-femp-2019-40-conjuntos-de-datos-publicar-por-las-entidades-locales" target="_blank">DATOS ABIERTOS FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a> (source: datos.gob.es)</li>\n    <li><a href="https://redtransparenciayparticipacion.es/wp-content/uploads/2025/03/Datos-abiertos-80-conjuntos-de-datos.pdf" target="_blank">DATOS ABIERTOS 80 CONJUNTOS DE DATOS</a></li>\n</ul>\n</span>\n
abstract-es=La Ontología de Servicios Públicos describe conceptos relacionados con los servicios municipales suministrados a la ciudadanía, los trámites administrativos asociados a los servicios, y los roles involucrados.
introduction-es=Esta ontología forma parte del catálogo de ontologías que está siendo desarrollado en el contexto del <a href="https://edint.es/" target="_blank">Espacio de Datos para las Infraestructuras Urbanas Inteligentes (EDINT)</a>. Asimismo, fue identificada como una ontología relevante para la representación de datos gestionados por entidades locales en la guía <a href="http://femp.femp.es/files/3580-1937-fichero/DATOS%20ABIERTOS%20FEMP%202019.pdf" target="_blank">Datos abiertos FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a>, tal y como se describe también en la correspondiente <a href="https://datos.gob.es/es/conocimiento/datos-abiertos-femp-2019-40-conjuntos-de-datos-publicar-por-las-entidades-locales" target="_blank">nota de datos.gob.es</a>, y por tanto recogido en el <a href="https://github.com/opencitydata" target="_blank">repositorio Github de apoyo a la iniciativa</a>, que queda deprecado una vez se lance este repositorio.\nUna versión amplificada de la guía se encuentra en <a href="https://redtransparenciayparticipacion.es/wp-content/uploads/2025/03/Datos-abiertos-80-conjuntos-de-datos.pdf" target="_blank">DATOS ABIERTOS 80 CONJUNTOS DE DATOS</a>\n
description-es=<span class="markdown">\n<p>La Figura 1 muestra el modelo conceptual general de la Ontología de Servicios Públicos.</p>\n<p><center><img src="../diagrams/diagram.png"/><figcaption>\nFigura 1. Modelo conceptual principal de la Ontología de Servicios Públicos</figcaption></center></p> \n\nLa ontología proporciona un modelo conceptual para describir servicios públicos y procedimientos administrativos ofrecidos por administraciones locales. Su objetivo es apoyar la publicación armonizada de información sobre servicios municipales, procedimientos, requisitos, documentación, organizaciones responsables e interacciones administrativas.<br><br>\n\nEl modelo reutiliza y extiende el <a href="https://semiceu.github.io/CPSV-AP/releases/3.0.0">Core Public Service Vocabulary (CPSV)</a>, un vocabulario diseñado para describir servicios públicos de forma estructurada e interoperable. Siguiendo el patrón de CPSV, la ontología representa un servicio público como una actividad o función prestada por una organización pública en respuesta a las necesidades de la ciudadanía, las empresas u otros agentes. Los procedimientos administrativos se representan como procesos formales asociados al acceso, solicitud, gestión o resolución de dichos servicios.<br>\n<br>\n\nLa ontología también reutiliza elementos del <a href="https://vocab.linkeddata.es/datosabiertos/def/sector-publico/servicio/index-es.html">Vocabulario para la representación de trámites, servicios y procedimientos administrativos ofrecidos por un ayuntamiento</a>, que también importa CPSV y fue desarrollado para describir servicios municipales y procedimientos administrativos. En particular, esta ontología reutiliza la clase <a href="https://vocab.linkeddata.es/datosabiertos/def/sector-publico/servicio/index-en.html#DestinadoProcedimiento"><code>DestinadoProcedimiento</code></a> para representar la entidad destinataria de un servicio público.<br><br>\n\nLos principales elementos conceptuales de la ontología incluyen:<br>\n\n- <a href="#PublicService">Servicio público</a>: representa un servicio prestado por una administración pública, como la recogida de residuos, la atención ciudadana, los servicios urbanísticos o los servicios sociales.<br>\n- <a href="#AdministrativeProcedure">Procedimiento administrativo</a>: representa un proceso administrativo formal mediante el cual una persona u organización interactúa con la administración, por ejemplo para presentar una solicitud, pedir una licencia, inscribir información, pagar una tasa, obtener un certificado o presentar una queja.<br>\n- <a href="#PublicOrganisation">Organización pública</a>: representa el organismo, departamento o unidad administrativa responsable de prestar un servicio o gestionar un procedimiento.<br>\n- <a href="#Input">Entrada</a>: representa la información, formularios o documentos que deben aportarse para iniciar o completar un procedimiento.<br>\n- <a href="#Output">Salida</a>: representa el resultado producido por un procedimiento, como una autorización, licencia, certificado, resolución o inscripción registral.<br>\n- <a href="#Rule">Regla</a>: representa el marco legal, normativo o administrativo que regula la prestación de un servicio o la ejecución de un procedimiento.<br><br>\n\nAdemás de estas clases principales, la ontología puede complementarse con vocabularios controlados para clasificar tipos de servicios públicos y tipos de procedimientos administrativos. Estos vocabularios controlados permiten diferenciar entre el ámbito del servicio, como seguridad pública, gestión de residuos, abastecimiento de agua o mantenimiento urbano, y el tipo de interacción administrativa, como solicitud, comunicación, declaración responsable, autorización, inscripción, pago, queja o recurso.<br>\n\n\n<pre><textarea style="resize:none" readonly id="code1" name="code" rows="25" cols="100">\n&lt;http://vocab.linkeddata.es/datosabiertos/recurso/servicio-publico/ServicioLicenciaObraMenor&gt;\n    a edintserpub:PublicService ;\n    rdfs:label "Servicio de licencia de obra menor"@es ;\n    dcterms:description "Servicio municipal que permite a la ciudadanía solicitar autorización para realizar obras menores en viviendas, locales o inmuebles dentro del término municipal."@es ;\n    dcterms:identifier "SP-URB-001" ;\n\n    edintserpub:availability "Disponible durante todo el año a través de la sede electrónica municipal y de la oficina de atención ciudadana."@es ;\n\n    # SKOS skos-PublicServices.ttl\n    edintserpub:typePublicService edintkossertype:servicioObras ;\n\n    # Procedimiento administrativo asociado\n    edintserpub:hasAdministrativeProcedure &lt;http://vocab.linkeddata.es/datosabiertos/recurso/procedimiento-administrativo/ProcedimientoLicenciaObraMenor&gt; ;\n\n    # Área competente\n    edintserpub:hasCompetentAuthority &lt;http://vocab.linkeddata.es/datosabiertos/recurso/area/AreaUrbanismo&gt; ;\n\n    # Punto de contacto\n    cv:contactPoint &lt;http://vocab.linkeddata.es/datosabiertos/recurso/punto-contacto/PuntoContactoUrbanismo&gt; ;\n\n    # Canales\n    cv:hasChannel &lt;http://vocab.linkeddata.es/datosabiertos/recurso/canal/CanalSedeElectronicaUrbanismo&gt; ;\n    cv:hasChannel &lt;http://vocab.linkeddata.es/datosabiertos/recurso/canal/CanalOficinaAtencionCiudadana&gt; ;\n\n    # Regla aplicable\n    cpsv:follows &lt;http://vocab.linkeddata.es/datosabiertos/recurso/regla/OrdenanzaUrbanisticaMunicipal&gt; .\n\n    # SKOS skos-AdministrativeProcedures.ttl\n    edintserpub:typeProcedure edintkosproctype:autorizacionLicencia ;\n\n    edintserpub:resolutionPeriod "P3M"^^xsd:duration ;\n    edintserpub:stateProcedure "Abierto"@es .\n\n\n\n# Organización pública responsable\n&lt;http://vocab.linkeddata.es/datosabiertos/recurso/area/AreaUrbanismo&gt;\n    a cpsv:PublicOrganisation;\n    rdfs:label "Área de Urbanismo del Ayuntamiento de Villa Ejemplo"@es ;\n    dcterms:description "Unidad administrativa responsable de gestionar los servicios y procedimientos municipales en materia urbanística."@es ;\n    dcterms:identifier "ORG-URB-001" .\n\n\n# Punto de contacto\n&lt;http://vocab.linkeddata.es/datosabiertos/recurso/punto-contacto/PuntoContactoUrbanismo&gt;\n    a cv:ContactPoint ;\n    rdfs:label "Punto de contacto del Área de Urbanismo"@es ;\n    schema:email "urbanismo@madrid.es" ;\n    schema:telephone "+34 900 000 001" ;\n    schema:contactType "Información y tramitación urbanística"@es .\n\n# Canal específico de urbanismo\n&lt;http://vocab.linkeddata.es/datosabiertos/recurso/canal/CanalSedeElectronicaUrbanismo&gt;\n    a cv:Channel ;\n    rdfs:label "Sede electrónica municipal para trámites urbanísticos"@es ;\n    schema:url &lt;https://sede.madrid.es/urbanismo/licencia-obra-menor&gt; ;\n    dcterms:description "Canal electrónico para presentar la solicitud de licencia de obra menor y consultar el estado del procedimiento."@es .\n\n# Regla aplicable al procedimiento urbanístico\n&lt;http://vocab.linkeddata.es/datosabiertos/recurso/regla/OrdenanzaUrbanisticaMunicipal&gt;\n    a cpsv:Rule ;\n    rdfs:label "Ordenanza municipal reguladora de actuaciones urbanísticas"@es ;\n    dcterms:description "Norma municipal que regula los requisitos, condiciones y documentación aplicables a la tramitación de licencias urbanísticas."@es ;\n    dcterms:identifier "RULE-URB-001" .\n\n</textarea></pre>\n\n</span>\n
