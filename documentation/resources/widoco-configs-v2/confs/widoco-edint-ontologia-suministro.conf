abstract-en=The purpose of this ontology is to provide a common vocabulary for representing all concepts related to the utilities supplied to the elements of a municipality's infrastructure and the measurement of their consumption. Its scope includes supplies such as electricity, gas, and water, among others, which are part of the routine functions of local authorities.
introduction-en=\nThis ontology is part of the catalog of ontologies that is being developed in the context of the <a href="https://edint.es/" target="_blank">Data Space for Smart Urban Infrastructures (EDINT)</a>. It was also identified as a relevant ontology for the representation of data managed by local entities in the guide <a href="http://femp.femp.es/files/3580-1937-fichero/DATOS%20ABIERTOS%20FEMP%202019.pdf" target="_blank">Datos abiertos FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a>, as also described in the corresponding <a href="https://datos.gob.es/es/conocimiento/datos-abiertos-femp-2019-40-conjuntos-de-datos-publicar-por-las-entidades-locales" target="_blank">data.gob.es note</a>, and therefore included in the <a href="https://github.com/opencitydata" target="_blank">Github repository supporting the initiative</a>, which will be deprecated once this repository is launched.\nAn amplified version of the guide can be found in <a href="https://redtransparenciayparticipacion.es/wp-content/uploads/2025/03/Datos-abiertos-80-conjuntos-de-datos.pdf" target="_blank">DATOS ABIERTOS 80 CONJUNTOS DE DATOS</a>\n
description-en=<span class="markdown"><p>Figure 1 shows the conceptual model of the ontology with its classes and relationships (object properties).</p>\n<p><center><img src="images/diagrama-conceptual.png"/><figcaption>\nFigure 1. Conceptual model of the ontology</figcaption></center></p>\n<p>The ontology reuses sensor-related concepts from the (<a href="https://w3c.github.io/sdw-sosa-ssn/ssn/">Semantic Sensor Network Ontology</a>) to represent the consumption of utilities by an infrastructure element. An <a href="#https://edint.es/def/infraestructura#InfrastructureElement">infrastructure element</a> is any facility or urban element that can have <a href="#UtilitySupplyPoint">utility supply points</a>. These points are <a href="#http://www.w3.org/ns/sosa/FeatureOfInterest">features of interest</a> of the measurements <a href="#http://www.w3.org/ns/sosa/madeBySensor">made with sensors</a>, which in turn <a href="#http://www.w3.org/ns/sosa/observes">observe</a> an <a href="#http://www.w3.org/ns/sosa/ObservableProperty">observable property</a> such as electricity consumption, gas consumption, or water consumption.</p>\n\n<p>A <a href="#UtilityMeter">meter</a> is a sensor that measures the consumption of a utility. The <a href="#UtilityConsumption">consumption of a utility</a> reflects the amount consumed over a certain period of time.</a> To represent the consumption, the ontology of quantities, units, dimensions and types is reused, <a href="https://www.qudt.org/">Quantities, Units, Dimensions and DataTypes Ontology</a>. The consumption value is represented by the class <a href="#http://qudt.org/schema/qudt/QuantityValue">QuantityValue</a> which expresses the magnitude and type of a quantity, and is obtained by multiplying a <a href="#http://qudt.org/schema/qudt/value">numerical value n</a> by a unit of measurement obtained through the property <a href="#http://qudt.org/schema/qudt/hasUnit">hasUnit</a> which is related to the class <a href="#http://qudt.org/schema/qudt/Unit">Unit</a> which in turn contains a catalog of units of measurement, for example kilowatt-hour (unit:KiloW-HR) used to measure electricity consumption. The measured period is represented by the class <a href="#http://www.w3.org/2006/time#Interval">Interval</a> where its start and end times are related to a point in time (<a href="#http://www.w3.org/2006/time#Instant">Instant</a>). The <a href="#https://edint.es/kos/UtilityType">utility type</a> is a taxonomy that includes concepts such as "active energy", "reactive energy", and "gas". The meter has a <a href="#https://edint.es/kos/MeterType">meter type</a> which, for example, for energy consumption, can be "external", "processed", or "telemetry".\nThe <a href="#UtilityContract">service contract</a> has a <a href="#contractHolder">holder</a> and <a href="#appliesTo">applies</a> to a specific supply point. The contract is also associated with a <a href="#UtilityRate">tariff</a>. A utility meter is a sensor that "measures" a property, which could be, for example, the consumption of electricity, gas, or water.</p>\n\n<pre><textarea style="resize:none" readonly id="code2" name="code" rows="25" cols="100">\n@prefix dct: &lt;http://purl.org/dc/terms/&gt; .\n@prefix edintinf: &lt;https://edint.es/def/infraestructura#&gt; .\n@prefix edintmetertype: &lt;https://edint.es/kos/MeterType/&gt; .\n@prefix edintsum: &lt;https://edint.es/def/suministro#&gt; .\n@prefix edintutiltype: &lt;https://edint.es/kos/UtilityType/&gt; .\n@prefix esdir: &lt;http://vocab.linkeddata.es/datosabiertos/def/urbanismo-infraestructuras/direccion-postal#&gt; .\n@prefix ester: &lt;http://vocab.linkeddata.es/datosabiertos/def/sector-publico/territorio#&gt; .\n@prefix geosparql: &lt;http://www.opengis.net/ont/geosparql#&gt; .\n@prefix ma: &lt;http://www.w3.org/ns/ma-ont#&gt; .\n@prefix map: &lt;http://mapping.example.com/&gt; .\n@prefix ql: &lt;http://semweb.mmlab.be/ns/ql#&gt; .\n@prefix qudt: &lt;http://qudt.org/schema/qudt/&gt; .\n@prefix rdf: &lt;http://www.w3.org/1999/02/22-rdf-syntax-ns#&gt; .\n@prefix rdfs: &lt;http://www.w3.org/2000/01/rdf-schema#&gt; .\n@prefix rml: &lt;http://semweb.mmlab.be/ns/rml#&gt; .\n@prefix rr: &lt;http://www.w3.org/ns/r2rml#&gt; .\n@prefix schema: &lt;https://schema.org/&gt; .\n@prefix sd: &lt;http://www.w3.org/ns/sparql-service-description#&gt; .\n@prefix sosa: &lt;http://www.w3.org/ns/sosa/&gt; .\n@prefix time: &lt;http://www.w3.org/2006/time#&gt; .\n@prefix xsd: &lt;http://www.w3.org/2001/XMLSchema#&gt; .\n\n# Utility consumption\n&lt;https://example.org/recurso/ConsumoSuministro/2258.0_2020_03_AMBIBAMMATUTE_General&gt;\n  a edintsum:UtilityConsumption;\n  dct:identifier "2258.0_2020_03_AMBIBAMMATUTE_General";\n  rdfs:label "Consumo de 13099 kWh en 3/2020", "Lectura del sensor AMBIBAMMATUTE_General correspondiente a 3/2020";\n  sosa:hasFeatureOfInterest &lt;https://example.org/recurso/puntoSuministro/ES2002783120652701XX&gt;;\n  sosa:hasResult &lt;https://example.org/recurso/valorSuministro/2258.0_2020_03_AMBIBAMMATUTE_General&gt;;\n  sosa:madeBySensor &lt;https://example.org/recurso/medidorSuministro/AMBIBAMMATUTE_General&gt;;\n  sosa:phenomenonTime &lt;https://example.org/recurso/intervaloMedicion/2258.0_2020_03_AMBIBAMMATUTE_General&gt; .\n\n# Utility contract\n&lt;https://example.org/recurso/contratoSuministo/2258.0&gt; a edintsum:UtilityContract;\n  dct:identifier "Contrato-ES2002783120652701XX";\n  edintsum:appliesTo &lt;https://example.org/recurso/puntoSuministro/ES2002783120652701XX&gt;;\n  edintsum:contractHolder &lt;https://example.org/recurso/organizacion/AyuntamientoDeMadrid&gt;;\n  edintsum:hasRate &lt;https://example.org/recurso/tarifaSuministro/tarifa_activa_general&gt;;\n  rdfs:label "Contrato de suministro de activeenergy situado en CALLE ISAAC ALBENIZ, 1 28019 MADRID",\n    "Contrato de suministro para: Biblioteca Ana María Matute" .\n\n# Postal addrss\n&lt;https://example.org/recurso/direccion-postal/28019&gt; a esdir:DireccionPostal;\n  rdfs:label "CALLE ISAAC ALBENIZ, 1 28019 MADRID" .\n\n# Geometry definition\n&lt;https://example.org/recurso/equipamiento-municipal/locations/438873.92-4472154.36&gt;\n  a geosparql:Geometry;\n  geosparql:asWKT "POINT (-3.7202936410904 40.3977521494866)"^^geosparql:wktLiteral .\n\n# Infrastructure element\n&lt;https://example.org/recurso/equipamientoMunicipal/2258.0&gt; a\n    edintinf:InfrastructureElement;\n  dct:identifier "2258.0";\n  edintinf:belongsTo &lt;https://example.org/recurso/sector-publico/territorio/barrio/113&gt;;\n  edintsum:hasUtilitySupplyPoint &lt;https://example.org/recurso/puntoSuministro/ES2002783120652701XX&gt;;\n  geosparql:hasGeometry &lt;https://example.org/recurso/equipamiento-municipal/locations/438873.92-4472154.36&gt;;\n  rdfs:label "Biblioteca Ana María Matute";\n  schema:address &lt;https://example.org/recurso/direccion-postal/28019&gt; .\n\n# Time instant for the beginning of a time interval\n&lt;https://example.org/recurso/instante/2258.0_2020_03_AMBIBAMMATUTE_General/2020-03-01T00%3A00%3A00Z&gt;\n  a time:Instant;\n  rdfs:label "Instante de tiempo: 2020-03-01T00:00:00Z";\n  time:inXSDDateTimeStamp "2020-03-01T00:00:00Z"^^xsd:dateTimeStamp .\n\n# Time instant for the end of a time interval\n&lt;https://example.org/recurso/instante/2258.0_2020_03_AMBIBAMMATUTE_General/2020-03-31T23%3A59%3A59Z&gt;\n  a time:Instant;\n  rdfs:label "Instante de tiempo: 2020-03-31T23:59:59Z";\n  time:inXSDDateTimeStamp "2020-03-31T23:59:59Z"^^xsd:dateTimeStamp .\n\n# Time interval\n&lt;https://example.org/recurso/intervaloMedicion/2258.0_2020_03_AMBIBAMMATUTE_General&gt;\n  a time:Interval;\n  rdfs:label "Período de medición correspondiente a 3/2020";\n  time:hasBeginning &lt;https://example.org/recurso/instante/2258.0_2020_03_AMBIBAMMATUTE_General/2020-03-01T00%3A00%3A00Z&gt;;\n  time:hasEnd &lt;https://example.org/recurso/instante/2258.0_2020_03_AMBIBAMMATUTE_General/2020-03-31T23%3A59%3A59Z&gt; .\n\n# Utility consumption meter\n&lt;https://example.org/recurso/medidorSuministro/AMBIBAMMATUTE_General&gt;\n  a edintsum:UtilityMeter;\n  dct:identifier "AMBIBAMMATUTE_General";\n  edintsum:hasMeterType edintmetertype:external;\n  rdfs:label "Medidor: AMBIBAMMATUTE_General, Sensor/Medidor de tipo: external";\n  schema:manufacturer &lt;https://example.org/recurso/organizacion/Siemens&gt; .\n\n# Organization that manages the infrastructure element\n&lt;https://example.org/recurso/organizacion/AyuntamientoDeMadrid&gt;\n  a schema:Organization;\n  dct:identifier "AyuntamientoDeMadrid";\n  rdf:label "Ayuntamiento de Madrid";\n  schema:legalName "Ayuntamiento de Madrid" .\n\n# Meter manufacturer\n&lt;https://example.org/recurso/organizacion/Siemens&gt; a schema:Organization;\n  dct:identifier "Siemens";\n  rdfs:label "Fabricante: Siemens" .\n\n# Utility supply point\n&lt;https://example.org/recurso/puntoSuministro/ES2002783120652701XX&gt;\n  a edintsum:UtilitySupplyPoint;\n  dct:identifier "ES2002783120652701XX";\n  edintsum:hasUtilityType edintutiltype:activeenergy;\n  rdfs:label "Punto de Suministro ES2002783120652701XX, Descripción/Grupo: Activa Interruptor Gral" .\n\n# Neighborhood to which the infrastructure element belongs\n&lt;https://example.org/recurso/sector-publico/territorio/barrio/113&gt;\n  a ester:Barrio;\n  dct:identifier "113";\n  rdfs:label "SAN ISIDRO" .\n\n# Utility contract rate\n&lt;https://example.org/recurso/tarifaSuministro/tarifa_activa_general&gt;\n  a edintsum:UtilityRate;\n  dct:identifier "tarifa_activa_general";\n  rdfs:label "Tarifa aplicada para el suministro de activeenergy. Referencia del grupo: Activa Interruptor Gral",\n    "Tarifa de tipo: tarifa_activa_general" .\n\n# Unit of measure\n&lt;https://example.org/recurso/unidad/kWh&gt; a qudt:Unit;\n  rdfs:label "kWh" .\n\n# Consumption value\n&lt;https://example.org/recurso/valorSuministro/2258.0_2020_03_AMBIBAMMATUTE_General&gt;\n  a qudt:QuantityValue;\n  qudt:hasUnit &lt;https://example.org/recurso/unidad/kWh&gt;;\n  qudt:value "13099"^^xsd:float;\n  rdfs:label "Cantidad consumida: 13099 kWh" .\n</textarea></pre>\n<script>\n    var editor2 = CodeMirror.fromTextArea(document.getElementById("code2"), {\n        mode: "text/turtle",\n        matchBrackets: true\n    });\n</script>\nThe example above shows a portion of the RDF knowledge graph for the "Ana María Matute Library". The Supply Point section represents general properties such as the identifier and the type of supply (active energy). The infrastructure element (Municipal Infrastructure Element section) is related to this Supply Point and has a postal address (Postal Address section) and a relationship with its spatial data corresponding to its geographic coordinates (Geometry Definition section). There is a link to the organization that manages this center (Organization that manages the infrastructure element section), which is the Madrid City Council. Information on energy consumption is found in the Supply Consumption section. The consumption of 13,099 kWh occurred in March 2020.\n</span>\n
references-en=<span class="markdown">\n<ul>\n    <li><a href="https://edint.es/en/" target="_blank">Data Spaces for Smart Urban Infrastructures (EDINT)</a></li>\n    <li><a href="http://femp.femp.es/files/3580-1937-fichero/DATOS%20ABIERTOS%20FEMP%202019.pdf" target="_blank">Guía Datos abiertos FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a></li>\n    <li><a href="https://datos.gob.es/es/conocimiento/datos-abiertos-femp-2019-40-conjuntos-de-datos-publicar-por-las-entidades-locales" target="_blank">DATOS ABIERTOS FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a> (source: datos.gob.es)</li>\n    <li><a href="https://redtransparenciayparticipacion.es/wp-content/uploads/2025/03/Datos-abiertos-80-conjuntos-de-datos.pdf" target="_blank">DATOS ABIERTOS 80 CONJUNTOS DE DATOS</a></li>\n</ul>\n</span>\n
abstract-es=El propósito de esta ontología es el de proporcionar un vocabulario común para la representación de todos los conceptos relacionados con los servicios suministrados a los elementos de la infraestructura de un municipio y la medición de su consumo. Su alcance es el de suministros como electricidad, gas, agua, entre otros, que son parte de las funciones habituales de las entidades locales.
introduction-es=Esta ontología forma parte del catálogo de ontologías que está siendo desarrollado en el contexto del <a href="https://edint.es/" target="_blank">Espacio de Datos para las Infraestructuras Urbanas Inteligentes (EDINT)</a>. Asimismo, fue identificada como una ontología relevante para la representación de datos gestionados por entidades locales en la guía <a href="http://femp.femp.es/files/3580-1937-fichero/DATOS%20ABIERTOS%20FEMP%202019.pdf" target="_blank">Datos abiertos FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a>, tal y como se describe también en la correspondiente <a href="https://datos.gob.es/es/conocimiento/datos-abiertos-femp-2019-40-conjuntos-de-datos-publicar-por-las-entidades-locales" target="_blank">nota de datos.gob.es</a>, y por tanto recogido en el <a href="https://github.com/opencitydata" target="_blank">repositorio Github de apoyo a la iniciativa</a>, que queda deprecado una vez se lance este repositorio.\nUna versión amplificada de la guía se encuentra en <a href="https://redtransparenciayparticipacion.es/wp-content/uploads/2025/03/Datos-abiertos-80-conjuntos-de-datos.pdf" target="_blank">DATOS ABIERTOS 80 CONJUNTOS DE DATOS</a>\n
description-es=<span class="markdown"><p>En la Figura 1 se muestra el modelo conceptual de la ontología con sus clases y relaciones (propiedades de objeto).</p>\n<p><center><img src="images/diagrama-conceptual.png"/><figcaption>\nFigura 1. Modelo conceptual de la ontología</figcaption></center></p>\n<p>La ontología reutiliza conceptos relacionados a sensores de la (<a href="https://w3c.github.io/sdw-sosa-ssn/ssn/">Semantic Sensor Network Ontology</a>) para representar el consumo de suministros de un elemento de la infraestructura. Un <a href="#https://edint.es/def/infraestructura#InfrastructureElement">elemento de la infraestructura</a> es cualquier equipamiento o elemento urbano que puede tener  <a href="#UtilitySupplyPoint">puntos de suministro de servicios</a>.  Estos puntos  son <a href="#http://www.w3.org/ns/sosa/FeatureOfInterest">características de interés</a> de las mediciones\n <a href="#http://www.w3.org/ns/sosa/madeBySensor">hechas con sensores</a>, que a su vez <a href="#http://www.w3.org/ns/sosa/observes">observan</a> una <a href="#http://www.w3.org/ns/sosa/ObservableProperty">propiedad observable</a> tal como el consumo de electricidad, el consumo de gas o el consumo de agua.</p>\n\n<p>Un <a href="#UtilityMeter">medidor</a> es un sensor que mide el consumo del suministro. Los <a href="#UtilityConsumption">consumos de un suministro</a> reflejan la cantidad consumida en cierto período de tiempo. Para representar los consumos se reutiliza la ontología de cantidades, unidades, dimensiones y tipos, <a href="https://www.qudt.org/">Quantities, Units, Dimensions and DataTypes Ontology</a>. El valor del consumo se representa mediante la clase  <a href="#http://qudt.org/schema/qudt/QuantityValue">QuantityValue</a> que expresa la magnitud y el tipo de una cantidad y se obtiene multiplicando un <a href="#http://qudt.org/schema/qudt/value">valor numérico n</a> por una unidad de medida que se obtiene a través de la propiedad <a href="#http://qudt.org/schema/qudt/hasUnit">hasUnit</a> que se relaciona con la clase <a href="#http://qudt.org/schema/qudt/Unit">Unit</a> que contiene un catálogo de uniddes de medida, por ejempo kilovatio-hora (unit:KiloW-HR) utilizado para medir el consumo de electricidad.  El período medido se representa mediante la clase  <a href="#http://www.w3.org/2006/time#Interval">Interval</a> en donde su hora de inicio y hora de fin se relacionan con un instante de tiempo (<a href="#http://www.w3.org/2006/time#Instant">Instant</a>). El <a href="#https://edint.es/kos/UtilityType">tipo de suministro</a> es una taxonomía en donde se tienen conceptos como "energía activa", "energía reactiva" y "gas".  El medidor tiene un <a href="#https://edint.es/kos/MeterType">tipo de medidor</a> que por ejemplo para consumo de energía puede ser "externo", "procesado" o "telemedida". \nEl <a href="#UtilityContract">contrato de servicio</a> tiene un <a href="#contractHolder">titular</a> y se <a href="#appliesTo">aplica</a> un determinado punto de suministro. El contrato también se asocia con una <a href="#UtilityRate">tarifa</a>. Un medidor de suministro es un sensor que "observa" una propiedad que puede ser por ejemplo el consumo de electricidad, gas o agua.</p>\n\n<pre><textarea style="resize:none" readonly id="code2" name="code" rows="25" cols="100">\n@prefix dct: &lt;http://purl.org/dc/terms/&gt; .\n@prefix edintinf: &lt;https://edint.es/def/infraestructura#&gt; .\n@prefix edintmetertype: &lt;https://edint.es/kos/MeterType/&gt; .\n@prefix edintsum: &lt;https://edint.es/def/suministro#&gt; .\n@prefix edintutiltype: &lt;https://edint.es/kos/UtilityType/&gt; .\n@prefix esdir: &lt;http://vocab.linkeddata.es/datosabiertos/def/urbanismo-infraestructuras/direccion-postal#&gt; .\n@prefix ester: &lt;http://vocab.linkeddata.es/datosabiertos/def/sector-publico/territorio#&gt; .\n@prefix geosparql: &lt;http://www.opengis.net/ont/geosparql#&gt; .\n@prefix ma: &lt;http://www.w3.org/ns/ma-ont#&gt; .\n@prefix map: &lt;http://mapping.example.com/&gt; .\n@prefix ql: &lt;http://semweb.mmlab.be/ns/ql#&gt; .\n@prefix qudt: &lt;http://qudt.org/schema/qudt/&gt; .\n@prefix rdf: &lt;http://www.w3.org/1999/02/22-rdf-syntax-ns#&gt; .\n@prefix rdfs: &lt;http://www.w3.org/2000/01/rdf-schema#&gt; .\n@prefix rml: &lt;http://semweb.mmlab.be/ns/rml#&gt; .\n@prefix rr: &lt;http://www.w3.org/ns/r2rml#&gt; .\n@prefix schema: &lt;https://schema.org/&gt; .\n@prefix sd: &lt;http://www.w3.org/ns/sparql-service-description#&gt; .\n@prefix sosa: &lt;http://www.w3.org/ns/sosa/&gt; .\n@prefix time: &lt;http://www.w3.org/2006/time#&gt; .\n@prefix xsd: &lt;http://www.w3.org/2001/XMLSchema#&gt; .\n\n# Consumo de un suministro\n&lt;https://example.org/recurso/ConsumoSuministro/2258.0_2020_03_AMBIBAMMATUTE_General&gt;\n  a edintsum:UtilityConsumption;\n  dct:identifier "2258.0_2020_03_AMBIBAMMATUTE_General";\n  rdfs:label "Consumo de 13099 kWh en 3/2020", "Lectura del sensor AMBIBAMMATUTE_General correspondiente a 3/2020";\n  sosa:hasFeatureOfInterest &lt;https://example.org/recurso/puntoSuministro/ES2002783120652701XX&gt;;\n  sosa:hasResult &lt;https://example.org/recurso/valorSuministro/2258.0_2020_03_AMBIBAMMATUTE_General&gt;;\n  sosa:madeBySensor &lt;https://example.org/recurso/medidorSuministro/AMBIBAMMATUTE_General&gt;;\n  sosa:phenomenonTime &lt;https://example.org/recurso/intervaloMedicion/2258.0_2020_03_AMBIBAMMATUTE_General&gt; .\n\n# Contrato de suministro\n&lt;https://example.org/recurso/contratoSuministo/2258.0&gt; a edintsum:UtilityContract;\n  dct:identifier "Contrato-ES2002783120652701XX";\n  edintsum:appliesTo &lt;https://example.org/recurso/puntoSuministro/ES2002783120652701XX&gt;;\n  edintsum:contractHolder &lt;https://example.org/recurso/organizacion/AyuntamientoDeMadrid&gt;;\n  edintsum:hasRate &lt;https://example.org/recurso/tarifaSuministro/tarifa_activa_general&gt;;\n  rdfs:label "Contrato de suministro de activeenergy situado en CALLE ISAAC ALBENIZ, 1 28019 MADRID",\n    "Contrato de suministro para: Biblioteca Ana María Matute" .\n\n# Dirección postal\n&lt;https://example.org/recurso/direccion-postal/28019&gt; a esdir:DireccionPostal;\n  rdfs:label "CALLE ISAAC ALBENIZ, 1 28019 MADRID" .\n\n# Definición de la Geometría\n&lt;https://example.org/recurso/equipamiento-municipal/locations/438873.92-4472154.36&gt;\n  a geosparql:Geometry;\n  geosparql:asWKT "POINT (-3.7202936410904 40.3977521494866)"^^geosparql:wktLiteral .\n\n# Elemento de la infraestructura municipal\n&lt;https://example.org/recurso/equipamientoMunicipal/2258.0&gt; a\n    edintinf:InfrastructureElement;\n  dct:identifier "2258.0";\n  edintinf:belongsTo &lt;https://example.org/recurso/sector-publico/territorio/barrio/113&gt;;\n  edintsum:hasUtilitySupplyPoint &lt;https://example.org/recurso/puntoSuministro/ES2002783120652701XX&gt;;\n  geosparql:hasGeometry &lt;https://example.org/recurso/equipamiento-municipal/locations/438873.92-4472154.36&gt;;\n  rdfs:label "Biblioteca Ana María Matute";\n  schema:address &lt;https://example.org/recurso/direccion-postal/28019&gt; .\n\n# Instante de tiempo de comienzo de un intervalo\n&lt;https://example.org/recurso/instante/2258.0_2020_03_AMBIBAMMATUTE_General/2020-03-01T00%3A00%3A00Z&gt;\n  a time:Instant;\n  rdfs:label "Instante de tiempo: 2020-03-01T00:00:00Z";\n  time:inXSDDateTimeStamp "2020-03-01T00:00:00Z"^^xsd:dateTimeStamp .\n\n# Instante de tiempo de final de un intervalo\n&lt;https://example.org/recurso/instante/2258.0_2020_03_AMBIBAMMATUTE_General/2020-03-31T23%3A59%3A59Z&gt;\n  a time:Instant;\n  rdfs:label "Instante de tiempo: 2020-03-31T23:59:59Z";\n  time:inXSDDateTimeStamp "2020-03-31T23:59:59Z"^^xsd:dateTimeStamp .\n\n# Intervalo de tiempo\n&lt;https://example.org/recurso/intervaloMedicion/2258.0_2020_03_AMBIBAMMATUTE_General&gt;\n  a time:Interval;\n  rdfs:label "Período de medición correspondiente a 3/2020";\n  time:hasBeginning &lt;https://example.org/recurso/instante/2258.0_2020_03_AMBIBAMMATUTE_General/2020-03-01T00%3A00%3A00Z&gt;;\n  time:hasEnd &lt;https://example.org/recurso/instante/2258.0_2020_03_AMBIBAMMATUTE_General/2020-03-31T23%3A59%3A59Z&gt; .\n\n# Medidor de consumo de un suministro\n&lt;https://example.org/recurso/medidorSuministro/AMBIBAMMATUTE_General&gt;\n  a edintsum:UtilityMeter;\n  dct:identifier "AMBIBAMMATUTE_General";\n  edintsum:hasMeterType edintmetertype:external;\n  rdfs:label "Medidor: AMBIBAMMATUTE_General, Sensor/Medidor de tipo: external";\n  schema:manufacturer &lt;https://example.org/recurso/organizacion/Siemens&gt; .\n\n# Organización que gestiona el elemento de la infraestructura\n&lt;https://example.org/recurso/organizacion/AyuntamientoDeMadrid&gt;\n  a schema:Organization;\n  dct:identifier "AyuntamientoDeMadrid";\n  rdf:label "Ayuntamiento de Madrid";\n  schema:legalName "Ayuntamiento de Madrid" .\n\n# Organización fabricante del medidor\n&lt;https://example.org/recurso/organizacion/Siemens&gt; a schema:Organization;\n  dct:identifier "Siemens";\n  rdfs:label "Fabricante: Siemens" .\n\n# Punto de suministro\n&lt;https://example.org/recurso/puntoSuministro/ES2002783120652701XX&gt;\n  a edintsum:UtilitySupplyPoint;\n  dct:identifier "ES2002783120652701XX";\n  edintsum:hasUtilityType edintutiltype:activeenergy;\n  rdfs:label "Punto de Suministro ES2002783120652701XX, Descripción/Grupo: Activa Interruptor Gral" .\n\n# Barrio al que pertenece el elemento de la infraestructura\n&lt;https://example.org/recurso/sector-publico/territorio/barrio/113&gt;\n  a ester:Barrio;\n  dct:identifier "113";\n  rdfs:label "SAN ISIDRO" .\n\n# Tarifa del contrato de suministro\n&lt;https://example.org/recurso/tarifaSuministro/tarifa_activa_general&gt;\n  a edintsum:UtilityRate;\n  dct:identifier "tarifa_activa_general";\n  rdfs:label "Tarifa aplicada para el suministro de activeenergy. Referencia del grupo: Activa Interruptor Gral",\n    "Tarifa de tipo: tarifa_activa_general" .\n\n# Unidad de medida\n&lt;https://example.org/recurso/unidad/kWh&gt; a qudt:Unit;\n  rdfs:label "kWh" .\n\n# Valor del consumo\n&lt;https://example.org/recurso/valorSuministro/2258.0_2020_03_AMBIBAMMATUTE_General&gt;\n  a qudt:QuantityValue;\n  qudt:hasUnit &lt;https://example.org/recurso/unidad/kWh&gt;;\n  qudt:value "13099"^^xsd:float;\n  rdfs:label "Cantidad consumida: 13099 kWh" .\n</textarea></pre>\n<script>\n    var editor2 = CodeMirror.fromTextArea(document.getElementById("code2"), {\n        mode: "text/turtle",\n        matchBrackets: true\n    });\n</script>\nEn el ejemplo anterior se muestra una porción del grafo de conocimiento en RDF para la "Biblioteca Ana María Matute". En la sección de Punto de sumninistro se representan propiedades generales tales como el identificador y el tipo de suministro (energía activa). El elemento de la infraestructura (Sección Elemento de la infraestructura municipal) está relacionado con este Punto de suministro y tiene una  dirección postal (Sección Dirección postal) y una relación con sus datos espaciales que corresponden a sus coordenadas geográficas (Sección Definición de la Geometría). Se tiene un enlace a la organización que gestiona ese centro (Sección Organización que gestiona el elemento de la infraestructura) que es el Ayuntamiento de Madrid. La información sobre el consumo de energía se encuentra en  la Sección Consumo de un suministro. El consumo de 13099 kWh se ha realizado en el mes de marzo del año 2020.\n</span>\n
