abstract-en=The purpose of the traffic ontology is to represent vehicle traffic measurement data for a city, as well as planned and unplanned incidents that may occur. It also includes observations of specific vehicle speed and access controls.
introduction-en=\nThis ontology is part of the catalog of ontologies that is being developed in the context of the <a href="https://edint.es/" target="_blank">Data Space for Smart Urban Infrastructures (EDINT)</a>. It was also identified as a relevant ontology for the representation of data managed by local entities in the guide <a href="http://femp.femp.es/files/3580-1937-fichero/DATOS%20ABIERTOS%20FEMP%202019.pdf" target="_blank">Datos abiertos FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a>, as also described in the corresponding <a href="https://datos.gob.es/es/conocimiento/datos-abiertos-femp-2019-40-conjuntos-de-datos-publicar-por-las-entidades-locales" target="_blank">data.gob.es note</a>, and therefore included in the <a href="https://github.com/opencitydata" target="_blank">Github repository supporting the initiative</a>, which will be deprecated once this repository is launched.\nAn amplified version of the guide can be found in <a href="https://redtransparenciayparticipacion.es/wp-content/uploads/2025/03/Datos-abiertos-80-conjuntos-de-datos.pdf" target="_blank">DATOS ABIERTOS 80 CONJUNTOS DE DATOS</a>\n
description-en=<span class="markdown"><p>This vocabulary represents traffic information for cities, which includes motor vehicles and excludes other types of vehicles or pedestrians.</p>\n<p>Therefore, the scope of this vocabulary is defined as follows:</p>\n<ul>\n<li>Traffic equipment, including traffic measurement devices and those for specific vehicle observations (e.g., speed cameras): measurements they obtain, location of the devices, and road sections they measure.</li>\n<li>Traffic-related incidents on public roads.</li>\n<li>Section observed by the device or where the incident occurs.</li>\n</ul>\n<p>Figure 1 shows the classes and properties of traffic equipment that perform the measurements.\n<div><center><img src="images/diagrama-conceptual-sensors.png" alt="Conceptual diagram of the sensors"/><figcaption>Figure 1. - Conceptual diagram of traffic equipment.</figcaption></center></div>\n</p>\n\n<p>To represent the equipment, the concept <a href="#TrafficEquipment">Traffic Equipment</a> has been created, which is related through the property <a href="#trafficEquipmentType">Traffic Equipment Type</a> to a concept in the corresponding <a href="#https://edint.es/kos/TrafficEquipmentType">taxonomy</a>. It has the following properties: a device identifier <a href="#http://purl.org/dc/terms/identifier" >dct:identifier</a>, a description <a href="#http://purl.org/dc/terms/description">dct:description</a>, <a href="#numDirections" >number of directions of traffic</a> it serves, the <a href="#numLanes">number of lanes</a>, and whether it is urban or not (<a href="#urban" >edinttraf:urban</a>).\n\n<p>The device  <a href="#monitors">monitors</a> a <a href="#StreetSection">section</a>, which is a class used to describe both the sections monitored by the devices and the sections of road affected by an <a href="#Incident">Incident</a>. There are two types of traffic equipment: <a href="#ControlEquipment">traffic control equipment</a> that performs measurements on specific vehicles and <a href="TrafficMeasurementDevice">traffic measurement devices</a>. Both, with their corresponding subtypes, are defined in the aforementioned traffic equipment type taxonomy. The class representing traffic devices is itself a subclass of <a href="#http://www.w3.org/ns/sosa/Sensor">sosa:Sensor</a> of the <a href="https://www.w3.org/TR/vocab-ssn/">SSN (Semantic Sensors Network Ontology)</a>.</p>\n\n<p>A traffic device <a href="#http://www.w3.org/ns/sosa/observes">observes</a> a <a href="#TrafficProperty">traffic property</a> that is a subclass of <a href="#http://www.w3.org/ns/sosa/ObservableProperty">sosa:ObservableProperty</a>.</p> Specifically, the traffic measurement device has attributes that indicate whether it is in service or not (<a href="#inService">inService</a>) and the measurement frequency (<a href="#measurementFrequency">measurementFrequency</a>).\n\nThe class representing traffic measurement properties has several instances that are the defined measurements: <a href="#intensity">intensity</a>, <a href="#occupation">occupancy</a>, <a href="#load">load</a>, <a href="#speed">speed</a>, <a href="#level">level</a>, <a href="#composition">composition</a>, <a href="#density">density</a>, and <a href="#vehicleAccess">vehicle access</a>.\n\nThe class <a href="#TrafficObservation">traffic observation</a> is a subclass of <a href="#http://www.w3.org/ns/sosa/Observation">sosa:Observation</a>, which has a  <a href="#validated">validated</a> property that represents whether the observation has been validated or not. The time at which the observation was made is expressed through the property <a href="#http://www.w3.org/ns/sosa/phenomenonTime">sosa:phenomenonTime</a>, which links to the class <a href="#http://www.w3.org/2006/time#TemporalEntity">time:TemporalEntity</a>, which represents a time interval or a point in time. Finally, the observation has a feature of interest <a href="#https://www.w3.org/ns/sosa/hasFeatureOfInterest">sosa:hasFeatureOfInterest</a> which is a specific <a href="#TrafficObservationPoint">traffic observation point</a> where the observation is made.</p>\n<!-- INCIDENT -->\n\n<p>Figure 2 shows the classes and properties of traffic incidents.\n\n<div><center><img src="images/diagrama-conceptual-incident.png" alt="Conceptual diagram of traffic incidents"/><figcaption>Figure 2. - Conceptual diagram of traffic incidents.</figcaption></center></div>\n\n</p>\n\n<p>The main concept in this figure is the <a href="#Incident">incident</a>, which is related to the <a href="#StreetSection">section</a> through the <a href="#incidentInSection">incident in section</a> property.\n\n<p> Since it is a subclass of <a href="#http://www.opengis.net/ont/geosparql#Feature">geosparql:Feature</a>, it has the property <a href="#http://www.opengis.net/ont/geosparql#hasGeometry">geosparql:hasGeometry</a> that links to its location at a geographic point <a href="#http://www.opengis.net/ont/sf#Point">sf:Point</a> whose attributes are its coordinates. It is also related to the taxonomy of <a href="#https://edint.es/kos/IncidentType">incident types</a> through the property <a href="#incidentType">incident type</a>.\n\n\nThe <a href="#Incident">edinttraf:Incident</a> has an identifier <a href="#http://purl.org/dc/terms/identifier">dct:identifier</a>, a description <a href="#http://purl.org/dc/terms/description">dct:description</a>, a start date <a href="#https://schema.org/startDate">schema:startDate</a>, an end date <a href="#https://schema.org/endDate">schema:endDate</a>, the <a href="#numDirections">number of directions it affects</a> and the <a href="#numLanes">number of lanes</a>. \nIt has two subclasses: <a href="#PlannedIncident">planned incident</a> and <a href="#UnplannedIncident">unplanned incident</a>, for incidents that occurred unexpectedly.</p>\n\n<p>To facilitate understanding the use of some classes and properties in this vocabulary, some examples are provided below:</p>\n\n<h4>Traffic Equipment</h4>\n\n<p>First, for the representation of traffic equipment, the equipment has an identifier, a description, and, if it is a measuring device, whether it is in service and the measurement frequency. It can also be specified how many directions the device monitors, how many lanes, and whether it is urban or non-urban equipment.\nIt is linked through the traffic equipment type property to the corresponding device type in the traffic equipment type taxonomy, in this case, pneumatic tube.</p>\n\n<pre><textarea style="resize:none" readonly id="code2" name="code" rows="25" cols="100">\n  &lt;https://example.org/recurso/equipotrafico/100&gt; a edinttraf:TrafficMeasurementDevice ;\n    dct:identifier "100"^^xsd:string ;\n    dct:description "C. GRAN VIA;San Bernardo-Garcia Molinas;San Bernardo"^^xsd:string ;\n    sosa:observes &lt;https://example.org/recurso/carga&gt; ;\n    edinttraf:numDirections "2"^^xsd:int ;\n    edinttraf:numCLanes "8"^^xsd:integer ;\n    edinttraf:urban "true"^^xsd:boolean ;\n    edinttraf:inService "true"^^xsd:boolean ;\n    edinttraf:measurementFrequency "5 minutos"^^xsd:string ;\n    edinttraf:monitors &lt;https://example.org/recurso/tramo/100&gt; ;\n    edinttraf:trafficEquipmentType &lt;https://edint.es/kos/trafficequipment/tubo-neumatico&gt; .\n  </textarea></pre>\n  <script>\n      var editor2 = CodeMirror.fromTextArea(document.getElementById("code2"), {\n          mode: "text/turtle",\n          matchBrackets: true\n      });\n       editor2.setSize(null, "200px"); // ancho automático, altura menor\n  </script>\n\n<h4>Traffic Observation</h4>\n\n<p>The traffic observation class is related to the "load" property through the sosa:observedProperty property. The validated property indicates whether the data has been validated or not. The sosa:phenomenonTime property, which is related to the time:TemporalEntity class as explained previously, is used to represent the data recording interval.</p>\n\n<p>Observation:</p>\n  <pre><textarea style="resize:none" readonly id="code3" name="code" rows="25" cols="100">\n   &lt;https://example.org/recurso/observaciontrafico/20200423114500&gt; a edinttraf:ObservacionTrafico ;\n    dct:identifier "100-20200423114500"^^xsd:string ;\n    sosa:resultTime "2020-04-23T11:45:00+02:00"^^xsd:dateTime ;\n    sosa:hasResult  &lt;https://example.org/recurso/quantityvalue/20200423114500&gt;;\n    edinttraf:validated "true"^^xsd:boolean ;\n    sosa:madeBySensor &lt;https://example.org/recurso/equipo-trafico/100&gt; ;\n    sosa:observedProperty &lt;https://example.org/recurso/carga&gt; ;\n    sosa:hasFeatureOfInterest &lt;https://example.org/recurso/punto-observacion-trafico/1234&gt; ;\n    sosa:phenomenonTime &lt;https://example.org/recurso/interval/20200423114500&gt; .\n  </textarea></pre>\n  <script>\n      var editor2 = CodeMirror.fromTextArea(document.getElementById("code3"), {\n          mode: "text/turtle",\n          matchBrackets: true\n      });\n      editor2.setSize(null, "160px"); // ancho automático, altura menor\n  </script>\n\n  <p>Observation interval:</p>\n  <pre><textarea style="resize:none" readonly id="code4" name="code" rows="25" cols="100">\n    &lt;https://example.org/recurso/interval/20200423114500&gt; a time:Interval ;\n    time:hasBegining &lt;https://example.org/recurso/instant/20200423114455&gt; ;\n    time:hasEnd &lt;https://example.org/recurso/instant/202004231145000&gt; .\n\n    &lt;https://example.org/recurso/instant/20200423114455&gt; a time:Instant ;\n    time:inXSDgYearMonth "2020-04-23T11:44:55+02:00"^^xsd:dateTime .\n\n    &lt;https://example.org/recurso/instant/20200423114500&gt; a time:Instant ;\n    time:inXSDgYearMonth "2020-04-23T11:45:00+02:00"^^xsd:dateTime .\n    </textarea></pre>\n    <script>\n        var editor2 = CodeMirror.fromTextArea(document.getElementById("code4"), {\n            mode: "text/turtle",\n            matchBrackets: true\n        });\n        editor2.setSize(null, "160px"); // ancho automático, altura menor\n    </script>\n\n    <h4>Where it appears</h4>\n\n<p>This Observation appears via sosa:hasFeatureOfInterest which relates to the traffic observation point.</p>\n<pre><textarea style="resize:none" readonly id="code5" name="code" rows="25" cols="100">\n    &lt;https://example.org/recurso/punto-observacion-trafico/1234&gt;; a edinttraf:TrafficObservationPoint ;\n    geosparql:hasGeometry &lt;https://example.org/recurso/point/100&gt; ;\n    geo:lat &lt;https://example.org/recurso/point/100&gt; ;\n    geo:long &lt;https://example.org/recurso/point/101&gt; ;.\n  </textarea></pre>\n  <script>\n      var editor2 = CodeMirror.fromTextArea(document.getElementById("code5"), {\n          mode: "text/turtle",\n          matchBrackets: true\n      });\n      editor2.setSize(null, "100px"); // ancho automático, altura menor\n  </script>\n  <h4>Incident</h4>\n\n<p>To represent an incident, an instance of the Incident class has been created, which has the properties described above: an incident creation date, a start date, an end date, a projected end date, the number of directions, the number of lanes, whether it is recurring, and if so, the reason for the recurrence.</p>\n<pre><textarea style="resize:none" readonly id="code6" name="code" rows="25" cols="100">\n    &lt;https://example.org/recurso/incidenciaplanificada/1000&gt; a edinttraf:Incidencia ;\n    dct:identifier "1000"^^xsd:string ;\n    dct:description "EXP-2020/22329 Plaza Humilladero-Almendro"^^xsd:string ;\n    schema:startDate "2020-03-12T16:00:00+02:00"^^xsd:dateTime ;\n    schema:endDate "2020-03-13T23:00:00+02:00"^^xsd:dateTime ;\n    edinttraf:expectedEndDate "2028-03-08T23:00:00+02:00"^^xsd:dateTime ;\n    edinttraf:numDirections "1"^^xsd:integer ;\n    edinttraf:numLanes "3"^^xsd:integer ;\n    edinttraf:isRecurrent "true"^^xsd:boolean ;\n    edinttraf:recurrence "Excursión juvenil" ;\n    edinttraf:incidentType &lt;https://edint.es/kos/IncidentType/evento&gt; ;\n    geosparql:hasGeometry\n    &lt;https://example.org/recurso/point/1000&gt; ;\n    edinttraf:incidentInSection &lt;https://example.org/recurso/tramo/1000&gt; .\n  </textarea></pre>\n  <script>\n      var editor2 = CodeMirror.fromTextArea(document.getElementById("code6"), {\n          mode: "text/turtle",\n          matchBrackets: true\n      });\n      editor2.setSize(null, "230px"); // ancho automático, altura menor\n  </script>\n</span>\n\n\n\n
references-en=<span class="markdown">\n<ul>\n    <li><a href="https://edint.es/en/" target="_blank">Data Spaces for Smart Urban Infrastructures (EDINT)</a></li>\n    <li><a href="http://femp.femp.es/files/3580-1937-fichero/DATOS%20ABIERTOS%20FEMP%202019.pdf" target="_blank">Guía Datos abiertos FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a></li>\n    <li><a href="https://datos.gob.es/es/conocimiento/datos-abiertos-femp-2019-40-conjuntos-de-datos-publicar-por-las-entidades-locales" target="_blank">DATOS ABIERTOS FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a> (source: datos.gob.es)</li>\n    <li><a href="https://redtransparenciayparticipacion.es/wp-content/uploads/2025/03/Datos-abiertos-80-conjuntos-de-datos.pdf" target="_blank">DATOS ABIERTOS 80 CONJUNTOS DE DATOS</a></li>\n</ul>\n</span>\n
abstract-es=El propósito de esta ontología de Tráfico es representar los datos de medición del tráfico de vehículos de una ciudad así como las incidencias planificadas y no planificadas que pueden ocurrir. Incluye también las observaciones de control de velocidad y acceso de vehículo específicos.
introduction-es=Esta ontología forma parte del catálogo de ontologías que está siendo desarrollado en el contexto del <a href="https://edint.es/" target="_blank">Espacio de Datos para las Infraestructuras Urbanas Inteligentes (EDINT)</a>. Asimismo, fue identificada como una ontología relevante para la representación de datos gestionados por entidades locales en la guía <a href="http://femp.femp.es/files/3580-1937-fichero/DATOS%20ABIERTOS%20FEMP%202019.pdf" target="_blank">Datos abiertos FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a>, tal y como se describe también en la correspondiente <a href="https://datos.gob.es/es/conocimiento/datos-abiertos-femp-2019-40-conjuntos-de-datos-publicar-por-las-entidades-locales" target="_blank">nota de datos.gob.es</a>, y por tanto recogido en el <a href="https://github.com/opencitydata" target="_blank">repositorio Github de apoyo a la iniciativa</a>, que queda deprecado una vez se lance este repositorio.\nUna versión amplificada de la guía se encuentra en <a href="https://redtransparenciayparticipacion.es/wp-content/uploads/2025/03/Datos-abiertos-80-conjuntos-de-datos.pdf" target="_blank">DATOS ABIERTOS 80 CONJUNTOS DE DATOS</a>\n
description-es=<span class="markdown"><p>Este vocabulario representa la información de tráfico de las ciudades, lo cual comprende los vehículos motorizados y excluye otro tipo de vehículos o transeúntes.</p>\n  <p>Por tanto se define el alcance de este vocabulario en:</p>\n  <ul>\n    <li>Equipos de tráfico, incluidos los dispositivos de medición de tráfico y los de observaciones específicas de vehículos (por ejemplo, radares para velocidad): medidas que obtienen, ubicación de los dispositivos, tramos de vía que miden.</li>\n    <li>Incidencias relacionadas con el tráfico en la vía pública.</li>\n    <li>Tramo que observa el dispositivo o donde se produce la incidencia.</li>\n  </ul>\n  \n  <p>La Figura 1 muestra las clases y propiedades de los equipos de tráfico que realizan las mediciones.\n  <div><center><img src="images/diagrama-conceptual-sensors.png" alt="Diagrama conceptual de los sensores"/><figcaption>Figura 1. - Diagrama conceptual de los equipos de tráfico.</figcaption></center></div>\n</p>\n\n  <p>Para representar los equipos se ha creado el concepto <a href="#TrafficEquipment">Equipo de tráfico</a> que se relaciona a través de la propiedad <a href="#trafficEquipmentType">tipo de equipo de tráfico</a> con un concepto de la  <a href="#https://edint.es/kos/TrafficEquipmentType">taxonomía</a> correspondiente. Tiene como propiedades un identificador del equipo <a href="#http://purl.org/dc/terms/identifier" >dct:identifier</a>, una descripción <a href="#http://purl.org/dc/terms/description">dct:description</a>,  <a href="#numDirections" >número de sentidos de circulación</a> a los que sirve, el <a href="#numLanes">número de carriles</a> y si es urbano o no (<a href="#urban" >edinttraf:urbano</a>).Lo</p>\n\n  <p>El equipo monitorea <a href="#monitors">monitorea</a> un  <a href="#StreetSection">tramo</a> que es una clase utilizada para describir tanto los tramos que monitorean los equipos como los tramos de vía que se ven afectados por una <a href="#Incidencia">Incidencia</a>.\n  Hay dos tipos de equipos de tráfico:  <a href="#ControlEquipment">equipos de control de tráfico</a> que realizan mediciones sobre vehículos específicos y  <a href="TrafficMeasurementDevice">dispositivos de medición de tráfico</a>. Ambos, con sus correspondientes subtipos, están definidos en la  taxomonía de tipo de equipo de tráfico ya mencionada. La clase que representa los equipos de tráfico es a su vez una subclase de <a href="#http://www.w3.org/ns/sosa/Sensor">sosa:Sensor</a> de la <a href="https://www.w3.org/TR/vocab-ssn/">Ontología SSN (Semantic Sensors Network Ontology)</a>.</p>\n\n   <p>Un equipo de tráfico  <a href="#http://www.w3.org/ns/sosa/observes">observa</a> una <a href="#TrafficProperty">propiedad de tráfico</a> que es una subclase de <a href="#http://www.w3.org/ns/sosa/ObservableProperty">sosa:ObservableProperty</a>. Específicamente, el dispositivo de medición de tráfico tiene atributos que indican si se encuentra en servicio o no (<a href="#inService">inService</a>) y la frecuencia de medición (<a href="#measurementFrequency">measurementFrequency</a>).\n   La clase que representa a las propiedades de medición de tráfico cuenta con varias instancias que son las mediciones definidas : <a href="#intensity">intensidad </a>, <a href="#occupation">ocupación </a>, <a href="#load">carga</a>, <a href="#speed">velocidad </a>,  <a href="#level">nivel</a>, <a href="#composition">composición</a>, <a href="#density">densidad</a> y <a href="#vehicleAccess">acceso de vehículo</a>.</p>\n\n  La clase <a href="#TrafficObservation">observación de tráfico</a> es subclase de <a href="#http://www.w3.org/ns/sosa/Observation" >sosa:Observation</a> que tiene una propiedad <a href="#validated">validada</a> que permite conocer si se ha producido una validación de la observación o no. El tiempo en el que se ha realizado la observación se expresa a través de la propiedad <a href="#http://www.w3.org/ns/sosa/phenomenonTime">sosa:phenomenonTime</a> que enlaza con la clase <a href="#http://www.w3.org/2006/time#TemporalEntity">time:TemporalEntity</a> que representa un intervalo temporal o un instante de tiempo. Finalmente, la observación tiene una característica de interés <a href="#https://www.w3.org/ns/sosa/hasFeatureOfInterest">sosa:hasFeatureOfInterest</a> que es un  <a href="#TrafficObservationPoint">punto de observación de tráfico</a> específico en donde se realiza la observación.</p>\n\n    <!-- INCIDENCIA --> \n    <p>La Figura 2 muestra las clases y propiedades de las incidencias de tráfico.\n  <div><center><img src="images/diagrama-conceptual-incident.png" alt="Diagrama conceptual de incidencias de tráfico"/><figcaption>Figura 2. - Diagrama conceptual de incidencias de tráfico.</figcaption></center></div>\n</p>\n\n  <p>El concepto principal de esta figura es la <a href="#Incident">incidencia</a> que se relaciona con el <a href="#StreetSection">tramo</a> a través de la propiedad <a href="#incidentInSection">incidencia en tramo</a>.\n  Dado que es subclase de <a href="#http://www.opengis.net/ont/geosparql#Feature" >geosparql:Feature</a>, tiene la propiedad <a href="#http://www.opengis.net/ont/geosparql#hasGeometry">geosparql:hasGeometry</a> que enlaza con su localización en un punto geográfico <a href="#http://www.opengis.net/ont/sf#Point">sf:Point</a> cuyos atributos son sus coordenadas. También se relaciona con la taxonomía de  <a href="#https://edint.es/kos/IncidentType">tipos de incidencia</a> a través de la propiedad <a href="#incidentType">tipo de incidencia</a>.\n  \n  La <a href="#Incident">edinttraf:Incidencia</a> cuenta con un identificador <a href="#http://purl.org/dc/terms/identifier">dct:identifier</a>, una descripción <a href="#http://purl.org/dc/terms/description">dct:description</a>, una fecha de inicio <a href="#https://schema.org/startDate">schema:startDate</a>, una fecha de fin <a href="#https://schema.org/endDate">schema:endDate</a>, el  <a href="#numDirections">número de sentidos a los que afecta</a> y el  <a href="#numLanes">número de carriles</a>.\n  Cuenta con dos subclases, la de <a href="#PlannedIncident">incidencia planificada</a> e <a href="#UnplannedIncident">incidencia no planificada</a> para las que han ocurrido de forma fortuita.</p>\n  <p>Con la finalidad de facilitar la comprensión del uso de algunas clases y propiedades de este vocabulario se proporcionan a continuación algunos ejemplos:</p>\n\n  <h4>Equipo Tráfico</h4>\n\n  <p>En primer lugar, para la representación del equipo de tráfico El equipo tiene un identificador, una descripción y en caso de que sea de medición se indicará si está en servicio o no y la frecuencia de medición. También se puede indicar a cuántos sentidos observa el dispositivo, a cuántos carriles y si se trata de un equipo urbano o no urbano.\n  Se enlaza a través de la propiedad tipo de equipo de tráfico con el tipo de dispositivo correspondiente de la taxonomía de tipos de equipos de tráfico, en este caso tubo neumático.</p>\n\n  <pre><textarea style="resize:none" readonly id="code2" name="code" rows="25" cols="100">\n  &lt;https://example.org/recurso/equipotrafico/100&gt; a edinttraf:TrafficMeasurementDevice ;\n    dct:identifier "100"^^xsd:string ;\n    dct:description "C. GRAN VIA;San Bernardo-Garcia Molinas;San Bernardo"^^xsd:string ;\n    sosa:observes &lt;https://example.org/recurso/carga&gt; ;\n    edinttraf:numDirections "2"^^xsd:int ;\n    edinttraf:numCLanes "8"^^xsd:integer ;\n    edinttraf:urban "true"^^xsd:boolean ;\n    edinttraf:inService "true"^^xsd:boolean ;\n    edinttraf:measurementFrequency "5 minutos"^^xsd:string ;\n    edinttraf:monitors &lt;https://example.org/recurso/tramo/100&gt; ;\n    edinttraf:trafficEquipmentType &lt;https://edint.es/kos/trafficequipment/tubo-neumatico&gt; .\n  </textarea></pre>\n  <script>\n      var editor2 = CodeMirror.fromTextArea(document.getElementById("code2"), {\n          mode: "text/turtle",\n          matchBrackets: true\n      });\n       editor2.setSize(null, "200px"); // ancho automático, altura menor\n  </script>\n\n\n\n\n\n  <h4>Observación de Tráfico</h4>\n  \n  <p>La clase observación de tráfico se relaciona a través de la propiedad sosa:observedProperty a la propiedad de "carga". La propiedad validada indica si el dato ha sido validado o no. Para representar el intervalo de registro de datos se utiliza la propiedad sosa:phenomenonTime que se relaciona con la clase time:TemporalEntity como se ha explicado anteriormente.</p>\n  <p>Observación:</p>\n  <pre><textarea style="resize:none" readonly id="code3" name="code" rows="25" cols="100">\n   &lt;https://example.org/recurso/observaciontrafico/20200423114500&gt; a edinttraf:ObservacionTrafico ;\n    dct:identifier "100-20200423114500"^^xsd:string ;\n    sosa:resultTime "2020-04-23T11:45:00+02:00"^^xsd:dateTime ;\n    sosa:hasResult  &lt;https://example.org/recurso/quantityvalue/20200423114500&gt;;\n    edinttraf:validated "true"^^xsd:boolean ;\n    sosa:madeBySensor &lt;https://example.org/recurso/equipo-trafico/100&gt; ;\n    sosa:observedProperty &lt;https://example.org/recurso/carga&gt; ;\n    sosa:hasFeatureOfInterest &lt;https://example.org/recurso/punto-observacion-trafico/1234&gt; ;\n    sosa:phenomenonTime &lt;https://example.org/recurso/interval/20200423114500&gt; .\n  </textarea></pre>\n  <script>\n      var editor2 = CodeMirror.fromTextArea(document.getElementById("code3"), {\n          mode: "text/turtle",\n          matchBrackets: true\n      });\n      editor2.setSize(null, "160px"); // ancho automático, altura menor\n  </script>\n\n  <p>Intervalo de observación:</p>\n  <pre><textarea style="resize:none" readonly id="code4" name="code" rows="25" cols="100">\n    &lt;https://example.org/recurso/interval/20200423114500&gt; a time:Interval ;\n    time:hasBegining &lt;https://example.org/recurso/instant/20200423114455&gt; ;\n    time:hasEnd &lt;https://example.org/recurso/instant/202004231145000&gt; .\n\n    &lt;https://example.org/recurso/instant/20200423114455&gt; a time:Instant ;\n    time:inXSDgYearMonth "2020-04-23T11:44:55+02:00"^^xsd:dateTime .\n\n    &lt;https://example.org/recurso/instant/20200423114500&gt; a time:Instant ;\n    time:inXSDgYearMonth "2020-04-23T11:45:00+02:00"^^xsd:dateTime .\n    </textarea></pre>\n    <script>\n        var editor2 = CodeMirror.fromTextArea(document.getElementById("code4"), {\n            mode: "text/turtle",\n            matchBrackets: true\n        });\n        editor2.setSize(null, "160px"); // ancho automático, altura menor\n    </script>\n\n  <h4>Donde aparece</h4>\n  <p>Esta Observación aparece a través de sosa:hasFeatureOfInterest que se relaciona con el punto de observacion de tráfico.</p>\n  <pre><textarea style="resize:none" readonly id="code5" name="code" rows="25" cols="100">\n    &lt;https://example.org/recurso/punto-observacion-trafico/1234&gt;; a edinttraf:TrafficObservationPoint ;\n    geosparql:hasGeometry &lt;https://example.org/recurso/point/100&gt; ;\n    geo:lat &lt;https://example.org/recurso/point/100&gt; ;\n    geo:long &lt;https://example.org/recurso/point/101&gt; ;.\n  </textarea></pre>\n  <script>\n      var editor2 = CodeMirror.fromTextArea(document.getElementById("code5"), {\n          mode: "text/turtle",\n          matchBrackets: true\n      });\n      editor2.setSize(null, "100px"); // ancho automático, altura menor\n  </script>\n\n  <h4>Incidencia</h4>\n  <p>Para representar una incidencia se ha creado una instancia de la clase incidencia que cuenta con las propiedades relatadas anteriormente: una fecha de creación de la incidencia, una fecha de inicio, una fecha de fin, una fecha de fin prevista, el número de sentidos, el número de carriles, si es recurrente y en este caso el motivo de la recurrencia.</p>\n  <pre><textarea style="resize:none" readonly id="code6" name="code" rows="25" cols="100">\n    &lt;https://example.org/recurso/incidenciaplanificada/1000&gt; a edinttraf:Incidencia ;\n    dct:identifier "1000"^^xsd:string ;\n    dct:description "EXP-2020/22329 Plaza Humilladero-Almendro"^^xsd:string ;\n    schema:startDate "2020-03-12T16:00:00+02:00"^^xsd:dateTime ;\n    schema:endDate "2020-03-13T23:00:00+02:00"^^xsd:dateTime ;\n    edinttraf:expectedEndDate "2028-03-08T23:00:00+02:00"^^xsd:dateTime ;\n    edinttraf:numDirections "1"^^xsd:integer ;\n    edinttraf:numLanes "3"^^xsd:integer ;\n    edinttraf:isRecurrent "true"^^xsd:boolean ;\n    edinttraf:recurrence "Excursión juvenil" ;\n    edinttraf:incidentType &lt;https://edint.es/kos/IncidentType/evento&gt; ;\n    geosparql:hasGeometry\n    &lt;https://example.org/recurso/point/1000&gt; ;\n    edinttraf:incidentInSection &lt;https://example.org/recurso/tramo/1000&gt; .\n  </textarea></pre>\n  <script>\n      var editor2 = CodeMirror.fromTextArea(document.getElementById("code6"), {\n          mode: "text/turtle",\n          matchBrackets: true\n      });\n      editor2.setSize(null, "230px"); // ancho automático, altura menor\n  </script>\n</span>\n\n
