abstract-en=El propósito de esta ontología es el de representar los datos de sistemas de vehículos compartidos. Los modelos de sistemas representados incluyen: (1)  Basados en estaciones con sensores en sus anclajes y (2) Libres, es decir aquellos sistemas que permiten que el vehículo se encuentre en algún lugar de aparcamiento permitido y que son ubicados a través de sus datos geoespaciales. 
introduction-en=\nThis ontology is part of the catalog of ontologies that is being developed in the context of the <a href="https://edint.es/" target="_blank">Data Space for Smart Urban Infrastructures (EDINT)</a>. It was also identified as a relevant ontology for the representation of data managed by local entities in the guide <a href="http://femp.femp.es/files/3580-1937-fichero/DATOS%20ABIERTOS%20FEMP%202019.pdf" target="_blank">Datos abiertos FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a>, as also described in the corresponding <a href="https://datos.gob.es/es/conocimiento/datos-abiertos-femp-2019-40-conjuntos-de-datos-publicar-por-las-entidades-locales" target="_blank">data.gob.es note</a>, and therefore included in the <a href="https://github.com/opencitydata" target="_blank">Github repository supporting the initiative</a>, which will be deprecated once this repository is launched.\nAn amplified version of the guide can be found in <a href="https://redtransparenciayparticipacion.es/wp-content/uploads/2025/03/Datos-abiertos-80-conjuntos-de-datos.pdf" target="_blank">DATOS ABIERTOS 80 CONJUNTOS DE DATOS</a>\n
description-en=<span class="markdown">Figure 1 shows the classes and properties of the shared vehicle systems ontology. The main objective of this portion of the ontology is to allow the representation of the routes taken by the vehicles in a system.\n\n<center><img src="images/diagrama-conceptual-vehiculos.png"><figcaption>Figure 1. - Conceptual diagram of the shared vehicles systems and their routes</figcaption></center>\n\n<span class="markdown">\n<p>To represent a route, we have the concept of <a href="#Route">Route</a> which must have an associated <a href="#SharedVehicle">Shared Vehicle</a> and, in turn, both an <a href="#originDock">origin dock</a> and a <a href="#destinationDock">destination dock</a> if the system model is station-based. If the model is "Free", then the route will have both an <a href="#originSpot">origin parking space</a>and a <a href="#destinationSpot">destination parking space</a>.\n\nA route can have a series of <a href="#Waypoint">waypoints</a>. Additionally, this ontology uses several SKOS concept schemas to represent a vehicle's state (active, under repair, abandoned), its propulsion type (electric, gasoline, etc.), and its vehicle type (car, bicycle, scooter, etc.).\n\nTo represent the possible waypoints of the routes, expressed in terms of their longitude and latitude, the classes g<a href="#http://www.opengis.net/ont/geosparql#Feature">geosparql:Feature</a>, <a href="#http://www.opengis.net/ont/geosparql#SpatialObject">geosparql:SpatialObject</a>, <a href="#http://www.opengis.net/ont/geosparql#Geometry">geosparql:Geometry</a> y <a href="#http://www.opengis.net/ont/sf#Point">geosparql:Point</a> have been reused from the <a href="https://docs.ogc.org/is/22-047r1/22-047r1.html">geosparql</a> vocabulary, following the "Location Pattern" in Figure 1.</p>\n\n<p>Furthermore, all observations regarding the availability of station docks are represented, as shown in Figure 2. The design pattern from the <a href="https://www.w3.org/TR/vocab-ssn/">Semantic Sensor Network Ontology</a> is reused.</a></p>\n</span>\n<center><img src="images/diagrama-conceptual-estaciones.png"><figcaption>Figure 2. - Conceptual diagram of stations and docks</figcaption></center>\n\n<span class="markdown">\n<p>The main concept is <a href="#Dock">Dock</a> for which the classes <a href="#http://www.w3.org/ns/sosa/Sensor">sosa:Sensor</a>, <a href="#http://www.w3.org/ns/sosa/Observation">sosa:Observation</a>, <a href="#http://www.w3.org/ns/sosa/ObservableProperty">sosa:ObservableProperty</a>, <a href="#http://w3.org/ns/sosa/Platform">sosa:Platform</a> and <a href="#http://www.w3.org/ns/sosa/FeatureOfInterest">sosa:FeatureOfInterest</a> are reused, of the <a href="http://www.w3.org/ns/sosa/">sosa</a> ontology. Specifically, we will observe the <a href="#dockAvailability">availability of a dock</a>, which is the property to be observed, and for which the result of the observation will be obtained. This property allows you to represent the <a href="#numberEmptyDocks">number of empty (free) docks</a>, and the <a href="#numberOccupiedDocks">number of occupied docks</a>, which are also observable properties of the <a href="#SharedVehicleStation">Station</a> in general.</p>\n</span>\n\n</span>\n<h3>3.1 Usage Examples<span class="backlink">back to <a href="#toc">&iacute;ndice</a></span></h3>\n\n<span class="markdown">\n\nTo represent a shared vehicle station, an instance of the class <a href="#SharedVehicleStation">edintvehcom:SharedVehicleStation</a> is created with the properties <a href="http://purl.org/dc/terms/identifier">dct:identifier</a>, <a href="https://schema.org/name">schema:name</a> (station name), <a href="https://schema.org/address">schema:address</a> (station address), and <a href="#comissioningDate">edintvehcom:comissioningDate</a> (commissioning date). The station is also linked, via the <a href="#stationState">edintvehcom:stationState</a> property, to the corresponding SKOS concept in the station state schema, which in this example is an operational station. with the organization that operates it through <a href="#operatedBy">edintvehcom:operatedBy</a>, and with its docks through <a href="#hasDock">edintvehcom:hasDock</a>.\n</span>\n<pre><textarea style="resize:none" readonly id="code1" name="code" rows="25" cols="100">\n&lt;Organization/operador-municipal-01&gt; a schema:Organization ;\n  schema:name &quot;Operador Municipal de Movilidad Compartida&quot;@es .\n\n&lt;SharedVehicleStation/estacion-001&gt; a edintvehcom:SharedVehicleStation ;\n  dct:identifier &quot;EST-001&quot; ;\n  schema:name &quot;Puerta del Sol&quot;@es ;\n  schema:address &quot;Puerta del Sol, 1, Madrid&quot;@es ;\n  edintvehcom:comissioningDate &quot;2024-03-15&quot;^^xsd:date ;\n  edintvehcom:stationState &lt;https://edint.es/kos/StationState/Operative&gt; ;\n  edintvehcom:operatedBy &lt;Organization/operador-municipal-01&gt; ;\n  edintvehcom:hasDock &lt;Dock/anclaje-001-01&gt; ,\n                        &lt;Dock/anclaje-001-02&gt; .\n</textarea></pre>\n  <script>\n      var editor_code1 = CodeMirror.fromTextArea(document.getElementById("code1"), {\n          mode: "text/turtle",\n          matchBrackets: true\n      });\n      editor_code1.setSize(null, "200px"); // ancho automático, altura menor\n</script>\n<span class="markdown">\n\nNext, two instances of <a href="#Dock">edintvehcom:Dock</a> are represented. For each dock, its identifier is indicated by <a href="http://purl.org/dc/terms/identifier">dct:identifier</a> and its state by the property <a href="#dockState">edintvehcom:dockState</a>, which links to the corresponding SKOS concept in the dock state schema. In the example, the docks are in the active state.\n\n</span>\n<pre><textarea style="resize:none" readonly id="code2" name="code" rows="25" cols="100">\n&lt;Dock/anclaje-001-01&gt; a edintvehcom:Dock ;\n  dct:identifier &quot;DOCK-001-01&quot; ;\n  edintvehcom:dockState &lt;https://edint.es/kos/DockState/Active&gt; .\n\n&lt;Dock/anclaje-001-02&gt; a edintvehcom:Dock ;\n  dct:identifier &quot;DOCK-001-02&quot; ;\n  edintvehcom:dockState &lt;https://edint.es/kos/DockState/Active&gt; .\n</textarea></pre>\n  <script>\n      var editor_code2 = CodeMirror.fromTextArea(document.getElementById("code2"), {\n          mode: "text/turtle",\n          matchBrackets: true\n      });\n      editor_code2.setSize(null, "120px"); // ancho automático, altura menor\n</script>\n<span class="markdown">\n\nTo represent a shared vehicle, an instance of the class <a href="#SharedVehicle">edintvehcom:SharedVehicle</a> is created. In the example, its identifier is specified, its vehicle type using <a href="#https://edint.es/def/censovehiculos#vehicleType">edintveh:vehicleType</a>, its propulsion system type using <a href="#propulsionSystemType">edintvehcom:propulsionSystemType</a>, its state using <a href="#vehicleState">edintvehcom:vehicleState</a>, and its manufacturer using <a href="https://schema.org/manufacturer">schema:manufacturer</a>. The properties `<a href="#propulsionSystemType">edintvehcom:propulsionSystemType</a>` and `<a href="#vehicleState">edintvehcom:vehicleState</a>` link to the corresponding SKOS concepts; in this case, an electric bicycle in its active state is represented.\n\n</span>\n<pre><textarea style="resize:none" readonly id="code3" name="code" rows="25" cols="100">\n&lt;Organization/fabricante-vehiculos-01&gt; a schema:Organization ;\n  schema:name &quot;Fabricante Ejemplo S.A.&quot;@es .\n\n&lt;SharedVehicle/vehiculo-0001&gt; a edintvehcom:SharedVehicle ;\n  dct:identifier &quot;VEH-0001&quot; ;\n  edintveh:vehicleType edintkosvehtype:bicicleta ;\n  edintvehcom:propulsionSystemType &lt;https://edint.es/kos/PropulsionSystemType/Electric&gt; ;\n  edintvehcom:vehicleState &lt;https://edint.es/kos/VehicleState/Active&gt; ;\n  schema:manufacturer &lt;Organization/fabricante-vehiculos-01&gt; .\n</textarea></pre>\n  <script>\n      var editor_code3 = CodeMirror.fromTextArea(document.getElementById("code3"), {\n          mode: "text/turtle",\n          matchBrackets: true\n      });\n      editor_code3.setSize(null, "180px"); // ancho automático, altura menor\n</script>\nspan class="markdown"> \nTo represent a route of a station-based system, an instance of the class <a href="#Route">edintvehcom:Route</a> is created with the properties <a href="http://purl.org/dc/terms/identifier">dct:identifier</a>, <a href="https://schema.org/startDate">schema:startDate</a> and <a href="https://schema.org/endDate">schema:endDate</a>. The route is linked to the vehicle using <a href="#madeByVehicle">edintvehcom:madeByVehicle</a>, to the origin dock using <a href="#originDock">edintvehcom:originDock</a>, to the destination dock using <a href="#destinationDock">edintvehcom:destinationDock</a>, and to its waypoints using <a href="#hasWaypoint">edintvehcom:hasWaypoint</a>. Each waypoint is represented as an instance of <a href="#Waypoint">edintvehcom:Waypoint</a>, with its order, date and time of passage, and associated geometry.\n\n</span>\n<pre><textarea style="resize:none" readonly id="code4" name="code" rows="25" cols="100">\n&lt;Route/trayecto-20260521-001&gt; a edintvehcom:Route ;\n  dct:identifier &quot;ROUTE-20260521-001&quot; ;\n  schema:startDate &quot;2026-05-21T08:30:00&quot;^^xsd:dateTime ;\n  schema:endDate &quot;2026-05-21T08:48:00&quot;^^xsd:dateTime ;\n  edintvehcom:madeByVehicle &lt;SharedVehicle/vehiculo-0001&gt; ;\n  edintvehcom:originDock &lt;Dock/anclaje-001-01&gt; ;\n  edintvehcom:destinationDock &lt;Dock/anclaje-001-02&gt; ;\n  edintvehcom:hasWaypoint &lt;Waypoint/trayecto-20260521-001-01&gt; ,\n                           &lt;Waypoint/trayecto-20260521-001-02&gt; .\n\n&lt;Waypoint/trayecto-20260521-001-01&gt; a edintvehcom:Waypoint ;\n  edintvehcom:order &quot;1&quot;^^xsd:integer ;\n  edintvehcom:passingDateTime &quot;2026-05-21T08:35:00&quot;^^xsd:dateTime ;\n  geosparql:hasGeometry &lt;Geometry/trayecto-20260521-001-01&gt; .\n\n&lt;Geometry/trayecto-20260521-001-01&gt; a geosparql:Geometry ;\n  geosparql:asWKT &quot;POINT (-3.703582 40.416704)&quot;^^geosparql:wktLiteral .\n\n&lt;Waypoint/trayecto-20260521-001-02&gt; a edintvehcom:Waypoint ;\n  edintvehcom:order &quot;2&quot;^^xsd:integer ;\n  edintvehcom:passingDateTime &quot;2026-05-21T08:42:00&quot;^^xsd:dateTime ;\n  geosparql:hasGeometry &lt;Geometry/trayecto-20260521-001-02&gt; .\n\n&lt;Geometry/trayecto-20260521-001-02&gt; a geosparql:Geometry ;\n  geosparql:asWKT &quot;POINT (-3.698960 40.418110)&quot;^^geosparql:wktLiteral .\n</textarea></pre>\n  <script>\n      var editor_code4 = CodeMirror.fromTextArea(document.getElementById("code4"), {\n          mode: "text/turtle",\n          matchBrackets: true\n      });\n      editor_code4.setSize(null, "420px"); // ancho automático, altura menor\n</script>\n<span class="markdown">\n\nIn the case of a free model, the route does not necessarily begin or end at a station's dock points. Therefore, the instance of <a href="#Route">edintvehcom:Route</a> is related to an origin parking space by <a href="#originSpot">edintvehcom:originSpot</a> and to a destination parking space by <a href="#destinationSpot">edintvehcom:destinationSpot</a>. Parking spaces are represented as instances of <a href="#https://edint.es/def/aparcamiento#ParkingSpot">edintapar:ParkingSpot</a>.\n\n</span>\n<pre><textarea style="resize:none" readonly id="code5" name="code" rows="25" cols="100">\n&lt;Route/trayecto-20260521-002&gt; a edintvehcom:Route ;\n  dct:identifier &quot;ROUTE-20260521-002&quot; ;\n  schema:startDate &quot;2026-05-21T09:10:00&quot;^^xsd:dateTime ;\n  schema:endDate &quot;2026-05-21T09:32:00&quot;^^xsd:dateTime ;\n  edintvehcom:madeByVehicle &lt;SharedVehicle/vehiculo-0001&gt; ;\n  edintvehcom:originSpot &lt;ParkingSpot/plaza-0001&gt; ;\n  edintvehcom:destinationSpot &lt;ParkingSpot/plaza-0002&gt; .\n\n&lt;ParkingSpot/plaza-0001&gt; a edintapar:ParkingSpot ;\n  dct:identifier &quot;PARK-0001&quot; .\n\n&lt;ParkingSpot/plaza-0002&gt; a edintapar:ParkingSpot ;\n  dct:identifier &quot;PARK-0002&quot; .\n</textarea></pre>\n  <script>\n      var editor_code5 = CodeMirror.fromTextArea(document.getElementById("code5"), {\n          mode: "text/turtle",\n          matchBrackets: true\n      });\n      editor_code5.setSize(null, "220px"); // ancho automático, altura menor\n</script>\n<span class="markdown">\n\nTo represent an observation about the availability of an dock, an instance of <a href="#DockSensor">edintvehcom:DockSensor</a> is created, hosted on the station by <a href="#http://www.w3.org/ns/sosa/isHostedBy">sosa:isHostedBy</a>, and which observes the property <a href="#dockAvailability">edintvehcom:dockAvailability</a>. The observation is represented with an instance of <a href="#DockObservation">edintvehcom:DockObservation</a>, indicating the observed dock using <a href="#http://www.w3.org/ns/sosa/hasFeatureOfInterest">sosa:hasFeatureOfInterest</a>, the sensor performing the observation using <a href="#http://www.w3.org/ns/sosa/madeBySensor">sosa:madeBySensor</a>, the observed property using <a href="#http://www.w3.org/ns/sosa/observedProperty">sosa:observedProperty</a>, the observation time using <a href="#http://www.w3.org/ns/sosa/phenomenonTime">sosa:phenomenonTime</a>, and the result using <a href="#http://www.w3.org/ns/sosa/hasResult">sosa:hasResult</a> with an instance of <a href="#http://qudt.org/schema/qudt/QuantityValue">qudt:QuantityValue</a>.\n</span>\n<pre><textarea style="resize:none" readonly id="code6" name="code" rows="25" cols="100">\n&lt;DockSensor/sensor-anclaje-001-01&gt; a edintvehcom:DockSensor ;\n  dct:identifier &quot;SENSOR-DOCK-001-01&quot; ;\n  sosa:isHostedBy &lt;SharedVehicleStation/estacion-001&gt; ;\n  sosa:observes edintvehcom:dockAvailability .\n\n&lt;DockObservation/obs-anclaje-001-01-20260521T085000&gt; a edintvehcom:DockObservation ;\n  sosa:hasFeatureOfInterest &lt;Dock/anclaje-001-01&gt; ;\n  sosa:madeBySensor &lt;DockSensor/sensor-anclaje-001-01&gt; ;\n  sosa:observedProperty edintvehcom:dockAvailability ;\n  sosa:phenomenonTime &lt;Instant/obs-anclaje-001-01-20260521T085000&gt; ;\n  sosa:hasResult [\n    a qudt:QuantityValue ;\n    qudt:value &quot;1&quot;^^xsd:integer ;\n    qudt:hasUnit unit:NUM\n  ] .\n\n&lt;Instant/obs-anclaje-001-01-20260521T085000&gt; a time:Instant ;\n  time:inXSDDateTimeStamp &quot;2026-05-21T08:50:00Z&quot;^^xsd:dateTimeStamp .\n</textarea></pre>\n  <script>\n      var editor_code6 = CodeMirror.fromTextArea(document.getElementById("code6"), {\n          mode: "text/turtle",\n          matchBrackets: true\n      });\n      editor_code6.setSize(null, "320px"); // ancho automático, altura menor\n</script>\n<span class="markdown">\n\nFinally, an aggregated observation about the station is displayed to indicate the number of empty docks. In this case, the feature of interest is the vehicle-sharing station itself, and the observed property is <a href="#numberEmptyDocks">edintvehcom:numberEmptyDocks</a>. The result is also expressed using <a href="#http://www.w3.org/ns/sosa/hasResult">sosa:hasResult</a> and <a href="#http://qudt.org/schema/qudt/QuantityValue">qudt:QuantityValue</a>.\n\n</span>\n<pre><textarea style="resize:none" readonly id="code7" name="code" rows="25" cols="100">\n&lt;Observation/obs-estacion-001-vacios-20260521T085000&gt; a sosa:Observation ;\n  sosa:hasFeatureOfInterest &lt;SharedVehicleStation/estacion-001&gt; ;\n  sosa:observedProperty edintvehcom:numberEmptyDocks ;\n  sosa:phenomenonTime &lt;Instant/obs-estacion-001-20260521T085000&gt; ;\n  sosa:hasResult [\n    a qudt:QuantityValue ;\n    qudt:value &quot;7&quot;^^xsd:integer ;\n    qudt:hasUnit unit:NUM\n  ] .\n\n&lt;Instant/obs-estacion-001-20260521T085000&gt; a time:Instant ;\n  time:inXSDDateTimeStamp &quot;2026-05-21T08:50:00Z&quot;^^xsd:dateTimeStamp .\n</textarea></pre>\n  <script>\n      var editor_code7 = CodeMirror.fromTextArea(document.getElementById("code7"), {\n          mode: "text/turtle",\n          matchBrackets: true\n      });\n      editor_code7.setSize(null, "240px"); // ancho automático, altura menor\n</script>\n\n\n\n\n</html>\n
references-en=<span class="markdown">\n<ul>\n    <li><a href="https://edint.es/en/" target="_blank">Data Spaces for Smart Urban Infrastructures (EDINT)</a></li>\n    <li><a href="http://femp.femp.es/files/3580-1937-fichero/DATOS%20ABIERTOS%20FEMP%202019.pdf" target="_blank">Guía Datos abiertos FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a></li>\n    <li><a href="https://datos.gob.es/es/conocimiento/datos-abiertos-femp-2019-40-conjuntos-de-datos-publicar-por-las-entidades-locales" target="_blank">DATOS ABIERTOS FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a> (source: datos.gob.es)</li>\n    <li><a href="https://redtransparenciayparticipacion.es/wp-content/uploads/2025/03/Datos-abiertos-80-conjuntos-de-datos.pdf" target="_blank">DATOS ABIERTOS 80 CONJUNTOS DE DATOS</a></li>\n</ul>\n</span>\n
abstract-es=El propósito de esta ontología es el de representar los datos de sistemas de vehículos compartidos. Los modelos de sistemas representados incluyen: (1)  Basados en estaciones con sensores en sus anclajes y (2) Libres, es decir aquellos sistemas que permiten que el vehículo se encuentre en algún lugar de aparcamiento permitido y que son ubicados a través de sus datos geoespaciales. 
introduction-es=Esta ontología forma parte del catálogo de ontologías que está siendo desarrollado en el contexto del <a href="https://edint.es/" target="_blank">Espacio de Datos para las Infraestructuras Urbanas Inteligentes (EDINT)</a>. Asimismo, fue identificada como una ontología relevante para la representación de datos gestionados por entidades locales en la guía <a href="http://femp.femp.es/files/3580-1937-fichero/DATOS%20ABIERTOS%20FEMP%202019.pdf" target="_blank">Datos abiertos FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a>, tal y como se describe también en la correspondiente <a href="https://datos.gob.es/es/conocimiento/datos-abiertos-femp-2019-40-conjuntos-de-datos-publicar-por-las-entidades-locales" target="_blank">nota de datos.gob.es</a>, y por tanto recogido en el <a href="https://github.com/opencitydata" target="_blank">repositorio Github de apoyo a la iniciativa</a>, que queda deprecado una vez se lance este repositorio.\nUna versión amplificada de la guía se encuentra en <a href="https://redtransparenciayparticipacion.es/wp-content/uploads/2025/03/Datos-abiertos-80-conjuntos-de-datos.pdf" target="_blank">DATOS ABIERTOS 80 CONJUNTOS DE DATOS</a>\n
description-es=<span class="markdown">La Figura 1 muestra las clases y propiedades de la ontología de vehículos compartidos. El principal objetivo de esta porción de la ontología es permitir la representación de los trayectos realizados por los vehhículos de un sistema.</span>\n<center><img src="images/diagrama-conceptual-vehiculos.png"><figcaption>Figura 1. - Diagrama conceptual de vehículos y trayectos</figcaption></center>\n<span class="markdown">\n<p>Para representar un trayecto se tiene el concepto <a href="#Route">Trayecto</a> que debe tener asociado un <a href="#SharedVehicle">Vehículo compartido</a> y, a su vez, tanto un <a href="#originDock">anclaje de origen</a>  como un <a href="#destinationDock">anclaje de destino</a> en caso de que el modelo del sistema esté basado en estaciones. En caso de que el modelo sea "Libre", entonces el trayecto tendrá tanto una <a href="#originSpot">plaza de aparcamiento de origen</a> como una <a href="#destinationSpot">plaza de aparcamiento de destino</a>.\nUn trayecto puede tener una serie de <a href="#Waypoint">puntos de paso</a>.Adicionalmente, en esta ontología se han utilizado varios esquemas de conceptos SKOS para representar el estado de un vehículo (activo, en reparación, abandonado), el tipo de propulsión (eléctrico, gasolina, etc.) y el tipo de vehículo (coche, bicicleta, patinete, etc.).</p>\n\n<p>Con la finalidad de representar los posibles puntos de paso de los trayectos, expresados en términos de su longitud y latitud, se han reutilizado las clases <a href="#http://www.opengis.net/ont/geosparql#Feature">geosparql:Feature</a>, <a href="#http://www.opengis.net/ont/geosparql#SpatialObject">geosparql:SpatialObject</a>, <a href="#http://www.opengis.net/ont/geosparql#Geometry">geosparql:Geometry</a> y <a href="#http://www.opengis.net/ont/sf#Point">geosparql:Point</a> del vocabulario <a href="https://docs.ogc.org/is/22-047r1/22-047r1.html">geosparql</a> siguiendo el "Patrón de localización" de la Figura 1.</p>\n\n<p>Asimismo, se representan todas las observaciones acerca de la disponibilidad de los anclajes de las estaciones, tal como se puede ver en la Figura 2. Se reutiliza el patrón de diseño de la <a href="https://www.w3.org/TR/vocab-ssn/">Semantic Sensor Network Ontology (sosa)</a>.</p>\n</span>\n<center><img src="images/diagrama-conceptual-estaciones.png"><figcaption>Figura 2. - Diagrama conceptual de estaciones y anclajes</figcaption></center>\n\n<span class="markdown">\n<p>El concepto principal es el de <a href="#Dock">Anclaje</a> para el cual se reutilizan las clases <a href="#http://www.w3.org/ns/sosa/Sensor">sosa:Sensor</a>, <a href="#http://www.w3.org/ns/sosa/Observation">sosa:Observation</a>, <a href="#http://www.w3.org/ns/sosa/ObservableProperty">sosa:ObservableProperty</a>, <a href="#http://w3.org/ns/sosa/Platform">sosa:Platform</a> y <a href="#http://www.w3.org/ns/sosa/FeatureOfInterest">sosa:FeatureOfInterest</a> de la ontología <a href="http://www.w3.org/ns/sosa/">sosa</a>. Concretamente, se va a observar la disponibilidad de un anclaje que a su vez es la característica de interés. La propiedad que se va a observar y para la que se va a obtener el resultado de la observación es la <a href="#dockAvailability">disponibilidad de un anclaje</a>. Esta propiedad permite representar el <a href="#numberEmptyDocks">número de anclajes vacíos (libres)</a>, y el <a href="#numberOccupiedDocks">número de anclajes ocupados</a> que a su vez son también propiedades observables de la <a href="#SharedVehicleStation">Estación</a> en general.</p>\n</span>\n\n</span>\n<h3>3.1 Ejemplos de uso<span class="backlink"> volver a <a href="#toc">&iacute;ndice</a></span></h3>\n\n<span class="markdown">\n  Para representar una estación de vehículos compartidos se crea una instancia de la clase <a href="#SharedVehicleStation">edintvehcom:SharedVehicleStation</a> con las propiedades <a href="http://purl.org/dc/terms/identifier">dct:identifier</a> (identificador de la estación), <a href="https://schema.org/name">schema:name</a> (nombre de la estación), <a href="https://schema.org/address">schema:address</a> (dirección de la estación) y <a href="#comissioningDate">edintvehcom:comissioningDate</a> (fecha de alta). Asimismo, se enlaza la estación mediante la propiedad <a href="#stationState">edintvehcom:stationState</a> con el concepto SKOS correspondiente del esquema de estados de estación, que en el ejemplo es una estación operativa; con la organización que la opera mediante <a href="#operatedBy">edintvehcom:operatedBy</a>, y con sus anclajes mediante <a href="#hasDock">edintvehcom:hasDock</a>.\n</span>\n<pre><textarea style="resize:none" readonly id="code1" name="code" rows="25" cols="100">\n&lt;Organization/operador-municipal-01&gt; a schema:Organization ;\n  schema:name &quot;Operador Municipal de Movilidad Compartida&quot;@es .\n\n&lt;SharedVehicleStation/estacion-001&gt; a edintvehcom:SharedVehicleStation ;\n  dct:identifier &quot;EST-001&quot; ;\n  schema:name &quot;Puerta del Sol&quot;@es ;\n  schema:address &quot;Puerta del Sol, 1, Madrid&quot;@es ;\n  edintvehcom:comissioningDate &quot;2024-03-15&quot;^^xsd:date ;\n  edintvehcom:stationState &lt;https://edint.es/kos/StationState/Operative&gt; ;\n  edintvehcom:operatedBy &lt;Organization/operador-municipal-01&gt; ;\n  edintvehcom:hasDock &lt;Dock/anclaje-001-01&gt; ,\n                        &lt;Dock/anclaje-001-02&gt; .\n</textarea></pre>\n  <script>\n      var editor_code1 = CodeMirror.fromTextArea(document.getElementById("code1"), {\n          mode: "text/turtle",\n          matchBrackets: true\n      });\n      editor_code1.setSize(null, "200px"); // ancho automático, altura menor\n</script>\n\n<span class="markdown">\n  Después, se representan dos instancias de <a href="#Dock">edintvehcom:Dock</a>. Para cada anclaje se indica su identificador mediante <a href="http://purl.org/dc/terms/identifier">dct:identifier</a> y su estado mediante la propiedad <a href="#dockState">edintvehcom:dockState</a>, que enlaza con el concepto SKOS correspondiente del esquema de estados de anclaje. En el ejemplo, los anclajes se encuentran en estado activo.\n</span>\n<pre><textarea style="resize:none" readonly id="code2" name="code" rows="25" cols="100">\n&lt;Dock/anclaje-001-01&gt; a edintvehcom:Dock ;\n  dct:identifier &quot;DOCK-001-01&quot; ;\n  edintvehcom:dockState &lt;https://edint.es/kos/DockState/Active&gt; .\n\n&lt;Dock/anclaje-001-02&gt; a edintvehcom:Dock ;\n  dct:identifier &quot;DOCK-001-02&quot; ;\n  edintvehcom:dockState &lt;https://edint.es/kos/DockState/Active&gt; .\n</textarea></pre>\n  <script>\n      var editor_code2 = CodeMirror.fromTextArea(document.getElementById("code2"), {\n          mode: "text/turtle",\n          matchBrackets: true\n      });\n      editor_code2.setSize(null, "120px"); // ancho automático, altura menor\n</script>\n\n<span class="markdown">\n  Para representar un vehículo compartido se crea una instancia de la clase <a href="#SharedVehicle">edintvehcom:SharedVehicle</a>. En el ejemplo se especifica su identificador, su tipo de vehículo mediante <a href="#https://edint.es/def/censovehiculos#vehicleType">edintveh:vehicleType</a>, su tipo de sistema de propulsión mediante <a href="#propulsionSystemType">edintvehcom:propulsionSystemType</a>, su estado mediante <a href="#vehicleState">edintvehcom:vehicleState</a> y su fabricante mediante <a href="https://schema.org/manufacturer">schema:manufacturer</a>. Las propiedades <a href="#propulsionSystemType">edintvehcom:propulsionSystemType</a> y <a href="#vehicleState">edintvehcom:vehicleState</a> enlazan con los conceptos SKOS correspondientes; en este caso se representa una bicicleta eléctrica en estado activo.\n</span>\n<pre><textarea style="resize:none" readonly id="code3" name="code" rows="25" cols="100">\n&lt;Organization/fabricante-vehiculos-01&gt; a schema:Organization ;\n  schema:name &quot;Fabricante Ejemplo S.A.&quot;@es .\n\n&lt;SharedVehicle/vehiculo-0001&gt; a edintvehcom:SharedVehicle ;\n  dct:identifier &quot;VEH-0001&quot; ;\n  edintveh:vehicleType edintkosvehtype:bicicleta ;\n  edintvehcom:propulsionSystemType &lt;https://edint.es/kos/PropulsionSystemType/Electric&gt; ;\n  edintvehcom:vehicleState &lt;https://edint.es/kos/VehicleState/Active&gt; ;\n  schema:manufacturer &lt;Organization/fabricante-vehiculos-01&gt; .\n</textarea></pre>\n  <script>\n      var editor_code3 = CodeMirror.fromTextArea(document.getElementById("code3"), {\n          mode: "text/turtle",\n          matchBrackets: true\n      });\n      editor_code3.setSize(null, "180px"); // ancho automático, altura menor\n</script>\n\n<span class="markdown">\n  Para representar un trayecto de un sistema basado en estaciones se crea una instancia de la clase <a href="#Route">edintvehcom:Route</a> con las propiedades <a href="http://purl.org/dc/terms/identifier">dct:identifier</a>, <a href="https://schema.org/startDate">schema:startDate</a> y <a href="https://schema.org/endDate">schema:endDate</a>. El trayecto se relaciona con el vehículo que lo realiza mediante <a href="#madeByVehicle">edintvehcom:madeByVehicle</a>, con el anclaje de origen mediante <a href="#originDock">edintvehcom:originDock</a>, con el anclaje de destino mediante <a href="#destinationDock">edintvehcom:destinationDock</a> y con sus puntos de paso mediante <a href="#hasWaypoint">edintvehcom:hasWaypoint</a>. Cada punto de paso se representa como una instancia de <a href="#Waypoint">edintvehcom:Waypoint</a>, con su orden, fecha y hora de paso, y geometría asociada.\n</span>\n<pre><textarea style="resize:none" readonly id="code4" name="code" rows="25" cols="100">\n&lt;Route/trayecto-20260521-001&gt; a edintvehcom:Route ;\n  dct:identifier &quot;ROUTE-20260521-001&quot; ;\n  schema:startDate &quot;2026-05-21T08:30:00&quot;^^xsd:dateTime ;\n  schema:endDate &quot;2026-05-21T08:48:00&quot;^^xsd:dateTime ;\n  edintvehcom:madeByVehicle &lt;SharedVehicle/vehiculo-0001&gt; ;\n  edintvehcom:originDock &lt;Dock/anclaje-001-01&gt; ;\n  edintvehcom:destinationDock &lt;Dock/anclaje-001-02&gt; ;\n  edintvehcom:hasWaypoint &lt;Waypoint/trayecto-20260521-001-01&gt; ,\n                           &lt;Waypoint/trayecto-20260521-001-02&gt; .\n\n&lt;Waypoint/trayecto-20260521-001-01&gt; a edintvehcom:Waypoint ;\n  edintvehcom:order &quot;1&quot;^^xsd:integer ;\n  edintvehcom:passingDateTime &quot;2026-05-21T08:35:00&quot;^^xsd:dateTime ;\n  geosparql:hasGeometry &lt;Geometry/trayecto-20260521-001-01&gt; .\n\n&lt;Geometry/trayecto-20260521-001-01&gt; a geosparql:Geometry ;\n  geosparql:asWKT &quot;POINT (-3.703582 40.416704)&quot;^^geosparql:wktLiteral .\n\n&lt;Waypoint/trayecto-20260521-001-02&gt; a edintvehcom:Waypoint ;\n  edintvehcom:order &quot;2&quot;^^xsd:integer ;\n  edintvehcom:passingDateTime &quot;2026-05-21T08:42:00&quot;^^xsd:dateTime ;\n  geosparql:hasGeometry &lt;Geometry/trayecto-20260521-001-02&gt; .\n\n&lt;Geometry/trayecto-20260521-001-02&gt; a geosparql:Geometry ;\n  geosparql:asWKT &quot;POINT (-3.698960 40.418110)&quot;^^geosparql:wktLiteral .\n</textarea></pre>\n  <script>\n      var editor_code4 = CodeMirror.fromTextArea(document.getElementById("code4"), {\n          mode: "text/turtle",\n          matchBrackets: true\n      });\n      editor_code4.setSize(null, "420px"); // ancho automático, altura menor\n</script>\n\n<span class="markdown">\n  En el caso de un modelo libre, el trayecto no se inicia ni finaliza necesariamente en anclajes de una estación. Por ello, la instancia de <a href="#Route">edintvehcom:Route</a> se relaciona con una plaza de aparcamiento de origen mediante <a href="#originSpot">edintvehcom:originSpot</a> y con una plaza de aparcamiento de destino mediante <a href="#destinationSpot">edintvehcom:destinationSpot</a>. Las plazas de aparcamiento se representan como instancias de <a href="#https://edint.es/def/aparcamiento#ParkingSpot">edintapar:ParkingSpot</a>.\n</span>\n<pre><textarea style="resize:none" readonly id="code5" name="code" rows="25" cols="100">\n&lt;Route/trayecto-20260521-002&gt; a edintvehcom:Route ;\n  dct:identifier &quot;ROUTE-20260521-002&quot; ;\n  schema:startDate &quot;2026-05-21T09:10:00&quot;^^xsd:dateTime ;\n  schema:endDate &quot;2026-05-21T09:32:00&quot;^^xsd:dateTime ;\n  edintvehcom:madeByVehicle &lt;SharedVehicle/vehiculo-0001&gt; ;\n  edintvehcom:originSpot &lt;ParkingSpot/plaza-0001&gt; ;\n  edintvehcom:destinationSpot &lt;ParkingSpot/plaza-0002&gt; .\n\n&lt;ParkingSpot/plaza-0001&gt; a edintapar:ParkingSpot ;\n  dct:identifier &quot;PARK-0001&quot; .\n\n&lt;ParkingSpot/plaza-0002&gt; a edintapar:ParkingSpot ;\n  dct:identifier &quot;PARK-0002&quot; .\n</textarea></pre>\n  <script>\n      var editor_code5 = CodeMirror.fromTextArea(document.getElementById("code5"), {\n          mode: "text/turtle",\n          matchBrackets: true\n      });\n      editor_code5.setSize(null, "220px"); // ancho automático, altura menor\n</script>\n\n<span class="markdown">\n  Para representar una observación sobre la disponibilidad de un anclaje se crea una instancia de <a href="#DockSensor">edintvehcom:DockSensor</a>, alojada en la estación mediante <a href="http://www.w3.org/ns/sosa/isHostedBy">sosa:isHostedBy</a>, y que observa la propiedad <a href="#dockAvailability">edintvehcom:dockAvailability</a>. La observación se representa con una instancia de <a href="#DockObservation">edintvehcom:DockObservation</a>, indicando el anclaje observado mediante <a href="#http://www.w3.org/ns/sosa/hasFeatureOfInterest">sosa:hasFeatureOfInterest</a>, el sensor que realiza la observación mediante <a href="#http://www.w3.org/ns/sosa/madeBySensor">sosa:madeBySensor</a>, la propiedad observada mediante <a href="#http://www.w3.org/ns/sosa/observedProperty">sosa:observedProperty</a>, el instante de observación mediante <a href="#http://www.w3.org/ns/sosa/phenomenonTime">sosa:phenomenonTime</a> y el resultado mediante <a href="http://www.w3.org/ns/sosa/hasResult">sosa:hasResult</a> con una instancia de <a href="http://qudt.org/schema/qudt/QuantityValue">qudt:QuantityValue</a>.\n</span>\n<pre><textarea style="resize:none" readonly id="code6" name="code" rows="25" cols="100">\n&lt;DockSensor/sensor-anclaje-001-01&gt; a edintvehcom:DockSensor ;\n  dct:identifier &quot;SENSOR-DOCK-001-01&quot; ;\n  sosa:isHostedBy &lt;SharedVehicleStation/estacion-001&gt; ;\n  sosa:observes edintvehcom:dockAvailability .\n\n&lt;DockObservation/obs-anclaje-001-01-20260521T085000&gt; a edintvehcom:DockObservation ;\n  sosa:hasFeatureOfInterest &lt;Dock/anclaje-001-01&gt; ;\n  sosa:madeBySensor &lt;DockSensor/sensor-anclaje-001-01&gt; ;\n  sosa:observedProperty edintvehcom:dockAvailability ;\n  sosa:phenomenonTime &lt;Instant/obs-anclaje-001-01-20260521T085000&gt; ;\n  sosa:hasResult [\n    a qudt:QuantityValue ;\n    qudt:value &quot;1&quot;^^xsd:integer ;\n    qudt:hasUnit unit:NUM\n  ] .\n\n&lt;Instant/obs-anclaje-001-01-20260521T085000&gt; a time:Instant ;\n  time:inXSDDateTimeStamp &quot;2026-05-21T08:50:00Z&quot;^^xsd:dateTimeStamp .\n</textarea></pre>\n  <script>\n      var editor_code6 = CodeMirror.fromTextArea(document.getElementById("code6"), {\n          mode: "text/turtle",\n          matchBrackets: true\n      });\n      editor_code6.setSize(null, "320px"); // ancho automático, altura menor\n</script>\n\n<span class="markdown">\n  Finalmente, se representa una observación agregada sobre la estación para indicar el número de anclajes vacíos. En este caso, la característica de interés es la propia estación de vehículos compartidos y la propiedad observada es <a href="#numberEmptyDocks">edintvehcom:numberEmptyDocks</a>. El resultado se expresa igualmente mediante <a href="http://www.w3.org/ns/sosa/hasResult">sosa:hasResult</a> y <a href="http://qudt.org/schema/qudt/QuantityValue">qudt:QuantityValue</a>.\n</span>\n<pre><textarea style="resize:none" readonly id="code7" name="code" rows="25" cols="100">\n&lt;Observation/obs-estacion-001-vacios-20260521T085000&gt; a sosa:Observation ;\n  sosa:hasFeatureOfInterest &lt;SharedVehicleStation/estacion-001&gt; ;\n  sosa:observedProperty edintvehcom:numberEmptyDocks ;\n  sosa:phenomenonTime &lt;Instant/obs-estacion-001-20260521T085000&gt; ;\n  sosa:hasResult [\n    a qudt:QuantityValue ;\n    qudt:value &quot;7&quot;^^xsd:integer ;\n    qudt:hasUnit unit:NUM\n  ] .\n\n&lt;Instant/obs-estacion-001-20260521T085000&gt; a time:Instant ;\n  time:inXSDDateTimeStamp &quot;2026-05-21T08:50:00Z&quot;^^xsd:dateTimeStamp .\n</textarea></pre>\n  <script>\n      var editor_code7 = CodeMirror.fromTextArea(document.getElementById("code7"), {\n          mode: "text/turtle",\n          matchBrackets: true\n      });\n      editor_code7.setSize(null, "240px"); // ancho automático, altura menor\n</script>\n\n\n\n\n</html>\n
