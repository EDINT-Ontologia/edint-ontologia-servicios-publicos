abstract-en=This ontology aims to define, categorize, and relate Regulatory Zones in the context of smart mobility and urban management (Smart Cities). It is designed as a modular extension of the Spanish Public Sector ontology (esadm).
introduction-en=\nThis ontology is part of the catalog of ontologies that is being developed in the context of the <a href="https://edint.es/" target="_blank">Data Space for Smart Urban Infrastructures (EDINT)</a>. It was also identified as a relevant ontology for the representation of data managed by local entities in the guide <a href="http://femp.femp.es/files/3580-1937-fichero/DATOS%20ABIERTOS%20FEMP%202019.pdf" target="_blank">Datos abiertos FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a>, as also described in the corresponding <a href="https://datos.gob.es/es/conocimiento/datos-abiertos-femp-2019-40-conjuntos-de-datos-publicar-por-las-entidades-locales" target="_blank">data.gob.es note</a>, and therefore included in the <a href="https://github.com/opencitydata" target="_blank">Github repository supporting the initiative</a>, which will be deprecated once this repository is launched.\nAn amplified version of the guide can be found in <a href="https://redtransparenciayparticipacion.es/wp-content/uploads/2025/03/Datos-abiertos-80-conjuntos-de-datos.pdf" target="_blank">DATOS ABIERTOS 80 CONJUNTOS DE DATOS</a>\n
description-en=\n<span class="markdown">Currently, vocabularies exist for administrative divisions (esadm) and geometries (GeoSPARQL), but there was a semantic gap for representing functional entities that overlay the urban grid (LEZ, Loading/Unloading, etc.) without adhering to fixed administrative boundaries. This ontology fills that gap.</span>\n\n<div style="padding: 25px; background-color: white; width: 100%; box-sizing: border-box; overflow: hidden;">\n    <a href="img/diagram.png" target="_blank" style="display: block;">\n        <img src="img/diagram.png" style="width: 100%; height: auto; display: block;"/>\n    </a>\n</div>\n\nAn example of entities defined by the ontology could be the following:\n\n<pre>\n    <textarea style="resize:none" readonly id="code1" name="code" rows="75" cols="200">\n@prefix dc: <http://purl.org/dc/elements/1.1/> .\n@prefix owl: <http://www.w3.org/2002/07/owl#> .\n@prefix rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#> .\n@prefix xml: <http://www.w3.org/XML/1998/namespace> .\n@prefix xsd: <http://www.w3.org/2001/XMLSchema#> .\n@prefix rdfs: <http://www.w3.org/2000/01/rdf-schema#> .\n@prefix org: <http://www.w3.org/ns/org#> .\n@prefix esadm: <http://vocab.linkeddata.es/datosabiertos/def/sector-publico/territorio#> .\n@prefix edintzone: <http://vocab.linkeddata.es/datosabiertos/def/common/zone#> .\n\n# Custom Resource Prefixes\n@prefix ex-zona: <http://example.org/resource/zona/> .\n@prefix ex-via: <http://example.org/resource/via/> .\n@prefix ex-org: <http://example.org/resource/organization/> .\n\n#################################################################\n#    Regulatory Zone 1 - ESRO (Rotation / Blue Zone)\n#################################################################\n\nex-zona:1-esro a edintzone:ShortTermParkingZone ;\n    rdfs:label "Zona 1 - ESRO (Estacionamiento Rotación)"@es ;\n    dc:description "Área de Zona 1 destinada a estacionamiento de rotación (zona azul). Máximo 2 horas."@es ;\n    \n    # Common Properties\n    edintzone:locatedIn <http://dbpedia.org/resource/Zaragoza> ;\n    edintzone:managedBy ex-org:z-m-ute ;\n    edintzone:scheduleDescription "Lunes a Viernes de 09:00 a 14:00 y de 17:00 a 20:00. Sábados, domingos y festivos sin regulación."^^xsd:string ;\n    edintzone:legalReference <https://www.zaragoza.es/sede/servicio/normativa/13296#tit3-capitulo4> ;\n\n    # Streets specifically listed as ESRO in Zona 1\n    edintzone:composedOf ex-via:calle-eusebio-blasco ,\n                        ex-via:calle-pedro-j-soler ,\n                        ex-via:plaza-san-pedro-nolasco ,\n                        ex-via:calle-san-andres ,\n                        ex-via:calle-san-jorge ,\n                        ex-via:calle-san-lorenzo ,\n                        ex-via:calle-santo-dominguito-de-val ,\n                        ex-via:calle-veronica .\n\n#################################################################\n#    Regulatory Zone 1 - ESRE (Residents / Orange Zone)\n#################################################################\n\nex-zona:1-esre a edintzone:ResidentialParkingZone ;\n    rdfs:label "Zona 1 - ESRE (Estacionamiento Residentes)"@es ;\n    dc:description "Área de Zona 1 destinada prioritariamente a residentes (zona naranja)."@es ;\n    \n    # Common Properties\n    edintzone:locatedIn <http://dbpedia.org/resource/Zaragoza> ;\n    edintzone:managedBy ex-org:z-m-ute ;\n    edintzone:scheduleDescription "Lunes a Viernes de 09:00 a 14:00 y de 17:00 a 20:00. Sábados, domingos y festivos sin regulación."^^xsd:string ;\n    edintzone:legalReference <https://www.zaragoza.es/sede/servicio/normativa/13296#tit3-capitulo4> ;\n\n    # Streets specifically listed as ESRE in Zona 1\n    edintzone:composedOf ex-via:calle-mayor ,\n                        ex-via:calle-refugio .\n\n#################################################################\n#    Municipality\n#################################################################\n\n<http://dbpedia.org/resource/Zaragoza> a esadm:Municipio ;\n    rdfs:label "Zaragoza"@es ;\n    # Linking both distinct zones to the municipality\n    edintzone:hasRegulatedZone ex-zona:1-esro ,\n                            ex-zona:1-esre .\n\n#################################################################\n#    Management Organization\n#################################################################\n\nex-org:z-m-ute a org:Organization ;\n    rdfs:label "Z+M UTE Servicio Estacionamiento Regulado de Zaragoza"@es ;\n    rdfs:comment "Unión Temporal de Empresas encargada de la gestión del servicio."@es .\n\n#################################################################\n#    Streets (Vias)\n#################################################################\n\n# ESRO Streets\nex-via:calle-eusebio-blasco a esadm:Via ; rdfs:label "Calle Eusebio Blasco"@es .\nex-via:calle-pedro-j-soler a esadm:Via ; rdfs:label "Calle Pedro J. Soler"@es .\nex-via:plaza-san-pedro-nolasco a esadm:Via ; rdfs:label "Plaza San Pedro Nolasco"@es .\nex-via:calle-san-andres a esadm:Via ; rdfs:label "Calle San Andrés"@es .\nex-via:calle-san-jorge a esadm:Via ; rdfs:label "Calle San Jorge"@es .\nex-via:calle-san-lorenzo a esadm:Via ; rdfs:label "Calle San Lorenzo"@es .\nex-via:calle-santo-dominguito-de-val a esadm:Via ; rdfs:label "Calle Santo Dominguito de Val"@es .\nex-via:calle-veronica a esadm:Via ; rdfs:label "Calle Verónica"@es .\n\n# ESRE Streets\nex-via:calle-mayor a esadm:Via ; rdfs:label "Calle Mayor"@es .\nex-via:calle-refugio a esadm:Via ; rdfs:label "Calle Refugio"@es .\n\n    </textarea>\n</pre>\n\nAdditionally, this linked data could be queried using SPARQL, as in the following example:\n\n<pre>\n    <textarea style="resize:none" readonly id="code2" name="code" rows="10" cols="200">\nPREFIX edintzone: <http://vocab.linkeddata.es/datosabiertos/def/common/zone#>\nPREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>\nPREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>\n\nSELECT DISTINCT ?zona\nWHERE {\n    ?zona rdf:type ?tipo .\n    ?tipo rdfs:subClassOf* edintzone:RegulatedZone .\n}\n\nORDER BY ?zona\n    </textarea>\n</pre>\n\n<script>\n    var editor1 = CodeMirror.fromTextArea(document.getElementById("code1"), {\n        mode: "text/turtle",\n        matchBrackets: true\n    });\n\n    var editor2 = CodeMirror.fromTextArea(document.getElementById("code2"), {\n        mode: "application/sparql-query",\n        matchBrackets: true\n    });\n</script>\n
references-en=<span class="markdown">\n<ul>\n    <li><a href="https://edint.es/en/" target="_blank">Data Spaces for Smart Urban Infrastructures (EDINT)</a></li>\n    <li><a href="http://femp.femp.es/files/3580-1937-fichero/DATOS%20ABIERTOS%20FEMP%202019.pdf" target="_blank">Guía Datos abiertos FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a></li>\n    <li><a href="https://datos.gob.es/es/conocimiento/datos-abiertos-femp-2019-40-conjuntos-de-datos-publicar-por-las-entidades-locales" target="_blank">DATOS ABIERTOS FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a> (source: datos.gob.es)</li>\n    <li><a href="https://redtransparenciayparticipacion.es/wp-content/uploads/2025/03/Datos-abiertos-80-conjuntos-de-datos.pdf" target="_blank">DATOS ABIERTOS 80 CONJUNTOS DE DATOS</a></li>\n</ul>\n</span>\n
abstract-es=Esta ontología tiene como propósito definir, categorizar y relacionar las Zonas Regulatorias en el contexto de la movilidad inteligente y la gestión urbana (Smart Cities). Se ha diseñado como una extensión modular de la ontología del Sector Público de España (esadm). Cubre el vacío semántico para representar entidades funcionales que se superponen a la trama urbana (como Zonas de Bajas Emisiones, Carga y Descarga, o Sandboxes regulatorios) sin responder necesariamente a límites administrativos fijos.
introduction-es=Esta ontología forma parte del catálogo de ontologías que está siendo desarrollado en el contexto del <a href="https://edint.es/" target="_blank">Espacio de Datos para las Infraestructuras Urbanas Inteligentes (EDINT)</a>. Asimismo, fue identificada como una ontología relevante para la representación de datos gestionados por entidades locales en la guía <a href="http://femp.femp.es/files/3580-1937-fichero/DATOS%20ABIERTOS%20FEMP%202019.pdf" target="_blank">Datos abiertos FEMP 2019: 40 conjuntos de datos a publicar por las Entidades Locales</a>, tal y como se describe también en la correspondiente <a href="https://datos.gob.es/es/conocimiento/datos-abiertos-femp-2019-40-conjuntos-de-datos-publicar-por-las-entidades-locales" target="_blank">nota de datos.gob.es</a>, y por tanto recogido en el <a href="https://github.com/opencitydata" target="_blank">repositorio Github de apoyo a la iniciativa</a>, que queda deprecado una vez se lance este repositorio.\nUna versión amplificada de la guía se encuentra en <a href="https://redtransparenciayparticipacion.es/wp-content/uploads/2025/03/Datos-abiertos-80-conjuntos-de-datos.pdf" target="_blank">DATOS ABIERTOS 80 CONJUNTOS DE DATOS</a>\n
description-es=\n<span class="markdown">Actualmente, existen vocabularios para divisiones administrativas (esadm) y geometrías (GeoSPARQL), pero existía un vacío semántico para representar entidades funcionales que se superponen a la trama urbana (ZBE, Carga y Descarga, etc...) sin responder a límites administrativos fijos. Esta ontología cubre dicho hueco.</span>\n\n<div style="padding: 25px; background-color: white; width: 100%; box-sizing: border-box; overflow: hidden;">\n    <a href="img/diagram.png" target="_blank" style="display: block;">\n        <img src="img/diagram.png" style="width: 100%; height: auto; display: block;"/>\n    </a>\n</div>\n\nUn ejemplo de entidades definidas por la ontología podría ser el siguiente:\n\n<pre>\n    <textarea style="resize:none" readonly id="code1" name="code" rows="75" cols="200">\n@prefix dc: <http://purl.org/dc/elements/1.1/> .\n@prefix owl: <http://www.w3.org/2002/07/owl#> .\n@prefix rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#> .\n@prefix xml: <http://www.w3.org/XML/1998/namespace> .\n@prefix xsd: <http://www.w3.org/2001/XMLSchema#> .\n@prefix rdfs: <http://www.w3.org/2000/01/rdf-schema#> .\n@prefix org: <http://www.w3.org/ns/org#> .\n@prefix esadm: <http://vocab.linkeddata.es/datosabiertos/def/sector-publico/territorio#> .\n@prefix edintzone: <http://vocab.linkeddata.es/datosabiertos/def/common/zone#> .\n\n# Custom Resource Prefixes\n@prefix ex-zona: <http://example.org/resource/zona/> .\n@prefix ex-via: <http://example.org/resource/via/> .\n@prefix ex-org: <http://example.org/resource/organization/> .\n\n#################################################################\n#    Regulatory Zone 1 - ESRO (Rotation / Blue Zone)\n#################################################################\n\nex-zona:1-esro a edintzone:ShortTermParkingZone ;\n    rdfs:label "Zona 1 - ESRO (Estacionamiento Rotación)"@es ;\n    dc:description "Área de Zona 1 destinada a estacionamiento de rotación (zona azul). Máximo 2 horas."@es ;\n    \n    # Common Properties\n    edintzone:locatedIn <http://dbpedia.org/resource/Zaragoza> ;\n    edintzone:managedBy ex-org:z-m-ute ;\n    edintzone:scheduleDescription "Lunes a Viernes de 09:00 a 14:00 y de 17:00 a 20:00. Sábados, domingos y festivos sin regulación."^^xsd:string ;\n    edintzone:legalReference <https://www.zaragoza.es/sede/servicio/normativa/13296#tit3-capitulo4> ;\n\n    # Streets specifically listed as ESRO in Zona 1\n    edintzone:composedOf ex-via:calle-eusebio-blasco ,\n                        ex-via:calle-pedro-j-soler ,\n                        ex-via:plaza-san-pedro-nolasco ,\n                        ex-via:calle-san-andres ,\n                        ex-via:calle-san-jorge ,\n                        ex-via:calle-san-lorenzo ,\n                        ex-via:calle-santo-dominguito-de-val ,\n                        ex-via:calle-veronica .\n\n#################################################################\n#    Regulatory Zone 1 - ESRE (Residents / Orange Zone)\n#################################################################\n\nex-zona:1-esre a edintzone:ResidentialParkingZone ;\n    rdfs:label "Zona 1 - ESRE (Estacionamiento Residentes)"@es ;\n    dc:description "Área de Zona 1 destinada prioritariamente a residentes (zona naranja)."@es ;\n    \n    # Common Properties\n    edintzone:locatedIn <http://dbpedia.org/resource/Zaragoza> ;\n    edintzone:managedBy ex-org:z-m-ute ;\n    edintzone:scheduleDescription "Lunes a Viernes de 09:00 a 14:00 y de 17:00 a 20:00. Sábados, domingos y festivos sin regulación."^^xsd:string ;\n    edintzone:legalReference <https://www.zaragoza.es/sede/servicio/normativa/13296#tit3-capitulo4> ;\n\n    # Streets specifically listed as ESRE in Zona 1\n    edintzone:composedOf ex-via:calle-mayor ,\n                        ex-via:calle-refugio .\n\n#################################################################\n#    Municipality\n#################################################################\n\n<http://dbpedia.org/resource/Zaragoza> a esadm:Municipio ;\n    rdfs:label "Zaragoza"@es ;\n    # Linking both distinct zones to the municipality\n    edintzone:hasRegulatedZone ex-zona:1-esro ,\n                            ex-zona:1-esre .\n\n#################################################################\n#    Management Organization\n#################################################################\n\nex-org:z-m-ute a org:Organization ;\n    rdfs:label "Z+M UTE Servicio Estacionamiento Regulado de Zaragoza"@es ;\n    rdfs:comment "Unión Temporal de Empresas encargada de la gestión del servicio."@es .\n\n#################################################################\n#    Streets (Vias)\n#################################################################\n\n# ESRO Streets\nex-via:calle-eusebio-blasco a esadm:Via ; rdfs:label "Calle Eusebio Blasco"@es .\nex-via:calle-pedro-j-soler a esadm:Via ; rdfs:label "Calle Pedro J. Soler"@es .\nex-via:plaza-san-pedro-nolasco a esadm:Via ; rdfs:label "Plaza San Pedro Nolasco"@es .\nex-via:calle-san-andres a esadm:Via ; rdfs:label "Calle San Andrés"@es .\nex-via:calle-san-jorge a esadm:Via ; rdfs:label "Calle San Jorge"@es .\nex-via:calle-san-lorenzo a esadm:Via ; rdfs:label "Calle San Lorenzo"@es .\nex-via:calle-santo-dominguito-de-val a esadm:Via ; rdfs:label "Calle Santo Dominguito de Val"@es .\nex-via:calle-veronica a esadm:Via ; rdfs:label "Calle Verónica"@es .\n\n# ESRE Streets\nex-via:calle-mayor a esadm:Via ; rdfs:label "Calle Mayor"@es .\nex-via:calle-refugio a esadm:Via ; rdfs:label "Calle Refugio"@es .\n\n    </textarea>\n</pre>\n\nAdicionalmente, estos datos enlazados podrían consultarse empleando SPARQL como el siguiente ejemplo:\n\n<pre>\n    <textarea style="resize:none" readonly id="code2" name="code" rows="10" cols="200">\nPREFIX edintzone: <http://vocab.linkeddata.es/datosabiertos/def/common/zone#>\nPREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>\nPREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>\n\nSELECT DISTINCT ?zona\nWHERE {\n    ?zona rdf:type ?tipo .\n    ?tipo rdfs:subClassOf* edintzone:RegulatedZone .\n}\n\nORDER BY ?zona\n    </textarea>\n</pre>\n\n<script>\n    var editor1 = CodeMirror.fromTextArea(document.getElementById("code1"), {\n        mode: "text/turtle",\n        matchBrackets: true\n    });\n\n    var editor2 = CodeMirror.fromTextArea(document.getElementById("code2"), {\n        mode: "application/sparql-query",\n        matchBrackets: true\n    });\n</script>\n
